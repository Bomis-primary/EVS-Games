<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Galaxy Game Journey - Premium Edition</title>
    <style>
        :root {
            --space-bg: #050510;
            --accent-yellow: #ffcc00;
            --neon-blue: #00d2ff;
            --glass-bg: rgba(15, 15, 35, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            user-select: none; 
            -webkit-tap-highlight-color: transparent; 
        }

        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background-color: var(--space-bg); 
            color: #ffffff; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: space-between; 
            overflow: hidden; 
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px),
                radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 40px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
            background-position: 0 0, 40px 60px, 130px 270px;
        }
        
        /* Screen Framework Containers */
        .screen { 
            position: absolute; 
            inset: 0; 
            display: none; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            padding: 20px; 
            text-align: center; 
            z-index: 20; 
            background: var(--space-bg);
        }
        
        #splash-screen { 
            display: flex; 
            background: #000000; 
            z-index: 100; 
        }
        #splash-screen img {
            max-width: 250px;
            height: auto;
            animation: pulse 2s infinite ease-in-out;
        }

        #title-screen h1, #instruction-screen h2 {
            font-size: 3rem;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #fff, var(--neon-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #instruction-screen p {
            font-size: 1.3rem;
            color: #b0b0d0;
            margin-bottom: 40px;
            max-width: 500px;
            line-height: 1.6;
        }
        
        /* Premium Buttons */
        button { 
            padding: 18px 45px; 
            font-size: 1.3rem; 
            cursor: pointer; 
            border-radius: 50px; 
            border: none; 
            background: linear-gradient(135deg, var(--accent-yellow), #ff9900); 
            color: #111; 
            font-weight: bold; 
            text-transform: uppercase;
            box-shadow: 0 0 25px rgba(255, 204, 0, 0.4);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        button:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 0 35px rgba(255, 204, 0, 0.6);
        }
        button:active {
            transform: translateY(1px);
        }
        
        /* HUD Dashboard Header */
        #hud-header {
            width: 100%;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 50;
            pointer-events: none;
        }
        .score-counter {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--accent-yellow);
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.3);
        }
        .hearts-container {
            display: flex;
            gap: 10px;
        }
        .heart {
            font-size: 1.8rem;
            filter: drop-shadow(0 0 5px rgba(255, 50, 50, 0.5));
            transition: transform 0.3s ease;
        }
        
        /* Core Arena Systems */
        #main-gameplay-screen { 
            align-items: stretch; 
            justify-content: space-between;
            background: transparent;
            padding: 80px 40px 40px 40px;
        }

        #arena-map { 
            flex-grow: 1;
            width: 100%; 
            display: flex; 
            align-items: center; 
            justify-content: flex-start;
            padding-left: 20px;
            overflow-x: auto;
        }

        #sun { 
            width: 130px; 
            height: 130px; 
            background: radial-gradient(circle at 35% 35%, #fff 0%, #ffcc00 40%, #ff3300 100%); 
            border-radius: 50%; 
            box-shadow: 0 0 50px rgba(255, 102, 0, 0.8), inset 0 0 20px rgba(255,255,255,0.6); 
            margin-right: 40px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-weight: 900; 
            font-size: 1.2rem;
            letter-spacing: 1px;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            flex-shrink: 0;
            animation: sunGlow 4s infinite alternate ease-in-out;
        }
        
        #slots-wrapper {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        .target-slot { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 12px;
        }

        .slot-circle { 
            width: 85px; 
            height: 85px; 
            border: 2px dashed rgba(255, 255, 255, 0.25); 
            border-radius: 50%; 
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
            box-shadow: inset 0 0 15px rgba(0,0,0,0.6);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .slot-circle:hover {
            border-color: var(--neon-blue);
            background: rgba(0, 210, 255, 0.08);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
        }

        .target-slot p {
            font-size: 0.85rem;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #a0a0c0;
            background: rgba(0,0,0,0.4);
            padding: 4px 10px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        
        /* Bottom Bay Planet Tray Container */
        #planets-tray { 
            width: 100%; 
            height: 140px; 
            background: var(--glass-bg); 
            border: 1px solid var(--glass-border); 
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 24px; 
            display: flex; 
            align-items: center; 
            justify-content: space-around; 
            padding: 0 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.2);
        }
        
        /* Spherical Visual Engine Designs */
        .planet-element { 
            width: 70px; 
            height: 70px; 
            border-radius: 50%; 
            cursor: pointer; 
            position: relative;
            box-shadow: inset -12px -12px 25px rgba(0,0,0,0.7), 0 10px 20px rgba(0,0,0,0.4);
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.25s ease;
        }
        .planet-element:hover {
            transform: scale(1.1) translateY(-5px);
        }
        .planet-element::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.25) 0%, transparent 60%);
        }

        /* Saturn Ring Engineering Modification */
        .saturn-rings {
            position: absolute;
            width: 120px;
            height: 24px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-15deg);
            border: 6px solid #dfc393;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            pointer-events: none;
            opacity: 0.85;
        }
        
        /* State Selection Framework and Physics Timers */
        .planet-selected { 
            transform: scale(1.15) translateY(-10px) !important; 
            box-shadow: inset -12px -12px 25px rgba(0,0,0,0.7), 0 0 25px var(--neon-blue) !important;
            outline: 3px solid var(--neon-blue);
            outline-offset: 4px;
        }
        
        .placed-locked {
            cursor: default !important;
            transform: scale(1) !important;
            pointer-events: none;
        }

        /* Animations Architecture Engine */
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.05); opacity: 1; } }
        @keyframes sunGlow { 0% { box-shadow: 0 0 40px rgba(255, 102, 0, 0.7); } 100% { box-shadow: 0 0 60px rgba(255, 150, 0, 0.9); } }
        @keyframes hapticShake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-12px); }
            40%, 80% { transform: translateX(12px); }
        }
        .shake { 
            animation: hapticShake 0.35s ease-in-out; 
            border-color: #ff3333 !important;
            background: rgba(255, 51, 51, 0.15) !important;
            box-shadow: 0 0 20px rgba(255, 51, 51, 0.3) !important;
        }

        /* Overlay Gateway Window Matrix */
        #quiz-overlay { 
            position: absolute; 
            inset: 0; 
            background: rgba(3, 3, 10, 0.95); 
            display: none; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            z-index: 300; 
        }
    </style>
</head>
<body>

    <!-- App Module Entry Screens Base -->
    <div id="splash-screen" class="screen">
        <img src="assets/innovine-logo.png" alt="Innovine Media Systems Engineering">
    </div>

    <div id="title-screen" class="screen">
        <h1>Galaxy Game Journey</h1>
        <button onclick="showInstructions()">Launch Core</button>
    </div>

    <div id="instruction-screen" class="screen">
        <h2>Mission Directives</h2>
        <p>Select a planet node from the visual navigation bay below, then tap its corresponding structural orbit socket next to the Sun to anchor it into position.</p>
        <button onclick="startGame()">Initiate Calibration</button>
    </div>

    <!-- Active Structural Interactive Interface HUD Layout Framework -->
    <div id="hud-header">
        <div class="score-counter">SCORE: <span id="val-score">0</span></div>
        <div class="hearts-container" id="hearts-layer">
            <span class="heart" id="hp-1">❤️</span>
            <span class="heart" id="hp-2">❤️</span>
            <span class="heart" id="hp-3">❤️</span>
        </div>
    </div>

    <div id="main-gameplay-screen" class="screen">
        <div id="arena-map">
            <div id="sun">SUN</div>
            <div id="slots-wrapper"></div>
        </div>
        <div id="planets-tray"></div>
    </div>

    <div id="quiz-overlay">
        <div id="quiz-content"></div>
    </div>

    <!-- Physical Hardware Communications Asset Layers -->
    <audio id="bg-music" src="assets/cheerfulmusic.mp3" loop></audio>
    <audio id="sfx-correct" src="assets/correct.mp3"></audio>
    <audio id="sfx-wrong" src="assets/wrong.mp3"></audio>
    <audio id="sfx-clap" src="assets/freesound_community-claps-44774.mp3"></audio>

<script>
    const planetsData = [
        { id: "mercury", name: "Mercury", skin: "radial-gradient(circle at 30% 30%, #e0e0e0 0%, #9494a0 45%, #404048 100%)" },
        { id: "venus", name: "Venus", skin: "radial-gradient(circle at 30% 30%, #fff3d1 0%, #e3a857 50%, #7d4911 100%)" },
        { id: "earth", name: "Earth", skin: "radial-gradient(circle at 30% 30%, #a3e2ff 0%, #2a7fd1 40%, #11387d 100%)" },
        { id: "mars", name: "Mars", skin: "radial-gradient(circle at 30% 30%, #ffa385 0%, #d1492a 50%, #611505 100%)" },
        { id: "jupiter", name: "Jupiter", skin: "repeating-linear-gradient(170deg, #dfc393 0px, #c49a6c 8px, #a67344 16px, #dfc393 24px)" },
        { id: "saturn", name: "Saturn", skin: "radial-gradient(circle at 30% 30%, #f4e3b1 0%, #d1b26a 50%, #705828 100%)", hasRings: true },
        { id: "uranus", name: "Uranus", skin: "radial-gradient(circle at 30% 30%, #d1ffff 0%, #70ccd4 50%, #24636e 100%)" },
        { id: "neptune", name: "Neptune", skin: "radial-gradient(circle at 30% 30%, #7097d4 0%, #2a4fa1 50%, #0b1a40 100%)" }
    ];

    let selectedPlanetId = null;
    let score = 0;
    let health = 3;

    // Splash Engine Lifespan Timing Sequence Trigger
    setTimeout(() => { 
        document.getElementById('splash-screen').style.display = 'none'; 
        document.getElementById('title-screen').style.display = 'flex'; 
    }, 5000);

    function showInstructions() { 
        document.getElementById('title-screen').style.display = 'none'; 
        document.getElementById('instruction-screen').style.display = 'flex'; 
    }

    function startGame() {
        document.getElementById('instruction-screen').style.display = 'none';
        document.getElementById('main-gameplay-screen').style.display = 'flex';
        document.getElementById('bg-music').play().catch(()=>{});
        initGameEngineLayout();
    }

    function initGameEngineLayout() {
        const slotsWrapper = document.getElementById('slots-wrapper');
        const tray = document.getElementById('planets-tray');
        
        slotsWrapper.innerHTML = '';
        tray.innerHTML = '';

        // Generate Linear Ordered Orbit Target Sockets
        planetsData.forEach(p => {
            const slot = document.createElement('div');
            slot.className = 'target-slot';
            slot.innerHTML = `<div class="slot-circle" id="socket-${p.id}"></div><p>${p.name}</p>`;
            slot.querySelector('.slot-circle').onclick = () => attemptSocketPlacement(p.id, slot.querySelector('.slot-circle'));
            slotsWrapper.appendChild(slot);
        });

        // Generate Shuffled Random Matrix for Tray Output Loading
        const shuffledPlanets = [...planetsData].sort(() => Math.random() - 0.5);

        shuffledPlanets.forEach(p => {
            const planet = document.createElement('div');
            planet.className = 'planet-element';
            planet.id = `node-${p.id}`;
            planet.style.background = p.skin;
            
            if(p.hasRings) {
                const ring = document.createElement('div');
                ring.className = 'saturn-rings';
                planet.appendChild(ring);
            }

            planet.onclick = (e) => {
                e.stopPropagation();
                selectPlanetNode(p.id);
            };
            tray.appendChild(planet);
        });
    }

    function selectPlanetNode(planetId) {
        // Prevent click sequence matching on verified anchored objects
        if(document.getElementById(`node-${planetId}`).classList.contains('placed-locked')) return;

        document.querySelectorAll('.planet-element').forEach(el => el.classList.remove('planet-selected'));
        selectedPlanetId = planetId;
        document.getElementById(`node-${planetId}`).classList.add('planet-selected');
    }

    function attemptSocketPlacement(targetId, socketElement) {
        if (!selectedPlanetId) return; 

        if (selectedPlanetId === targetId) {
            // MATCH FOUND LOGIC LAYER
            const planetNode = document.getElementById(`node-${selectedPlanetId}`);
            
            planetNode.classList.remove('planet-selected');
            planetNode.classList.add('placed-locked');
            planetNode.onclick = null; 

            // Hard Append Node directly into core layout viewport matrix
            socketElement.appendChild(planetNode);
            socketElement.style.border = 'none';
            socketElement.style.background = 'transparent';
            socketElement.onclick = null; 

            selectedPlanetId = null; 
            score += 10;
            document.getElementById('val-score').innerText = score;
            document.getElementById('sfx-correct').play().catch(()=>{});
            
            verifyWinConditionState();
        } else {
            // HARD MISMATCH DISCOVERY FRAMEWORK
            if (navigator.vibrate) navigator.vibrate(200); 
            
            socketElement.classList.add('shake');
            document.getElementById('sfx-wrong').play().catch(()=>{});
            
            processDamagePenalty();

            setTimeout(() => {
                socketElement.classList.remove('shake');
            }, 350);
        }
    }

    function processDamagePenalty() {
        if(health > 0) {
            document.getElementById(`hp-${health}`).style.transform = 'scale(0)';
            health--;
        }
        if(health === 0) {
            setTimeout(() => {
                alert("Mission Critical Error: System Failure. Resetting Coordinates.");
                location.reload();
            }, 300);
        }
    }

    function verifyWinConditionState() {
        const totalLocked = document.querySelectorAll('.placed-locked').length;
        if(totalLocked === planetsData.length) {
            document.getElementById('sfx-clap').play().catch(()=>{});
            setTimeout(() => {
                alert(`System Fully Operational! System Core Cleared. Final Score: ${score}`);
            }, 500);
        }
    }
</script>
</body>
</html>
