<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>Avian Cloud Quest Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111827;
            font-family: 'Press Start 2P', monospace;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        /* Fully Responsive Arcade Viewport Wrapper */
        .arcade-container {
            width: 100%;
            max-width: 440px;
            height: 100%;
            max-height: 820px;
            position: relative;
            overflow: hidden;
            background-color: #70c5ce;
            display: flex;
            flex-direction: column;
            justify-between: space-between;
        }

        @media (min-height: 821px) {
            .arcade-container {
                height: 96vh;
                border: 6px solid #000000;
                box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            }
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }

        .pixel-card {
            border: 4px solid #000000;
            box-shadow: 6px 6px 0px #000000;
        }
        
        .pixel-btn {
            border: 4px solid #000000;
            box-shadow: 0px 5px 0px #000000;
            text-shadow: 1px 1px 0px rgba(0,0,0,0.4);
            transition: transform 0.05s, box-shadow 0.05s;
        }
        .pixel-btn:active {
            transform: translateY(4px);
            box-shadow: 0px 1px 0px #000000;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen w-screen bg-[#0f172a]">

    <audio id="sndCorrect" src="./assets/correct.mp3" preload="auto"></audio>
    <audio id="sndWrong" src="./assets/wrong.mp3" preload="auto"></audio>
    <audio id="sndClaps" src="./assets/freesound_community-claps-44774.mp3" preload="auto"></audio>

    <div class="arcade-container">
        
        <div class="relative w-full flex-grow overflow-hidden bg-[#70c5ce]">
            <canvas id="gameCanvas" width="440" height="640"></canvas>

            <div id="screenSplash" class="absolute inset-0 bg-white flex items-center justify-center p-6 z-50 transition-opacity duration-500">
                <img src="./assets/innovine-logo.png" alt="Innovine Logo" class="max-w-xs max-h-[70%] w-auto h-auto object-contain object-center">
            </div>

            <div id="screenTitle" class="hidden absolute inset-0 bg-black/20 flex flex-col items-center justify-center p-5 z-20">
                <div class="bg-[#fcf8f2] pixel-card p-5 w-full text-center space-y-6">
                    <h1 class="text-[15px] font-black text-slate-800 leading-tight uppercase tracking-wide">
                        AVIAN<br><span class="text-sky-500 text-[18px]">CLOUD QUEST</span>
                    </h1>
                    <button onclick="showInstructions()" class="w-full bg-amber-500 text-white text-[11px] font-bold py-3.5 pixel-btn cursor-pointer uppercase">
                        START QUEST
                    </button>
                </div>
            </div>

            <div id="screenInstructions" class="hidden absolute inset-0 bg-black/30 flex flex-col items-center justify-center p-5 z-20">
                <div class="bg-white pixel-card p-5 w-full space-y-4">
                    <h2 class="text-[11px] font-bold text-center text-emerald-600 uppercase">MISSION MANUAL 🚀</h2>
                    <div class="space-y-3 text-[8px] text-slate-600 leading-relaxed">
                        <p class="flex items-start gap-1"><span>■</span> Use screen buttons <span class="font-bold text-black">▲ UP</span> / <span class="font-bold text-black">▼ DOWN</span> to fly.</p>
                        <p class="flex items-start gap-1"><span>■</span> Avoid crashing into the solid brown column systems.</p>
                        <p class="flex items-start gap-1"><span>■</span> Intercept flying cloud modules to trigger quiz points (+10 marks).</p>
                    </div>
                    <button onclick="startGameEngine()" class="w-full bg-emerald-500 text-white text-[11px] font-bold py-3.5 pixel-btn cursor-pointer uppercase">
                        LET'S FLY
                    </button>
                </div>
            </div>

            <div id="modalQuiz" class="hidden absolute inset-0 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4 z-40">
                <div id="modalCard" class="bg-white border-4 border-black p-5 w-full text-center space-y-4">
                    <div class="inline-block px-3 py-1 bg-sky-100 border-2 border-black text-sky-700 font-bold text-[8px] uppercase" id="modalCloudTerm">
                        ☁️ MODULE
                    </div>
                    <p id="modalPrompt" class="text-[9px] text-slate-800 font-bold leading-normal"></p>
                    <div id="modalChoices" class="flex flex-col gap-2 pt-1"></div>
                </div>
            </div>

            <div id="screenGameOver" class="hidden absolute inset-0 bg-black/50 flex flex-col items-center justify-center p-5 z-30">
                <div class="bg-white pixel-card p-5 w-full text-center space-y-4">
                    <h2 class="text-xs font-black text-sky-600 uppercase">QUEST COMPLETED</h2>
                    <p class="text-slate-500 text-[8px] leading-normal">Fabulous flight! All science tasks processed.</p>
                    
                    <div class="bg-slate-50 border-2 border-black p-3">
                        <span class="text-[7px] text-slate-400 block uppercase mb-1">SCORE MARKS</span>
                        <span id="txtFinalScore" class="text-lg font-bold text-emerald-600">0</span>
                    </div>

                    <button onclick="restartQuest()" class="w-full bg-amber-500 text-white text-[10px] font-bold py-3.5 pixel-btn uppercase">
                        PLAY AGAIN 🔄
                    </button>
                </div>
            </div>
        </div>

        <div id="controlsDeck" class="hidden bg-amber-900 border-t-4 border-black p-3 flex gap-3 items-center justify-center z-30">
            <button id="btnMoveUp" class="pixel-btn bg-sky-500 hover:bg-sky-400 text-white text-[10px] font-bold py-4 flex-1 rounded cursor-pointer select-none tracking-tighter">
                ▲ GLIDE UP
            </button>
            <button id="btnMoveDown" class="pixel-btn bg-sky-500 hover:bg-sky-400 text-white text-[10px] font-bold py-4 flex-1 rounded cursor-pointer select-none tracking-tighter">
                ▼ GLIDE DOWN
            </button>
        </div>

    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        ctx.imageSmoothingEnabled = false;

        let state = "SPLASH";
        let score = 0;
        let lives = 3;
        let activeIndex = 0;
        
        let pipeArray = [];
        let cloudArray = [];
        let screenFlashTick = 0;
        
        let targetFpsInterval = 1000 / 60;
        let lastEngineFrameTime = 0;
        let animationTick = 0;

        let inputUpActive = false;
        let inputDownActive = false;

        let avatarBird = {
            x: 75,
            y: 240,
            width: 38,
            height: 26,
            speed: 4.5
        };

        const questionBank = [
            { term: "Upstroke", prompt: "Identify the correct wing movement profile:", choices: ["Wings move upward and forward", "Wings move downward and backward"], answer: "Wings move upward and forward" },
            { term: "Downstroke", prompt: "Identify the correct wing movement profile:", choices: ["Wings move downward and backward", "Wings move upward and forward"], answer: "Wings move downward and backward" },
            { term: "Down Feathers", prompt: "What is the primary function of these soft feathers?", choices: ["Keeps the bird's body warm", "Helps lift and steer flight paths"], answer: "Keeps the bird's body warm" },
            { term: "Flight Feathers", prompt: "What is the function of large wing/tail feathers?", choices: ["Provides lifting power and steering control", "Insulates body temperature"], answer: "Provides lifting power and steering control" },
            { term: "Chisel Beak", prompt: "Feeding adaptation seen commonly in Woodpeckers:", choices: ["Drilling into bark for insect extraction", "Sucking liquid flower nectar stores"], answer: "Drilling into bark for insect extraction" },
            { term: "Hooked Beak", prompt: "Feeding structure optimization for Birds of Prey:", choices: ["Tearing flesh apart cleanly", "Cracking open heavy nut shells"], answer: "Tearing flesh apart cleanly" },
            { term: "Webbed Feet", prompt: "Locomotion benefit provided to Ducks:", choices: ["Acting as functional paddles for swimming", "Climbing up steep vertical bark lines"], answer: "Acting as functional paddles for swimming" },
            { term: "Tailorbird", prompt: "Nesting configuration trait typical of this species:", choices: ["Stitching leaves together with silk paths", "Weaving hanging bottle structures"], answer: "Stitching leaves together with silk paths" },
            { term: "Weaver Bird", prompt: "Nesting pattern architecture observed here:", choices: ["Weaving hanging bottle nests out of grass strips", "Creating basic open cup structures on twigs"], answer: "Weaving hanging bottle nests out of grass strips" },
            { term: "Talons", prompt: "Description of structural mechanics for claws:", choices: ["Sharp, curved grasp tools for handling prey", "Flat, wide toes ideal for mud wading"], answer: "Sharp, curved grasp tools for handling prey" },
            { term: "Hollow Bones", prompt: "How do specialized internal bone grids aid flight?", choices: ["Decreasing total body weight parameters", "Adding rigid structural weight ballasts"], answer: "Decreasing total body weight parameters" }
        ];

        window.onload = function() {
            setupInputControls();
            
            window.addEventListener('resize', autoResizeCanvasViewport);
            autoResizeCanvasViewport();

            // SCREEN 1: plain background showing the logo in the middle for exactly 5 seconds
            setTimeout(() => {
                const splash = document.getElementById('screenSplash');
                if(splash) {
                    splash.classList.add('opacity-0');
                    setTimeout(() => {
                        splash.remove();
                        document.getElementById('screenTitle').classList.remove('hidden');
                        state = "TITLE";
                    }, 500);
                }
            }, 5000);

            requestAnimationFrame(renderEngineLoop);
        };

        function autoResizeCanvasViewport() {
            const containerRect = canvas.parentElement.getBoundingClientRect();
            canvas.width = containerRect.width || 440;
            canvas.height = containerRect.height || 640;
        }

        function setupInputControls() {
            const btnUp = document.getElementById('btnMoveUp');
            const btnDown = document.getElementById('btnMoveDown');

            btnUp.addEventListener('mousedown', () => inputUpActive = true);
            btnUp.addEventListener('mouseup', () => inputUpActive = false);
            btnUp.addEventListener('mouseleave', () => inputUpActive = false);
            btnUp.addEventListener('touchstart', (e) => { e.preventDefault(); inputUpActive = true; }, { passive: false });
            btnUp.addEventListener('touchend', (e) => { e.preventDefault(); inputUpActive = false; }, { passive: false });

            btnDown.addEventListener('mousedown', () => inputDownActive = true);
            btnDown.addEventListener('mouseup', () => inputDownActive = false);
            btnDown.addEventListener('mouseleave', () => inputDownActive = false);
            btnDown.addEventListener('touchstart', (e) => { e.preventDefault(); inputDownActive = true; }, { passive: false });
            btnDown.addEventListener('touchend', (e) => { e.preventDefault(); inputDownActive = false; }, { passive: false });

            window.addEventListener('keydown', (e) => {
                if (e.key === "ArrowUp" || e.key === "w" || e.key === " ") inputUpActive = true;
                if (e.key === "ArrowDown" || e.key === "s") inputDownActive = true;
            });
            window.addEventListener('keyup', (e) => {
                if (e.key === "ArrowUp" || e.key === "w" || e.key === " ") inputUpActive = false;
                if (e.key === "ArrowDown" || e.key === "s") inputDownActive = false;
            });
        }

        function showInstructions() {
            document.getElementById('screenTitle').classList.add('hidden');
            document.getElementById('screenInstructions').classList.remove('hidden');
            state = "INSTRUCTIONS";
        }

        function updateControlsDeckVisibility() {
            const deck = document.getElementById('controlsDeck');
            if (state === "PLAYING") {
                deck.classList.remove('hidden');
                deck.classList.add('flex');
            } else {
                deck.classList.add('hidden');
                deck.classList.remove('flex');
            }
            autoResizeCanvasViewport();
        }

        function startGameEngine() {
            document.getElementById('screenInstructions').classList.add('hidden');
            score = 0;
            lives = 3;
            activeIndex = 0;
            pipeArray = [];
            cloudArray = [];
            avatarBird.y = 240;
            generateNextCloud();
            state = "PLAYING";
            updateControlsDeckVisibility();
        }

        function generateNextCloud() {
            if (activeIndex >= questionBank.length) {
                concludeQuestEngine();
                return;
            }
            cloudArray.push({
                x: canvas.width + 60,
                y: Math.floor(Math.random() * 150) + 160,
                width: 120,
                height: 48,
                data: questionBank[activeIndex]
            });
        }

        function drawOriginalPixelBird(ctx, birdX, birdY) {
            ctx.save();
            ctx.translate(birdX, birdY);

            ctx.fillStyle = "#000000";
            ctx.fillRect(2, 0, 32, 26);
            ctx.fillRect(0, 4, 38, 18);

            ctx.fillStyle = "#fcd34d";
            ctx.fillRect(4, 2, 28, 22);
            ctx.fillRect(2, 6, 34, 14);

            ctx.fillStyle = "#f59e0b";
            ctx.fillRect(4, 18, 24, 6);
            ctx.fillRect(22, 14, 8, 4);

            ctx.fillStyle = "#ffffff";
            ctx.fillRect(20, 4, 12, 10);
            ctx.fillStyle = "#000000";
            ctx.fillRect(26, 6, 4, 6);

            ctx.fillStyle = "#ef4444";
            ctx.fillRect(24, 12, 14, 8);
            ctx.fillStyle = "#f97316";
            ctx.fillRect(26, 14, 10, 4);
            ctx.fillStyle = "#000000";
            ctx.fillRect(24, 15, 14, 2);

            let flapFactor = Math.sin(animationTick * 0.25) > 0 ? 0 : 4;
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(4, 10 + flapFactor, 10, 6);
            ctx.fillStyle = "#d1d5db";
            ctx.fillRect(4, 13 + flapFactor, 10, 3);
            ctx.fillStyle = "#000000";
            ctx.strokeRect(4, 10 + flapFactor, 10, 6);

            ctx.restore();
        }

        function drawThickBrownPipe(ctx, pipe) {
            ctx.save();

            let colorDarkBorder = "#3e2723";
            let colorMainBrown = "#795548";
            let colorLightGlint = "#a1887f";
            let colorShadowTrim = "#5d4037";

            ctx.fillStyle = colorMainBrown;
            ctx.fillRect(pipe.x, 0, pipe.width, pipe.topHeight);
            
            ctx.fillStyle = colorLightGlint;
            ctx.fillRect(pipe.x + 6, 0, 10, pipe.topHeight);
            ctx.fillStyle = colorShadowTrim;
            ctx.fillRect(pipe.x + pipe.width - 14, 0, 8, pipe.topHeight);

            ctx.fillStyle = colorMainBrown;
            ctx.fillRect(pipe.x - 4, pipe.topHeight - 24, pipe.width + 8, 24);
            ctx.fillStyle = colorLightGlint;
            ctx.fillRect(pipe.x - 2, pipe.topHeight - 22, 10, 20);
            ctx.fillStyle = colorShadowTrim;
            ctx.fillRect(pipe.x + pipe.width - 10, pipe.topHeight - 22, 12, 20);

            ctx.lineWidth = 4;
            ctx.strokeStyle = colorDarkBorder;
            ctx.strokeRect(pipe.x, -10, pipe.width, pipe.topHeight + 10);
            ctx.strokeRect(pipe.x - 4, pipe.topHeight - 24, pipe.width + 8, 24);

            let bottomHeight = canvas.height - pipe.bottomY;
            ctx.fillStyle = colorMainBrown;
            ctx.fillRect(pipe.x, pipe.bottomY, pipe.width, bottomHeight);
            
            ctx.fillStyle = colorLightGlint;
            ctx.fillRect(pipe.x + 6, pipe.bottomY, 10, bottomHeight);
            ctx.fillStyle = colorShadowTrim;
            ctx.fillRect(pipe.x + pipe.width - 14, pipe.bottomY, 8, bottomHeight);

            ctx.fillStyle = colorMainBrown;
            ctx.fillRect(pipe.x - 4, pipe.bottomY, pipe.width + 8, 24);
            ctx.fillStyle = colorLightGlint;
            ctx.fillRect(pipe.x - 2, pipe.bottomY + 2, 10, 20);
            ctx.fillStyle = colorShadowTrim;
            ctx.fillRect(pipe.x + pipe.width - 10, pipe.bottomY + 2, 12, 20);

            ctx.strokeRect(pipe.x, pipe.bottomY, pipe.width, bottomHeight + 10);
            ctx.strokeRect(pipe.x - 4, pipe.bottomY, pipe.width + 8, 24);

            ctx.restore();
        }

        function renderEngineLoop(timestamp) {
            requestAnimationFrame(renderEngineLoop);

            let delta = timestamp - lastEngineFrameTime;
            if (delta < targetFpsInterval) return;
            lastEngineFrameTime = timestamp - (delta % targetFpsInterval);

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            animationTick++;

            ctx.fillStyle = "#70c5ce";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (state === "PLAYING") {
                if (inputUpActive) avatarBird.y -= avatarBird.speed;
                if (inputDownActive) avatarBird.y += avatarBird.speed;

                if (avatarBird.y < 2) avatarBird.y = 2;
                if (avatarBird.y > canvas.height - 35 - avatarBird.height) {
                    avatarBird.y = canvas.height - 35 - avatarBird.height;
                }

                if (pipeArray.length === 0 || pipeArray[pipeArray.length - 1].x < canvas.width - 220) {
                    let clearanceGap = 165;
                    let minimumAllowedH = 60;
                    let maximumAllowedH = canvas.height - clearanceGap - 120;
                    let calculatedTopHeight = Math.floor(Math.random() * (maximumAllowedH - minimumAllowedH)) + minimumAllowedH;

                    pipeArray.push({
                        x: canvas.width,
                        topHeight: calculatedTopHeight,
                        bottomY: calculatedTopHeight + clearanceGap,
                        width: 74
                    });
                }
            }

            pipeArray.forEach((pipe, i) => {
                if (state === "PLAYING") pipe.x -= 2.0;
                drawThickBrownPipe(ctx, pipe);

                let hitTop = (avatarBird.x + 4 < pipe.x + pipe.width && avatarBird.x + avatarBird.width - 4 > pipe.x && avatarBird.y + 4 < pipe.topHeight);
                let hitBottom = (avatarBird.x + 4 < pipe.x + pipe.width && avatarBird.x + avatarBird.width - 4 > pipe.x && avatarBird.y + avatarBird.height - 4 > pipe.bottomY);

                if (state === "PLAYING" && (hitTop || hitBottom)) {
                    document.getElementById('sndWrong').play().catch(()=>{});
                    lives--;
                    screenFlashTick = 12;

                    if (lives <= 0) {
                        concludeQuestEngine();
                    } else {
                        avatarBird.y = 240;
                        pipeArray = [];
                        inputUpActive = false;
                        inputDownActive = false;
                    }
                }

                if (pipe.x + pipe.width < 0) pipeArray.splice(i, 1);
            });

            cloudArray.forEach((cloud, idx) => {
                if (state === "PLAYING") cloud.x -= 2.0;

                ctx.save();
                ctx.fillStyle = "#ffffff";
                ctx.strokeStyle = "#000000";
                ctx.lineWidth = 4;
                ctx.fillRect(cloud.x, cloud.y, cloud.width, cloud.height);
                ctx.strokeRect(cloud.x, cloud.y, cloud.width, cloud.height);

                ctx.fillStyle = "#1e3a8a";
                ctx.font = "8px 'Press Start 2P', sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(cloud.data.term, cloud.x + (cloud.width / 2), cloud.y + (cloud.height / 2));
                ctx.restore();

                let touchCloud = (avatarBird.x + avatarBird.width > cloud.x &&
                                  avatarBird.x < cloud.x + cloud.width &&
                                  avatarBird.y + avatarBird.height > cloud.y &&
                                  avatarBird.y < cloud.y + cloud.height);

                if (state === "PLAYING" && touchCloud) {
                    cloudArray.splice(idx, 1);
                    launchVocabularyModal(cloud.data);
                }

                if (cloud.x + cloud.width < 0) {
                    cloudArray.splice(idx, 1);
                    activeIndex++;
                    generateNextCloud();
                }
            });

            drawOriginalPixelBird(ctx, avatarBird.x, avatarBird.y);

            ctx.fillStyle = "#558b2f";
            ctx.fillRect(0, canvas.height - 30, canvas.width, 30);
            ctx.fillStyle = "#000000";
            ctx.fillRect(0, canvas.height - 30, canvas.width, 4);

            if (screenFlashTick > 0) {
                ctx.fillStyle = `rgba(239, 68, 68, ${screenFlashTick / 12 * 0.45})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                screenFlashTick--;
            }

            if (state === "PLAYING" || state === "MODAL") {
                ctx.save();
                ctx.fillStyle = "#ffffff";
                ctx.strokeStyle = "#000000";
                ctx.lineWidth = 4;
                ctx.font = "16px 'Press Start 2P', sans-serif";
                ctx.textAlign = "left";
                ctx.strokeText(`SCORE:${score}`, 16, 32);
                ctx.fillText(`SCORE:${score}`, 16, 32);

                let lifeHearts = "";
                for(let h = 0; h < lives; h++) lifeHearts += "❤️";
                ctx.textAlign = "right";
                ctx.font = "12px 'Arial', sans-serif";
                ctx.strokeText(lifeHearts, canvas.width - 16, 28);
                ctx.fillText(lifeHearts, canvas.width - 16, 28);
                ctx.restore();
            }
        }

        function launchVocabularyModal(data) {
            state = "MODAL";
            updateControlsDeckVisibility();
            document.getElementById('modalCloudTerm').innerText = `☁️ MOVEMENT: ${data.term}`;
            document.getElementById('modalPrompt').innerText = data.prompt;
            
            const btnBox = document.getElementById('modalChoices');
            btnBox.innerHTML = '';

            data.choices.forEach(option => {
                btnBox.innerHTML += `
                    <button onclick="evaluateResponse('${option.replace(/'/g, "\\'")}', '${data.answer.replace(/'/g, "\\")}')"
                        class="w-full text-left p-3.5 bg-slate-50 border-2 border-black font-bold text-[8px] text-slate-700 active:bg-sky-100 cursor-pointer uppercase">
                        ■ ${option}
                    </button>
                `;
            });

            document.getElementById('modalQuiz').classList.remove('hidden');
        }

        function evaluateResponse(chosen, realCorrectAnswer) {
            if (chosen === realCorrectAnswer) {
                document.getElementById('sndCorrect').play().catch(()=>{});
                score += 10;
                activeIndex++;
                
                document.getElementById('modalQuiz').classList.add('hidden');
                state = "PLAYING";
                updateControlsDeckVisibility();
                generateNextCloud();
            } else {
                document.getElementById('sndWrong').play().catch(()=>{});
                let el = document.getElementById('modalCard');
                el.classList.add('animate-bounce');
                setTimeout(() => el.classList.remove('animate-bounce'), 450);
            }
        }

        function concludeQuestEngine() {
            state = "GAMEOVER";
            updateControlsDeckVisibility();
            document.getElementById('sndClaps').play().catch(()=>{});
            document.getElementById('txtFinalScore').innerText = score;
            document.getElementById('modalQuiz').classList.add('hidden');
            document.getElementById('screenGameOver').classList.remove('hidden');
        }

        function restartQuest() {
            document.getElementById('screenGameOver').classList.add('hidden');
            startGameEngine();
        }
    </script>
</body>
</html>
