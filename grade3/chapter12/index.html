<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stone Age Adventure: Early Humans</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #2c1a04;
            font-family: 'Fredoka One', 'Comic Sans MS', cursive, sans-serif;
            color: #fff;
        }
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 500px;
            max-height: 850px;
            margin: 0 auto;
            background: linear-gradient(180deg, #5c3a21 0%, #2c1a04 100%);
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            z-index: 10;
        }
        .active-screen { display: flex; }

        /* Screen 1: Splash */
        #splash-screen {
            background-color: #ffffff;
            z-index: 100;
        }
        #splash-screen img {
            max-width: 70%;
            max-height: 50%;
            object-fit: contain;
            animation: pulse 2s infinite ease-in-out;
        }
        /* Screen 2 & 3: Menu & Instructions */
        #menu-screen { background: linear-gradient(135deg, #ff9f43 0%, #ee5253 100%); }
        #instruction-screen { background: linear-gradient(135deg, #1dd1a1 0%, #10ac84 100%); }
        
        h1 {
            font-size: 2.2rem;
            color: #fff;
            text-shadow: 3px 3px 0px #574b90;
            margin-bottom: 30px;
            line-height: 1.2;
        }
        p.instruction-text {
            font-size: 1.3rem;
            line-height: 1.6;
            margin-bottom: 30px;
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 15px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        .btn {
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #fff;
            background-color: #ff9f43;
            border: 4px solid #fff;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 0px #d35400;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0px #d35400;
        }
        /* Screen 4: Main gameplay core */
        #game-screen {
            display: none;
            position: relative;
            flex: 1;
            flex-direction: column;
            justify-content: flex-start;
            padding: 10px;
            background: transparent;
        }
        #game-screen.active-screen { display: flex; }

        #ui-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 10px;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            margin-bottom: 5px;
        }
        .ui-item {
            font-size: 1.1rem;
            font-weight: bold;
            background: #ff9f43;
            padding: 5px 12px;
            border-radius: 20px;
            border: 2px solid #fff;
        }
        #canvas-wrapper {
            position: relative;
            flex: 1;
            width: 100%;
            background: #111;
            border: 4px solid #ff9f43;
            border-radius: 10px;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        /* Touch controls for mobile layouts */
        #controls-bar {
            width: 100%;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px 0;
            background: rgba(0,0,0,0.2);
        }
        .control-btn {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: 3px solid #fff;
            background-color: #574b90;
            color: #fff;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 0 #2c254e;
        }
        .control-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #2c254e;
        }
        /* Quiz overlay block */
        #quiz-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(44, 26, 4, 0.95);
            z-index: 50;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        #quiz-box {
            width: 100%;
            background: #ffeaa7;
            border: 5px solid #ffb8b8;
            border-radius: 20px;
            padding: 20px;
            color: #2c1a04;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #question-text {
            font-size: 1.3rem;
            margin-bottom: 20px;
            font-weight: bold;
            line-height: 1.4;
            text-align: center;
        }
        .option-btn {
            width: 100%;
            padding: 14px;
            margin-bottom: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #2c1a04;
            background: #fff;
            border: 3px solid #ff9f43;
            border-radius: 12px;
            cursor: pointer;
            text-align: left;
            transition: background 0.2s;
        }
        .option-btn:active {
            background: #ffeaa7;
        }
        #quiz-progress {
            margin-bottom: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #fff;
            background: #ee5253;
            padding: 4px 15px;
            border-radius: 15px;
        }
        /* Animations */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- Screen 1: Innovine Splash Logo Screen -->
    <div id="splash-screen" class="screen active-screen">
        <img src="assets/innovine-logo.png" alt="Innovine Logo" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'200\' height=\'200\'><rect width=\'100%\' height=\'100%\' fill=\'%23ff9f43\'/><text x=\'50%\' y=\'55%\' font-size=\'24\' fill=\'white\' font-family=\'sans-serif\' text-anchor=\'middle\'>INNOVINE</text></svg>'">
    </div>

    <!-- Screen 2: Title Menu Screen -->
    <div id="menu-screen" class="screen">
        <h1>🦖 Stone Age Adventure:<br>Early Humans</h1>
        <button class="btn" id="start-btn">START</button>
    </div>

    <!-- Screen 3: Simplified Instructions Screen -->
    <div id="instruction-screen" class="screen">
        <h1>How To Play</h1>
        <p class="instruction-text">
            Move the falling colorful gems left or right!<br><br>
            Match <b>3 gems of the same color</b> to clear them and unlock secret stories about how early humans lived!
        </p>
        <button class="btn" id="play-btn">PLAY</button>
    </div>

    <!-- Screen 4: Active Main Game Frame -->
    <div id="game-screen" class="screen">
        <div id="ui-bar">
            <div class="ui-item" id="score-display">Score: 0</div>
            <div class="ui-item" id="progress-display">History: 0/12</div>
        </div>

        <div id="canvas-wrapper">
            <canvas id="gameCanvas"></canvas>
        </div>

        <!-- Touch Controls Layout for Tablets and Mobile devices -->
        <div id="controls-bar">
            <button class="control-btn" id="left-btn">◀</button>
            <button class="control-btn" id="swap-btn">🔄</button>
            <button class="control-btn" id="right-btn">▶</button>
        </div>

        <!-- Quiz Panel overlay framework -->
        <div id="quiz-overlay">
            <div id="quiz-progress">Secret Story 1/12</div>
            <div id="quiz-box">
                <div id="question-text">Question text goes here?</div>
                <div id="options-container">
                    <button class="option-btn">Option 1</button>
                    <button class="option-btn">Option 2</button>
                    <button class="option-btn">Option 3</button>
                    <button class="option-btn">Option 4</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Audio elements mapped directly to repository structure
    const sndCorrect = new Audio('assets/correct.mp3');
    const sndWrong = new Audio('assets/wrong.mp3');
    const sndClap = new Audio('assets/freesound_community-claps-44774.mp3');

    function playSound(sound) {
        sound.currentTime = 0;
        sound.play().catch(e => console.log("Audio waiting for interaction context"));
    }

    // 12 Simplified Kid-Friendly Questions Bank
    const baseQuestions = [
        { q: "BRRR! It is raining hard and a big wild cat is chasing you! Where do you hide to stay safe?", a: "Inside a dark cave or up in a tall tree!", options: ["Inside a dark cave or up in a tall tree!", "Inside a modern brick house.", "Under a beach umbrella.", "Inside a camping tent."] },
        { q: "Oh no! Clothes are not invented yet! What can you wear today to stay warm?", a: "Big leaves, tree bark, and furry animal skins!", options: ["Big leaves, tree bark, and furry animal skins!", "A bright yellow raincoat and boots.", "A superhero costume.", "Soft cotton pajamas."] },
        { q: "Time to eat! You found wild berries and a fish. There are no stoves or microwaves. How do you eat them?", a: "You eat them raw!", options: ["You eat them raw!", "You bake them into a pizza.", "You fry them in a pan with butter.", "You microwave them."] },
        { q: "You want to dig up roots to eat, but your hands are not strong enough. What do you look for on the ground to help you?", a: "Sharp stones, animal bones, and horns!", options: ["Sharp stones, animal bones, and horns!", "Metal nails and a screwdriver.", "Colorful plastic toys.", "Pieces of broken glass."] },
        { q: "SPARK! You rub two special stones together very fast. What amazing thing jumps out?", a: "Bright sparks that start a fire!", options: ["Bright sparks that start a fire!", "A magic genie.", "Bubbly cold water.", "Rainbow smoke."] },
        { q: "A scary wild animal is walking toward your cave! What can you light up to scare it away?", a: "A bright, hot fire!", options: ["A bright, hot fire!", "A big flashlight.", "A neon sign.", "Twinkling fairy lights."] },
        { q: "You dropped some seeds in the dirt last week. Now, tiny green plants are growing there! What does this teach you?", a: "Seeds grow into new plants for food!", options: ["Seeds grow into new plants for food!", "Seeds turn into gold coins.", "Plants fall down from the sky.", "Ants hide secret treasures there."] },
        { q: "You tie a sharp stone to a strong wooden stick. What useful tool did you just make?", a: "A strong stone axe!", options: ["A strong stone axe!", "An electric chainsaw.", "Kitchen scissors.", "A magic wand."] },
        { q: "A furry animal walks up to you and wags its tail. It wants to guard your cave. What is your new pet?", a: "A friendly dog!", options: ["A friendly dog!", "A roaring tiger.", "A giant elephant.", "A wild mountain lion."] },
        { q: "Your tribe needs to cross a big, deep river but you cannot swim. How do you get across?", a: "Tie logs together to make a floating raft!", options: ["Tie logs together to make a floating raft!", "Call a fast motorboat.", "Get on a giant cruise ship.", "Ride in a submarine."] },
        { q: "You see a round tree log rolling down a hill very fast. What great idea does this give you?", a: "To invent the rolling wheel!", options: ["To invent the rolling wheel!", "To make a square brick.", "To build a triangle roof.", "To make an iron bar."] },
        { q: "You spin a wooden wheel with wet mud on top to shape a bowl for water. What are you using?", a: "A potter's wheel to make clay pots!", options: ["A potter's wheel to make clay pots!", "A car steering wheel.", "A spinning wheel for making clothes.", "A giant Ferris wheel."] }
    ];

    let gameQuestions = [];
    let currentQuestionIndex = 0;
    let quizBatchCount = 0;
    let questionsAnsweredTotal = 0;

    // Shuffle Utility
    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
    }

    function initQuestions() {
        gameQuestions = JSON.parse(JSON.stringify(baseQuestions));
        shuffleArray(gameQuestions);
        gameQuestions.forEach(item => shuffleArray(item.options));
        questionsAnsweredTotal = 0;
        currentQuestionIndex = 0;
    }

    // Canvas Board State Setup
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    const COLS = 6;
    const ROWS = 11;
    let grid = [];
    let cellSize = 0;
    
    const COLORS = ['#ee5253', '#341f97', '#10ac84', '#feca57', '#574b90']; // Red, Blue, Green, Yellow, Purple
    
    let currentPiece = null; 
    let gameScore = 0;
    let isGameOver = false;
    let isPausedForQuiz = false;
    let dropInterval = 1200; // Eased drop speed from 1000ms to 1200ms
    let lastTime = 0;

    // Initialize Screens Sequence flow
    window.addEventListener('load', () => {
        // Step 1: Splash timeout screen active for 5 seconds
        setTimeout(() => {
            showScreen('menu-screen');
        }, 5000);
    });

    document.getElementById('start-btn').addEventListener('click', () => {
        showScreen('instruction-screen');
    });

    document.getElementById('play-btn').addEventListener('click', () => {
        showScreen('game-screen');
        resizeCanvas();
        initGame();
    });

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
        document.getElementById(screenId).classList.add('active-screen');
    }

    function resizeCanvas() {
        const wrapper = document.getElementById('canvas-wrapper');
        canvas.width = wrapper.clientWidth;
        canvas.height = wrapper.clientHeight;
        cellSize = Math.min(canvas.width / COLS, canvas.height / ROWS);
    }
    window.addEventListener('resize', resizeCanvas);

    function initGame() {
        grid = Array(ROWS).fill().map(() => Array(COLS).fill(null));
        gameScore = 0;
        isGameOver = false;
        isPausedForQuiz = false;
        document.getElementById('score-display').innerText = "Score: " + gameScore;
        initQuestions();
        updateProgressUI();
        spawnPiece();
        lastTime = performance.now();
        requestAnimationFrame(gameLoop);
    }

    function spawnPiece() {
        // Vertical column stack consisting of 3 random colors
        currentPiece = {
            x: 2,
            y: -2, 
            colors: [
                COLORS[Math.floor(Math.random() * COLORS.length)],
                COLORS[Math.floor(Math.random() * COLORS.length)],
                COLORS[Math.floor(Math.random() * COLORS.length)]
            ]
        };
        
        // Game over conditional constraint checking space availability
        if (grid[0][2] !== null || grid[1][2] !== null) {
            isGameOver = true;
            // Replaced alert with a cleaner state reset
            console.log("Game Over triggered");
            initGame();
        }
    }

    // Main Canvas Render and Tick loop configuration
    function gameLoop(timestamp) {
        if (isGameOver || isPausedForQuiz) return;

        let delta = timestamp - lastTime;
        if (delta > dropInterval) {
            moveDown();
            lastTime = timestamp;
        }

        draw();
        requestAnimationFrame(gameLoop);
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Calculate offset values centering the grid matrix boundary context
        let offsetX = (canvas.width - (COLS * cellSize)) / 2;
        let offsetY = (canvas.height - (ROWS * cellSize)) / 2;

        // Draw stable board block grid items
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                ctx.strokeStyle = '#3d2711';
                ctx.strokeRect(offsetX + c * cellSize, offsetY + r * cellSize, cellSize, cellSize);
                if (grid[r][c]) {
                    drawGem(offsetX + c * cellSize, offsetY + r * cellSize, grid[r][c]);
                }
            }
        }

        // Draw active dropping columns fragment elements
        if (currentPiece) {
            for (let i = 0; i < 3; i++) {
                let py = currentPiece.y + i;
                if (py >= 0 && py < ROWS) {
                    drawGem(offsetX + currentPiece.x * cellSize, offsetY + py * cellSize, currentPiece.colors[i]);
                }
            }
        }
    }

    function drawGem(x, y, color) {
        let radius = cellSize / 2 - 3;
        let cx = x + cellSize / 2;
        let cy = y + cellSize / 2;

        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
        
        // High fidelity glossy shine layer
        ctx.beginPath();
        ctx.arc(cx - radius/3, cy - radius/3, radius/4, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.fill();

        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();
    }

    // Mechanics: Core Horizontal, Vertical and Side inputs handling mapping rules
    function moveLeft() {
        if (currentPiece && currentPiece.x > 0 && !checkCollision(currentPiece.x - 1, currentPiece.y)) {
            currentPiece.x--;
        }
    }

    function moveRight() {
        if (currentPiece && currentPiece.x < COLS - 1 && !checkCollision(currentPiece.x + 1, currentPiece.y)) {
            currentPiece.x++;
        }
    }

    function swapColors() {
        if (!currentPiece) return;
        // Shift colors downward across the stack container
        let temp = currentPiece.colors[2];
        currentPiece.colors[2] = currentPiece.colors[1];
        currentPiece.colors[1] = currentPiece.colors[0];
        currentPiece.colors[0] = temp;
    }

    function moveDown() {
        if (!currentPiece) return;
        if (!checkCollision(currentPiece.x, currentPiece.y + 1)) {
            currentPiece.y++;
        } else {
            lockPiece();
            checkMatchesAndTriggers();
        }
    }

    function checkCollision(nx, ny) {
        for (let i = 0; i < 3; i++) {
            let py = ny + i;
            if (py >= ROWS) return true;
            if (py >= 0 && grid[py][nx] !== null) return true;
        }
        return false;
    }

    function lockPiece() {
        for (let i = 0; i < 3; i++) {
            let py = currentPiece.y + i;
            if (py >= 0 && py < ROWS) {
                grid[py][currentPiece.x] = currentPiece.colors[i];
            }
        }
        currentPiece = null;
    }

    function checkMatchesAndTriggers() {
        let matched = false;
        let toRemove = Array(ROWS).fill().map(() => Array(COLS).fill(false));

        // Check horizontal sets
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS - 2; c++) {
                if (grid[r][c] && grid[r][c] === grid[r][c+1] && grid[r][c] === grid[r][c+2]) {
                    toRemove[r][c] = toRemove[r][c+1] = toRemove[r][c+2] = true;
                    matched = true;
                }
            }
        }

        // Check vertical sets
        for (let c = 0; c < COLS; c++) {
            for (let r = 0; r < ROWS - 2; r++) {
                if (grid[r][c] && grid[r][c] === grid[r+1][c] && grid[r][c] === grid[r+2][c]) {
                    toRemove[r][c] = toRemove[r+1][c] = toRemove[r+2][c] = true;
                    matched = true;
                }
            }
        }

        if (matched) {
            // Apply score points
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (toRemove[r][c]) {
                        grid[r][c] = null;
                        gameScore += 10;
                    }
                }
            }
            document.getElementById('score-display').innerText = "Score: " + gameScore;
            applyGravity();
            
            // Activate the integrated quiz phase setup
            triggerQuizBatch();
        } else {
            spawnPiece();
        }
    }

    function applyGravity() {
        for (let c = 0; c < COLS; c++) {
            let emptyRow = ROWS - 1;
            for (let r = ROWS - 1; r >= 0; r--) {
                if (grid[r][c] !== null) {
                    let temp = grid[r][c];
                    grid[r][c] = null;
                    grid[emptyRow][c] = temp;
                    emptyRow--;
                }
            }
        }
    }

    // Intermediary Quiz Overlay triggering rules logic
    function triggerQuizBatch() {
        if (questionsAnsweredTotal >= 12) {
            spawnPiece();
            return;
        }
        isPausedForQuiz = true;
        quizBatchCount = 0; 
        showQuizQuestion();
    }

    function showQuizQuestion() {
        if (quizBatchCount >= 3 || currentQuestionIndex >= gameQuestions.length) {
            // Completed the target batch setup; return control loop seamlessly back to grid matching action
            isPausedForQuiz = false;
            document.getElementById('quiz-overlay').style.display = 'none';
            spawnPiece();
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
            return;
        }

        document.getElementById('quiz-overlay').style.display = 'flex';
        document.getElementById('quiz-progress').innerText = `Secret Story: ${questionsAnsweredTotal + 1} / 12`;

        let currentQ = gameQuestions[currentQuestionIndex];
        document.getElementById('question-text').innerText = currentQ.q;

        let container = document.getElementById('options-container');
        container.innerHTML = '';

        currentQ.options.forEach(opt => {
            let btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => handleAnswerSelection(opt, currentQ.a, btn);
            container.appendChild(btn);
        });
    }

    function handleAnswerSelection(selected, correct, buttonElement) {
        // Disable further click interactions on all sibling button components temporarily during verification sequence
        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach(b => b.disabled = true);

        if (selected === correct) {
            buttonElement.style.background = '#10ac84';
            buttonElement.style.color = '#fff';
            playSound(sndCorrect);
            questionsAnsweredTotal++;
            quizBatchCount++;
            currentQuestionIndex++;
            updateProgressUI();

            setTimeout(() => {
                if (questionsAnsweredTotal >= 12) {
                    playSound(sndClap);
                    alert(`Fantastic Work! You uncovered all 12 Stone Age Secrets! Final Score: ${gameScore}`);
                    initGame();
                } else {
                    showQuizQuestion();
                }
            }, 1200);
        } else {
            buttonElement.style.background = '#ee5253';
            buttonElement.style.color = '#fff';
            playSound(sndWrong);
            // Re-shuffle the current choices dynamically to offer a fresh perspective layout
            shuffleArray(gameQuestions[currentQuestionIndex].options);
            setTimeout(() => showQuizQuestion(), 1000);
        }
    }

    function updateProgressUI() {
        document.getElementById('progress-display').innerText = `History: ${questionsAnsweredTotal}/12`;
    }

    // Map Keyboard keycodes dynamically to support cross-device setups
    window.addEventListener('keydown', (e) => {
        if (isPausedForQuiz || isGameOver) return;
        if (e.key === 'ArrowLeft') moveLeft();
        if (e.key === 'ArrowRight') moveRight();
        if (e.key === 'ArrowUp' || e.key === ' ') swapColors();
        if (e.key === 'ArrowDown') moveDown();
        draw();
    });

    // Wire up tactile responsive click events down to visual button handles on mobile devices
    document.getElementById('left-btn').addEventListener('touchstart', (e) => { e.preventDefault(); moveLeft(); draw(); });
    document.getElementById('right-btn').addEventListener('touchstart', (e) => { e.preventDefault(); moveRight(); draw(); });
    document.getElementById('swap-btn').addEventListener('touchstart', (e) => { e.preventDefault(); swapColors(); draw(); });
    
    document.getElementById('left-btn').addEventListener('click', () => { moveLeft(); draw(); });
    document.getElementById('right-btn').addEventListener('click', () => { moveRight(); draw(); });
    document.getElementById('swap-btn').addEventListener('click', () => { swapColors(); draw(); });
</script>
</body>
</html>
