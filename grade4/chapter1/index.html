<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nutrient Ninja</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        /* Cross-device reset and strict performance rules */
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; font-family: 'Fredoka', sans-serif; }
        html, body { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #1a0f0a; overflow: hidden; }
        
        #game-wrapper { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; display: block; }
        
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 10; padding: 20px; text-align: center; background-color: #2d1a10;
        }
        .hidden { display: none !important; }

        /* Splash Screen */
        #screen-splash { background-color: #ffffff; z-index: 100; }
        .logo { width: 80%; max-width: 300px; height: auto; }

        /* Typography & Buttons */
        h1.title { font-size: 3.5rem; color: #ffbe0b; margin-bottom: 40px; text-transform: uppercase; line-height: 1.1; }
        p.text-simple { color: #ffffff; font-size: 1.2rem; line-height: 1.8; max-width: 500px; margin-bottom: 40px; text-align: left; }
        
        button.btn-primary { background-color: #e63946; color: #ffffff; border: none; padding: 16px 40px; font-size: 1.4rem; font-weight: 700; border-radius: 8px; cursor: pointer; outline: none; transition: 0.2s; }
        button.btn-primary:active { background-color: #c1121f; }

        /* HUD */
        #hud {
            position: absolute; top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between;
            z-index: 5; color: #ffffff; font-size: 1.2rem; font-weight: 700; pointer-events: none;
        }

        /* Quiz UI */
        #screen-quiz { background-color: rgba(26, 15, 10, 0.98); z-index: 50; display: flex; justify-content: center; padding: 20px; }
        .quiz-box { background: #ffffff; border-radius: 12px; padding: 24px; width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .quiz-question { color: #1a0f0a; font-size: 1.3rem; font-weight: 700; margin-bottom: 24px; text-align: left; line-height: 1.4; }
        
        .quiz-option {
            display: block; width: 100%; background: #f1faee; color: #1d3557; border: 2px solid #a8dadc;
            padding: 14px; margin-bottom: 12px; border-radius: 8px; font-size: 1.1rem; font-weight: 700; text-align: left; cursor: pointer;
        }
        .quiz-option:disabled { cursor: not-allowed; opacity: 0.7; }
        .quiz-option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
        .quiz-option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }

        .hint-box { background: #fff3cd; color: #856404; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-weight: 700; text-align: left; font-size: 1rem; }
        .exp-box { background: #d4edda; color: #155724; padding: 12px; border-radius: 8px; margin-top: 15px; font-weight: 700; text-align: left; font-size: 1rem; }
        
        #quiz-status { font-size: 1rem; font-weight: 700; color: #e63946; margin-bottom: 15px; text-align: right; }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <canvas id="game-canvas"></canvas>

        <div id="hud" class="hidden">
            <div>SCORE: <span id="val-score">0</span></div>
            <div>LEVEL <span id="val-level">1</span></div>
            <div>COLLECTED: <span id="val-healthy">0</span>/3</div>
        </div>

        <div id="screen-splash" class="screen">
            <img src="assets/innovine-logo.png" alt="Innovine Logo" class="logo">
        </div>

        <div id="screen-title" class="screen hidden">
            <h1 class="title">Nutrient Ninja</h1>
            <button class="btn-primary" onclick="navToInstructions()">PLAY</button>
        </div>

        <div id="screen-instructions" class="screen hidden">
            <p class="text-simple">
                1. Swipe to collect healthy foods.<br>
                2. Avoid junk foods.<br>
                3. Collect 3 healthy foods to unlock a quiz.<br>
                4. You have 3 attempts per question. Hints will help if you get stuck.<br>
                5. Complete all 3 levels to win.
            </p>
            <button class="btn-primary" onclick="startGame()">START</button>
        </div>

        <div id="screen-quiz" class="screen hidden">
            <div class="quiz-box">
                <div id="quiz-status">Attempt 1 / 3</div>
                <div class="quiz-question" id="quiz-q"></div>
                <div id="quiz-hint" class="hint-box hidden"></div>
                <div id="quiz-options"></div>
                <div id="quiz-exp" class="exp-box hidden"></div>
            </div>
        </div>

        <div id="screen-end" class="screen hidden">
            <h1 class="title" id="end-title">GAME OVER</h1>
            <p class="text-simple" style="text-align: center;" id="end-msg"></p>
            <p class="text-simple" style="text-align: center; font-size: 2.5rem; color: #ffbe0b;">FINAL SCORE: <span id="end-score">0</span></p>
            <button class="btn-primary" onclick="resetGame()">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        // Scenario-Based Curriculum Database (Grade 4, Chapter 1)
        const textbookDatabase = {
            1: [
                { q: "Rahul is playing a football match and feels very tired at half-time. What should he eat for instant energy?", a: "Carbohydrates", options: ["Proteins", "Carbohydrates", "Vitamins"], hint: "Athletes eat a lot of this before a big race! Examples include bananas, potatoes, and bread.", exp: "Carbohydrates are 'energy-giving foods' that our body quickly breaks down to give us instant energy." },
                { q: "Meera fell off her bicycle and got a deep cut on her knee. Which nutrient will help her body repair the damaged cells and heal the wound?", a: "Proteins", options: ["Fats", "Carbohydrates", "Proteins"], hint: "You can find this nutrient packed inside milk, eggs, pulses (daal), and chicken.", exp: "Proteins are 'body-building foods.' They help in the growth of the body and repair damaged cells." },
                { q: "It is a freezing cold winter morning. Which nutrient will help keep Rohan's body warm if he eats a handful of almonds and walnuts?", a: "Fats", options: ["Fats", "Vitamins", "Roughage"], hint: "Butter, cooking oil, ghee, and nuts are very rich in this nutrient.", exp: "Fats give us more energy and heat than carbohydrates. They help keep our bodies warm." },
                { q: "Sita's doctor told her she falls sick often because her body cannot fight germs well. Which 'protective' foods should she eat more of?", a: "Vitamins and Minerals", options: ["Carbohydrates and Fats", "Vitamins and Minerals", "Proteins and Water"], hint: "Think about what a shield does for a knight in battle! Fresh fruits and vegetables are full of these.", exp: "Vitamins and minerals protect our body from various diseases and keep our organs, bones, and teeth healthy." },
                { q: "Anil is finding it very difficult to read his book when the room gets dim in the evening. His doctor says he lacks Vitamin A. Which disease might he have?", a: "Night blindness", options: ["Scurvy", "Beriberi", "Night blindness"], hint: "This condition makes it very difficult for a person to see clearly in the dark.", exp: "Vitamin A is essential for good eyesight. Without enough of it, a person can develop night blindness." }
            ],
            2: [
                { q: "You just took a bite of a sweet apple. What is the fluid in your mouth that instantly starts breaking down the apple's starch into sweet sugar?", a: "Saliva", options: ["Bile juice", "Acid", "Saliva"], hint: "It's the watery liquid that makes your 'mouth water' when you smell your favorite tasty food!", exp: "Saliva is a digestive juice produced in the mouth. It mixes with food to make it soft and starts digesting starches." },
                { q: "After you swallow a bite of a sandwich, it travels down a long muscular tube to reach your stomach. What is this tube formally called?", a: "Oesophagus", options: ["Oesophagus", "Small Intestine", "Windpipe"], hint: "It is also commonly known as the 'food pipe.'", exp: "The oesophagus is the tube that swallows your chewed food and pushes it down into the stomach." },
                { q: "Your lunch has just reached a J-shaped muscular bag in your body where it gets churned and mixed with strong juices. Where is your food right now?", a: "Stomach", options: ["Liver", "Large Intestine", "Stomach"], hint: "When you are very hungry, this organ might make a loud rumbling noise!", exp: "The stomach acts like a mixer. It churns the food and mixes it with acidic digestive juices." },
                { q: "The food you ate is now completely digested into a simple liquid, and your blood is absorbing all the useful nutrients. Which organ is doing this job?", a: "Small Intestine", options: ["Mouth", "Small Intestine", "Large Intestine"], hint: "It is a very long, tightly coiled tube that comes right after the stomach.", exp: "The small intestine completes the digestion process. Here, the useful nutrients are fully absorbed into the bloodstream." },
                { q: "You drank a lot of water today. The undigested food passes into an organ that absorbs this extra water before pushing the solid waste out. Which organ is this?", a: "Large Intestine", options: ["Liver", "Small Intestine", "Large Intestine"], hint: "This is the final major stop for food before waste leaves the body.", exp: "The large intestine's main job is to absorb extra water from the undigested food, forming solid waste." }
            ],
            3: [
                { q: "Aman left his bread sandwich on the kitchen counter for three days. When he found it, it had greenish-black cotton-like patches. What caused this?", a: "Germs growing in warm, moist air", options: ["Loss of water", "Germs growing in warm, moist air", "Excess salt"], hint: "These are tiny living things (like mold) that love to grow in wet and warm places.", exp: "Germs multiply rapidly in warm, moist conditions, which is why food left outside spoils and gets moldy." },
                { q: "Grandma wants to make sure the fresh mangoes she bought last for a long time without spoiling. What is this process called?", a: "Food preservation", options: ["Food preservation", "Digestion", "Churning"], hint: "Think of a word that means 'to protect' or 'to keep safe.'", exp: "Food preservation involves treating and handling food in special ways to stop germs from destroying it." },
                { q: "Before drinking milk straight from the dairy farm, Rohan's mother always heats it on the stove until it bubbles. What method is she using to kill germs?", a: "Boiling", options: ["Freezing", "Boiling", "Drying"], hint: "You do this by heating the liquid at very high temperatures.", exp: "Boiling liquid at high temperatures instantly kills the harmful germs present in it." },
                { q: "It is a hot summer day. Why did Neha's mother put the leftover chicken curry inside the refrigerator?", a: "Low temperatures do not allow germs to grow fast", options: ["Low temperatures do not allow germs to grow fast", "It removes all water content", "It adds healthy salt coatings"], hint: "Think about how ice-cold weather affects bugs and living things—it slows them down!", exp: "Germs need warmth to survive. The cold temperatures inside a refrigerator prevent germs from multiplying rapidly." },
                { q: "The farmer harvested red chillies and spread them out under the hot sun for many days before packing them into bags. Which preservation method is this?", a: "Drying", options: ["Canning", "Freezing", "Drying"], hint: "This method removes all the water (moisture) from the food.", exp: "The drying method removes moisture. Because germs cannot survive without water, the food is preserved for a long time." }
            ]
        };

        const healthyFoods = ["🍎", "🍉", "🍌", "🥦", "🥕", "🥛", "🥚", "🍞"];
        const junkFoods = ["🍔", "🍟", "🥤", "🍩"];
        
        let canvas, ctx;
        let score = 0, level = 1, healthySlices = 0;
        let gameLoop, isPlaying = false, spawnTimer = 0;
        let items = [], swipeTrail = [];
        let currentQuiz = [], quizIndex = 0, attempts = 0, qData = null;
        let sndCorrect, sndWrong, sndClaps;

        // Shuffle Utility to randomize questions and options
        function shuffle(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Init
        window.onload = () => {
            canvas = document.getElementById('game-canvas');
            ctx = canvas.getContext('2d', { alpha: false }); 
            
            resize();
            window.addEventListener('resize', resize);
            setupInput();

            // Assets load silently so game won't crash if paths are missing
            try { sndCorrect = new Audio('assets/correct.mp3'); } catch(e){}
            try { sndWrong = new Audio('assets/wrong.mp3'); } catch(e){}
            try { sndClaps = new Audio('assets/freesound_community-claps-44774.mp3'); } catch(e){}

            // Screen 1 Splash Timing
            setTimeout(() => {
                document.getElementById('screen-splash').classList.add('hidden');
                document.getElementById('screen-title').classList.remove('hidden');
            }, 5000);
        };

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function navToInstructions() {
            document.getElementById('screen-title').classList.add('hidden');
            document.getElementById('screen-instructions').classList.remove('hidden');
        }

        function resetGame() {
            document.getElementById('screen-end').classList.add('hidden');
            startGame();
        }

        function playAudio(audioObj) {
            if(audioObj) { try { audioObj.currentTime = 0; audioObj.play().catch(()=>{}); } catch(e){} }
        }

        // Gameplay Initialization
        function startGame() {
            document.getElementById('screen-instructions').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            score = 0; level = 1; 
            startLevelPhase();
        }

        function startLevelPhase() {
            healthySlices = 0;
            items = []; swipeTrail = []; spawnTimer = 0;
            updateHUD();
            
            // Randomize the 5 questions for this level
            currentQuiz = shuffle(textbookDatabase[level]);
            
            isPlaying = true;
            requestAnimationFrame(engine);
        }

        function updateHUD() {
            document.getElementById('val-score').innerText = score;
            document.getElementById('val-level').innerText = level;
            document.getElementById('val-healthy').innerText = healthySlices;
        }

        // Falling Items Logic
        class Item {
            constructor() {
                this.x = Math.random() * (canvas.width - 80) + 40;
                this.y = canvas.height + 40;
                this.isJunk = Math.random() > 0.6;
                this.emoji = this.isJunk ? junkFoods[Math.floor(Math.random()*junkFoods.length)] : healthyFoods[Math.floor(Math.random()*healthyFoods.length)];
                this.vx = (canvas.width/2 - this.x) * 0.012 + (Math.random()*2-1);
                this.vy = -(canvas.height * 0.016 + 8);
                this.gravity = 0.22;
                this.active = true;
                this.radius = 40;
            }
            update() {
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                if(this.y > canvas.height + 60) this.active = false;
            }
            draw() {
                ctx.font = "55px Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(this.emoji, this.x, this.y);
            }
        }

        function engine() {
            if(!isPlaying) return;
            
            // Fill background
            ctx.fillStyle = "#2d1a10";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Spawn rate
            spawnTimer++;
            if(spawnTimer > 45) { items.push(new Item()); spawnTimer = 0; }

            // Update items
            for (let i = items.length - 1; i >= 0; i--) {
                let itm = items[i];
                itm.update();
                itm.draw();
                if(!itm.active) items.splice(i, 1);
            }

            // Draw swipe path
            if(swipeTrail.length > 1) {
                ctx.beginPath(); ctx.strokeStyle = "#ffbe0b"; ctx.lineWidth = 6; ctx.lineCap = "round";
                ctx.moveTo(swipeTrail[0].x, swipeTrail[0].y);
                for(let i=1; i<swipeTrail.length; i++) ctx.lineTo(swipeTrail[i].x, swipeTrail[i].y);
                ctx.stroke();
            }
            gameLoop = requestAnimationFrame(engine);
        }

        // Input & Slicing Control
        function setupInput() {
            const track = (x, y) => {
                if(!isPlaying) return;
                swipeTrail.push({x, y});
                if(swipeTrail.length > 6) swipeTrail.shift();
                checkSlice(x, y);
            };
            const clearSwipe = () => { swipeTrail = []; };

            canvas.addEventListener('mousemove', e => { if(e.buttons === 1) track(e.clientX, e.clientY); });
            canvas.addEventListener('touchmove', e => { track(e.touches[0].clientX, e.touches[0].clientY); }, {passive: true});
            window.addEventListener('mouseup', clearSwipe);
            window.addEventListener('touchend', clearSwipe);
        }

        function checkSlice(x, y) {
            items.forEach(itm => {
                if(!itm.active) return;
                let dist = Math.hypot(itm.x - x, itm.y - y);
                if(dist < itm.radius + 15) {
                    itm.active = false;
                    
                    if(itm.isJunk) {
                        playAudio(sndWrong); // No lives lost, just audio feedback
                    } else {
                        playAudio(sndCorrect);
                        healthySlices++;
                        updateHUD();
                        
                        if(healthySlices >= 3) {
                            isPlaying = false;
                            cancelAnimationFrame(gameLoop);
                            setTimeout(startQuizPhase, 500); 
                        }
                    }
                }
            });
        }

        // Quiz Handling
        function startQuizPhase() {
            document.getElementById('hud').classList.add('hidden');
            quizIndex = 0;
            renderQuestion();
            document.getElementById('screen-quiz').classList.remove('hidden');
        }

        function renderQuestion() {
            attempts = 0;
            qData = currentQuiz[quizIndex];
            
            document.getElementById('quiz-status').innerText = `Question ${quizIndex + 1} of 5 | Attempt 1 / 3`;
            document.getElementById('quiz-q').innerText = qData.q;
            
            const hintBox = document.getElementById('quiz-hint');
            hintBox.classList.add('hidden');
            hintBox.innerText = `💡 HINT: ${qData.hint}`;

            const expBox = document.getElementById('quiz-exp');
            expBox.classList.add('hidden');
            expBox.innerText = `📘 EXPLANATION: ${qData.exp}`;

            const optBox = document.getElementById('quiz-options');
            optBox.innerHTML = '';
            
            // Randomize options for display
            let opts = shuffle(qData.options);
            opts.forEach(opt => {
                let btn = document.createElement('button');
                btn.className = 'quiz-option';
                btn.innerText = opt;
                btn.onclick = (e) => evalAnswer(opt, btn);
                optBox.appendChild(btn);
            });
        }

        function evalAnswer(selected, btnElement) {
            attempts++;
            const opts = document.querySelectorAll('.quiz-option');

            if(selected === qData.a) {
                // Correct logic
                playAudio(sndCorrect);
                let points = (attempts === 1) ? 20 : (attempts === 2) ? 10 : 5;
                score += points;
                
                btnElement.classList.add('correct');
                opts.forEach(b => b.disabled = true);
                
                document.getElementById('quiz-status').innerText = "Correct! Great Job.";
                document.getElementById('quiz-exp').classList.remove('hidden');
                
                setTimeout(nextQuestion, 4000); // Time to read explanation
            } else {
                // Wrong logic
                playAudio(sndWrong);
                btnElement.classList.add('wrong');
                btnElement.disabled = true;

                if(attempts === 1) {
                    document.getElementById('quiz-hint').classList.remove('hidden');
                    document.getElementById('quiz-status').innerText = `Attempt 2 / 3`;
                } else if(attempts === 2) {
                    document.getElementById('quiz-status').innerText = `Attempt 3 / 3 - Last Chance!`;
                } else {
                    // Out of attempts, show correct answer and explanation
                    opts.forEach(b => {
                        b.disabled = true;
                        if(b.innerText === qData.a) b.classList.add('correct');
                    });
                    document.getElementById('quiz-status').innerText = "Out of attempts!";
                    document.getElementById('quiz-exp').classList.remove('hidden');
                    
                    setTimeout(nextQuestion, 4500); 
                }
            }
        }

        function nextQuestion() {
            quizIndex++;
            if(quizIndex >= 5) {
                document.getElementById('screen-quiz').classList.add('hidden');
                
                if(level >= 3) {
                    endGame(); // Finished all 15 questions
                } else {
                    level++;
                    document.getElementById('hud').classList.remove('hidden');
                    startLevelPhase();
                }
            } else {
                renderQuestion();
            }
        }

        function endGame() {
            isPlaying = false;
            cancelAnimationFrame(gameLoop);
            
            let msg = "";
            if(score >= 250) msg = "Incredible job! You have mastered the nutrients!";
            else if(score >= 150) msg = "Great effort! You know your curriculum well.";
            else msg = "Good try! Review your notes and play again to improve.";

            document.getElementById('end-title').innerText = "VICTORY!";
            document.getElementById('end-msg').innerText = msg;
            document.getElementById('end-score').innerText = score;
            
            playAudio(sndClaps);
            document.getElementById('screen-end').classList.remove('hidden');
        }
    </script>
</body>
</html>
