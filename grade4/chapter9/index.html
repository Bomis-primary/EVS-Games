<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>India Quest</title>
    <style>
        :root {
            --saffron: #FF9933;
            --white: #FFFFFF;
            --green-india: #138808;
            --navy-blue: #000080;
            --bg-light: #f4f6f7;
            --text-dark: #2c3e50;
            --coral-pink: #ff6b6b;
            --sky-blue: #3498db;
            --sky-light: #eaf2f8;
            --amber-yellow: #f1c40f;
            --font-family: 'Comic Sans MS', 'Segoe UI', Roboto, sans-serif;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: var(--font-family);
            background: linear-gradient(135deg, #ffefd5 0%, #e8f5e9 100%);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }

        .screen {
            display: none;
            width: 100%;
            max-width: 500px;
            min-height: 580px;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 28px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.12);
            padding: 25px;
            text-align: center;
            border-top: 8px solid var(--saffron);
            border-bottom: 8px solid var(--green-india);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            position: relative;
        }

        .screen.active {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* --- SPLASH SCREEN LOGO LAYOUT --- */
        #screen-splash {
            background: white !important;
            justify-content: center !important;
            align-items: center !important;
        }
        .logo-container img {
            max-width: 240px;
            height: auto;
            animation: pulseLogo 2s infinite ease-in-out;
        }
        @keyframes pulseLogo {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        h1 {
            color: var(--navy-blue);
            margin: auto 0;
            font-size: 2.5rem;
        }

        .btn-action {
            background: linear-gradient(135deg, var(--saffron) 0%, #ff7700 100%);
            color: white;
            border: none;
            padding: 16px 45px;
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 12px rgba(255, 153, 51, 0.3);
            transition: transform 0.1s ease;
            width: 85%;
            margin: 30px auto;
            border: 3px solid #fff;
        }
        .btn-action:active {
            transform: scale(0.96);
        }

        /* --- HUD ELEMENTS --- */
        .hud-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            background: var(--bg-light);
            padding: 10px 15px;
            border-radius: 16px;
            font-weight: bold;
            font-size: 1.05rem;
            border: 2px solid #e5e8e8;
        }
        .lives-box {
            color: var(--coral-pink);
            letter-spacing: 2px;
            font-size: 1.1rem;
        }
        .score-box {
            color: var(--green-india);
        }

        /* --- SCENARIO QUESTION BOX --- */
        .question-box {
            width: 100%;
            background: var(--sky-light);
            border: 3px solid var(--sky-blue);
            border-radius: 20px;
            padding: 18px;
            margin: 20px 0;
            text-align: left;
        }
        .question-box .category-tag {
            font-size: 0.85rem;
            background: var(--navy-blue);
            color: white;
            padding: 3px 10px;
            border-radius: 8px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 8px;
        }
        .question-box p {
            margin: 5px 0 0 0;
            font-size: 1.15rem;
            font-weight: bold;
            line-height: 1.4;
            color: var(--text-dark);
        }

        /* --- CONVEYOR BELT TRACK SYSTEM --- */
        .conveyor-window {
            width: 100%;
            overflow: hidden;
            background: #eaeded;
            border: 4px solid var(--navy-blue);
            border-radius: 20px;
            padding: 15px 0;
            margin: 15px 0;
            position: relative;
            display: flex;
            align-items: center;
            box-shadow: inset 0 5px 10px rgba(0,0,0,0.1);
        }

        .conveyor-track {
            display: flex;
            gap: 20px;
            white-space: nowrap;
            width: max-content;
            animation: scrollBelt 14s linear infinite;
        }

        @keyframes scrollBelt {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .conveyor-track.paused {
            animation-play-state: paused;
        }

        .item-card {
            background: white;
            border: 3px solid #bdc3c7;
            border-radius: 16px;
            padding: 15px 25px;
            font-size: 1.15rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.06);
            transition: transform 0.15s ease, background-color 0.2s ease;
            color: #34495e;
            display: inline-block;
            min-width: 150px;
            text-align: center;
        }
        .item-card:active {
            transform: scale(0.95);
        }

        /* --- SELECTION FEEDBACK COLORS --- */
        .item-card.correct-pick {
            background-color: #d4edda !important;
            border-color: var(--green-india) !important;
            color: #155724 !important;
        }
        .item-card.wrong-pick {
            background-color: #f8d7da !important;
            border-color: var(--coral-pink) !important;
            color: #721c24 !important;
        }

        /* --- HINT WARNING BOX --- */
        .hint-alert-box {
            width: 100%;
            background: #fff9e6;
            border: 2px solid var(--amber-yellow);
            border-radius: 14px;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: bold;
            color: #b7950b;
            margin-top: auto;
            display: none;
            text-align: left;
        }
    </style>
</head>
<body>

<audio id="sound-win" src="assets/correct.mp3" preload="auto"></audio>
<audio id="sound-fail" src="assets/wrong.mp3" preload="auto"></audio>
<audio id="sound-end" src="assets/freesound_community-claps-44774.mp3" preload="auto"></audio>

<div id="screen-splash" class="screen active">
    <div class="logo-container">
        <img src="assets/innovine-logo.png" alt="Innovine Logo">
    </div>
</div>

<div id="screen-welcome" class="screen">
    <h1>🇮🇳 India Quest</h1>
    <button class="btn-action" id="btn-to-rules">START</button>
</div>

<div id="screen-rules" class="screen">
    <h1>Game Rules 📜</h1>
    <button class="btn-action" id="btn-start-game">PLAY</button>
</div>

<div id="screen-play" class="screen">
    <div class="hud-bar">
        <span class="score-box">Score: <span id="label-score">0</span></span>
        <span id="label-round-tracker">Round 1: Q1/3</span>
        <span class="lives-box" id="label-lives">❤️❤️❤️❤️❤️</span>
    </div>

    <div class="question-box">
        <span class="category-tag" id="label-category-name">CATEGORY</span>
        <p id="label-question-text">Loading question text template...</p>
    </div>

    <div class="conveyor-window">
        <div class="conveyor-track" id="belt-track"></div>
    </div>
    
    <div class="hint-alert-box" id="box-hint-display">💡 Hint active panel...</div>
</div>

<div id="screen-results" class="screen">
    <h1 id="results-heading">Complete! 🎉</h1>
    <div style="background: var(--bg-light); padding: 20px; border-radius: 16px; width: 80%; margin: 20px 0; font-size: 1.6rem; font-weight: bold; color: var(--navy-blue);">
        Score: <span id="label-final-score">0</span>
    </div>
    <button class="btn-action" onclick="location.reload()">Play Again 🔄</button>
</div>

<script>
    const gameDatabase = [
        {
            category: "Neighboring Countries 🗺️",
            questions: [
                {
                    q: "Your friend Rahul is traveling north out of India to see the famous Great Wall. Which neighboring country is he visiting?",
                    o: ["China", "Sri Lanka", "Arabian Sea", "Mumbai"],
                    a: "China",
                    hint: "Think of our giant neighbor located high up across the northern Himalayan borders!"
                },
                {
                    q: "Meera is looking at India's map. She wants to spot the island neighbor country that sits right below the southern tip of India. Help her find it!",
                    o: ["Pakistan", "Sri Lanka", "Nepal", "Himalayas"],
                    a: "Sri Lanka",
                    hint: "It looks like a beautiful teardrop shape in the Indian Ocean directly to our south!"
                },
                {
                    q: "During a school quiz, Rohan is asked to name the western neighbor country that lies right next to the state of Gujarat and Rajasthan. What is the correct answer?",
                    o: ["Bhutan", "Myanmar", "Pakistan", "Delhi"],
                    a: "Pakistan",
                    hint: "This country shares its border with Punjab and Rajasthan on our western side!"
                }
            ]
        },
        {
            category: "Physical Landforms 🏔️",
            questions: [
                {
                    q: "Aarav is visiting a region covered entirely with loose sand, rocks, and very few cactus plants. Which landform division of India is he exploring?",
                    o: ["Northern Plains", "Great Indian Desert", "Islands", "Coastal Plains"],
                    a: "Great Indian Desert",
                    hint: "This dry, hot sandy region is also famously known as the Thar Desert!"
                },
                {
                    q: "Sita wants to see the highest mountain peaks in the world covered in white snow. To which physical division should she travel?",
                    o: ["Northern Mountains", "Peninsular Plateau", "Coastal Plains", "China"],
                    a: "Northern Mountains",
                    hint: "This area forms a giant protective wall of ice and stone along India's northern edge!"
                },
                {
                    q: "Kabir lives near a flat, super fertile land where farmers easily grow lots of crops like rice and wheat next to large flowing rivers. Where does he live?",
                    o: ["Peninsular Plateau", "Northern Plains", "Great Indian Desert", "Nepal"],
                    a: "Northern Plains",
                    hint: "Look for the flat, rich plains that lie directly south of the Himalayas!"
                }
            ]
        },
        {
            category: "States of India 🏛️",
            questions: [
                {
                    q: "Your cousin wants to see the historic Gateway of India monument located in the capital city of Mumbai. Which state must they travel to?",
                    o: ["Maharashtra", "Kerala", "Bihar", "Ladakh"],
                    a: "Maharashtra",
                    hint: "Mumbai is the sprawling capital city of this large western-central state!"
                },
                {
                    q: "Riya is visiting Jaipur, the famous 'Pink City', to see ancient palaces located inside India's biggest state by land area. Which state is it?",
                    o: ["Goa", "Rajasthan", "Arunachal Pradesh", "Chandigarh"],
                    a: "Rajasthan",
                    hint: "This huge western state contains the Great Indian Desert!"
                },
                {
                    q: "Tina lives in the smallest state of India, famous for its beautiful sandy beaches and coconut trees along the western coast. Name this tiny state!",
                    o: ["Bihar", "Gujarat", "Goa", "Delhi"],
                    a: "Goa",
                    hint: "It is a very small, fun beach state tucked neatly between Maharashtra and Karnataka!"
                }
            ]
        },
        {
            category: "Union Territories ⚓",
            questions: [
                {
                    q: "Arjun is flying to a group of beautiful islands located in the Bay of Bengal water body to see the historic Cellular Jail. What Union Territory is this?",
                    o: ["Andaman & Nicobar Islands", "Lakshadweep", "Chandigarh", "Puducherry"],
                    a: "Andaman & Nicobar Islands",
                    hint: "This island cluster sits on the right-hand (eastern) side of India's main peninsula!"
                },
                {
                    q: "Sonam lives in a high, cold mountain territory located in the far north, famous for its beautiful lakes, unique culture, and the town of Leh. Where does she live?",
                    o: ["Puducherry", "Delhi", "Ladakh", "Goa"],
                    a: "Ladakh",
                    hint: "This northern mountain territory was newly created right next to Jammu & Kashmir!"
                },
                {
                    q: "Amit wants to visit the official capital city of India where the Prime Minister resides and works. Which special Union Territory is this?",
                    o: ["Chandigarh", "Delhi", "Lakshadweep", "Mumbai"],
                    a: "Delhi",
                    hint: "This central territory contains New Delhi, our nation's heart and political capital!"
                }
            ]
        }
    ];

    let currentCategoryIdx = 0;
    let currentQuestionIdx = 0; 
    let score = 0;
    let lives = 5;
    let attemptsOnCurrentQuestion = 0; 

    function displayActiveScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    // Fixed 5-Second Splash Screen Delay Control
    setTimeout(() => { displayActiveScreen('screen-welcome'); }, 5000);

    document.getElementById('btn-to-rules').addEventListener('pointerup', () => displayActiveScreen('screen-rules'));
    document.getElementById('btn-start-game').addEventListener('pointerup', () => {
        displayActiveScreen('screen-play');
        initGameEngine();
    });

    function initGameEngine() {
        score = 0;
        lives = 5;
        currentCategoryIdx = 0;
        currentQuestionIdx = 0;
        loadQuestionCycle();
    }

    function loadQuestionCycle() {
        attemptsOnCurrentQuestion = 0;
        document.getElementById('box-hint-display').style.display = 'none';
        updateHUD();

        let currentCatData = gameDatabase[currentCategoryIdx];
        let qData = currentCatData.questions[currentQuestionIdx];

        document.getElementById('label-category-name').innerText = currentCatData.category;
        document.getElementById('label-round-tracker').innerText = `Round ${currentCategoryIdx + 1}: Q${currentQuestionIdx + 1}/3`;
        document.getElementById('label-question-text').innerText = qData.q;

        const track = document.getElementById('belt-track');
        track.className = "conveyor-track"; // Ensure animation plays smoothly
        track.innerHTML = "";

        // Double options array length to achieve endless loop background effect
        let repeatedPool = [...qData.o, ...qData.o];

        repeatedPool.forEach((optionText, internalIdx) => {
            const card = document.createElement('div');
            card.className = 'item-card';
            card.innerText = optionText;
            
            card.addEventListener('pointerup', (e) => {
                e.preventDefault();
                verifyPlayerInput(card, optionText, qData.a, qData.hint);
            });
            track.appendChild(card);
        });
    }

    function updateHUD() {
        document.getElementById('label-score').innerText = score;
        let hearts = "";
        for(let i=0; i<5; i++) {
            hearts += (i < lives) ? "❤️" : "🖤";
        }
        document.getElementById('label-lives').innerText = hearts;
    }

    function verifyPlayerInput(selectedCard, chosenText, correctText, hintMessage) {
        if (selectedCard.classList.contains('correct-pick') || selectedCard.classList.contains('wrong-pick')) return;

        attemptsOnCurrentQuestion++;
        const track = document.getElementById('belt-track');

        if (chosenText === correctText) {
            track.classList.add('paused'); // Lock belt movement during selection feedback
            
            // Highlight instances matching the text strings inside the doubled tracks container
            document.querySelectorAll('.item-card').forEach(c => {
                if(c.innerText === correctText) c.classList.add('correct-pick');
            });

            document.getElementById('sound-win').play().catch(()=>{});
            score += (attemptsOnCurrentQuestion === 1) ? 20 : 10;
            document.getElementById('label-score').innerText = score;

            lockAllCards();
            setTimeout(advanceGameProgress, 1500);
        } else {
            selectedCard.classList.add('wrong-pick');
            document.getElementById('sound-fail').play().catch(()=>{});
            lives--;
            updateHUD();

            if (lives <= 0) {
                track.classList.add('paused');
                lockAllCards();
                setTimeout(() => terminateGameEngine(false), 1500);
                return;
            }

            if (attemptsOnCurrentQuestion === 1) {
                const hintBox = document.getElementById('box-hint-display');
                hintBox.innerText = "💡 Hint: " + hintMessage;
                hintBox.style.display = 'block';
                
                // Only disable the single instances clicked by the user
                selectedCard.style.pointerEvents = 'none';
                selectedCard.style.opacity = '0.4';
            } else {
                track.classList.add('paused');
                lockAllCards();
                // Flag correct answer on screen natively
                document.querySelectorAll('.item-card').forEach(c => {
                    if (c.innerText === correctText) c.classList.add('correct-pick');
                });
                setTimeout(advanceGameProgress, 2000);
            }
        }
    }

    function lockAllCards() {
        document.querySelectorAll('.item-card').forEach(c => c.style.pointerEvents = 'none');
    }

    function advanceGameProgress() {
        currentQuestionIdx++;
        if (currentQuestionIdx >= 3) {
            currentQuestionIdx = 0;
            currentCategoryIdx++;
        }

        if (currentCategoryIdx >= gameDatabase.length) {
            terminateGameEngine(true);
        } else {
            loadQuestionCycle();
        }
    }

    function terminateGameEngine(isWin) {
        displayActiveScreen('screen-results');
        document.getElementById('label-final-score').innerText = score;
        document.getElementById('sound-end').play().catch(()=>{});
        document.getElementById('results-heading').innerText = isWin ? "🏆 Quiz Hero!" : "🚨 Try Again!";
    }
</script>
</body>
</html>
