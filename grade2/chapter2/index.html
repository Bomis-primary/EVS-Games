<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Food Crush Mania</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #ffebf0; font-family: 'Arial Rounded MT Bold', 'Chalkboard SE', sans-serif; }
        
        #gameWrapper {
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, #ffebf0 0%, #ffccd5 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            position: relative;
        }

        #statsBar {
            width: 100%;
            max-width: 430px;
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            gap: 5px;
        }
        .stat-pill {
            background: #ffffff;
            border: 3px solid #ffccd5;
            border-radius: 16px;
            padding: 8px 12px;
            font-size: 14px;
            font-weight: 900;
            color: #ff477e;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            gap: 4px;
            flex: 1;
            justify-content: center;
        }

        #boardContainer {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 430px;
            aspect-ratio: 1/1;
        }
        #gridBoard {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(6, 1fr);
            gap: 8px;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.85);
            border: 8px solid #ff8fa3;
            border-radius: 32px;
            padding: 10px;
            box-shadow: 0 12px 28px rgba(255, 143, 163, 0.3);
            position: relative;
        }

        .tile {
            background: radial-gradient(circle, #ffffff 40%, #f0f0f0 100%);
            border: 3px solid #e2e8f0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(26px, 8.5vw, 38px);
            cursor: pointer;
            box-shadow: 0 6px 0 #cbd5e1;
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }
        .tile:active { transform: scale(0.9); }
        .tile.selected { 
            background: radial-gradient(circle, #fff0f5 20%, #ffb6c1 100%);
            border-color: #ff477e; 
            box-shadow: 0 2px 0 #ff477e;
            transform: scale(1.08);
            animation: pulseTile 0.6s infinite alternate;
        }

        #controlRow {
            width: 100%;
            max-width: 430px;
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 5px;
            margin-bottom: 10px;
        }
        .util-btn {
            background: linear-gradient(180deg, #4ed964 0%, #34c759 100%);
            border: 3px solid #ffffff;
            color: white;
            padding: 8px 22px;
            border-radius: 20px;
            font-weight: 900;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(52, 199, 89, 0.3);
        }

        @keyframes pulseTile { 0% { transform: scale(1.04); } 100% { transform: scale(1.12); } }
        @keyframes popOut { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(0); opacity: 0; } }
        .pop-anim { animation: popOut 0.2s cubic-bezier(0.6, -0.28, 0.735, 0.045) forwards; }

        .layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; z-index: 100; }
        #screenLogo { background: #ffffff; z-index: 300; }
        #screenLogo img { max-width: 70%; max-height: 40%; object-fit: contain; }

        #screenTitle { background: linear-gradient(135deg, #ffebf0 0%, #ffccd5 100%); z-index: 200; }
        #screenIntro { background: #fff0f3; z-index: 150; }
        #screenEnd { background: radial-gradient(circle, #e8f5e9 0%, #c8e6c9 100%); display: none; z-index: 250; }

        #screenQuiz { background: rgba(0,0,0,0.6); display: none; z-index: 400; }
        .quiz-card { background: white; border: 6px solid #ff477e; border-radius: 28px; padding: 20px; width: 95%; max-width: 400px; box-shadow: 0 12px 30px rgba(0,0,0,0.3); text-align: left; }
        .quiz-question { font-size: 16px; font-weight: bold; color: #2d3748; margin-bottom: 15px; line-height: 1.4; background: #fff0f3; padding: 12px; border-radius: 16px; transition: background 0.3s ease; }
        .quiz-options { display: flex; flex-direction: column; gap: 10px; }
        .option-btn { background: #f8fafc; border: 2px solid #cbd5e1; padding: 12px 16px; border-radius: 16px; font-size: 15px; font-weight: bold; color: #4a5568; cursor: pointer; text-align: left; transition: all 0.2s ease; }

        .game-title { font-size: clamp(42px, 12vw, 60px); color: #ff477e; font-weight: 900; text-transform: uppercase; line-height: 1; letter-spacing: -1px; text-shadow: 3px 4px 0 white; margin-bottom: 20px; }
        .action-btn { background: linear-gradient(180deg, #ff7b93 0%, #ff477e 100%); color: white; border: 4px solid white; padding: 14px 45px; font-size: clamp(16px, 4.5vw, 22px); font-weight: 900; border-radius: 30px; cursor: pointer; box-shadow: 0 6px 14px rgba(255, 71, 126, 0.3); }

        .popup-card { background: white; border: 4px solid #ff8fa3; border-radius: 28px; padding: 25px; width: 92%; max-width: 380px; }
        .rule-line { display: flex; align-items: center; gap: 12px; font-size: 16px; font-weight: bold; text-align: left; margin-bottom: 14px; color: #4a5568; }
    </style>
</head>
<body>

<div id="gameWrapper">
    <div id="screenLogo" class="layer">
        <img src="assets/innovine-logo.png" alt="Innovine Logo">
    </div>

    <div id="screenTitle" class="layer">
        <h1 class="game-title">Food<br><span style="color: #ff7b93;">Crush</span></h1>
        <button class="action-btn" onclick="showFirstInstructions()">PLAY ▶</button>
    </div>

    <div id="screenIntro" class="layer">
        <div class="popup-card">
            <h2 style="color: #ff477e; margin-bottom: 18px; text-align: center; font-size: 24px;">How to Play!</h2>
            <div id="introRules">
                <div class="rule-line"><span>🍬</span><span>Match items to trigger surprise questions!</span></div>
                <div class="rule-line"><span>⭐</span><span>Points are ONLY earned by answering correctly.</span></div>
                <div class="rule-line"><span>❤️</span><span>Losing all lives resets the level's puzzle!</span></div>
            </div>
            <button class="action-btn" style="width: 100%; margin-top: 10px;" onclick="startGameSession()">START GAME 🚀</button>
        </div>
    </div>

    <div id="screenQuiz" class="layer">
        <div class="quiz-card">
            <h3 style="color:#ff477e; margin-bottom: 8px; font-size: 14px;" id="quizProgress">CHALLENGE</h3>
            <div class="quiz-question" id="quizQuestionText">Loading...</div>
            <div class="quiz-options" id="quizOptionsContainer"></div>
        </div>
    </div>

    <div id="statsBar">
        <div class="stat-pill" id="lblLevel">🏆 Level: 1</div>
        <div class="stat-pill" id="lblScore">⭐ Score: 0</div>
        <div class="stat-pill" style="background:#ff477e; color:white; border-color:white;" id="lblAttempts">Lives: 2</div>
    </div>

    <div id="boardContainer">
        <div id="gridBoard"></div>
    </div>

    <div id="controlRow">
        <button class="util-btn" onclick="triggerUndo()">↩️ UNDO SWAP</button>
    </div>

    <div id="screenEnd" class="layer">
        <h1 class="game-title" style="color: #2e7d32;">WINNER! 🏆</h1>
        <div class="popup-card" style="border-color: #a1c4fd; margin-bottom: 20px;">
            <p style="font-size: 22px; font-weight: 900; color: #2e7d32;" id="lblFinalScore">Final Score: 0</p>
            <p style="font-weight: bold; color: #718096; margin-top: 8px;">Amazing job learning about food choices!</p>
        </div>
        <button class="action-btn" style="background:linear-gradient(180deg, #4caf50 0%, #2e7d32 100%); border-color:white;" onclick="location.reload()">PLAY AGAIN 🔄</button>
    </div>
</div>

<script>
    const sndCorrect = new Audio('assets/correct.mp3');
    const sndWrong = new Audio('assets/wrong.mp3');
    const sndClap = new Audio('assets/freesound_community-claps-44774.mp3');
    const sndBgm = new Audio('assets/playfulsong.mp3');
    sndBgm.loop = true;

    const GRID_SIZE = 6;
    
    const ITEMS = {
        apple:  { symbol: "🍎" },
        banana: { symbol: "🍌" },
        milk:   { symbol: "🥛" },
        eggs:   { symbol: "🥚" },
        cheese: { symbol: "🧀" },
        burger: { symbol: "🍔" },
        pizza:  { symbol: "🍕" },
        soda:   { symbol: "🥤" }
    };

    // 12 unique questions with custom Grade 2 intuitive hints added
    const sourceQuestions = [
        { q: "I am a round and crunchy fruit. I can be red or green. An apple a day keeps the doctor away! What am I?", ops: ["🍎 Apple", "🍌 Banana", "🍍 Pineapple"], ans: "🍎 Apple", hint: "💡 Hint: Look closely at the phrase 'An apple a day'!" },
        { q: "I am yellow and sweet. I am a long fruit that monkeys love to peel and eat. What am I?", ops: ["🍍 Pineapple", "🥭 Mango", "🍌 Banana"], ans: "🍌 Banana", hint: "💡 Hint: It has a yellow peel and curves like a little smile!" },
        { q: "I am yellow, sweet, and very juicy. Everyone calls me the 'King of Fruits' during the hot summer. What am I?", ops: ["🥭 Mango", "🍎 Apple", "🍉 Watermelon"], ans: "🥭 Mango", hint: "💡 Hint: India's favourite summer fruit, starting with the letter M!" },
        { q: "Simran’s mother is cooking rice and dal. She says rice comes from plants. Where do we get milk, eggs, and meat from?", ops: ["🐮 Animals", "🌱 Plants", "🏪 Only from shops"], ans: "🐮 Animals", hint: "💡 Hint: Cows give us milk, and hens give us eggs!" },
        { q: "Kabir's grandfather is eating a soft chapati. Which plant grain is crushed into flour to make chapatis and bread?", ops: ["🥛 Rice seeds", "🍞 Wheat grains", "🍯 Corn stalks"], ans: "🍞 Wheat grains", hint: "💡 Hint: Flour used for making soft rotis comes from wheat!" },
        { q: "Meera wants to run very fast and win the school race. She needs Energy-giving foods. What should she eat?", ops: ["🥔 Potato and Rice", "🥚 Eggs and Meat", "🥬 Spinach and Water"], ans: "🥔 Potato and Rice", hint: "💡 Hint: Potatoes and rice fill our bodies up with instant energy!" },
        { q: "Little Sonu wants his bones and muscles to grow big, strong, and tall. Which Body-building food should he drink every single day?", ops: ["🥤 Fizzy Soda", "🥛 Milk", "☕ Tea"], ans: "🥛 Milk", hint: "💡 Hint: It's white, healthy, comes from cows, and builds our teeth!" },
        { q: "Ananya does not want to fall sick or catch a cold. She needs Protective food to fight germs. What should she eat?", ops: ["🍕 Pizza and Burgers", "🍇 Fruits and Vegetables", "🍬 Candy and Chocolates"], ans: "🍇 Fruits and Vegetables", hint: "💡 Hint: Natural, colourful items from garden trees keep us healthy!" },
        { q: "Rahul says: 'I love eating kheer, paneer, fruits, and dal, but I never eat meat, chicken, or fish!' What kind of food eater is Rahul?", ops: ["🌱 Vegetarian", "🍗 Non-vegetarian", "🛸 Alien"], ans: "🌱 Vegetarian", hint: "💡 Hint: People who eat only plants and dairy foods are vegetarians!" },
        { q: "Teacher asks: 'Yummy biscuits are made using wheat flour, sugar, milk, and butter. Where do these things come from?'", ops: ["🌱 Only from plants", "🐮 Only from animals", "🍕 Both plants and animals"], ans: "🍕 Both plants and animals", hint: "💡 Hint: Wheat comes from plants, but milk and butter come from cows!" },
        { q: "Aarav is sitting down at the dining table to eat his lunch. What is the most important thing he must do before and after eating?", ops: ["🧼 Wash his hands with soap", "📱 Play a game on the phone", "😴 Go straight to sleep"], ans: "🧼 Wash his hands with soap", hint: "💡 Hint: Use soap and water to wash away dirty gems on fingers!" },
        { q: "Sarita sees an open street food cart with dirty flies buzzing all over the uncovered food. What will happen if she eats it?", ops: ["🦸‍♀️ She will get superpowers", "🤢 It can make her fall sick", "🎂 She will win a prize"], ans: "🤢 It can make her fall sick", hint: "💡 Hint: Uncovered food with flies carries bad stomach germs!" }
    ];

    let currentLevelQuestions = [];
    let currentLevel = 1;
    let score = 0; 
    let quizLives = 2; 
    let boardState = [];
    let activeSelection = null;
    let lockControls = false;
    let lastExecutedSwap = null;
    let activeQuizIndex = 0;

    function shuffleArray(arr) {
        let copy = [...arr];
        for (let i = copy.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
    }

    function prepareLevelRiddles() {
        let shuffledPool = shuffleArray(sourceQuestions);
        let selectedThree = shuffledPool.slice(0, 3);
        
        currentLevelQuestions = selectedThree.map(item => {
            return {
                q: item.q,
                ops: shuffleArray(item.ops), 
                ans: item.ans,
                hint: item.hint
            };
        });
        activeQuizIndex = 0;
    }

    setTimeout(() => { document.getElementById('screenLogo').style.display = 'none'; }, 2500);

    function showFirstInstructions() {
        document.getElementById('screenTitle').style.display = 'none';
        document.getElementById('screenIntro').style.display = 'flex';
    }
    
    function startGameSession() {
        document.getElementById('screenIntro').style.display = 'none';
        currentLevel = 1;
        score = 0;
        prepareLevelRiddles();
        initiateLevelDataLoad();
        sndBgm.currentTime = 0; sndBgm.play().catch(()=>{});
    }

    function initiateLevelDataLoad() {
        quizLives = 2;
        updateHUDView();
        buildCandyBoard();
    }

    function buildCandyBoard() {
        const boardEl = document.getElementById('gridBoard');
        boardEl.innerHTML = "";
        boardState = [];

        for (let r = 0; r < GRID_SIZE; r++) {
            boardState[r] = [];
            for (let c = 0; c < GRID_SIZE; c++) {
                let item = getRandomItem();
                while (checkForInitialMatch3(r, c, item)) { item = getRandomItem(); }
                boardState[r][c] = item;

                const tileEl = document.createElement('div');
                tileEl.id = `tile-${r}-${c}`;
                tileEl.className = "tile";
                tileEl.innerText = item.symbol;
                tileEl.addEventListener('click', () => handleSelect(r, c));
                boardEl.appendChild(tileEl);
            }
        }
        verifyBoardHasPotentialMatches();
    }

    function getRandomItem() {
        const keys = Object.keys(ITEMS);
        return ITEMS[keys[Math.floor(Math.random() * keys.length)]];
    }

    function checkForInitialMatch3(r, c, item) {
        if (c >= 2 && boardState[r][c-1]?.symbol === item.symbol && boardState[r][c-2]?.symbol === item.symbol) return true;
        if (r >= 2 && boardState[r-1][c]?.symbol === item.symbol && boardState[r-2][c]?.symbol === item.symbol) return true;
        return false;
    }

    function handleSelect(r, c) {
        if (lockControls) return;
        const clickedEl = document.getElementById(`tile-${r}-${c}`);

        if (!activeSelection) {
            activeSelection = { r, c, element: clickedEl };
            clickedEl.classList.add('selected');
        } else {
            if (activeSelection.r === r && activeSelection.c === c) {
                clickedEl.classList.remove('selected');
                activeSelection = null;
                return;
            }

            const dist = Math.abs(activeSelection.r - r) + Math.abs(activeSelection.c - c);
            if (dist === 1) {
                swapTilesAction(activeSelection.r, activeSelection.c, r, c, true);
            } else {
                activeSelection.element.classList.remove('selected');
                activeSelection = { r, c, element: clickedEl };
                clickedEl.classList.add('selected');
            }
        }
    }

    async function swapTilesAction(r1, c1, r2, c2, recordHistory = true) {
        lockControls = true;
        if(activeSelection) activeSelection.element.classList.remove('selected');
        activeSelection = null;

        if (recordHistory) { lastExecutedSwap = { r1, c1, r2, c2 }; }

        let t1 = boardState[r1][c1];
        boardState[r1][c1] = boardState[r2][c2];
        boardState[r2][c2] = t1;

        document.getElementById(`tile-${r1}-${c1}`).innerText = boardState[r1][c1].symbol;
        document.getElementById(`tile-${r2}-${c2}`).innerText = boardState[r2][c2].symbol;

        let matchedCoordinates = evaluateBoardMatches();
        if (matchedCoordinates.length > 0) {
            await runFullCascadeLoop(matchedCoordinates);
            setTimeout(launchQuizRiddleOverlay, 350);
        } else {
            if (recordHistory) {
                let t2 = boardState[r1][c1];
                boardState[r1][c1] = boardState[r2][c2];
                boardState[r2][c2] = t2;
                document.getElementById(`tile-${r1}-${c1}`).innerText = boardState[r1][c1].symbol;
                document.getElementById(`tile-${r2}-${c2}`).innerText = boardState[r2][c2].symbol;
                sndWrong.currentTime = 0; sndWrong.play().catch(()=>{});
                lockControls = false;
            } else {
                lockControls = false;
            }
        }
    }

    function triggerUndo() {
        if (lockControls || !lastExecutedSwap) return;
        const { r1, c1, r2, c2 } = lastExecutedSwap;
        swapTilesAction(r1, c1, r2, c2, false);
        lastExecutedSwap = null;
    }

    function evaluateBoardMatches() {
        let matchedSet = new Set();
        for (let r = 0; r < GRID_SIZE; r++) {
            for (let c = 0; c < GRID_SIZE - 2; c++) {
                if (boardState[r][c] && boardState[r][c+1] && boardState[r][c+2] &&
                    boardState[r][c].symbol === boardState[r][c+1].symbol && boardState[r][c].symbol === boardState[r][c+2].symbol) {
                    matchedSet.add(`${r},${c}`); matchedSet.add(`${r},${c+1}`); matchedSet.add(`${r},${c+2}`);
                }
            }
        }
        for (let c = 0; c < GRID_SIZE; c++) {
            for (let r = 0; r < GRID_SIZE - 2; r++) {
                if (boardState[r][c] && boardState[r+1][c] && boardState[r+2][c] &&
                    boardState[r][c].symbol === boardState[r+1][c].symbol && boardState[r][c].symbol === boardState[r+2][c].symbol) {
                    matchedSet.add(`${r},${c}`); matchedSet.add(`${r+1},${c}`); matchedSet.add(`${r+2},${c}`);
                }
            }
        }
        return Array.from(matchedSet).map(s => { const [r,c] = s.split(',').map(Number); return {r,c}; });
    }

    async function runFullCascadeLoop(initialMatches) {
        let activeMatches = initialMatches;
        while(activeMatches.length > 0) {
            activeMatches.forEach(coord => {
                if(boardState[coord.r][coord.c]) {
                    document.getElementById(`tile-${coord.r}-${coord.c}`).classList.add('pop-anim');
                }
            });
            sndCorrect.currentTime = 0; sndCorrect.play().catch(()=>{});
            await new Promise(res => setTimeout(res, 250));

            executeBoardGravityDrop();
            refillBoardSpaces();
            await new Promise(res => setTimeout(res, 150));

            activeMatches = evaluateBoardMatches();
        }
        verifyBoardHasPotentialMatches();
    }

    function executeBoardGravityDrop() {
        for (let c = 0; c < GRID_SIZE; c++) {
            let spaceCount = 0;
            for (let r = GRID_SIZE - 1; r >= 0; r--) {
                if (document.getElementById(`tile-${r}-${c}`).classList.contains('pop-anim')) {
                    spaceCount++;
                    boardState[r][c] = null;
                } else if (spaceCount > 0) {
                    boardState[r + spaceCount][c] = boardState[r][c];
                    boardState[r][c] = null;
                }
            }
        }
    }

    function refillBoardSpaces() {
        for (let r = 0; r < GRID_SIZE; r++) {
            for (let c = 0; c < GRID_SIZE; c++) {
                let el = document.getElementById(`tile-${r}-${c}`);
                el.classList.remove('pop-anim');
                if (boardState[r][c] === null) { boardState[r][c] = getRandomItem(); }
                el.innerText = boardState[r][c].symbol;
            }
        }
    }

    function launchQuizRiddleOverlay() {
        lockControls = true;
        if (activeQuizIndex >= currentLevelQuestions.length) { activeQuizIndex = 0; }
        
        const quizData = currentLevelQuestions[activeQuizIndex];
        
        // Reset styles back to default puzzle setup
        const questionBox = document.getElementById('quizQuestionText');
        questionBox.style.background = "#fff0f3";
        questionBox.innerText = quizData.q;
        
        document.getElementById('quizProgress').innerText = `CHALLENGE (${activeQuizIndex + 1}/3)`;
        
        const optionsContainer = document.getElementById('quizOptionsContainer');
        optionsContainer.innerHTML = "";
        
        quizData.ops.forEach((optionText) => {
            const btn = document.createElement('button');
            btn.className = "option-btn";
            btn.innerText = optionText;
            btn.onclick = () => evaluateQuizAnswer(optionText, btn, quizData.ans, quizData.hint);
            optionsContainer.appendChild(btn);
        });
        
        document.getElementById('screenQuiz').style.display = "flex";
    }

    function evaluateQuizAnswer(selectedText, buttonElement, correctText, hintText) {
        if (selectedText.trim() === correctText.trim()) {
            score += 10;
            updateHUDView();
            buttonElement.style.background = "#c8e6c9";
            buttonElement.style.borderColor = "#4caf50";
            buttonElement.style.color = "#1b5e20";
            sndCorrect.currentTime = 0; sndCorrect.play().catch(()=>{});
            
            setTimeout(() => {
                activeQuizIndex++;
                if (activeQuizIndex < 3) {
                    launchQuizRiddleOverlay();
                } else {
                    document.getElementById('screenQuiz').style.display = "none";
                    lockControls = false;
                    advanceNextLevelStructure();
                }
            }, 1000);
        } else {
            quizLives--;
            updateHUDView();
            
            // Visual indicators for the wrong option selected
            buttonElement.style.background = "#ffcdcd";
            buttonElement.style.borderColor = "#f44336";
            buttonElement.style.color = "#b71c1c";
            sndWrong.currentTime = 0; sndWrong.play().catch(()=>{});

            // Dynamically updates the question box layout to output a simple structural hint
            const questionBox = document.getElementById('quizQuestionText');
            questionBox.style.background = "#fff9c4"; // Warm reminder yellow accent
            questionBox.innerText = hintText;

            if (quizLives <= 0) {
                setTimeout(() => {
                    document.getElementById('screenQuiz').style.display = "none";
                    prepareLevelRiddles(); 
                    initiateLevelDataLoad(); 
                    lockControls = false;
                }, 1400);
            }
        }
    }

    function verifyBoardHasPotentialMatches() {
        let viable = false;
        for (let r = 0; r < GRID_SIZE; r++) {
            for (let c = 0; c < GRID_SIZE; c++) {
                if (c < GRID_SIZE - 1 && testSwapMatching(r, c, r, c + 1)) viable = true;
                if (r < GRID_SIZE - 1 && testSwapMatching(r, c, r + 1, c)) viable = true;
            }
        }
        if (!viable) { buildCandyBoard(); }
    }

    function testSwapMatching(r1, c1, r2, c2) {
        let temp = boardState[r1][c1];
        boardState[r1][c1] = boardState[r2][c2];
        boardState[r2][c2] = temp;
        let matches = evaluateBoardMatches();
        boardState[r2][c2] = boardState[r1][c1];
        boardState[r1][c1] = temp;
        return matches.length > 0;
    }

    function advanceNextLevelStructure() {
        if (currentLevel < 3) {
            currentLevel++;
            prepareLevelRiddles(); 
            initiateLevelDataLoad(); 
        } else {
            sndBgm.pause(); sndClap.play().catch(()=>{});
            document.getElementById('lblFinalScore').innerText = `Final Score: ${score}`;
            document.getElementById('screenEnd').style.display = 'flex';
        }
    }

    function updateHUDView() {
        document.getElementById('lblLevel').innerText = `🏆 Level: ${currentLevel}`;
        document.getElementById('lblScore').innerText = `⭐ Score: ${score}`;
        document.getElementById('lblAttempts').innerText = `Lives: ${quizLives}`;
    }
</script>
</body>
</html>
