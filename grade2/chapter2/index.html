<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Food Crush Mania</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #ffebf0; font-family: 'Arial Rounded MT Bold', 'Chalkboard SE', sans-serif; }
        
        #gameWrapper {
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, #ffebf0 0%, #ffccd5 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            position: relative;
        }

        /* Candy Crush Styled Headers */
        #levelBanner {
            width: 100%;
            max-width: 430px;
            background: linear-gradient(180deg, #ff6b8b 0%, #ff477e 100%);
            border: 4px solid #ffffff;
            border-radius: 20px;
            padding: 8px 12px;
            text-align: center;
            box-shadow: 0 6px 16px rgba(255, 71, 126, 0.4);
            color: #ffffff;
        }
        #levelTitle { font-size: 18px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.5px; text-shadow: 1px 2px 0px rgba(0,0,0,0.2); }
        #levelTask { font-size: 13px; font-weight: bold; background: rgba(0, 0, 0, 0.15); border-radius: 10px; padding: 2px 8px; margin-top: 4px; display: inline-block; }

        #statsBar {
            width: 100%;
            max-width: 430px;
            display: flex;
            justify-content: space-between;
            margin: 6px 0;
        }
        .stat-pill {
            background: #ffffff;
            border: 3px solid #ffccd5;
            border-radius: 16px;
            padding: 6px 14px;
            font-size: 14px;
            font-weight: 900;
            color: #ff477e;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Vibrant Candy Grid */
        #boardContainer {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 430px;
            aspect-ratio: 1/1;
        }
        #gridBoard {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(6, 1fr);
            gap: 8px;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.85);
            border: 8px solid #ff8fa3;
            border-radius: 32px;
            padding: 10px;
            box-shadow: 0 12px 28px rgba(255, 143, 163, 0.3);
            position: relative;
        }

        .tile {
            background: radial-gradient(circle, #ffffff 40%, #f0f0f0 100%);
            border: 3px solid #e2e8f0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(26px, 8.5vw, 38px);
            cursor: pointer;
            box-shadow: 0 6px 0 #cbd5e1;
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }
        .tile:active { transform: scale(0.9); }
        .tile.selected { 
            background: radial-gradient(circle, #fff0f5 20%, #ffb6c1 100%);
            border-color: #ff477e; 
            box-shadow: 0 2px 0 #ff477e;
            transform: scale(1.08);
            animation: pulseTile 0.6s infinite alternate;
        }

        #controlRow {
            width: 100%;
            max-width: 430px;
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 5px;
        }
        .util-btn {
            background: linear-gradient(180deg, #4ed964 0%, #34c759 100%);
            border: 3px solid #ffffff;
            color: white;
            padding: 8px 22px;
            border-radius: 20px;
            font-weight: 900;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(52, 199, 89, 0.3);
        }
        .util-btn:active { transform: translateY(2px); box-shadow: none; }

        @keyframes pulseTile { 0% { transform: scale(1.04); } 100% { transform: scale(1.12); } }
        @keyframes popOut { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(0); opacity: 0; } }
        .pop-anim { animation: popOut 0.2s cubic-bezier(0.6, -0.28, 0.735, 0.045) forwards; }

        /* Full Screen Layers overlay */
        .layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; z-index: 100; }
        #screenLogo { background: #ffffff; z-index: 300; }
        #screenLogo img { max-width: 70%; max-height: 40%; object-fit: contain; }

        #screenTitle { background: linear-gradient(135deg, #ffebf0 0%, #ffccd5 100%); z-index: 200; }
        #screenIntro { background: #fff0f3; z-index: 150; }
        #screenEnd { background: radial-gradient(circle, #e8f5e9 0%, #c8e6c9 100%); display: none; z-index: 250; }

        /* Quiz Overlay Board Layout */
        #screenQuiz { background: rgba(0,0,0,0.6); display: none; z-index: 400; }
        .quiz-card { background: white; border: 6px solid #ff477e; border-radius: 28px; padding: 20px; width: 95%; max-width: 400px; box-shadow: 0 12px 30px rgba(0,0,0,0.3); text-align: left; }
        .quiz-question { font-size: 16px; font-weight: bold; color: #2d3748; margin-bottom: 15px; line-height: 1.4; background: #fff0f3; padding: 12px; border-radius: 16px; }
        .quiz-options { display: flex; flex-direction: column; gap: 10px; }
        .option-btn { background: #f8fafc; border: 2px solid #cbd5e1; padding: 12px 16px; border-radius: 16px; font-size: 15px; font-weight: bold; color: #4a5568; cursor: pointer; text-align: left; transition: all 0.1s; }
        .option-btn:active { transform: scale(0.98); }

        .game-title { font-size: clamp(42px, 12vw, 60px); color: #ff477e; font-weight: 900; text-transform: uppercase; line-height: 1; letter-spacing: -1px; text-shadow: 3px 4px 0 white; margin-bottom: 20px; }
        .action-btn { background: linear-gradient(180deg, #ff7b93 0%, #ff477e 100%); color: white; border: 4px solid white; padding: 14px 45px; font-size: clamp(16px, 4.5vw, 22px); font-weight: 900; border-radius: 30px; cursor: pointer; box-shadow: 0 6px 14px rgba(255, 71, 126, 0.3); }
        .action-btn:active { transform: translateY(4px); box-shadow: none; }

        .popup-card { background: white; border: 4px solid #ff8fa3; border-radius: 28px; padding: 25px; width: 92%; max-width: 380px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .rule-line { display: flex; align-items: center; gap: 12px; font-size: 16px; font-weight: bold; text-align: left; margin-bottom: 14px; color: #4a5568; line-height: 1.4; }
    </style>
</head>
<body>

<div id="gameWrapper">
    <div id="screenLogo" class="layer">
        <img src="assets/innovine-logo.png" alt="Innovine Logo">
    </div>

    <div id="screenTitle" class="layer">
        <h1 class="game-title">Food<br><span style="color: #ff7b93;">Crush</span></h1>
        <button class="action-btn" onclick="showFirstInstructions()">PLAY ▶</button>
    </div>

    <div id="screenIntro" class="layer">
        <div class="popup-card">
            <h2 style="color: #ff477e; margin-bottom: 15px;" id="introHeading">Level 1 Setup!</h2>
            <div id="introRules">
                </div>
            <button class="action-btn" onclick="startCurrentLevel()">START LEVEL 🚀</button>
        </div>
    </div>

    <div id="screenQuiz" class="layer">
        <div class="quiz-card">
            <h3 style="color:#ff477e; margin-bottom: 8px; font-size: 14px;" id="quizProgress">BONUS RIDDLE!</h3>
            <div class="quiz-question" id="quizQuestionText">Loading riddle...</div>
            <div class="quiz-options" id="quizOptionsContainer"></div>
        </div>
    </div>

    <div id="levelBanner">
        <div id="levelTitle">Level 1: Plant Power</div>
        <div id="levelTask">Make matches to drop items and win!</div>
    </div>

    <div id="statsBar">
        <div class="stat-pill" id="lblScore">⭐ 0</div>
        <div class="stat-pill" style="background:#ff477e; color:white; border-color:white;" id="lblTarget">Matches Left: 8</div>
    </div>

    <div id="boardContainer">
        <div id="gridBoard"></div>
    </div>

    <div id="controlRow">
        <button class="util-btn" onclick="triggerUndo()">↩️ UNDO SWAP</button>
    </div>

    <div id="screenEnd" class="layer">
        <h1 class="game-title" style="color: #2e7d32;">WINNER! 🏆</h1>
        <div class="popup-card" style="border-color: #a1c4fd; margin-bottom: 20px;">
            <p style="font-size: 22px; font-weight: 900; color: #2e7d32;" id="lblFinalScore">Final Score: 0</p>
            <p style="font-weight: bold; color: #718096; margin-top: 8px;">Amazing job learning about healthy food options!</p>
        </div>
        <button class="action-btn" style="background:linear-gradient(180deg, #4caf50 0%, #2e7d32 100%); border-color:white;" onclick="location.reload()">PLAY AGAIN 🔄</button>
    </div>
</div>

<script>
    // Audio Tracks Maps
    const sndCorrect = new Audio('assets/correct.mp3');
    const sndWrong = new Audio('assets/wrong.mp3');
    const sndClap = new Audio('assets/freesound_community-claps-44774.mp3');
    const sndBgm = new Audio('assets/playfulsong.mp3');
    sndBgm.loop = true;

    const GRID_SIZE = 6;
    
    const ITEMS = {
        apple:  { symbol: "🍎", type: "plant",  group: "protective" },
        banana: { symbol: "🍌", type: "plant",  group: "energy" },
        milk:   { symbol: "🥛", type: "animal", group: "bodybuilding" },
        eggs:   { symbol: "🥚", type: "animal", group: "bodybuilding" },
        cheese: { symbol: "🧀", type: "animal", group: "bodybuilding" },
        burger: { symbol: "🍔", type: "junk",   group: "unhealthy" },
        pizza:  { symbol: "🍕", type: "junk",   group: "unhealthy" },
        soda:   { symbol: "🥤", type: "junk",   group: "unhealthy" }
    };

    // 12 Situational Questions Bank
    const quizBank = [
        // Set 1 (Triggered at 2 Matches)
        { q: "Rohan is looking inside a fruit basket. He finds a yellow fruit that monkeys absolutely love to eat! Help Rohan guess what it is!", ops: ["🍎 Apple", "🍌 Banana", "🥛 Milk"], ans: 1 },
        { q: "Simran is eating hot kheer. Her mother says the rice in the kheer comes from a plant. Where does the milk in the kheer come from?", ops: ["🌱 Plant", "🐮 Animal", "🏪 Shop only"], ans: 1 },
        { q: "Kabir wants to eat something made from wheat seeds. Which food items are made from wheat grains?", ops: ["🥛 Milk and Cheese", "🍞 Chapati and Bread", "🍯 Honey and Eggs"], ans: 1 },
        // Set 2 (Triggered at 4 Matches)
        { q: "Meera wants to run very fast in her school race 🏃‍♀️. She needs lots of Energy-giving food. What should she eat?", ops: ["🥔 Potato and Rice", "🥚 Eggs and Meat", "🥬 Spinach and Water"], ans: 0 },
        { q: "Little Sonu wants his bones and muscles to grow big and strong 💪. Which Body-building food should he drink every day?", ops: ["🥤 Fizzy Soda", "🥛 Milk", "☕ Tea"], ans: 1 },
        { q: "Tina had a small scratch on her knee while playing. Which food group helps our body heal injuries and rebuild?", ops: ["🍔 Junk Food", "🔋 Energy-giving Food", "🧱 Body-building Food"], ans: 2 },
        // Set 3 (Triggered at 6 Matches)
        { q: "Appu does not want to fall sick 🤒. He needs Protective food to fight off bad germs. What should he add to his plate?", ops: ["🍕 Pizza and Burgers", "🍇 Fruits and Vegetables", "🍬 Candy and Chocolates"], ans: 1 },
        { q: "Joy tells his friends: 'I love eating fruits, rice, and vegetables, but I never eat meat or eggs!' What kind of food eater is Joy?", ops: ["🌱 Vegetarian", "🍗 Non-vegetarian", "🛸 Alien"], ans: 0 },
        { q: "Teacher asks: 'Cookies are made using flour, milk, and butter. Where do these things come from?' What is the correct answer?", ops: ["Only from plants", "Only from animals", "Both plants and animals"], ans: 2 },
        // Set 4 (Triggered at 8 Matches)
        { q: "Aarav is sitting down to eat his lunch 🍽️. What must he do before and after eating food to stay healthy?", ops: ["🧼 Wash his hands with soap", "📱 Play a game on the phone", "😴 Go straight to sleep"], ans: 0 },
        { q: "Sarita sees an open street food cart with flies flying over the uncovered food 🪰. What will happen if she eats this street food often?", ops: ["🦸‍♀️ She will get superpowers", "🤢 It can make her fall sick", "🎂 She will win a prize"], ans: 1 },
        { q: "Look at these three dining habits. Which one is a good and healthy habit?", ops: ["🗣️ Talking loudly while chewing food", "🗑️ Leaving half the food on the plate to waste it", "👄 Eating slowly and chewing food well"], ans: 2 }
    ];

    let currentLevel = 1;
    let score = 0;
    let totalLevelCorrectMatches = 0;
    let levelTargetCount = 8; 
    let boardState = [];
    let activeSelection = null;
    let lockControls = false;
    let lastExecutedSwap = null;

    let currentQuizIndex = 0;
    let activeQuizBatchCount = 0;

    // Splash Timer Setup
    setTimeout(() => { document.getElementById('screenLogo').style.display = 'none'; }, 5000);

    function showFirstInstructions() {
        document.getElementById('screenTitle').style.display = 'none';
        displayLevelInstructionCard();
    }

    // New logic: Isolate instructions and trigger only one card layout before each specific level
    function displayLevelInstructionCard() {
        const heading = document.getElementById('introHeading');
        const rules = document.getElementById('introRules');
        
        heading.innerText = `Level ${currentLevel} Mission!`;

        if (currentLevel === 1) {
            rules.innerHTML = `
                <div class="rule-line"><span>🌱</span><span><b>Topic: Plant Power!</b></span></div>
                <div class="rule-line"><span>🎮</span><span>Match ANY 3 food items in a line to drop pieces.</span></div>
                <div class="rule-line"><span>🧠</span><span>Every 2 matches unlocks bonus riddles about Plant Foods!</span></div>
            `;
        } else if (currentLevel === 2) {
            rules.innerHTML = `
                <div class="rule-line"><span>🥛</span><span><b>Topic: Animal Treats!</b></span></div>
                <div class="rule-line"><span>🎮</span><span>Keep matching rows to score!</span></div>
                <div class="rule-line"><span>🧠</span><span>Bonus puzzles will test you on foods we get from animals!</span></div>
            `;
        } else if (currentLevel === 3) {
            rules.innerHTML = `
                <div class="rule-line"><span>🍏</span><span><b>Topic: Healthy Plates!</b></span></div>
                <div class="rule-line"><span>🎮</span><span>Swap foods to clear rows.</span></div>
                <div class="rule-line"><span>🧠</span><span>Answer bonus questions to find what happens if we eat dirty street junk food!</span></div>
            `;
        } else if (currentLevel === 4) {
            rules.innerHTML = `
                <div class="rule-line"><span>💪</span><span><b>Topic: Muscle & Shield!</b></span></div>
                <div class="rule-line"><span>🎮</span><span>The final level grid challenge!</span></div>
                <div class="rule-line"><span>🧠</span><span>Riddles will ask about Body-Building foods vs Protective fruits!</span></div>
            `;
        }

        document.getElementById('screenIntro').style.display = "flex";
    }
    
    function startCurrentLevel() {
        document.getElementById('screenIntro').style.display = 'none';
        totalLevelCorrectMatches = 0;
        levelTargetCount = 8;
        
        // Dynamic display update
        const titleText = document.getElementById('levelTitle');
        if (currentLevel === 1) titleText.innerText = "Level 1: Plant Power";
        if (currentLevel === 2) titleText.innerText = "Level 2: Animal Treats";
        if (currentLevel === 3) titleText.innerText = "Level 3: Clean Plate";
        if (currentLevel === 4) titleText.innerText = "Level 4: Muscle & Shield";

        updateHUDView();
        buildCandyBoard();
        if (currentLevel === 1) { sndBgm.currentTime = 0; sndBgm.play().catch(()=>{}); }
    }

    function buildCandyBoard() {
        const boardEl = document.getElementById('gridBoard');
        boardEl.innerHTML = "";
        boardState = [];

        for (let r = 0; r < GRID_SIZE; r++) {
            boardState[r] = [];
            for (let c = 0; c < GRID_SIZE; c++) {
                let item = getRandomItem();
                while (checkForInitialMatch3(r, c, item)) { item = getRandomItem(); }
                boardState[r][c] = item;

                const tileEl = document.createElement('div');
                tileEl.id = `tile-${r}-${c}`;
                tileEl.className = "tile";
                tileEl.innerText = item.symbol;
                tileEl.addEventListener('click', () => handleSelect(r, c));
                boardEl.appendChild(tileEl);
            }
        }
        verifyBoardHasPotentialMatches();
    }

    function getRandomItem() {
        const keys = Object.keys(ITEMS);
        return ITEMS[keys[Math.floor(Math.random() * keys.length)]];
    }

    function checkForInitialMatch3(r, c, item) {
        if (c >= 2 && boardState[r][c-1]?.symbol === item.symbol && boardState[r][c-2]?.symbol === item.symbol) return true;
        if (r >= 2 && boardState[r-1][c]?.symbol === item.symbol && boardState[r-2][c]?.symbol === item.symbol) return true;
        return false;
    }

    function handleSelect(r, c) {
        if (lockControls) return;
        const clickedEl = document.getElementById(`tile-${r}-${c}`);

        if (!activeSelection) {
            activeSelection = { r, c, element: clickedEl };
            clickedEl.classList.add('selected');
        } else {
            if (activeSelection.r === r && activeSelection.c === c) {
                clickedEl.classList.remove('selected');
                activeSelection = null;
                return;
            }

            const dist = Math.abs(activeSelection.r - r) + Math.abs(activeSelection.c - c);
            if (dist === 1) {
                swapTilesAction(activeSelection.r, activeSelection.c, r, c, true);
            } else {
                activeSelection.element.classList.remove('selected');
                activeSelection = { r, c, element: clickedEl };
                clickedEl.classList.add('selected');
            }
        }
    }

    async function swapTilesAction(r1, c1, r2, c2, recordHistory = true) {
        lockControls = true;
        if(activeSelection) activeSelection.element.classList.remove('selected');
        activeSelection = null;

        if (recordHistory) { lastExecutedSwap = { r1, c1, r2, c2 }; }

        let t1 = boardState[r1][c1];
        boardState[r1][c1] = boardState[r2][c2];
        boardState[r2][c2] = t1;

        document.getElementById(`tile-${r1}-${c1}`).innerText = boardState[r1][c1].symbol;
        document.getElementById(`tile-${r2}-${c2}`).innerText = boardState[r2][c2].symbol;

        let matchedCoordinates = evaluateBoardMatches();
        if (matchedCoordinates.length > 0) {
            await resolveGridCascades(matchedCoordinates);
        } else {
            if (recordHistory) {
                let t2 = boardState[r1][c1];
                boardState[r1][c1] = boardState[r2][c2];
                boardState[r2][c2] = t2;
                document.getElementById(`tile-${r1}-${c1}`).innerText = boardState[r1][c1].symbol;
                document.getElementById(`tile-${r2}-${c2}`).innerText = boardState[r2][c2].symbol;
                sndWrong.currentTime = 0; sndWrong.play().catch(()=>{});
            }
        }
        lockControls = false;
    }

    function triggerUndo() {
        if (lockControls || !lastExecutedSwap) return;
        const { r1, c1, r2, c2 } = lastExecutedSwap;
        swapTilesAction(r1, c1, r2, c2, false);
        lastExecutedSwap = null;
    }

    function evaluateBoardMatches() {
        let matchedSet = new Set();
        for (let r = 0; r < GRID_SIZE; r++) {
            for (let c = 0; c < GRID_SIZE - 2; c++) {
                if (boardState[r][c] && boardState[r][c+1] && boardState[r][c+2] &&
                    boardState[r][c].symbol === boardState[r][c+1].symbol && boardState[r][c].symbol === boardState[r][c+2].symbol) {
                    matchedSet.add(`${r},${c}`); matchedSet.add(`${r},${c+1}`); matchedSet.add(`${r},${c+2}`);
                }
            }
        }
        for (let c = 0; c < GRID_SIZE; c++) {
            for (let r = 0; r < GRID_SIZE - 2; r++) {
                if (boardState[r][c] && boardState[r+1][c] && boardState[r+2][c] &&
                    boardState[r][c].symbol === boardState[r+1][c].symbol && boardState[r][c].symbol === boardState[r+2][c].symbol) {
                    matchedSet.add(`${r},${c}`); matchedSet.add(`${r+1},${c}`); matchedSet.add(`${r+2},${c}`);
                }
            }
        }
        return Array.from(matchedSet).map(s => { const [r,c] = s.split(',').map(Number); return {r,c}; });
    }

    async function resolveGridCascades(matches) {
        let accurateMatchesFound = false;

        matches.forEach(coord => {
            let item = boardState[coord.r][coord.c];
            if (!item) return;
            accurateMatchesFound = true; // Any complete aligned line is a valid match!
            document.getElementById(`tile-${coord.r}-${coord.c}`).classList.add('pop-anim');
        });

        if (accurateMatchesFound) {
            score += 10;
            totalLevelCorrectMatches++;
            levelTargetCount = Math.max(0, levelTargetCount - 1);
            sndCorrect.currentTime = 0; sndCorrect.play().catch(()=>{});
        }

        updateHUDView();
        await new Promise(res => setTimeout(res, 200));

        executeBoardGravityDrop();
        refillBoardSpaces();

        // Check if a riddle break is hit (Every 2 Correct Matches)
        if (accurateMatchesFound && totalLevelCorrectMatches % 2 === 0 && totalLevelCorrectMatches <= 8) {
            activeQuizBatchCount = 0; 
            setTimeout(launchQuizRiddleOverlay, 300);
            return;
        }

        if (levelTargetCount <= 0) {
            advanceNextLevelStructure();
            return;
        }

        let recursiveMatches = evaluateBoardMatches();
        if (recursiveMatches.length > 0) { await resolveGridCascades(recursiveMatches); }
        else { verifyBoardHasPotentialMatches(); }
    }

    function executeBoardGravityDrop() {
        for (let c = 0; c < GRID_SIZE; c++) {
            let spaceCount = 0;
            for (let r = GRID_SIZE - 1; r >= 0; r--) {
                if (document.getElementById(`tile-${r}-${c}`).classList.contains('pop-anim')) {
                    spaceCount++;
                    boardState[r][c] = null;
                } else if (spaceCount > 0) {
                    boardState[r + spaceCount][c] = boardState[r][c];
                    boardState[r][c] = null;
                }
            }
        }
    }

    function refillBoardSpaces() {
        for (let r = 0; r < GRID_SIZE; r++) {
            for (let c = 0; c < GRID_SIZE; c++) {
                let el = document.getElementById(`tile-${r}-${c}`);
                el.classList.remove('pop-anim');
                if (boardState[r][c] === null) { boardState[r][c] = getRandomItem(); }
                el.innerText = boardState[r][c].symbol;
            }
        }
    }

    function launchQuizRiddleOverlay() {
        if (currentQuizIndex >= quizBank.length) {
            currentQuizIndex = 0; 
        }
        
        lockControls = true;
        const quizData = quizBank[currentQuizIndex];
        document.getElementById('quizProgress').innerText = `BONUS RIDDLE (${activeQuizBatchCount + 1}/3)`;
        document.getElementById('quizQuestionText').innerText = quizData.q;
        
        const optionsContainer = document.getElementById('quizOptionsContainer');
        optionsContainer.innerHTML = "";
        
        quizData.ops.forEach((optionText, idx) => {
            const btn = document.createElement('button');
            btn.className = "option-btn";
            btn.innerText = optionText;
            btn.onclick = () => evaluateQuizAnswer(idx, btn);
            optionsContainer.appendChild(btn);
        });
        
        document.getElementById('screenQuiz').style.display = "flex";
    }

    function evaluateQuizAnswer(selectedIdx, buttonElement) {
        const quizData = quizBank[currentQuizIndex];
        if (selectedIdx === quizData.ans) {
            score += 10;
            updateHUDView();
            buttonElement.style.background = "#c8e6c9";
            buttonElement.style.borderColor = "#4caf50";
            sndCorrect.currentTime = 0; sndCorrect.play().catch(()=>{});
            
            setTimeout(() => {
                currentQuizIndex++;
                activeQuizBatchCount++;
                if (activeQuizBatchCount < 3) {
                    launchQuizRiddleOverlay();
                } else {
                    document.getElementById('screenQuiz').style.display = "none";
                    lockControls = false;
                    if (levelTargetCount <= 0) {
                        advanceNextLevelStructure();
                    } else {
                        verifyBoardHasPotentialMatches();
                    }
                }
            }, 1000);
        } else {
            buttonElement.style.background = "#ffcdcd";
            buttonElement.style.borderColor = "#f44336";
            sndWrong.currentTime = 0; sndWrong.play().catch(()=>{});
        }
    }

    function verifyBoardHasPotentialMatches() {
        let viable = false;
        for (let r = 0; r < GRID_SIZE; r++) {
            for (let c = 0; c < GRID_SIZE; c++) {
                if (c < GRID_SIZE - 1 && testSwapMatching(r, c, r, c + 1)) viable = true;
                if (r < GRID_SIZE - 1 && testSwapMatching(r, c, r + 1, c)) viable = true;
            }
        }
        if (!viable) { buildCandyBoard(); }
    }

    function testSwapMatching(r1, c1, r2, c2) {
        let temp = boardState[r1][c1];
        boardState[r1][c1] = boardState[r2][c2];
        boardState[r2][c2] = temp;
        let matches = evaluateBoardMatches();
        boardState[r2][c2] = boardState[r1][c1];
        boardState[r1][c1] = temp;
        return matches.length > 0;
    }

    function advanceNextLevelStructure() {
        if (currentLevel < 4) {
            currentLevel++;
            displayLevelInstructionCard();
        } else {
            sndBgm.pause(); sndClap.play().catch(()=>{});
            document.getElementById('lblFinalScore').innerText = `Final Score: ${score}`;
            document.getElementById('screenEnd').style.display = 'flex';
        }
    }

    function updateHUDView() {
        document.getElementById('lblScore').innerText = `⭐ SCORE: ${score}`;
        document.getElementById('lblTarget').innerText = `Matches Left: ${levelTargetCount}`;
    }
</script>
</body>
</html>
