<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Super Body Quest: Wild Cards!</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #141432; font-family: 'Arial Black', sans-serif; }
        
        /* Layout Grid Optimized for Tall/Wide Devices */
        #gameContainer { 
            width: 100vw; 
            height: 100vh; 
            background: radial-gradient(circle, #1a4a2a 0%, #0a2214 100%); /* Classic card table green */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
        }

        #topHUD {
            width: 100%;
            max-width: 450px;
            display: flex;
            justify-content: space-between;
            color: #fff;
            font-size: clamp(16px, 4.5vw, 22px);
            text-shadow: 2px 2px #000;
        }

        /* The Center Table / Discard Pile */
        #tableCenter {
            flex-grow: 1;
            width: 100%;
            max-width: 450px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        /* Giant UNO-style Center Riddle Card */
        .riddle-card {
            width: 85%;
            aspect-ratio: 2/3;
            max-height: 40vh;
            background: #ffffff;
            border: 12px solid #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            text-align: center;
            position: relative;
            animation: drawCard 0.4s ease-out;
        }

        .card-oval {
            width: 100%;
            height: 80%;
            background: #111;
            border-radius: 50% / 40%;
            transform: rotate(-10deg);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }

        .card-text {
            color: #fff;
            transform: rotate(10deg); /* Counter rotate to keep text straight */
            font-size: clamp(14px, 3.8vw, 19px);
            line-height: 1.4;
            font-family: 'Arial', sans-serif;
            font-weight: bold;
        }

        /* The Player's Hand at Bottom */
        #playerHand {
            width: 100%;
            max-width: 450px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            padding-bottom: 10px;
        }

        /* Interactive Choice Cards */
        .uno-btn {
            aspect-ratio: 2/3;
            border: 6px solid #fff;
            border-radius: 14px;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 10px 4px;
            cursor: pointer;
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }
        .uno-btn:active { transform: scale(0.92) translateY(4px); }
        .uno-btn .icon { font-size: clamp(28px, 8vw, 42px); }
        .uno-btn .label { font-size: clamp(11px, 3vw, 14px); letter-spacing: 1px; text-shadow: 1px 1px #000; }

        #cardRed { background: #ff2233; }
        #cardOrange { background: #ff9900; }
        #cardGreen { background: #22cc44; }

        /* Animation Trigger */
        @keyframes drawCard {
            0% { transform: translateY(100vh) rotate(30deg); opacity: 0; }
            100% { transform: translateY(0) rotate(0deg); opacity: 1; }
        }

        /* Overlay Banners */
        #feedbackOverlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            max-width: 400px;
            background: rgba(0, 0, 0, 0.9);
            border: 4px solid #fff;
            border-radius: 15px;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            display: none;
            z-index: 50;
        }

        /* Generic Framework Screen Menus */
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; padding: 20px; text-align: center; box-sizing: border-box; background: #0a2214; color: white;}
        #logoScreen { background-color: #ffffff; z-index: 200; }
        #logoScreen img { max-width: 75%; max-height: 45%; object-fit: contain; }
        .btn { background: #ffcc00; color: #0d0d26; border: none; padding: 16px 45px; font-size: clamp(20px, 5vw, 26px); font-weight: bold; border-radius: 35px; cursor: pointer; margin-top: 25px; box-shadow: 0 6px 0 #cc9900; }
        .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #cc9900; }
    </style>
</head>
<body>

<div id="gameContainer">
    <!-- Brand Entry Screen -->
    <div id="logoScreen" class="screen">
        <img src="assets/innovine-logo.png" alt="Innovine Logo">
    </div>

    <!-- Title Screen -->
    <div id="titleScreen" class="screen">
        <h1 style="font-size: clamp(34px, 10vw, 52px); color: #ffcc00; line-height: 1.2;">WILD BODY<br>CARDS! 🃏</h1>
        <button class="btn" onclick="startGame()">PLAY GAME ▶</button>
    </div>

    <!-- Gameplay Board Dashboard -->
    <div id="topHUD" style="visibility: hidden;">
        <span id="txtScore">⭐ 000</span>
        <span id="txtLives">❤️ ❤️ ❤️</span>
    </div>

    <!-- Center Card Deck Discard Station -->
    <div id="tableCenter" style="visibility: hidden;">
        <div class="riddle-card" id="mainDeckCard">
            <span style="font-size: 20px; font-weight: bold; color: #111;" id="cardBorderTag">❓ RIDDLE</span>
            <div class="card-oval">
                <div class="card-text" id="riddleDisplayText">Loading card deck...</div>
            </div>
            <span style="font-size: 20px; font-weight: bold; color: #111; transform: rotate(180deg);">❓</span>
        </div>
    </div>

    <!-- Feedback Banner Notification Pop-up -->
    <div id="feedbackOverlay">CORRECT!</div>

    <!-- Hand Cards Action Controls Row -->
    <div id="playerHand" style="visibility: hidden;">
        <div class="uno-btn" id="cardRed" onclick="submitAnswer('internal')">
            <span class="label">INTERNAL</span>
            <span class="icon">🍒</span>
            <span class="label">RED</span>
        </div>
        <div class="uno-btn" id="cardOrange" onclick="submitAnswer('external')">
            <span class="label">EXTERNAL</span>
            <span class="icon">🍊</span>
            <span class="label">ORANGE</span>
        </div>
        <div class="uno-btn" id="cardGreen" onclick="submitAnswer('frame')">
            <span class="label">BODY FRAME</span>
            <span class="icon">🍏</span>
            <span class="label">GREEN</span>
        </div>
    </div>

    <!-- End Game Scoreboard Display -->
    <div id="endScreen" class="screen" style="display: none;">
        <h1 id="endTitle" style="font-size: 40px; color: #ffcc00;">QUEST OVER!</h1>
        <div id="finalScore" style="font-size: 26px; margin: 20px 0;">SCORE: 0</div>
        <button class="btn" onclick="location.reload()">PLAY AGAIN 🔄</button>
    </div>
</div>

<script>
    // System Sound Engines Setup
    const sndCorrect = new Audio('assets/correct.mp3');
    const sndWrong = new Audio('assets/wrong.mp3');
    const sndClap = new Audio('assets/freesound_community-claps-44774.mp3');
    const sndBgm = new Audio('assets/cartoonbackgroundmusic.mp3');
    sndBgm.loop = true;

    // Game Parameters Storage
    let score = 0;
    let lives = 3;
    let currentIdx = 0;
    let acceptInput = true;

    // Dynamic Database Storage Matrix
    const originalQuestions = [
        { q: "Thump-thump! I am a muscle inside your chest that pumps blood to your toes. Who am I?", target: "internal", type: "normal" },
        { q: "I live inside your head and do all your thinking, dreaming, and math homework. Who am I?", target: "internal", type: "normal" },
        { q: "Gurgle! When you swallow your lunch, it drops down into me so I can break it down. Who am I?", target: "internal", type: "normal" },
        { q: "Blink, blink! Look in the mirror—we help you see colors, shapes, and your friends. What are we?", target: "external", type: "normal" },
        { q: "I am the outer jacket that covers your whole body from head to toe to keep germs out. What am I?", target: "external", type: "normal" },
        { q: "Sniff! I sit right in the middle of your face to help you smell fresh cookies. What am I?", target: "external", type: "normal" },
        { q: "We are super hard and white. We join together to make a skeleton framework. What are we?", target: "frame", type: "normal" },
        { q: "Bend and snap! I am the magic spot where two bones meet, like your elbow or your knee. What am I?", target: "frame", type: "normal" },
        { q: "We are stretchy like rubber bands, covering your bones to help you pull, run, and jump. What are we?", target: "frame", type: "normal" },
        { q: "👻 WILD GHOST ATTACK! Quickly match the INTERNAL organ button to zap the ghost!", target: "internal", type: "ghost" },
        { q: "👻 WILD GHOST ATTACK! Quickly match the EXTERNAL body button to zap the ghost!", target: "external", type: "ghost" },
        { q: "👻 WILD GHOST ATTACK! Quickly match the BODY FRAME button to zap the ghost!", target: "frame", type: "ghost" }
    ];
    let deck = [];

    // Delayed Splash Navigation
    setTimeout(() => {
        document.getElementById('logoScreen').style.display = 'none';
    }, 5000);

    function startGame() {
        document.getElementById('titleScreen').style.display = 'none';
        
        // Reveal Interactive Gameplay Elements
        document.getElementById('topHUD').style.visibility = 'visible';
        document.getElementById('tableCenter').style.visibility = 'visible';
        document.getElementById('playerHand').style.visibility = 'visible';

        score = 0;
        lives = 3;
        currentIdx = 0;
        
        deck = [...originalQuestions];
        shuffle(deck);
        
        updateUI();
        sndBgm.currentTime = 0;
        sndBgm.play().catch(()=>{});
    }

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function updateUI() {
        document.getElementById('txtScore').innerText = `⭐ ${score}`;
        document.getElementById('txtLives').innerText = "❤️ ".repeat(lives);

        if(currentIdx >= deck.length) {
            endGame(true);
            return;
        }

        let currentCard = deck[currentIdx];
        let displayBox = document.getElementById('riddleDisplayText');
        let borderTag = document.getElementById('cardBorderTag');
        let cardFrame = document.getElementById('mainDeckCard');

        // Refresh Card Presentation Animation Graph
        cardFrame.style.animation = 'none';
        cardFrame.offsetHeight; 
        cardFrame.style.animation = 'drawCard 0.4s ease-out';

        displayBox.innerText = currentCard.q;

        if(currentCard.type === "ghost") {
            cardFrame.style.borderColor = "#a884ff";
            borderTag.innerText = "👻 GHOST ALERT";
            borderTag.style.color = "#a884ff";
        } else {
            cardFrame.style.borderColor = "#ffffff";
            borderTag.innerText = "❓ RIDDLE";
            borderTag.style.color = "#111";
        }
        acceptInput = true;
    }

    function submitAnswer(chosenCategory) {
        if(!acceptInput) return;
        acceptInput = false;

        let currentCard = deck[currentIdx];
        let overlay = document.getElementById('feedbackOverlay');

        if(chosenCategory === currentCard.target) {
            // Hit Success Calculation
            score += 100;
            overlay.innerText = currentCard.type === "ghost" ? "👻 GHOST ZAPPED! ✨" : "✨ CORRECT! ✨";
            overlay.style.borderColor = "#22cc44";
            sndCorrect.currentTime = 0;
            sndCorrect.play().catch(()=>{});
        } else {
            // Hit Error Calculation
            lives--;
            overlay.innerText = currentCard.type === "ghost" ? "👻 GHOST TOOK A LIFE!" : "❌ WRONG CARD! ❌";
            overlay.style.borderColor = "#ff2233";
            sndWrong.currentTime = 0;
            sndWrong.play().catch(()=>{});
        }

        overlay.style.display = 'block';

        setTimeout(() => {
            overlay.style.display = 'none';
            if(lives <= 0) {
                endGame(false);
            } else {
                currentIdx++;
                updateUI();
            }
        }, 1500);
    }

    function endGame(isWin) {
        sndBgm.pause();
        document.getElementById('topHUD').style.visibility = 'hidden';
        document.getElementById('tableCenter').style.visibility = 'hidden';
        document.getElementById('playerHand').style.visibility = 'hidden';

        const endScreen = document.getElementById('endScreen');
        const title = document.getElementById('endTitle');
        
        if(isWin) {
            title.innerText = "🏆 DECK CLEARED! 🏆";
            title.style.color = "#ffcc00";
            sndClap.play().catch(()=>{});
        } else {
            title.innerText = "GAME OVER 👻";
            title.style.color = "#ff2233";
        }

        document.getElementById('finalScore').innerText = `FINAL SCORE: ${score}`;
        endScreen.style.display = 'flex';
    }
</script>
</body>
</html>
