<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Super Body Quest</title>
    <style>
        /* CSS Reset for Global Device Consistency */
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #eef7ff; font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial', sans-serif; }
        
        /* Performance Optimised Layout Shell */
        #gameContainer { 
            width: 100vw; 
            height: 100vh; 
            background: linear-gradient(135deg, #eef7ff 0%, #e0f4ff 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            position: relative;
        }

        #topHUD {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            color: #4a5568;
            font-size: clamp(16px, 5vw, 22px);
            font-weight: bold;
            padding: 5px 10px;
        }

        /* Center Table Area */
        #tableCenter {
            flex-grow: 1;
            width: 100%;
            max-width: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        /* Cute Rounded Riddle Card */
        .riddle-card {
            width: 95%;
            max-width: 420px;
            aspect-ratio: 4/3;
            background: #ffffff;
            border: 8px solid #ffccd5;
            border-radius: 24px;
            box-shadow: 0 8px 24px rgba(165, 180, 200, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            position: relative;
            transform: translateZ(0);
            will-change: transform, opacity;
            animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.2);
        }

        .card-text {
            color: #2d3748;
            font-size: clamp(15px, 4.5vw, 21px);
            line-height: 1.5;
            font-weight: bold;
        }

        /* Hand Choices Wrapper */
        #playerHand {
            width: 100%;
            max-width: 500px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            padding-bottom: env(safe-area-inset-bottom, 15px);
            perspective: 800px; /* Gives 3D depth to the shuffling spin */
        }

        /* Responsive Text-Only Cards with Shuffling Animation Frame support */
        .choice-card {
            aspect-ratio: 2/3;
            border: 6px solid #ffffff;
            border-radius: 20px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            text-align: center;
            font-weight: 900;
            font-size: clamp(13px, 3.8vw, 18px);
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(165, 180, 200, 0.35);
            transform: translateZ(0);
            transition: transform 0.1s ease-out;
            backface-visibility: hidden;
        }
        .choice-card:active { transform: scale(0.94); }

        /* Shuffling Card Animation Styles */
        .shuffle-spin {
            animation: cardShuffle 0.5s ease-in-out;
        }

        /* Bright Soft Color Palettes */
        .color-red { background-color: #ff6b6b; }
        .color-orange { background-color: #ffa048; }
        .color-green { background-color: #4ed964; }

        @keyframes popIn {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes cardShuffle {
            0% { transform: scale(1) rotateY(0deg); opacity: 1; }
            50% { transform: scale(0.8) rotateY(90deg); opacity: 0.4; }
            100% { transform: scale(1) rotateY(0deg); opacity: 1; }
        }

        /* Overlay Banners */
        #feedbackOverlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            max-width: 380px;
            background: #ffffff;
            border: 6px solid #4ed964;
            border-radius: 24px;
            color: #2d3748;
            padding: 25px;
            text-align: center;
            font-size: clamp(20px, 6vw, 24px);
            font-weight: bold;
            display: none;
            z-index: 50;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        /* Overlay Screen Structures */
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; padding: 20px; text-align: center; background: #eef7ff; color: #2d3748; }
        #logoScreen { background-color: #ffffff; z-index: 200; }
        #logoScreen img { max-width: 70%; max-height: 40%; object-fit: contain; }
        
        .btn { background: #ff6b8b; color: white; border: none; padding: 16px 50px; font-size: clamp(18px, 5vw, 24px); font-weight: bold; border-radius: 30px; cursor: pointer; margin-top: 30px; box-shadow: 0 6px 0 #d94e6d; -webkit-tap-highlight-color: transparent; }
        .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #d94e6d; }
    </style>
</head>
<body>

<div id="gameContainer">
    <!-- Brand Splash Screen -->
    <div id="logoScreen" class="screen">
        <img src="assets/innovine-logo.png" alt="Innovine Logo">
    </div>

    <!-- Clean Title Screen -->
    <div id="titleScreen" class="screen">
        <h1 style="font-size: clamp(38px, 11vw, 54px); color: #ff6b8b; font-weight: 900; line-height: 1.2;">Super Body<br><span style="color: #ffa048;">Quest</span></h1>
        <button class="btn" onclick="startGame()">START ▶</button>
    </div>

    <!-- HUD Layout Area -->
    <div id="topHUD" style="visibility: hidden;">
        <span id="txtScore">⭐ SCORE: 0</span>
        <span id="txtLives">❤️ ❤️ ❤️</span>
    </div>

    <!-- Central Interactive Discard Pile Frame -->
    <div id="tableCenter" style="visibility: hidden;">
        <div class="riddle-card" id="mainDeckCard">
            <div class="card-text" id="riddleDisplayText">Loading Quest Card...</div>
        </div>
    </div>

    <!-- Notifications Hub Overlay -->
    <div id="feedbackOverlay">GREAT JOB!</div>

    <!-- Choice Action Hand Matrix Layout -->
    <div id="playerHand" style="visibility: hidden;">
        <div class="choice-card color-red" id="card0" onclick="submitAnswer(0)">...</div>
        <div class="choice-card color-orange" id="card1" onclick="submitAnswer(1)">...</div>
        <div class="choice-card color-green" id="card2" onclick="submitAnswer(2)">...</div>
    </div>

    <!-- Scoreboards Target Frame -->
    <div id="endScreen" class="screen" style="display: none;">
        <h1 id="endTitle" style="font-size: 36px; color: #ff6b8b;">YOU DID IT!</h1>
        <div id="finalScore" style="font-size: 24px; margin: 20px 0; font-weight: bold;">FINAL SCORE: 0</div>
        <button class="btn" onclick="location.reload()">PLAY AGAIN 🔄</button>
    </div>
</div>

<script>
    // Asset Pipeline Management
    const sndCorrect = new Audio('assets/correct.mp3');
    const sndWrong = new Audio('assets/wrong.mp3');
    const sndClap = new Audio('assets/freesound_community-claps-44774.mp3');
    const sndBgm = new Audio('assets/cartoonbackgroundmusic.mp3');
    sndBgm.loop = true;

    // Local Storage Variable Maps
    let score = 0;
    let lives = 3;
    let currentIdx = 0;
    let acceptInput = true;
    let currentChoices = [];

    // Comprehensive 12 Target System Question Arrays 
    const questions = [
        { q: "Thump-thump! I am a muscle inside your chest that pumps blood all the way to your toes. Who am I?", name: "HEART" },
        { q: "I live inside your head and do all your thinking, dreaming, and remembering. Who am I?", name: "BRAIN" },
        { q: "Gurgle! When you swallow your yummy lunch, it drops down into me so I can break it down. Who am I?", name: "STOMACH" },
        { q: "We fill up with air like two bouncy balloons every single time you breathe in fresh oxygen. What are we?", name: "LUNGS" },
        { q: "I filter your blood and turn waste into pee to keep your body clean inside. What am I?", name: "KIDNEYS" },
        { q: "Blink, blink! Look in the mirror—we help you see colors, books, shapes, and all your friends. What are we?", name: "EYES" },
        { q: "I am like a magic outer jacket that covers your whole body from head to toe to protect you. What am I?", name: "SKIN" },
        { q: "Sniff, sniff! I sit right in the middle of your face to help you smell flowers and warm cookies. What am I?", name: "NOSE" },
        { q: "We sit safely on the sides of your head so you can listen to music, stories, and teacher's voice. What are we?", name: "EARS" },
        { q: "We are super hard, strong, and white. We join together to make your skeleton frame so you can stand tall! What are we?", name: "BONES" },
        { q: "We are stretchy like rubber bands. We cover your bones and pack power to let you run, pull, and jump! What are we?", name: "MUSCLES" },
        { q: "Bend and snap! I am the magic spot where two bones meet, like your elbow, shoulder, or your knee. What am I?", name: "JOINTS" }
    ];

    // Delayed Splash Navigation
    setTimeout(() => {
        document.getElementById('logoScreen').style.display = 'none';
    }, 5000);

    function startGame() {
        document.getElementById('titleScreen').style.display = 'none';
        document.getElementById('topHUD').style.visibility = 'visible';
        document.getElementById('tableCenter').style.visibility = 'visible';
        document.getElementById('playerHand').style.visibility = 'visible';

        score = 0;
        lives = 3;
        currentIdx = 0;
        
        shuffle(questions);
        loadNextQuestion();

        sndBgm.currentTime = 0;
        sndBgm.play().catch(()=>{});
    }

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function loadNextQuestion() {
        document.getElementById('txtScore').innerText = `⭐ SCORE: ${score}`;
        document.getElementById('txtLives').innerText = "❤️ ".repeat(lives);

        if(currentIdx >= questions.length) {
            endGame(true);
            return;
        }

        let currentItem = questions[currentIdx];
        
        // Element Redraw Initialization Optimization 
        let cardFrame = document.getElementById('mainDeckCard');
        cardFrame.style.animation = 'none';
        cardFrame.offsetHeight; 
        cardFrame.style.animation = 'popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.2)';

        document.getElementById('riddleDisplayText').innerText = currentItem.q;

        // Choice Generator Engine - Shuffles Options Fully Before Presentation
        currentChoices = [currentItem.name];
        
        let fullNamesList = questions.map(item => item.name);
        let optionsPool = fullNamesList.filter(name => name !== currentItem.name);
        shuffle(optionsPool);
        
        currentChoices.push(optionsPool[0], optionsPool[1]);
        shuffle(currentChoices);

        // Map strings straight to targets and fire the card shuffling flip animation
        for (let i = 0; i < 3; i++) {
            let cardElement = document.getElementById(`card${i}`);
            
            // Re-trigger the shuffle spin styling safely
            cardElement.classList.remove('shuffle-spin');
            cardElement.offsetHeight; 
            cardElement.classList.add('shuffle-spin');
            
            cardElement.innerText = currentChoices[i];
        }

        acceptInput = true;
    }

    function submitAnswer(chosenIndex) {
        if(!acceptInput) return;
        acceptInput = false;

        let correctAnswer = questions[currentIdx].name;
        let selectedAnswer = currentChoices[chosenIndex];
        let overlay = document.getElementById('feedbackOverlay');

        if(selectedAnswer === correctAnswer) {
            score += 10;
            document.getElementById('txtScore').innerText = `⭐ SCORE: ${score}`;
            overlay.innerText = "✨ YES! YOU GOT IT! ✨";
            overlay.style.borderColor = "#4ed964";
            sndCorrect.currentTime = 0;
            sndCorrect.play().catch(()=>{});
        } else {
            lives--;
            overlay.innerText = `❌ OOPS! THAT IS THE ${correctAnswer}! ❌`;
            overlay.style.borderColor = "#ff6b6b";
            sndWrong.currentTime = 0;
            sndWrong.play().catch(()=>{});
        }

        overlay.style.display = 'block';

        setTimeout(() => {
            overlay.style.display = 'none';
            if(lives <= 0) {
                endGame(false);
            } else {
                currentIdx++;
                loadNextQuestion();
            }
        }, 2000);
    }

    function endGame(isWin) {
        sndBgm.pause();
        document.getElementById('topHUD').style.visibility = 'hidden';
        document.getElementById('tableCenter').style.visibility = 'hidden';
        document.getElementById('playerHand').style.visibility = 'hidden';

        const endScreen = document.getElementById('endScreen');
        const title = document.getElementById('endTitle');
        
        if(isWin) {
            title.innerText = "🏆 AWESOME WORK! 🏆";
            title.style.color = "#ffa048";
            sndClap.play().catch(()=>{});
        } else {
            title.innerText = "TRY AGAIN! 🌟";
            title.style.color = "#ff6b6b";
        }

        document.getElementById('finalScore').innerText = `FINAL SCORE: ${score}`;
        endScreen.style.display = 'flex';
    }
</script>
</body>
</html>
