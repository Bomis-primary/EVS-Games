<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Great Train Journey!</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: 'Comic Neue', cursive;
            background-color: #87CEEB; /* Sky blue */
            background-image: radial-gradient(#fff 15%, transparent 16%), radial-gradient(#fff 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            background-color: rgba(255, 255, 255, 0.9);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            box-sizing: border-box;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-container img {
            height: 50px;
        }

        .stats {
            display: flex;
            gap: 20px;
            font-size: 24px;
            align-items: center;
        }

        .hearts { color: #ff3366; }
        .score { color: #333; font-weight: bold; }
        
        button {
            font-family: 'Comic Neue', cursive;
            background-color: #FF9800;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 18px;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 0 #F57C00;
            transition: transform 0.1s;
        }
        button:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        /* Train Container */
        .train-track {
            width: 100%;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 10px;
            border-bottom: 10px solid #555;
            margin-top: 20px;
            position: relative;
        }

        .train-track::after {
            content: '';
            position: absolute;
            bottom: -20px;
            width: 100%;
            height: 10px;
            background: repeating-linear-gradient(90deg, #8B4513, #8B4513 20px, transparent 20px, transparent 40px);
        }

        .engine {
            width: 150px;
            height: 120px;
            background-color: #2196F3;
            border-radius: 20px 20px 0 0;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 20px;
            box-shadow: inset -10px -10px rgba(0,0,0,0.2);
        }
        
        .engine::before {
            content: '🚂';
            font-size: 60px;
        }

        .carriage {
            width: 180px;
            min-height: 140px;
            border-radius: 10px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            box-shadow: inset -5px -5px rgba(0,0,0,0.2);
        }

        .carriage::after, .engine::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 20px;
            width: 30px;
            height: 30px;
            background-color: #333;
            border-radius: 50%;
            box-shadow: 80px 0 0 #333;
        }

        .carriage-link {
            width: 10px;
            height: 5px;
            background-color: #333;
            margin-bottom: 20px;
        }

        /* Carriage Colors */
        .outdoor-car { background-color: #4CAF50; border: 4px solid #388E3C; }
        .indoor-car { background-color: #9C27B0; border: 4px solid #7B1FA2; }
        .rules-car { background-color: #FFEB3B; border: 4px solid #FBC02D; }

        .carriage h3 {
            margin: 0 0 10px 0;
            color: white;
            text-shadow: 1px 1px 2px black;
            text-align: center;
            font-size: 18px;
        }
        .rules-car h3 { color: #333; text-shadow: none; }

        .drop-zone {
            width: 100%;
            flex-grow: 1;
            background: rgba(255,255,255,0.4);
            border: 2px dashed rgba(255,255,255,0.8);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding: 5px;
            box-sizing: border-box;
        }
        .drop-zone.drag-over {
            background: rgba(255,255,255,0.8);
        }

        /* Items Container */
        .items-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            padding: 30px;
            max-width: 800px;
        }

        .draggable-item {
            background-color: white;
            border: 3px solid #333;
            border-radius: 15px;
            padding: 10px 20px;
            font-size: 18px;
            font-weight: bold;
            cursor: grab;
            box-shadow: 0 4px 0 #ccc;
            user-select: none;
        }
        .draggable-item:active {
            cursor: grabbing;
        }
        .draggable-item.hidden {
            display: none;
        }

        /* Modals */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 200;
        }
        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            border: 5px solid #FF9800;
        }
        .modal-content h2 { margin-top: 0; font-size: 32px; }
        
        #clueText { font-size: 20px; color: #555; margin-bottom: 20px; }

    </style>
</head>
<body>

    <!-- Audio Assets Linked to Your Folder Structure -->
    <audio id="bgMusic" src="assets/cartoonbackgroundmusic.mp3" loop></audio>
    <audio id="sndCorrect" src="assets/correct.mp3"></audio>
    <audio id="sndWrong" src="assets/wrong.mp3"></audio>
    <audio id="sndWin" src="assets/freesound_community-claps-44774.mp3"></audio>

    <header>
        <div class="logo-container">
            <img src="assets/innovine-logo.png" alt="Innovine Logo" onerror="this.style.display='none'">
        </div>
        <div class="stats">
            <div class="score">Score: <span id="scoreDisplay">0</span></div>
            <div class="hearts" id="heartsDisplay">❤️❤️❤️</div>
        </div>
        <div>
            <button onclick="showClue()">Get a Clue! 💡</button>
            <button onclick="toggleMusic()" id="musicBtn">🔇 Music</button>
        </div>
    </header>

    <div class="train-track">
        <div class="engine"></div>
        <div class="carriage-link"></div>
        
        <div class="carriage outdoor-car">
            <h3>Outdoor Games</h3>
            <div class="drop-zone" data-category="outdoor"></div>
        </div>
        <div class="carriage-link"></div>

        <div class="carriage indoor-car">
            <h3>Indoor Games</h3>
            <div class="drop-zone" data-category="indoor"></div>
        </div>
        <div class="carriage-link"></div>

        <div class="carriage rules-car">
            <h3>Fair Play Rules</h3>
            <div class="drop-zone" data-category="rules"></div>
        </div>
    </div>

    <div class="items-container" id="itemsContainer">
        <!-- Items generated by JS -->
    </div>

    <!-- Clue Modal -->
    <div class="modal" id="clueModal">
        <div class="modal-content">
            <h2>Train Conductor says:</h2>
            <p id="clueText"></p>
            <button onclick="closeModal('clueModal')">Got it!</button>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div class="modal" id="gameOverModal">
        <div class="modal-content">
            <h2>Oh no! The train stopped.</h2>
            <p>You ran out of hearts. Let's try again!</p>
            <button onclick="location.reload()">Restart Game</button>
        </div>
    </div>

    <!-- Victory Modal -->
    <div class="modal" id="victoryModal">
        <div class="modal-content">
            <h2>Choo Choo! You Did It!</h2>
            <p>You loaded all the carriages perfectly.</p>
            <p>Final Score: <span id="finalScoreDisplay"></span></p>
            <button onclick="location.reload()">Play Again</button>
        </div>
    </div>

    <script>
        // Game State
        let score = 0;
        let hearts = 3;
        let isMusicPlaying = false;

        const gameItems = [
            { id: "i1", text: "Football ⚽", category: "outdoor", clue: "You need a big green field to kick this!" },
            { id: "i2", text: "Chess ♟️", category: "indoor", clue: "A board game with kings and queens played inside." },
            { id: "i3", text: "No Cheating 🚫", category: "rules", clue: "This is a very important rule to keep games fun and fair." },
            { id: "i4", text: "Hide & Seek 🌳", category: "outdoor", clue: "You run outside and hide behind trees!" },
            { id: "i5", text: "Ludo 🎲", category: "indoor", clue: "You roll dice on a board inside your house." },
            { id: "i6", text: "Wait Your Turn ⏳", category: "rules", clue: "Don't skip the line; this is how we play nicely." },
            { id: "i7", text: "Cricket 🏏", category: "outdoor", clue: "Hit the ball out of the park!" },
            { id: "i8", text: "Carrom 🎯", category: "indoor", clue: "Flick the striker on the smooth wooden board." },
            { id: "i9", text: "Shake Hands 🤝", category: "rules", clue: "Do this at the end of a match to show respect." }
        ];

        // Initialization
        function initGame() {
            const container = document.getElementById('itemsContainer');
            // Shuffle items
            const shuffled = gameItems.sort(() => Math.random() - 0.5);
            
            shuffled.forEach(item => {
                const div = document.createElement('div');
                div.className = 'draggable-item';
                div.draggable = true;
                div.id = item.id;
                div.innerText = item.text;
                div.dataset.category = item.category;
                
                div.addEventListener('dragstart', dragStart);
                div.addEventListener('dragend', dragEnd);
                
                container.appendChild(div);
            });

            // Setup Drop Zones
            const dropZones = document.querySelectorAll('.drop-zone');
            dropZones.forEach(zone => {
                zone.addEventListener('dragover', dragOver);
                zone.addEventListener('dragleave', dragLeave);
                zone.addEventListener('drop', drop);
            });
        }

        // Drag & Drop Functions
        let draggedItem = null;

        function dragStart(e) {
            draggedItem = this;
            setTimeout(() => this.style.opacity = '0.5', 0);
        }

        function dragEnd() {
            this.style.opacity = '1';
            draggedItem = null;
        }

        function dragOver(e) {
            e.preventDefault();
            this.classList.add('drag-over');
        }

        function dragLeave() {
            this.classList.remove('drag-over');
        }

        function drop(e) {
            e.preventDefault();
            this.classList.remove('drag-over');
            
            if (!draggedItem) return;

            const expectedCategory = this.dataset.category;
            const itemCategory = draggedItem.dataset.category;

            if (expectedCategory === itemCategory) {
                // Correct Match
                playSound('sndCorrect');
                score += 5;
                document.getElementById('scoreDisplay').innerText = score;
                
                // Move item to carriage visually
                draggedItem.draggable = false;
                draggedItem.style.fontSize = '14px';
                draggedItem.style.padding = '5px';
                this.appendChild(draggedItem);
                
                checkWinCondition();
            } else {
                // Wrong Match
                playSound('sndWrong');
                hearts--;
                updateHearts();
                
                if (hearts <= 0) {
                    setTimeout(() => {
                        document.getElementById('gameOverModal').style.display = 'flex';
                    }, 500);
                }
            }
        }

        function updateHearts() {
            const heartsDisplay = document.getElementById('heartsDisplay');
            heartsDisplay.innerText = '❤️'.repeat(hearts) + '🖤'.repeat(3 - hearts);
        }

        function checkWinCondition() {
            const remainingItems = document.getElementById('itemsContainer').children.length;
            if (remainingItems === 0) {
                setTimeout(() => {
                    playSound('sndWin');
                    document.getElementById('finalScoreDisplay').innerText = score;
                    document.getElementById('victoryModal').style.display = 'flex';
                }, 500);
            }
        }

        // Clue System
        function showClue() {
            const container = document.getElementById('itemsContainer');
            const items = Array.from(container.children);
            
            if (items.length > 0) {
                // Pick a random remaining item
                const randomItem = items[Math.floor(Math.random() * items.length)];
                const itemData = gameItems.find(i => i.id === randomItem.id);
                
                document.getElementById('clueText').innerText = `Looking for ${itemData.text}? Here's a hint: "${itemData.clue}"`;
                document.getElementById('clueModal').style.display = 'flex';
            } else {
                document.getElementById('clueText').innerText = "All items sorted! Great job!";
                document.getElementById('clueModal').style.display = 'flex';
            }
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        // Audio Management
        function playSound(id) {
            const sound = document.getElementById(id);
            sound.currentTime = 0;
            sound.play().catch(e => console.log("Audio play prevented by browser"));
        }

        function toggleMusic() {
            const bgMusic = document.getElementById('bgMusic');
            const musicBtn = document.getElementById('musicBtn');
            
            if (isMusicPlaying) {
                bgMusic.pause();
                musicBtn.innerText = '🔇 Music';
            } else {
                bgMusic.play().catch(e => console.log("Autoplay blocked"));
                musicBtn.innerText = '🔊 Music';
            }
            isMusicPlaying = !isMusicPlaying;
        }

        // Start Game
        window.onload = initGame;
    </script>
</body>
</html>
