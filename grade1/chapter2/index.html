<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Healthy Life Quest</title>
<style>
* {
  box-sizing: border-box;
  -webkit-user-select: none;
  user-select: none;
  margin: 0;
  padding: 0;
}
body {
  font-family: Arial, Helvetica, sans-serif;
  background: #fff5f0;
  color: #4a322e;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.screen {
  display: none;
  width: 100%;
  max-width: 500px;
  padding: 20px;
  animation: fadeIn 0.4s ease-out;
}
.screen.active {
  display: block;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* CH1: SPLASH VIEW - ABSOLUTE DEAD-CENTER ALIGNMENT */
#splashScreen {
  background: #ffffff;
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  z-index: 9999;
  display: none;
  grid-template-columns: 1fr;
  align-items: center;
  justify-content: center;
  place-content: center;
  place-items: center;
}
#splashScreen.active { 
  display: grid; 
}
#splashScreen img {
  display: block;
  margin: auto;
  width: auto;
  height: auto;
  max-width: 75vw;
  max-height: 45vh;
  object-fit: contain;
}

/* THEMED PASTEL CONTAINER */
.game-card {
  background: #ffffff;
  border: 6px solid #ffccbc;
  border-radius: 36px;
  padding: 24px;
  box-shadow: 0 16px 40px rgba(255, 171, 145, 0.3);
  text-align: center;
  position: relative;
}

h1 {
  font-size: 32px;
  color: #e64a19;
  margin-bottom: 12px;
  text-shadow: 1px 2px 0px #fbe9e7;
}

.btn-main {
  border: none;
  border-radius: 20px;
  padding: 16px 36px;
  font-size: 20px;
  cursor: pointer;
  background: #ffcc80;
  color: #5d4037;
  box-shadow: 0 6px 0 #f57c00;
  font-weight: 800;
  margin-top: 15px;
  display: inline-block;
  transition: all 0.1s ease;
}
.btn-main:active {
  transform: translateY(4px);
  box-shadow: 0 2px 0 #f57c00;
}

/* TOP STATUS HUD BAR */
.hud-bar {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 16px;
}
.hud-item {
  flex: 1;
  background: #fff3e0;
  border: 2px solid #ffcc80;
  padding: 8px 4px;
  border-radius: 16px;
  font-weight: 700;
  font-size: 14px;
  color: #e65100;
}

/* SNAKE BOARD CANVAS STYLING */
#gamePlayArea {
  display: block;
}
.board-container {
  display: inline-block;
  background: #faf0ec;
  border: 5px solid #ffab91;
  border-radius: 24px;
  overflow: hidden;
  margin: 10px 0;
  line-height: 0;
}
canvas {
  background: #fafafa;
}

/* QUIZ INTERFACE VIEW */
#quizPlayArea {
  display: none;
  background: #ffffff;
  border-radius: 24px;
  padding: 10px;
  margin-top: 10px;
  animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.2);
}
@keyframes popIn {
  from { transform: scale(0.95); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.q-text {
  font-size: 19px;
  font-weight: 700;
  color: #d84315;
  margin-bottom: 16px;
  line-height: 1.5;
}
.hint-banner {
  display: none; 
  font-size: 14px;
  font-weight: 700;
  color: #c62828;
  background: #ffebee;
  padding: 10px 14px;
  border-radius: 14px;
  margin-bottom: 16px;
  border: 1px dashed #ef9a9a;
}
.status-msg {
  font-size: 18px;
  font-weight: 800;
  margin-bottom: 14px;
  min-height: 24px;
}

.options-stack {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.opt-card {
  background: #f9f9f9;
  border: 3px solid #e0e0e0;
  color: #37474f;
  border-radius: 16px;
  padding: 14px;
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
  width: 100%;
  text-align: center;
  box-shadow: 0 4px 0 #e0e0e0;
  transition: all 0.1s ease;
}
.opt-card:active:not(:disabled) {
  transform: translateY(2px);
  box-shadow: 0 2px 0 #e0e0e0;
}
.opt-card.correct {
  background: #c8e6c9 !important;
  border-color: #81c784 !important;
  color: #1b5e20 !important;
  box-shadow: 0 4px 0 #66bb6a !important;
}
.opt-card.wrong {
  background: #ffcdd2 !important;
  border-color: #ef9a9a !important;
  color: #b71c1c !important;
  box-shadow: 0 4px 0 #e57373 !important;
}

/* DPAD CONTROLS */
.dpad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(3, 1fr);
  gap: 10px;
  width: 160px;
  height: 160px;
  margin: 15px auto 0 auto;
}
.dpad-btn {
  background: #fff;
  border: 3px solid #ffcc80;
  border-radius: 18px;
  font-size: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 4px 0 #ffcc80;
}
.dpad-btn:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 #ffcc80;
}

/* EXPLANATION REVIEW PANEL - STRICT DOTTED OUTLINE */
.review-box {
  background: #fffdfb;
  border: 4px dotted #ff7043;
  border-radius: 24px;
  padding: 18px;
  margin: 15px 0;
  text-align: left;
}

.bg-blob {
  position: absolute;
  border-radius: 50%;
  z-index: -1;
  filter: blur(40px);
  opacity: 0.35;
}
</style>
</head>
<body>

<div class="bg-blob" style="width:220px;height:220px;background:#ffccbc;top:8%;left:6%;"></div>
<div class="bg-blob" style="width:260px;height:260px;background:#ffe082;bottom:12%;right:6%;"></div>

<div id="splashScreen" class="screen active">
  <img src="assets/innovine-logo.png" alt="Innovine Logo">
</div>

<div id="startScreen" class="screen">
  <div class="game-card">
    <h1>Healthy Life Quest</h1>
    <p style="font-size: 19px; line-height: 1.6; color: #e64a19; font-weight: 700; margin: 25px 0;">
      Chomp 2 energy treats to test your skills on Food, Clothes, and Healthy Habits!
    </p>
    <button class="btn-main" onclick="bootGame()">▶ Start Quest</button>
  </div>
</div>

<div id="gameScreen" class="screen">
  <div class="game-card">
    
    <div class="hud-bar">
      <div class="hud-item" id="hudTreatsBox">🍎 Energy: <span id="lblFood">0/2</span></div>
      <div class="hud-item">⭐ Score: <span id="lblScore">0</span></div>
      <div class="hud-item" id="lblSmileys" style="font-size:16px;">🙂🙂🙂🙂</div>
    </div>

    <div id="gamePlayArea">
      <div class="board-container">
        <canvas id="stage" width="300" height="300"></canvas>
      </div>

      <div class="dpad">
        <div></div>
        <div class="dpad-btn" onclick="steer('UP')">⬆️</div>
        <div></div>
        <div class="dpad-btn" onclick="steer('LEFT')">⬅️</div>
        <div style="background:#fdf5f2; border-radius:14px;"></div>
        <div class="dpad-btn" onclick="steer('RIGHT')">➡️</div>
        <div></div>
        <div class="dpad-btn" onclick="steer('DOWN')">⬇️</div>
        <div></div>
      </div>
    </div>

    <div id="quizPlayArea">
      <div class="q-text" id="qContainer">Loading...</div>
      <div class="hint-banner" id="hintContainer"></div>
      <div class="status-msg" id="msgContainer"></div>
      <div class="options-stack" id="optContainer"></div>
    </div>

  </div>
</div>

<div id="reviewScreen" class="screen">
  <div class="game-card" style="border-color: #ffab91;">
    <h1 style="color: #ff5722;">Let's Understand! 💡</h1>
    
    <div class="review-box">
      <p style="font-weight: bold; color: #8d6e63; margin-bottom: 6px; font-size: 15px;">Question asked:</p>
      <p id="revQuestion" style="font-size: 16px; margin-bottom: 14px; color: #4a322e; line-height: 1.4; font-weight: 700;"></p>
      
      <p style="font-weight: bold; color: #2e7d32; margin-bottom: 4px; font-size: 15px;">The Right Answer:</p>
      <div id="revAnswer" style="background: #e8f5e9; color: #1b5e20; padding: 10px; border-radius: 12px; font-weight: bold; font-size: 18px; margin-bottom: 14px; border: 2px dashed #81c784; text-align: center;"></div>
      
      <p style="font-weight: bold; color: #e64a19; margin-bottom: 4px; font-size: 15px;">Fun Fact Corner:</p>
      <p id="revReason" style="font-size: 15px; color: #5d4037; line-height: 1.4; font-weight: 500;"></p>
    </div>
    
    <button class="btn-main" style="background: #ffab91; box-shadow: 0 6px 0 #d84315; color:#fff;" onclick="dismissReviewScreen()">Got It! 👍</button>
  </div>
</div>

<div id="endScreen" class="screen">
  <div class="game-card">
    <h1 id="endTitle">Quest Done!</h1>
    <h2 style="color:#e64a19; margin:15px 0;">Final Score: <span id="endScore">0</span></h2>
    <p id="endSubtitle" style="font-weight: bold; color: #795548; margin-bottom: 15px; font-size:16px;"></p>
    <button class="btn-main" onclick="bootGame()">🔄 Play Again</button>
  </div>
</div>

<audio id="soundRight" preload="auto" src="assets/correct.mp3"></audio>
<audio id="soundWrong" preload="auto" src="assets/wrong.mp3"></audio>
<audio id="soundTrack" preload="auto" loop src="assets/funnysong.mp3"></audio>
<audio id="soundClaps" preload="auto" src="assets/freesound_community-claps-44774.mp3"></audio>

<script>
const questionsBank = [
  { q: "Which drink makes your teeth and bones super strong?", a: "Milk", o: ["Milk", "Soda", "Sweet Tea"], h: "Hint: It is white and comes from a cow!", r: "Milk has calcium! Calcium acts like tiny blocks to build strong superhero bones." },
  { q: "What should you wear to stay dry when it rains outside?", a: "Raincoat", o: ["Raincoat", "Swimsuit", "Sweater"], h: "Hint: It is made of plastic and drops slide right off it!", r: "Raincoats are waterproof! They act like an umbrella shield for your clothes." },
  { q: "How many times should you brush your teeth every day?", a: "Two times", o: ["Two times", "Zero times", "One time a week"], h: "Hint: Brush once in the morning, and once before bed!", r: "Brushing twice a day chases away the tiny sugar bugs that hide in your mouth while you sleep!" },
  { q: "What should you do right before you eat your lunch?", a: "Wash your hands", o: ["Wash your hands", "Play with toys", "Put on shoes"], h: "Hint: Use warm water and bubbly soap!", r: "Washing your hands cleans off sneaky, invisible germs so they don't jump onto your food!" },
  { q: "What keeps you warm when playing in the cold snow?", a: "Warm jacket", o: ["Warm jacket", "T-shirt", "Sunglasses"], h: "Hint: It is thick, fluffy, and zips up tight!", r: "Heavy jackets trap your body heat inside like a cozy, warm hug!" },
  { q: "I am a red fruit that grows on a tree. I am healthy, but I am not a strawberry. What am I?", a: "Apple", o: ["Apple", "Strawberry", "French Fries"], h: "Hint: Strawberries grow on the ground, but I grow high up on branches!", r: "Both are red and yummy, but apples grow high in the sky on trees!" },
  { q: "Carrots are orange. Cheese balls are orange. Which one helps your eyes see better?", a: "Carrots", o: ["Carrots", "Cheese balls", "Candy"], h: "Hint: Bunnies love this crunchy snack! It grows in the dirt.", r: "Carrots have Vitamin A. It works like magic night-vision goggles for your eyes!" },
  { q: "It is a hot, sunny day. Which shirt will keep you feeling cooler?", a: "White shirt", o: ["White shirt", "Black shirt", "Winter coat"], h: "Hint: Dark colors soak up the hot sun. Light colors bounce it away!", r: "A black shirt acts like a sponge for heat. A white shirt acts like a mirror and bounces the hot sun rays away!" },
  { q: "Your hands look clean after playing with toys. Do you still have to wash them before dinner?", a: "Yes, germs are invisible", o: ["Yes, germs are invisible", "No, they look clean", "No, just wipe them"], h: "Hint: Germs are way too small to see with your eyes!", r: "Germs are hide-and-seek champions! Even if your hands look clean, tiny bugs are hiding there until soap washes them away." },
  { q: "You sit in a warm bathtub for a long time but do not use any soap. Are you clean?", a: "No, you need soap", o: ["No, you need soap", "Yes, water is enough", "Yes, the water was hot"], h: "Hint: Water alone cannot wash away sticky sweat!", r: "Soap acts like a magnet! It grabs onto sticky dirt and sweat so the water can slide them down the drain." }
];

const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");
const gridSize = 20; 
const tileCount = canvas.width / gridSize;

let snake = [], food = {x:0, y:0};
let dx = gridSize, dy = 0;
let score = 0, lives = 4, targetCounter = 0; // Configured at 4 smileys
let loopEngine = null, isPaused = false;
let sessionQuestions = [], currentQ = null;
let wrongAttempts = 0; 
let quizCounter = 0; 
let hintTimeoutTracker = null; 

const sndRight = document.getElementById("soundRight");
const sndWrong = document.getElementById("soundWrong");
const sndTrack = document.getElementById("soundTrack");
const sndClaps = document.getElementById("soundClaps");

function navigate(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function bootGame() {
  score = 0;
  lives = 4;
  targetCounter = 0;
  quizCounter = 0;
  isPaused = false; 
  dx = gridSize; 
  dy = 0;
  
  sessionQuestions = shuffle([...questionsBank]);
  
  snake = [
    {x: gridSize * 4, y: gridSize * 5},
    {x: gridSize * 3, y: gridSize * 5},
    {x: gridSize * 2, y: gridSize * 5}
  ];
  
  document.getElementById("gamePlayArea").style.display = "block";
  document.getElementById("hudTreatsBox").style.visibility = "visible";
  document.getElementById("quizPlayArea").style.display = "none";
  
  refreshFood();
  syncPanel(0); // Pass 0 wrong choices initially
  navigate("gameScreen");
  
  clearInterval(loopEngine);
  loopEngine = setInterval(gameTick, 450); 
  
  sndTrack.currentTime = 0;
  sndTrack.volume = 0.2;
  sndTrack.play().catch(()=>{});
}

function syncPanel(wrongInThisTurn = 0) {
  document.getElementById("lblScore").textContent = score;
  document.getElementById("lblFood").textContent = `${targetCounter}/2`;
  
  // DYNAMIC MOOD INDICATOR SYSTEM (4 FIXED STATUSES)
  let arrayDisplay = ["⚫", "⚫", "⚫", "⚫"];
  for (let i = 0; i < lives; i++) {
    arrayDisplay[i] = "🙂"; 
  }
  // Change state of active warning smileys dynamically
  if (wrongInThisTurn === 1 && lives > 0) {
    arrayDisplay[lives - 1] = "🤔";
  }
  
  document.getElementById("lblSmileys").textContent = arrayDisplay.join("");
}

function refreshFood() {
  food.x = Math.floor(Math.random() * tileCount) * gridSize;
  food.y = Math.floor(Math.random() * tileCount) * gridSize;
  snake.forEach(part => {
    if(part.x === food.x && part.y === food.y) refreshFood();
  });
}

function steer(dir) {
  if (isPaused) return;
  if (dir === "UP" && dy === 0) { dx = 0; dy = -gridSize; }
  if (dir === "DOWN" && dy === 0) { dx = 0; dy = gridSize; }
  if (dir === "LEFT" && dx === 0) { dx = -gridSize; dy = 0; }
  if (dir === "RIGHT" && dx === 0) { dx = gridSize; dy = 0; }
}

window.addEventListener("keydown", e => {
  if (e.key === "ArrowUp" || e.key.toLowerCase() === "w") steer("UP");
  if (e.key === "ArrowDown" || e.key.toLowerCase() === "s") steer("DOWN");
  if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") steer("LEFT");
  if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") steer("RIGHT");
});

function gameTick() {
  if (isPaused) return;
  
  const head = {x: snake[0].x + dx, y: snake[0].y + dy};
  
  if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
    handleFailure();
    return;
  }
  
  for (let i = 0; i < snake.length; i++) {
    if (snake[i].x === head.x && snake[i].y === head.y) {
      handleFailure();
      return;
    }
  }
  
  snake.unshift(head);
  
  if (head.x === food.x && head.y === food.y) {
    targetCounter++; 
    refreshFood();
    syncPanel(0);
    
    if (targetCounter >= 2) {
      isPaused = true;
      targetCounter = 0;
      quizCounter = 0; 
      triggerQuizRound();
      return;
    }
  } else {
    snake.pop();
  }
  
  renderCanvas();
}

function renderCanvas() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  ctx.fillStyle = "#ff7043";
  ctx.beginPath();
  ctx.arc(food.x + gridSize/2, food.y + gridSize/2, gridSize/2 - 2, 0, Math.PI * 2);
  ctx.fill();
  
  snake.forEach((part, idx) => {
    ctx.fillStyle = idx === 0 ? "#ff8a65" : "#ffab91";
    ctx.beginPath();
    ctx.roundRect(part.x + 2, part.y + 2, gridSize - 4, gridSize - 4, [8]);
    ctx.fill();
  });
}

function handleFailure() {
  if (dx === gridSize) { dx = 0; dy = gridSize; }
  else if (dy === gridSize) { dx = -gridSize; dy = 0; }
  else if (dx === -gridSize) { dx = 0; dy = -gridSize; }
  else if (dy === -gridSize) { dx = gridSize; dy = 0; }
}

function triggerQuizRound() {
  wrongAttempts = 0; 
  clearTimeout(hintTimeoutTracker);
  
  if (sessionQuestions.length === 0) {
    terminateQuest(true);
    return;
  }
  
  document.getElementById("gamePlayArea").style.display = "none";
  document.getElementById("hudTreatsBox").style.visibility = "hidden";
  document.getElementById("quizPlayArea").style.display = "block";
  
  const hintBanner = document.getElementById("hintContainer");
  hintBanner.style.display = "none";
  
  currentQ = sessionQuestions.pop();
  quizCounter++; 
  
  document.getElementById("qContainer").textContent = currentQ.q;
  hintBanner.textContent = currentQ.h;
  document.getElementById("msgContainer").textContent = "";
  
  const optBox = document.getElementById("optContainer");
  optBox.innerHTML = "";
  
  const shuffledOptions = shuffle([...currentQ.o]);
  shuffledOptions.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "opt-card";
    btn.textContent = opt;
    btn.onclick = () => verifyQuizAction(btn, opt === currentQ.a);
    optBox.appendChild(btn);
  });

  hintTimeoutTracker = setTimeout(() => {
    hintBanner.style.display = "block";
  }, 15000);
}

function verifyQuizAction(element, isCorrect) {
  clearTimeout(hintTimeoutTracker);

  if (isCorrect) {
    score += 1;
    
    document.querySelectorAll(".opt-card").forEach(b => {
      b.disabled = true;
      if (b.textContent === currentQ.a) b.classList.add("correct");
    });
    
    // ATTACH UNIVERSAL CONVERSATIONAL FUN FACT DISCOVERY ON SUCCESS
    const msg = document.getElementById("msgContainer");
    msg.style.color = "#2e7d32";
    msg.innerHTML = `🎉 Correct! <br><span style='font-size:14px; font-weight:500; color:#5d4037;'>Fact: ${currentQ.r}</span>`;
    
    sndRight.currentTime = 0;
    sndRight.play().catch(()=>{});
    syncPanel(0);
    
    setTimeout(() => {
      evaluateRoundProgression();
    }, 4000); // Extended slightly so they can read the fun fact corner text
    
  } else {
    wrongAttempts++;
    document.getElementById("hintContainer").style.display = "block";
    
    if (wrongAttempts === 1) {
      element.classList.add("wrong");
      element.disabled = true;
      
      const msg = document.getElementById("msgContainer");
      msg.style.color = "#f57c00";
      msg.textContent = "Try again! You have 1 more choice! 🤔";
      
      sndWrong.currentTime = 0;
      sndWrong.play().catch(()=>{});
      
      syncPanel(1); // Shifts latest active face element into thinking mode
      
    } else {
      element.classList.add("wrong");
      
      document.querySelectorAll(".opt-card").forEach(b => {
        b.disabled = true;
        if (b.textContent === currentQ.a) b.classList.add("correct");
      });
      
      lives--; // Deducts and removes smiley
      const msg = document.getElementById("msgContainer");
      msg.style.color = "#d32f2f";
      msg.textContent = "Let's check the right answer!";
      
      sndWrong.currentTime = 0;
      sndWrong.play().catch(()=>{});
      syncPanel(0);
      
      setTimeout(() => {
        if (lives <= 0) {
          terminateQuest(false); // Triggers soft game over screen
        } else {
          loadReviewScreen();
        }
      }, 1800);
    }
  }
}

function loadReviewScreen() {
  document.getElementById("revQuestion").textContent = currentQ.q;
  document.getElementById("revAnswer").textContent = currentQ.a;
  document.getElementById("revReason").textContent = currentQ.r;
  navigate("reviewScreen");
}

function dismissReviewScreen() {
  navigate("gameScreen");
  evaluateRoundProgression();
}

function evaluateRoundProgression() {
  if (sessionQuestions.length === 0) {
    terminateQuest(true);
    return;
  }
  
  if (quizCounter < 2) {
    triggerQuizRound();
  } else {
    document.getElementById("quizPlayArea").style.display = "none";
    document.getElementById("gamePlayArea").style.display = "block";
    document.getElementById("hudTreatsBox").style.visibility = "visible";
    isPaused = false;
    renderCanvas();
  }
}

function terminateQuest(isWin) {
  isPaused = true;
  clearTimeout(hintTimeoutTracker);
  clearInterval(loopEngine);
  sndTrack.pause();
  sndTrack.currentTime = 0;
  
  document.getElementById("endScore").textContent = score;
  const title = document.getElementById("endTitle");
  const sub = document.getElementById("endSubtitle");
  
  if (isWin) {
    title.textContent = "Healthy Life Hero! 🏆";
    title.style.color = "#2e7d32";
    sub.textContent = "Awesome job! You know how to stay safe, clean, and strong!";
    sndClaps.currentTime = 0;
    sndClaps.play().catch(()=>{});
  } else {
    // TIMEOUT GAME OVER SCREEN SPECIFICATIONS
    title.textContent = "Keep Trying, Champ! 💪";
    title.style.color = "#e64a19";
    sub.textContent = "Eat more treats to try the riddles again!";
  }
  
  navigate("endScreen");
}

window.addEventListener("load", () => {
  setTimeout(() => {
    navigate("startScreen");
  }, 5000);
});
</script>
</body>
</html>
