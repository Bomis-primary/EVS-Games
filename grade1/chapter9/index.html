<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Safe Route Planner - EVS Chapter 9</title>
    <style>
        :root {
            --bg-sky: #bae6fd;
            --grass-green: #4ade80;
            --road-asphalt: #475569;
            --sidewalk-gray: #cbd5e1;
            --text-dark: #1e3a8a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0c4a6e;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Comic Sans MS', 'Arial Rounded MT Bold', sans-serif;
        }

        /* CABINET WITH BUILT-IN SCROLL SUPPORT FOR SMALL MONITORS */
        .game-cabinet-stage {
            width: 500px;
            height: 850px;
            max-height: 95vh;
            background: linear-gradient(180deg, var(--bg-sky) 0%, #e0f2fe 100%);
            border: 8px solid #38bdf8;
            border-radius: 24px;
            position: relative;
            overflow-y: auto; /* Enables custom scrolling if monitor height cuts off view */
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }

        /* Custom Kid-Friendly Scrollbar Styling */
        .game-cabinet-stage::-webkit-scrollbar {
            width: 10px;
        }
        .game-cabinet-stage::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
            border-radius: 10px;
        }
        .game-cabinet-stage::-webkit-scrollbar-thumb {
            background: #38bdf8;
            border-radius: 10px;
        }

        .screen-view {
            display: none;
            width: 100%;
            min-height: 100%;
            padding: 16px;
            flex-direction: column;
            position: relative;
        }

        .active-view {
            display: flex !important;
        }

        #screen-brand-intro {
            background: #ffffff;
            justify-content: center;
            align-items: center;
        }

        .intro-logo-graphic {
            width: 75%;
            max-width: 300px;
            object-fit: contain;
        }

        #screen-welcome {
            background: url('assets/startscreenimage.png') no-repeat center center;
            background-size: cover;
            min-height: 834px;
        }

        .native-play-hotspot {
            position: absolute;
            bottom: 24%;
            left: 50%;
            transform: translateX(-50%);
            width: 280px;
            height: 80px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.01);
            border-radius: 40px;
        }

        #screen-game {
            gap: 12px;
            justify-content: flex-start;
        }

        .btn-kids-action {
            background: linear-gradient(180deg, #fb923c 0%, #f97316 50%, #ea580c 100%);
            color: white;
            border: 4px solid #fff;
            padding: 12px 40px;
            font-size: 24px;
            font-weight: 900;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 0 #c2410c, 0 8px 15px rgba(0,0,0,0.3);
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            text-transform: uppercase;
            align-self: center;
            transition: transform 0.1s;
        }
        .btn-kids-action:active {
            transform: translateY(3px);
            box-shadow: 0 3px 0 #c2410c;
        }

        .kids-hud {
            width: 100%;
            height: 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            border: 4px solid #38bdf8;
            padding: 0 16px;
            border-radius: 18px;
            font-weight: 900;
            font-size: 18px;
        }

        .stars-container {
            color: #facc15;
            font-size: 22px;
        }

        .task-instruction-banner {
            width: 100%;
            background: #fef08a;
            border: 4px dashed #eab308;
            border-radius: 14px;
            padding: 12px;
            text-align: center;
            font-size: 16px;
            font-weight: 900;
            color: #713f12;
            line-height: 1.4;
        }

        .grid-box-wrapper {
            width: 100%;
            aspect-ratio: 1 / 1;
            position: relative;
        }

        .kids-map-grid {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 6px;
            background: var(--grass-green);
            border: 6px solid #fcd34d;
            border-radius: 20px;
            padding: 6px;
            position: relative;
        }

        .kids-tile {
            position: relative;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .tile-empty {
            background: #86efac;
            border: 3px dashed #22c55e;
            cursor: pointer;
        }
        .tile-obstacle {
            background: #4ade80;
            font-size: 42px;
        }
        .tile-road-lane {
            background: var(--road-asphalt);
            border-top: 3px dashed #94a3b8;
            border-bottom: 3px dashed #94a3b8;
        }
        
        .tile-anchor-building {
            background: #93c5fd;
            border: 4px solid #2563eb;
            position: relative;
        }
        .anchor-tag-lbl {
            font-size: 10px;
            font-weight: 900;
            color: #1e3a8a;
            background: white;
            padding: 1px 5px;
            border-radius: 5px;
            border: 1px solid #2563eb;
            position: absolute;
            bottom: 2px;
            z-index: 5;
        }

        .placed-footpath-block { background: var(--sidewalk-gray); border: 3px solid #94a3b8; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 46px; }
        .placed-zebra-block { background: linear-gradient(90deg, var(--road-asphalt) 15%, #fff 15%, #fff 35%, var(--road-asphalt) 35%, var(--road-asphalt) 65%, #fff 65%, #fff 85%, var(--road-asphalt) 85%); border: 3px solid white; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 46px; }
        
        .placed-signal-block { background: #334155; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: 3px solid #64748b; }
        .signal-bulb { width: 14px; height: 14px; border-radius: 50%; background: #475569; border: 1px solid #000; }
        .placed-signal-block.red-on .bulb-r { background: #ef4444; box-shadow: 0 0 8px #ef4444; }
        .placed-signal-block.green-on .bulb-g { background: #22c55e; box-shadow: 0 0 8px #22c55e; }

        .placement-valid-glow { border: 4px solid #22c55e !important; }
        .placement-invalid-glow { border: 4px solid #ef4444 !important; }

        .lane-vehicle-token { position: absolute; font-size: 38px; z-index: 10; pointer-events: none; }

        #sam-player-token {
            position: absolute;
            width: 25%;
            height: 25%;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: left 0.4s cubic-bezier(0.25, 1, 0.5, 1), top 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            pointer-events: none;
        }
        #sam-player-token img {
            width: 90%;
            height: 90%;
            object-fit: contain;
            filter: drop-shadow(0 5px 6px rgba(0,0,0,0.3));
        }

        .grid-control-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }
        .btn-control-utility {
            flex: 1;
            background: #ffffff;
            border: 3px solid #cbd5e1;
            padding: 10px;
            font-weight: 900;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 15px;
            color: #475569;
            box-shadow: 0 4px 0 #cbd5e1;
        }

        .inventory-tray {
            width: 100%;
            background: #ffffff;
            border: 4px solid #fcd34d;
            border-radius: 18px;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
        }
        .tool-card {
            width: 75px;
            height: 75px;
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            position: relative;
        }
        .counter-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #ef4444;
            color: white;
            font-size: 11px;
            padding: 2px 7px;
            border-radius: 10px;
            border: 2px solid white;
        }
        .tool-footpath { background: var(--sidewalk-gray); border: 3px solid #94a3b8; }
        .tool-zebra { background: linear-gradient(45deg, #475569 25%, #fff 25%, #fff 50%, #475569 50%, #475569 75%, #fff 75%); background-size: 10px 10px; border: 3px solid #475569; color: white;}
        .tool-signal { background: #334155; border: 3px solid #64748b; color: white; }

        .game-speech-bubble {
            position: absolute;
            bottom: 140px;
            left: 5%;
            width: 90%;
            background: #ffffff;
            border: 5px solid #ef4444;
            border-radius: 16px;
            padding: 12px;
            text-align: center;
            font-weight: 900;
            font-size: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            display: none;
            z-index: 200;
        }

        .briefing-overlay {
            background: rgba(12, 74, 110, 0.96);
            justify-content: center;
            align-items: center;
            padding: 24px;
            gap: 20px;
            color: white;
            text-align: center;
        }
        .briefing-card {
            background: #ffffff;
            border: 6px solid #fb923c;
            border-radius: 20px;
            padding: 24px 16px;
            color: var(--text-dark);
            width: 100%;
        }

        /* LIVE OVERLAY POPUP MODAL FOR QUIZ */
        .midway-quiz-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            z-index: 500;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .quiz-popup-card {
            background: #ffffff;
            border: 6px solid #eab308;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            animation: popIn 0.3s ease-out;
        }
        .quiz-popup-question {
            font-size: 19px;
            font-weight: 900;
            color: #1e3a8a;
            margin-bottom: 16px;
            line-height: 1.4;
        }
        .quiz-popup-options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }
        .quiz-popup-btn {
            width: 100%;
            background: #f8fafc;
            border: 3px solid #cbd5e1;
            padding: 14px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 900;
            color: #334155;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .quiz-hint-text {
            color: #ea580c;
            font-size: 14px;
            font-weight: 900;
            margin-top: 12px;
            display: none;
            background: #fff7ed;
            padding: 8px;
            border-radius: 8px;
            border: 1px dashed #fdba74;
        }

        #confetti-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 150;
        }

        @keyframes popIn { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }
    </style>
</head>
<body>

    <audio id="audio-right" src="assets/correctanswer-1.mp3" preload="auto"></audio>
    <audio id="audio-wrong" src="assets/wrong.mp3" preload="auto"></audio>
    <audio id="audio-claps" src="assets/freesound_community-claps-44774.mp3" preload="auto"></audio>

    <div class="game-cabinet-stage" id="master-game-stage">
        <canvas id="confetti-canvas"></canvas>

        <div id="screen-brand-intro" class="screen-view active-view">
            <img src="assets/innovine-logo.png" alt="Innovine Logo" class="intro-logo-graphic">
        </div>

        <div id="screen-welcome" class="screen-view">
            <div class="native-play-hotspot" onclick="initializePreLevelBriefing(1)"></div>
        </div>

        <div id="screen-briefing" class="screen-view briefing-overlay">
            <h2 id="briefing-title-lbl" style="color: #facc15; font-size: 34px; font-weight: 900;">LEVEL 1</h2>
            <div class="briefing-card">
                <p style="font-size: 14px; font-weight: 900; color: #a1a1aa; margin-bottom: 4px; text-transform: uppercase;">Your Mission:</p>
                <p id="briefing-text-lbl" style="font-size: 18px; font-weight: bold; line-height: 1.4; color: #1e3a8a;"></p>
            </div>
            <button class="btn-kids-action" onclick="loadActiveLevelSandboxState()">START ▶️</button>
        </div>

        <div id="screen-game" class="screen-view">
            <div id="live-quiz-modal" class="midway-quiz-overlay">
                <div class="quiz-popup-card" id="quiz-card-frame">
                    <p style="color: #fb923c; font-size: 14px; font-weight: 900; margin-bottom: 4px; text-transform: uppercase;">Traffic Quiz! 🚦</p>
                    <div id="quiz-modal-q-text" class="quiz-popup-question"></div>
                    <div id="quiz-modal-options-box" class="quiz-popup-options-list"></div>
                    <div id="quiz-modal-hint" class="quiz-hint-text"></div>
                </div>
            </div>

            <div class="kids-hud">
                <span id="hud-level-tag" style="color: #0284c7;">LEVEL: 1/3</span>
                <span id="hud-stars-tag" class="stars-container">⭐⭐⭐</span>
            </div>

            <div id="task-banner-text" class="task-instruction-banner">Help Sam walk safely on the Footpath to reach home!</div>

            <div class="grid-box-wrapper">
                <div id="kids-map-mesh" class="kids-map-grid">
                    <div id="sam-player-token">
                        <img src="assets/student-mascot.png" alt="Sam avatar">
                    </div>
                </div>
            </div>

            <div id="speech-bubble-prompt" class="game-speech-bubble"></div>

            <div class="grid-control-bar">
                <button class="btn-control-utility" onclick="executeUndoLastPlacementStep()">↩️ Undo Step</button>
                <button class="btn-control-utility" onclick="resetCurrentLevelMatrixState()">🔄 Reset Map</button>
            </div>

            <div id="inventory-dock" class="inventory-tray"></div>

            <button id="btn-action-trigger" class="btn-kids-action" style="width: 100%; background: linear-gradient(180deg, #4ade80 0%, #16a34a 100%); box-shadow: 0 6px 0 #15803d; font-size:24px; padding:12px; margin-top: 5px;" onclick="beginRouteVerificationWalk()">GO HOME! 🏃‍♂️</button>
        </div>

        <div id="screen-victory" class="screen-view briefing-overlay" style="justify-content:center; gap:20px; background: rgba(224, 242, 254, 0.98);">
            <div style="font-size: 60px; line-height:1;">🏆</div>
            <h1 style="color: #16a34a; font-size: 30px; font-weight: 900;">MISSION CLEAR!</h1>
            
            <div style="background: #1e3a8a; border: 5px solid #38bdf8; border-radius:20px; padding: 16px; width:90%;">
                <p style="font-size: 15px; color: #93c5fd; font-weight: 900; margin-bottom: 4px; text-align:center;">FINAL RATING:</p>
                <p id="victory-stars-lbl" style="font-size: 36px; text-align:center;"></p>
            </div>

            <button class="btn-kids-action" style="background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%); box-shadow: 0 6px 0 #1e40af;" onclick="resetWholeAppEngine()">PLAY AGAIN 🔄</button>
        </div>
    </div>

    <script>
        setTimeout(() => {
            switchScreenLayout('screen-welcome');
        }, 3000);

        function switchScreenLayout(id) {
            document.querySelectorAll('.screen-view').forEach(view => view.classList.remove('active-view'));
            const node = document.getElementById(id);
            if (node) node.classList.add('active-view');
            document.getElementById('master-game-stage').scrollTop = 0;
        }

        let activeLevelIdx = 1;
        let cumulativeStarsEarned = 0;
        let runningLevelStarsCount = 3;
        let fieldMatrixConfiguration = [];
        let currentlySelectedToolType = null;
        let runningInventoryPoolMap = {};
        let placementHistoryStack = [];
        let activeLanesVehiclesCollection = [];
        let lightSignalState = "red";
        let autoSignalTimerClock = null;
        let routeSimulationLockFlag = false;
        
        let confettiIntervalClock = null;
        let confettiParticlesCollection = [];

        const mapsDatabase = {
            level1: {
                shortBrief: "Build a safe path from School to Home! Stay off the green grass!",
                task: "Help Sam walk safely on the Footpath to reach home! Don't step on the grass!",
                inventory: { footpath: 6 },
                start: { r: 0, c: 0 },
                end: { r: 3, c: 3 },
                matrix: [
                    ['school', 'empty',    'empty',    'empty'],
                    ['obstacle', 'obstacle', 'obstacle', 'empty'],
                    ['obstacle', 'obstacle', 'obstacle', 'empty'],
                    ['obstacle', 'obstacle', 'obstacle', 'home']
                ],
                milestoneQuizzes: {
                    "0,2": {
                        q: "Where is the safest place for Sam to walk?",
                        hint: "Hint: Roads and grass are dangerous! Walk on paths made of bricks.",
                        options: [
                            { text: "On the Footpath! 🧱", correct: true },
                            { text: "On the green grass. 🌳", correct: false }
                        ]
                    },
                    "1,3": {
                        q: "Should we run or play games on the footpath?",
                        hint: "Hint: Footpaths are for walking carefully to stay safe!",
                        options: [
                            { text: "No, stay safe! 🛑", correct: true },
                            { text: "Yes, let's run! 🏃‍♂️", correct: false }
                        ]
                    },
                    "2,3": {
                        q: "Is it safe to play near streets where cars travel?",
                        hint: "Hint: Cars move very fast and might not see you!",
                        options: [
                            { text: "No, it is dangerous! 🙅‍♂️", correct: true },
                            { text: "Yes, it is perfectly fine.", correct: false }
                        ]
                    }
                }
            },
            level2: {
                shortBrief: "Build a safe path across the road using a Zebra Crossing!",
                task: "Help Sam walk down and cross the busy road using a Zebra Crossing!",
                inventory: { footpath: 4, zebra: 1 },
                start: { r: 0, c: 0 },
                end: { r: 3, c: 3 },
                matrix: [
                    ['school',   'empty',    'obstacle', 'obstacle'],
                    ['obstacle', 'empty',    'obstacle', 'obstacle'],
                    ['road_lane_left', 'road_lane_right', 'road_lane_left', 'road_lane_right'],
                    ['obstacle', 'empty',    'empty',    'home']
                ],
                milestoneQuizzes: {
                    "1,1": {
                        q: "What are the white stripes on the road called?",
                        hint: "Hint: They are named after a striped black-and-white animal!",
                        options: [
                            { text: "Zebra Crossing! 🏁", correct: true },
                            { text: "Tiger Lines. 🐅", correct: false }
                        ]
                    },
                    "2,1": {
                        q: "What do we do right before crossing any street?",
                        hint: "Hint: Use your eyes to check left and right for vehicles!",
                        options: [
                            { text: "Stop and look both ways! 👀", correct: true },
                            { text: "Run as fast as you can!", correct: false }
                        ]
                    },
                    "3,1": {
                        q: "Zebra lines help walkers cross roads safely. True or False?",
                        hint: "Hint: Drivers always look out for people on these special white lines.",
                        options: [
                            { text: "True! 👍", correct: true },
                            { text: "False! 👎", correct: false }
                        ]
                    }
                }
            },
            level3: {
                shortBrief: "Cars are driving fast! Place a Zebra Crossing and Traffic Light to cross safely!",
                task: "The street is busy! Help Sam use the Zebra Crossing and Traffic Light safely!",
                inventory: { footpath: 3, zebra: 1, trafficlight: 1 },
                start: { r: 0, c: 0 },
                end: { r: 3, c: 3 },
                matrix: [
                    ['school',   'empty',    'obstacle', 'obstacle'],
                    ['obstacle', 'empty',    'obstacle', 'obstacle'],
                    ['road_lane_left', 'road_lane_right', 'road_lane_left', 'road_lane_right'],
                    ['obstacle', 'empty',    'empty',    'home']
                ],
                milestoneQuizzes: {
                    "1,1": {
                        q: "What does a RED traffic light tell cars to do?",
                        hint: "Hint: Red means danger! Vehicles must stop immediately.",
                        options: [
                            { text: "Stop completely! 🛑", correct: true },
                            { text: "Drive faster! 🚗", correct: false }
                        ]
                    },
                    "2,1": {
                        q: "Which light color tells walkers it is safe to cross?",
                        hint: "Hint: This color means 'Go ahead safely'!",
                        options: [
                            { text: "Green! 🟢", correct: true },
                            { text: "Red! 🔴", correct: false }
                        ]
                    },
                    "3,1": {
                        q: "We should always follow traffic safety rules. True or False?",
                        hint: "Hint: Traffic rules keep everybody, including you, perfectly safe!",
                        options: [
                            { text: "True! ✅", correct: true },
                            { text: "False! ❌", correct: false }
                        ]
                    }
                }
            }
        };

        function initializePreLevelBriefing(lvlNum) {
            activeLevelIdx = lvlNum;
            const metaSpec = mapsDatabase["level" + activeLevelIdx];
            document.getElementById('briefing-title-lbl').innerText = `LEVEL ${activeLevelIdx}`;
            document.getElementById('briefing-text-lbl').innerText = metaSpec.shortBrief;
            switchScreenLayout('screen-briefing');
        }

        function loadActiveLevelSandboxState() {
            switchScreenLayout('screen-game');
            buildMapLevelRun(activeLevelIdx);
        }

        function buildMapLevelRun(lvlNum) {
            activeLevelIdx = lvlNum;
            runningLevelStarsCount = 3;
            currentlySelectedToolType = null;
            routeSimulationLockFlag = false;
            placementHistoryStack = [];
            clearVehiclesSimulationThreads();
            stopConfettiParticleEngine();

            document.getElementById('hud-level-tag').innerText = "LEVEL: " + activeLevelIdx + "/3";
            updateStarsDisplayUI();
            document.getElementById('speech-bubble-prompt').style.display = "none";
            document.getElementById('live-quiz-modal').style.display = "none";

            const specBlueprint = mapsDatabase["level" + activeLevelIdx];
            document.getElementById('task-banner-text').innerText = specBlueprint.task;

            fieldMatrixConfiguration = JSON.parse(JSON.stringify(specBlueprint.matrix));
            runningInventoryPoolMap = JSON.parse(JSON.stringify(specBlueprint.inventory));

            const containerGridBox = document.getElementById('kids-map-mesh');
            containerGridBox.querySelectorAll('.kids-tile').forEach(tile => tile.remove());

            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    const tileCodeType = fieldMatrixConfiguration[r][c];
                    const nodeCell = document.createElement('div');
                    nodeCell.className = `kids-tile tile-${tileCodeType}`;
                    nodeCell.dataset.row = r;
                    nodeCell.dataset.col = c;
                    nodeCell.style.gridRowStart = r + 1;
                    nodeCell.style.gridColStart = c + 1;

                    if (tileCodeType === 'school') {
                        nodeCell.className += " tile-anchor-building";
                        nodeCell.innerHTML = `<span style="font-size:38px;">🏫</span><span class="anchor-tag-lbl">SCHOOL</span>`;
                    } else if (tileCodeType === 'home') {
                        nodeCell.className += " tile-anchor-building";
                        nodeCell.innerHTML = `<span style="font-size:38px;">🏠</span><span class="anchor-tag-lbl">HOME</span>`;
                    } else if (tileCodeType === 'obstacle') {
                        nodeCell.innerText = "🌳";
                    } else if (tileCodeType === 'road_lane_left' || tileCodeType === 'road_lane_right') {
                        nodeCell.className = "kids-tile tile-road-lane";
                    } else if (tileCodeType === 'empty') {
                        nodeCell.className += " tile-empty";
                    }

                    nodeCell.addEventListener('click', () => executeDirectTapPlacementBlock(nodeCell));
                    containerGridBox.appendChild(nodeCell);
                }
            }

            setTimeout(() => { placeSamCharacterPawnCoordinates(specBlueprint.start.r, specBlueprint.start.c); }, 70);
            renderInventoryTrayUI();

            if (activeLevelIdx >= 2) {
                deployDynamicLaneTrafficEngine();
                if (activeLevelIdx === 3) launchTrafficLightSignalAutomation();
            }
        }

        function updateStarsDisplayUI() {
            let starsStr = "";
            for (let i = 0; i < 3; i++) {
                starsStr += (i < runningLevelStarsCount) ? "⭐" : "⚫";
            }
            document.getElementById('hud-stars-tag').innerText = starsStr;
        }

        function renderInventoryTrayUI() {
            const dock = document.getElementById('inventory-dock');
            dock.innerHTML = "";

            Object.keys(runningInventoryPoolMap).forEach(key => {
                const availableQuantity = runningInventoryPoolMap[key];
                const blockCard = document.createElement('div');
                blockCard.className = `tool-card tool-${key}`;
                if (currentlySelectedToolType === key) blockCard.style.outline = "5px solid #ea580c";

                let iconGraphicSymbol = "🧱"; let labelNameStr = "Footpath";
                if (key === 'zebra') { iconGraphicSymbol = "🏁"; labelNameStr = "Zebra"; }
                if (key === 'trafficlight') { iconGraphicSymbol = "🚦"; labelNameStr = "Signal"; }

                blockCard.innerHTML = `
                    <span style="font-size: 28px; line-height: 1;">${iconGraphicSymbol}</span>
                    <span style="font-size: 11px; font-weight: 900; margin-top: 4px;">${labelNameStr}</span>
                    <div class="counter-badge" style="background:${availableQuantity <= 0 ? '#64748b':'#ef4444'}">${availableQuantity}</div>
                `;

                blockCard.addEventListener('click', () => {
                    if(availableQuantity <= 0) {
                        displayKidsSpeechBubble("Out of tiles! Use Undo if you need to fix a mistake! ↩️");
                        return;
                    }
                    currentlySelectedToolType = key;
                    document.querySelectorAll('.tool-card').forEach(c => c.style.outline = "none");
                    blockCard.style.outline = "5px solid #ea580c";
                });

                dock.appendChild(blockCard);
            });
        }

        function executeDirectTapPlacementBlock(targetTileNode) {
            if (routeSimulationLockFlag) return;

            const r = parseInt(targetTileNode.dataset.row);
            const c = parseInt(targetTileNode.dataset.col);
            const initialIdentityState = fieldMatrixConfiguration[r][c];

            if (!currentlySelectedToolType) {
                if (initialIdentityState === 'school' || initialIdentityState === 'home') return;
                displayKidsSpeechBubble("Tap a tool card from the tray first! 🎒");
                return;
            }

            let wasPlacementSuccessful = false;

            if (currentlySelectedToolType === 'zebra') {
                if (initialIdentityState === 'road_lane_left' || initialIdentityState === 'road_lane_right') {
                    targetTileNode.innerHTML = `<div class="placed-zebra-block">🏁</div>`;
                    fieldMatrixConfiguration[r][c] = 'paved_zebra';
                    wasPlacementSuccessful = true;
                } else {
                    triggerTactileFlashFeedback(targetTileNode, "placement-invalid-glow");
                    displayKidsSpeechBubble("Place the Zebra Crossing directly on the dark road! 🏁");
                }
            } 
            else if (currentlySelectedToolType === 'trafficlight') {
                if (initialIdentityState === 'empty' || initialIdentityState === 'road_lane_left' || initialIdentityState === 'road_lane_right') {
                    targetTileNode.innerHTML = `
                        <div class="placed-signal-block red-on" onclick="manuallyToggleSignalLight(event)">
                            <div class="signal-bulb bulb-r"></div>
                            <div class="signal-bulb bulb-g"></div>
                        </div>`;
                    fieldMatrixConfiguration[r][c] = 'paved_signal';
                    wasPlacementSuccessful = true;
                }
            } 
            else if (currentlySelectedToolType === 'footpath') {
                if (initialIdentityState === 'empty') {
                    targetTileNode.innerHTML = `<div class="placed-footpath-block">🧱</div>`;
                    fieldMatrixConfiguration[r][c] = 'paved_footpath';
                    wasPlacementSuccessful = true;
                } else {
                    triggerTactileFlashFeedback(targetTileNode, "placement-invalid-glow");
                    displayKidsSpeechBubble("Place Footpaths on the dotted green grass boxes! 🧱");
                }
            }

            if (wasPlacementSuccessful) {
                triggerAudioOutputEffect('audio-right');
                triggerTactileFlashFeedback(targetTileNode, "placement-valid-glow");
                
                placementHistoryStack.push({ r: r, c: c, originalState: initialIdentityState, toolType: currentlySelectedToolType });
                runningInventoryPoolMap[currentlySelectedToolType]--;
                currentlySelectedToolType = null;
                renderInventoryTrayUI();
            }
        }

        function triggerTactileFlashFeedback(targetNode, className) {
            targetNode.classList.add(className);
            setTimeout(() => targetNode.classList.remove(className), 400);
        }

        function executeUndoLastPlacementStep() {
            if (routeSimulationLockFlag || placementHistoryStack.length === 0) return;
            const lastStep = placementHistoryStack.pop();
            
            const fieldCanvasGrid = document.getElementById('kids-map-mesh');
            const tileNode = fieldCanvasGrid.querySelector(`.kids-tile[data-row="${lastStep.r}"][data-col="${lastStep.c}"]`);
            
            fieldMatrixConfiguration[lastStep.r][lastStep.c] = lastStep.originalState;
            
            if (lastStep.originalState === 'empty') {
                tileNode.className = "kids-tile tile-empty";
                tileNode.innerHTML = "";
            } else if (lastStep.originalState === 'road_lane_left' || lastStep.originalState === 'road_lane_right') {
                tileNode.className = "kids-tile tile-road-lane";
                tileNode.innerHTML = "";
            }

            runningInventoryPoolMap[lastStep.toolType]++;
            currentlySelectedToolType = null;
            renderInventoryTrayUI();
        }

        function resetCurrentLevelMatrixState() {
            if (routeSimulationLockFlag) return;
            buildMapLevelRun(activeLevelIdx);
        }

        function placeSamCharacterPawnCoordinates(r, c) {
            const fieldCanvasGrid = document.getElementById('kids-map-mesh');
            const targetTileCell = fieldCanvasGrid.querySelector(`.kids-tile[data-row="${r}"][data-col="${c}"]`);
            if (!targetTileCell) return;

            const samTokenBox = document.getElementById('sam-player-token');
            samTokenBox.style.left = targetTileCell.offsetLeft + "px";
            samTokenBox.style.top = targetTileCell.offsetTop + "px";
            samTokenBox.style.width = targetTileCell.offsetWidth + "px";
            samTokenBox.style.height = targetTileCell.offsetHeight + "px";
        }

        function deployDynamicLaneTrafficEngine() {
            spawnIndependentLaneVehicle(2, "🚗", 3.5, "left");
            spawnIndependentLaneVehicle(2, "🚌", 2.5, "right");
        }

        function spawnIndependentLaneVehicle(targetRow, spriteSymbol, movementVelocity, directionPathStr) {
            const meshCanvas = document.getElementById('kids-map-mesh');
            const vehicleNode = document.createElement('div');
            vehicleNode.className = "lane-vehicle-token";
            vehicleNode.innerText = spriteSymbol;
            meshCanvas.appendChild(vehicleNode);

            const rowAnchorTile = meshCanvas.querySelector(`.kids-tile[data-row="${targetRow}"][data-col="0"]`);
            setTimeout(() => {
                let offsetHeightModifier = (directionPathStr === "left") ? 2 : (rowAnchorTile.offsetHeight / 2 - 2);
                vehicleNode.style.top = (rowAnchorTile.offsetTop + offsetHeightModifier) + "px";
            }, 60);

            let calculatedCoordinateX = (directionPathStr === "right") ? -50 : (meshCanvas.clientWidth + 50);
            vehicleNode.style.left = calculatedCoordinateX + "px";

            const operationalClockTimer = setInterval(() => {
                if (activeLevelIdx === 3 && lightSignalState === "red" && calculatedCoordinateX >= (meshCanvas.clientWidth * 0.30) && calculatedCoordinateX <= (meshCanvas.clientWidth * 0.60)) {
                    return;
                }

                if (directionPathStr === "right") {
                    calculatedCoordinateX += movementVelocity;
                    if (calculatedCoordinateX > meshCanvas.clientWidth + 50) calculatedCoordinateX = -50;
                } else {
                    calculatedCoordinateX -= movementVelocity;
                    if (calculatedCoordinateX < -50) calculatedCoordinateX = meshCanvas.clientWidth + 50;
                }
                vehicleNode.style.left = calculatedCoordinateX + "px";
            }, 35);

            activeLanesVehiclesCollection.push({ element: vehicleNode, clock: operationalClockTimer });
        }

        function launchTrafficLightSignalAutomation() {
            lightSignalState = "red";
            autoSignalTimerClock = setInterval(() => {
                const targetSignalBox = document.querySelector('.placed-signal-block');
                if (!targetSignalBox) return;

                if (lightSignalState === "red") {
                    lightSignalState = "green";
                    targetSignalBox.className = "placed-signal-block green-on";
                } else {
                    lightSignalState = "red";
                    targetSignalBox.className = "placed-signal-block red-on";
                }
            }, 4000);
        }

        function manuallyToggleSignalLight(e) {
            e.stopPropagation();
            if (routeSimulationLockFlag) return;
            const element = e.currentTarget;
            if (lightSignalState === "red") {
                lightSignalState = "green";
                element.className = "placed-signal-block green-on";
            } else {
                lightSignalState = "red";
                element.className = "placed-signal-block red-on";
            }
        }

        function clearVehiclesSimulationThreads() {
            activeLanesVehiclesCollection.forEach(obj => { obj.element.remove(); clearInterval(obj.clock); });
            activeLanesVehiclesCollection = [];
            if (autoSignalTimerClock) { clearInterval(autoSignalTimerClock); autoSignalTimerClock = null; }
        }

        function displayKidsSpeechBubble(msg) {
            const bubbleNode = document.getElementById('speech-bubble-prompt');
            bubbleNode.innerText = msg;
            bubbleNode.style.display = "block";
            setTimeout(() => { bubbleNode.style.display = "none"; }, 4500);
        }

        function triggerMidwayQuizInterceptAsync(quizPayload) {
            return new Promise((resolve) => {
                const modal = document.getElementById('live-quiz-modal');
                const hintNode = document.getElementById('quiz-modal-hint');
                const cardFrame = document.getElementById('quiz-card-frame');
                
                document.getElementById('quiz-modal-q-text').innerText = quizPayload.q;
                hintNode.style.display = "none";
                hintNode.innerText = quizPayload.hint || "";
                
                const optContainer = document.getElementById('quiz-modal-options-box');
                optContainer.innerHTML = "";
                
                modal.style.display = "flex";

                quizPayload.options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = "quiz-popup-btn";
                    btn.innerText = opt.text;
                    
                    btn.onclick = () => {
                        if (opt.correct) {
                            btn.style.background = "#22c55e";
                            btn.style.color = "#ffffff";
                            triggerAudioOutputEffect('audio-right');
                            setTimeout(() => {
                                modal.style.display = "none";
                                resolve(); 
                            }, 1200);
                        } else {
                            btn.style.background = "#ef4444";
                            btn.style.color = "#ffffff";
                            triggerAudioOutputEffect('audio-wrong');
                            
                            // Visual Shake Notification
                            cardFrame.style.animation = "none";
                            setTimeout(() => { cardFrame.style.animation = "shake 0.3s ease-in-out"; }, 10);
                            
                            // Display Helpful Contextual Hint
                            if (quizPayload.hint) {
                                hintNode.style.display = "block";
                            }
                            
                            runningLevelStarsCount = Math.max(1, runningLevelStarsCount - 1);
                            updateStarsDisplayUI();
                        }
                    };
                    optContainer.appendChild(btn);
                });
            });
        }

        /* DYNAMIC PATHTRACKING RUNTIME MATRIX SEARCH SYSTEM */
        async function beginRouteVerificationWalk() {
            if (routeSimulationLockFlag) return;
            routeSimulationLockFlag = true;

            const blueprintMeta = mapsDatabase["level" + activeLevelIdx];
            let currentR = blueprintMeta.start.r;
            let currentC = blueprintMeta.start.c;
            const finalDestinationRow = blueprintMeta.end.r;
            const finalDestinationCol = blueprintMeta.end.c;

            let pathTraversedRegistry = {};

            while (currentR !== finalDestinationRow || currentC !== finalDestinationCol) {
                pathTraversedRegistry[`${currentR},${currentC}`] = true;

                // Priority Sequence: Right, Down, Left, Up
                let spatialDirections = [
                    { r: currentR, c: currentC + 1 }, 
                    { r: currentR + 1, c: currentC }, 
                    { r: currentR, c: currentC - 1 }, 
                    { r: currentR - 1, c: currentC }  
                ];

                let targetNextStep = null;

                for (let step of spatialDirections) {
                    if (step.r >= 0 && step.r < 4 && step.c >= 0 && step.c < 4) {
                        if (pathTraversedRegistry[`${step.r},${step.c}`]) continue;

                        const tileState = fieldMatrixConfiguration[step.r][step.c];

                        // Sam will strictly move across placed blocks or target landmarks
                        if (tileState === 'paved_footpath' || tileState === 'paved_zebra' || 
                            tileState === 'paved_signal' || tileState === 'home') {
                            targetNextStep = step;
                            break;
                        }
                    }
                }

                if (!targetNextStep) {
                    triggerAudioOutputEffect('audio-wrong');
                    displayKidsSpeechBubble("Oops! The safety path breaks here. Add more tiles to finish the path! 🧱");
                    penalizeAttemptLogs();
                    return;
                }

                currentR = targetNextStep.r;
                currentC = targetNextStep.c;
                placeSamCharacterPawnCoordinates(currentR, currentC);
                await executeAsyncSleepTimer(500);

                // Open contextual safety quiz if row/col matches a challenge spot
                const positionCoordKey = `${currentR},${currentC}`;
                if (blueprintMeta.milestoneQuizzes && blueprintMeta.milestoneQuizzes[positionCoordKey]) {
                    await triggerMidwayQuizInterceptAsync(blueprintMeta.milestoneQuizzes[positionCoordKey]);
                }

                // Traffic enforcement checks
                if (activeLevelIdx === 3 && fieldMatrixConfiguration[currentR][currentC] === 'paved_zebra' && lightSignalState === 'red') {
                    triggerAudioOutputEffect('audio-wrong');
                    displayKidsSpeechBubble("Wait, Sam! The traffic light is RED! Wait for it to turn GREEN! 🚦");
                    penalizeAttemptLogs();
                    return;
                }
            }

            cumulativeStarsEarned += runningLevelStarsCount;
            triggerAudioOutputEffect('audio-claps');
            startConfettiParticleEngine();

            setTimeout(() => {
                advanceToNextLevel();
            }, 2000);
        }

        function penalizeAttemptLogs() {
            runningLevelStarsCount = Math.max(1, runningLevelStarsCount - 1);
            updateStarsDisplayUI();
            setTimeout(() => { buildMapLevelRun(activeLevelIdx); }, 4000);
        }

        function advanceToNextLevel() {
            if (activeLevelIdx < 3) {
                initializePreLevelBriefing(activeLevelIdx + 1);
            } else {
                let ratingStars = "";
                let calculatedAverage = Math.round(cumulativeStarsEarned / 3);
                for(let i=0; i<3; i++) ratingStars += (i < calculatedAverage) ? "⭐" : "⚫";
                
                document.getElementById('victory-stars-lbl').innerText = ratingStars;
                switchScreenLayout('screen-victory');
            }
        }

        function resetWholeAppEngine() {
            cumulativeStarsEarned = 0;
            switchScreenLayout('screen-welcome');
        }

        function executeAsyncSleepTimer(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        function triggerAudioOutputEffect(id) {
            const track = document.getElementById(id);
            if (track) { track.currentTime = 0; track.play().catch(() => {}); }
        }

        function startConfettiParticleEngine() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            
            canvas.width = 500;
            canvas.height = 850;
            
            confettiParticlesCollection = [];
            const colorPalettes = ['#facc15', '#f43f5e', '#3b82f6', '#10b981', '#a855f7', '#fb923c'];

            for (let i = 0; i < 90; i++) {
                confettiParticlesCollection.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    r: Math.random() * 6 + 4,
                    d: Math.random() * canvas.height,
                    color: colorPalettes[Math.floor(Math.random() * colorPalettes.length)],
                    tilt: Math.random() * 10 - 5,
                    tiltAngleIncremental: Math.random() * 0.07 + 0.02,
                    tiltAngle: 0
                });
            }

            clearInterval(confettiIntervalClock);
            confettiIntervalClock = setInterval(() => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                confettiParticlesCollection.forEach((p, idx) => {
                    p.tiltAngle += p.tiltAngleIncremental;
                    p.y += (p.r + 1) / 2;
                    p.x += Math.sin(p.tiltAngle);
                    p.tilt = Math.sin(p.tiltAngle - idx/3) * 10;

                    ctx.beginPath();
                    ctx.lineWidth = p.r;
                    ctx.strokeStyle = p.color;
                    ctx.moveTo(p.x + p.tilt + p.r / 2, p.y);
                    ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r / 2);
                    ctx.stroke();

                    if (p.y > canvas.height) {
                        p.x = Math.random() * canvas.width;
                        p.y = -20;
                    }
                });
            }, 25);
        }

        function stopConfettiParticleEngine() {
            clearInterval(confettiIntervalClock);
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
    </script>
