<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Safe Route Planner - Arcade Edition</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --arcade-blue: #2563eb;
            --arcade-neon: #38bdf8;
            --neon-green: #4ade80;
            --neon-red: #f87171;
            --neon-gold: #fbbf24;
            --road-dark: #334155;
            --sidewalk-concrete: #94a3b8;
            --grid-bg: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Arial Rounded MT Bold', 'Comic Sans MS', sans-serif;
            background-color: var(--bg-dark);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Scalable Arcade Cabinet Frame */
        .game-frame {
            width: 100vw;
            height: 100vh;
            max-width: 480px;
            max-height: 854px;
            background: linear-gradient(180deg, #1e1b4b 0%, #0f0728 100%);
            border: 4px solid #3b82f6;
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.6);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
            overflow: hidden;
        }

        .screen-view {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        .active-view {
            display: flex !important;
        }

        /* Perfectly Centered Splash Screen */
        #screen-splash {
            background: #090514;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .splash-centered-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 80%;
            gap: 30px;
        }
        .splash-logo {
            width: 100%;
            max-width: 260px;
            object-fit: contain;
            filter: drop-shadow(0 0 12px rgba(58, 189, 248, 0.4));
            animation: arcadePulse 1.5s infinite ease-in-out;
        }
        .loading-container {
            width: 80%;
            max-width: 200px;
            height: 12px;
            background: #2e1065;
            border: 2px solid var(--arcade-neon);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 10px var(--arcade-neon);
        }
        .loading-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, var(--arcade-neon), var(--neon-green));
            transform: translateX(-100%);
            animation: loadProgress 4s forwards linear;
        }

        /* Title Screen */
        #screen-welcome {
            justify-content: center;
            gap: 40px;
            text-align: center;
        }
        .arcade-title {
            font-size: clamp(36px, 8vh, 48px);
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 10px var(--arcade-neon), 0 0 20px var(--arcade-blue);
            line-height: 1.1;
        }
        .menu-mascot {
            width: 150px;
            height: 150px;
            object-fit: contain;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5));
            animation: bounceMascot 2s infinite ease-in-out;
        }

        /* Premium Candy Push Buttons */
        .btn-arcade {
            background: linear-gradient(180deg, #4ade80 0%, #16a34a 100%);
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: clamp(20px, 5vw, 24px);
            font-weight: 900;
            border-radius: 32px;
            cursor: pointer;
            box-shadow: 0 8px 0 #15803d, 0 12px 20px rgba(0,0,0,0.3);
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
            transition: transform 0.05s;
        }
        .btn-arcade:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #15803d, 0 4px 10px rgba(0,0,0,0.3);
        }

        /* Gameplay Interface Heads Up Display */
        .hud-panel {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            border: 2px solid var(--arcade-blue);
            padding: 12px 16px;
            border-radius: 16px;
            font-weight: 900;
            font-size: clamp(16px, 4.5vw, 20px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .hud-text-neon {
            color: #ffffff;
            text-shadow: 0 0 8px var(--arcade-neon);
        }

        /* Map Matrix Canvas Grid Frame */
        .grid-container-box {
            width: 100%;
            aspect-ratio: 1 / 1;
            margin: auto 0;
        }
        .arcade-grid-mesh {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 6px;
            background: #020617;
            border: 4px solid var(--arcade-blue);
            border-radius: 20px;
            padding: 6px;
            position: relative;
            box-shadow: 0 0 20px rgba(37, 99, 235, 0.3), inset 0 4px 12px rgba(0,0,0,0.9);
        }

        /* Advanced Custom Grid Cells Layout */
        .mesh-tile {
            position: relative;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 2px dashed transparent;
            transition: background 0.2s, border-color 0.2s;
        }
        .tile-state-empty {
            background: var(--grid-bg);
            border-color: #334155;
        }
        .tile-state-empty.highlight-active {
            border-color: var(--neon-gold);
            box-shadow: inset 0 0 10px var(--neon-gold);
        }
        .tile-state-obstacle {
            background: linear-gradient(135deg, #064e3b 0%, #022c22 100%);
            font-size: 28px;
            border: 1px solid #047857;
        }
        .tile-state-road {
            background: linear-gradient(180deg, #1e293b 0%, var(--road-dark) 100%);
            border-top: 2px dashed #64748b;
            border-bottom: 2px dashed #64748b;
        }
        .tile-state-fixed {
            background: #1d4ed8;
            border: 2px solid var(--arcade-neon);
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
        }
        .tile-state-fixed img {
            width: 80%;
            height: 80%;
            object-fit: contain;
        }
        .anchor-lbl {
            font-size: 10px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }

        /* Asset Placements Layout Mechanics */
        .block-footpath { background: var(--sidewalk-concrete); width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 28px; border: 2px solid #cbd5e1; animation: pulsePop 0.2s; }
        .block-zebra { background: linear-gradient(90deg, #334155 15%, #fff 15%, #fff 35%, #334155 35%, #334155 65%, #fff 65%, #fff 85%, #334155 85%); width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 28px; border: 1px solid #ffffff; animation: pulsePop 0.2s; }
        
        .block-signal-tower { background: #1e293b; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; border: 2px solid #475569; }
        .tower-bulb { width: 12px; height: 12px; border-radius: 50%; background: #475569; border: 1px solid #000; }
        .block-signal-tower.glow-red .bulb-r { background: var(--neon-red); box-shadow: 0 0 10px var(--neon-red); }
        .block-signal-tower.glow-green .bulb-g { background: var(--neon-green); box-shadow: 0 0 10px var(--neon-green); }

        /* Moving Elements Simulation Nodes */
        .ambient-car-node {
            position: absolute;
            font-size: 32px;
            z-index: 10;
            pointer-events: none;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
        }

        #arcade-player-pawn {
            position: absolute;
            width: 25%;
            height: 25%;
            z-index: 40;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: left 0.35s cubic-bezier(0.25, 1, 0.5, 1), top 0.35s cubic-bezier(0.25, 1, 0.5, 1);
            pointer-events: none;
        }
        #arcade-player-pawn img {
            width: 85%;
            height: 85%;
            object-fit: contain;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.6));
        }

        /* Inventory Toolbelt Dock */
        .arcade-tray-dock {
            width: 100%;
            background: #1e1b4b;
            border: 3px solid var(--arcade-blue);
            border-radius: 20px;
            padding: 12px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-top: 10px;
            gap: 10px;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.8);
        }
        .tray-slot-tool {
            width: clamp(60px, 15vw, 72px);
            height: clamp(60px, 15vw, 72px);
            border-radius: 16px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            position: relative;
        }
        .badge-counter {
            position: absolute;
            top: -6px;
            right: -6px;
            background: #ef4444;
            color: white;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            border: 2px solid white;
            font-weight: 900;
        }
        .tool-style-footpath { background: var(--sidewalk-concrete); border: 3px solid #cbd5e1; }
        .tool-style-zebra { background: linear-gradient(45deg, #1e293b 25%, #fff 25%, #fff 50%, #1e293b 50%, #1e293b 75%, #fff 75%); background-size: 14px 14px; border: 3px solid white; }
        .tool-style-signal { background: #334155; border: 3px solid var(--arcade-neon); }

        /* Dynamic Feedback Prompts Card */
        .hud-dialogue-card {
            position: absolute;
            bottom: 100px;
            left: 5%;
            width: 90%;
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            border: 3px solid #f87171;
            border-radius: 16px;
            padding: 14px;
            text-align: center;
            font-weight: 900;
            font-size: 15px;
            color: #ffffff;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            display: none;
            z-index: 100;
            animation: pulsePop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Blackboard Presentation Layout Panels */
        .blackboard-cabinet {
            background: #064e3b;
            border: 8px solid #78350f;
            border-radius: 16px;
            padding: 24px 16px;
            width: 100%;
            box-shadow: inset 0 4px 12px rgba(0,0,0,0.6), 0 8px 20px rgba(0,0,0,0.5);
        }
        .blackboard-headline {
            font-size: clamp(18px, 4.5vw, 22px);
            color: #f0fdf4;
            font-weight: bold;
            line-height: 1.6;
        }

        @keyframes loadProgress { from { transform: translateX(-100%); } to { transform: translateX(0%); } }
        @keyframes arcadePulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.04); opacity: 0.9; } }
        @keyframes bounceMascot { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        @keyframes pulsePop { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

    <audio id="audio-right" src="assets/correctanswer-1.mp3" preload="auto"></audio>
    <audio id="audio-wrong" src="assets/wrong.mp3" preload="auto"></audio>
    <audio id="audio-claps" src="assets/freesound_community-claps-44774.mp3" preload="auto"></audio>

    <div class="game-frame">

        <div id="screen-splash">
            <div class="splash-centered-box">
                <img src="assets/innovine-logo.png" alt="Innovine Logo" class="splash-logo">
                <div class="loading-container">
                    <div class="loading-fill"></div>
                </div>
            </div>
        </div>

        <div id="screen-welcome" class="screen-view active-view">
            <h1 class="arcade-title">SAFE ROUTE<br><span style="color: var(--neon-green);">PLANNER</span></h1>
            <img src="assets/student-mascot.png" class="menu-mascot" alt="Mascot Token">
            <button class="btn-arcade" onclick="triggerSpaceTransition('screen-game'); bootMapLevelBlueprint(1);">PLAY GAME ➔</button>
        </div>

        <div id="screen-game" class="screen-view">
            <div class="hud-panel">
                <span id="label-level-idx" class="hud-text-neon">STAGE: 1/3</span>
                <span id="label-score-counter" style="color: var(--neon-gold);">SCORE: 100</span>
            </div>

            <div class="grid-container-box">
                <div id="arcade-mesh-canvas" class="arcade-grid-mesh">
                    <div id="arcade-player-pawn">
                        <img src="assets/student-mascot.png" alt="Player Pawn">
                    </div>
                </div>
            </div>

            <div id="dialogue-prompt-card" class="hud-dialogue-card"></div>
            <div id="inventory-dock-tray" class="arcade-tray-dock"></div>
            
            <button id="btn-action-trigger" class="btn-arcade" style="width: 100%; background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%); box-shadow: 0 8px 0 #0369a1;" onclick="evaluateConstructedRoute()">GO HOME! 🏃‍♂️</button>
        </div>

        <div id="screen-summary" class="screen-view overlay-screen">
            <div class="blackboard-cabinet">
                <p id="summary-render-text" class="blackboard-headline"></p>
            </div>
            <button id="btn-summary-continue" class="btn-arcade" onclick="progressLevelRouting()">CONTINUE ➔</button>
        </div>

        <div id="screen-victory" class="screen-view overlay-screen">
            <div style="font-size: 70px; filter: drop-shadow(0 0 15px var(--neon-gold));">🏆</div>
            <h1 style="color: var(--neon-green); font-size: 36px; font-weight: 900; text-shadow: 0 0 10px rgba(74,222,128,0.4);">STAGE CLEAR!</h1>
            
            <div class="blackboard-cabinet" style="background: #1e3a8a; border-color: var(--arcade-blue);">
                <p style="font-size: 18px; color: #93c5fd; margin-bottom: 8px; font-weight: 900;">FINAL SCORE:</p>
                <p id="label-total-score-ledger" style="font-size: 46px; font-weight: 900; color: var(--neon-gold); text-shadow: 0 0 8px var(--neon-gold);"></p>
            </div>

            <button class="btn-arcade" style="background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%); box-shadow: 0 8px 0 #1e40af;" onclick="resetWholeGameWorkflow()">REPLAY 🔄</button>
        </div>

    </div>

    <script>
        // Automatic Boot Transition Dismissal
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('screen-splash').style.display = 'none';
            }, 4000);
        });

        function triggerSpaceTransition(screenId) {
            document.querySelectorAll('.screen-view').forEach(view => view.classList.remove('active-view'));
            const target = document.getElementById(screenId);
            if (target) target.classList.add('active-view');
        }

        // Configuration Architecture System Properties Engine
        let activeStage = 1;
        let cumulativeScorePoints = 0;
        let runningStagePoints = 100;
        let matrixLayoutData = [];
        let currentlySelectedTool = null;
        let activeInventoryAllocation = {};
        let simulationCarTimers = [];
        let lightSignalStatus = "red";
        let loopSignalTimer = null;
        let executionLockState = false;

        const mapsDatabase = {
            level1: {
                summary: "Safety on the Footpath! Always walk on the footpath to stay safe. We should never run while crossing the road or play on or near the road!",
                // Granted 6 footpath pieces to comfortably pave across empty grid coordinates
                inventory: { footpath: 6 },
                start: { r: 0, c: 0 },
                end: { r: 3, c: 3 },
                matrix: [
                    ['school', 'empty',    'empty',    'empty'],
                    ['empty',    'obstacle', 'obstacle', 'empty'],
                    ['empty',    'obstacle', 'obstacle', 'empty'],
                    ['empty',    'empty',    'empty',    'home']
                ]
            },
            level2: {
                summary: "Zebra Crossings! These lines are painted on the street to keep pedestrians safe. You must cross busy roads by following the zebra crossing!",
                inventory: { footpath: 4, zebra: 2 },
                start: { r: 0, c: 0 },
                end: { r: 3, c: 3 },
                matrix: [
                    ['school',   'empty',    'obstacle', 'obstacle'],
                    ['obstacle', 'empty',    'obstacle', 'obstacle'],
                    ['road',     'road',     'road',     'road'],
                    ['obstacle', 'obstacle', 'empty',    'home']
                ]
            },
            level3: {
                summary: "Traffic Lights Save Lives! When the light turns red, vehicles STOP. Yellow tells us to WAIT. When it turns green, pedestrians can GO safely!",
                inventory: { footpath: 2, zebra: 2, trafficlight: 1 },
                start: { r: 0, c: 0 },
                end: { r: 3, c: 3 },
                matrix: [
                    ['school',   'empty',    'obstacle', 'obstacle'],
                    ['obstacle', 'empty',    'obstacle', 'obstacle'],
                    ['road',     'road',     'road',     'road'],
                    ['obstacle', 'obstacle', 'empty',    'home']
                ]
            }
        };

        function bootMapLevelBlueprint(lvlNum) {
            activeStage = lvlNum;
            runningStagePoints = 100;
            currentlySelectedTool = null;
            executionLockState = false;
            clearActiveSimulationLoops();

            document.getElementById('label-level-idx').innerText = "STAGE: " + activeStage + "/3";
            document.getElementById('label-score-counter').innerText = "SCORE: " + runningStagePoints;
            document.getElementById('dialogue-prompt-card').style.display = "none";
            document.getElementById('btn-action-trigger').style.display = "block";

            const metaBlueprint = mapsDatabase["level" + activeStage];
            matrixLayoutData = JSON.parse(JSON.stringify(metaBlueprint.matrix));
            activeInventoryAllocation = JSON.parse(JSON.stringify(metaBlueprint.inventory));

            const canvas = document.getElementById('arcade-mesh-canvas');
            canvas.querySelectorAll('.mesh-tile').forEach(tile => tile.remove());

            // Build Matrix Coordinates Grid Mesh
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    const blockType = matrixLayoutData[r][c];
                    const node = document.createElement('div');
                    node.className = `mesh-tile tile-state-${blockType}`;
                    node.dataset.row = r;
                    node.dataset.col = c;
                    node.style.gridRowStart = r + 1;
                    node.style.gridColStart = c + 1;

                    if (blockType === 'school') {
                        node.className += " tile-state-fixed";
                        node.innerHTML = `🏫<span class="anchor-lbl">SCHOOL</span>`;
                    } else if (blockType === 'home') {
                        node.className += " tile-state-fixed";
                        node.innerHTML = `<img src="assets/happy-home.png" alt="Home">`;
                    } else if (blockType === 'obstacle') {
                        node.innerText = "🚧";
                    } else if (blockType === 'empty') {
                        node.className += " tile-state-empty";
                        node.addEventListener('click', () => triggerDirectTapPlacement(node));
                    }

                    canvas.appendChild(node);
                }
            }

            // Reposition player pawn to stage configurations
            setTimeout(() => { locatePawnOnCoordinates(metaBlueprint.start.r, metaBlueprint.start.c); }, 60);
            updateInventoryDockUI();

            // Fire Stage Ambient Car Operations Loops
            if (activeStage === 2) {
                generateAmbientTrafficVehicle(2);
            } else if (activeStage === 3) {
                generateAmbientTrafficVehicle(2);
                launchTrafficLightSignalController();
            }
        }

        function updateInventoryDockUI() {
            const tray = document.getElementById('inventory-dock-tray');
            tray.innerHTML = "";

            Object.keys(activeInventoryAllocation).forEach(key => {
                const count = activeInventoryAllocation[key];
                if (count <= 0) return;

                const block = document.createElement('div');
                block.className = `tray-slot-tool tool-style-${key}`;
                if (currentlySelectedTool === key) block.style.outline = "4px solid var(--neon-gold)";

                let graphic = "🚶"; let subtitle = "Footpath";
                if (key === 'zebra') { graphic = "🏁"; subtitle = "Crossing"; }
                if (key === 'trafficlight') { graphic = "🚦"; subtitle = "Signal"; }

                block.innerHTML = `
                    <span style="font-size: 26px; line-height: 1;">${graphic}</span>
                    <span style="font-size: 10px; font-weight: 900; margin-top: 2px;">${subtitle}</span>
                    <div class="badge-counter">${count}</div>
                `;

                block.addEventListener('click', () => {
                    currentlySelectedTool = key;
                    document.querySelectorAll('.tray-slot-tool').forEach(b => b.style.outline = "none");
                    block.style.outline = "4px solid var(--neon-gold)";
                    
                    // Highlight compatible drop positions targets across the field
                    document.querySelectorAll('.tile-state-empty').forEach(tile => {
                        tile.classList.add('highlight-active');
                    });
                });

                tray.appendChild(block);
            });
        }

        function triggerDirectTapPlacement(tileNode) {
            if (executionLockState || !currentlySelectedTool) return;

            const r = parseInt(tileNode.dataset.row);
            const c = parseInt(tileNode.dataset.col);

            if (matrixLayoutData[r][c] !== 'empty') return;

            triggerAudioOutput('audio-right');

            if (currentlySelectedTool === 'footpath') {
                tileNode.innerHTML = `<div class="block-footpath">🚶</div>`;
                matrixLayoutData[r][c] = 'user_footpath';
            } else if (currentlySelectedTool === 'zebra') {
                tileNode.innerHTML = `<div class="block-zebra">🏁</div>`;
                matrixLayoutData[r][c] = 'user_zebra';
            } else if (currentlySelectedTool === 'trafficlight') {
                tileNode.innerHTML = `
                    <div class="block-signal-tower glow-red" onclick="manuallyToggleSignalState(event)">
                        <div class="tower-bulb bulb-r"></div>
                        <div class="tower-bulb bulb-g"></div>
                    </div>`;
                matrixLayoutData[r][c] = 'user_signal';
            }

            activeInventoryAllocation[currentlySelectedTool]--;
            currentlySelectedTool = null;
            
            document.querySelectorAll('.tile-state-empty').forEach(tile => {
                tile.classList.remove('highlight-active');
            });
            
            updateInventoryDockUI();
        }

        function locatePawnOnCoordinates(row, col) {
            const mesh = document.getElementById('arcade-mesh-canvas');
            const tile = mesh.querySelector(`.mesh-tile[data-row="${row}"][data-col="${col}"]`);
            if (!tile) return;

            const pawn = document.getElementById('arcade-player-pawn');
            pawn.style.left = tile.offsetLeft + "px";
            pawn.style.top = tile.offsetTop + "px";
            pawn.style.width = tile.offsetWidth + "px";
            pawn.style.height = tile.offsetHeight + "px";
        }

        function generateAmbientTrafficVehicle(rowNum) {
            const canvas = document.getElementById('arcade-mesh-canvas');
            const vehicle = document.createElement('div');
            vehicle.className = "ambient-car-node";
            vehicle.innerText = "🚗";
            canvas.appendChild(vehicle);

            const anchorTile = canvas.querySelector(`.mesh-tile[data-row="${rowNum}"][data-col="0"]`);
            setTimeout(() => {
                vehicle.style.top = (anchorTile.offsetTop + (anchorTile.offsetHeight / 2) - 20) + "px";
            }, 50);

            let posX = -50;
            vehicle.style.left = posX + "px";

            const threadClock = setInterval(() => {
                // Halt vehicles if Level 3 Traffic Signal matches red criteria
                if (activeStage === 3 && lightSignalStatus === "red" && posX >= (canvas.clientWidth * 0.38) && posX <= (canvas.clientWidth * 0.52)) {
                    return;
                }

                posX += 5;
                if (posX > canvas.clientWidth + 50) posX = -50;
                vehicle.style.left = posX + "px";
            }, 30);

            simulationCarTimers.push({ node: vehicle, clock: threadClock });
        }

        function launchTrafficLightSignalController() {
            lightSignalStatus = "red";
            loopSignalTimer = setInterval(() => {
                const element = document.querySelector('.block-signal-tower');
                if (!element) return;

                if (lightSignalStatus === "red") {
                    lightSignalStatus = "green";
                    element.className = "block-signal-tower glow-green";
                } else {
                    lightSignalStatus = "red";
                    element.className = "block-signal-tower glow-red";
                }
            }, 4000);
        }

        function manuallyToggleSignalState(event) {
            event.stopPropagation();
            if (executionLockState) return;
            const element = event.currentTarget;
            if (lightSignalStatus === "red") {
                lightSignalStatus = "green";
                element.className = "block-signal-tower glow-green";
            } else {
                lightSignalStatus = "red";
                element.className = "block-signal-tower glow-red";
            }
        }

        function clearActiveSimulationLoops() {
            simulationCarTimers.forEach(item => { item.node.remove(); clearInterval(item.clock); });
            simulationCarTimers = [];
            if (loopSignalTimer) { clearInterval(loopSignalTimer); loopSignalTimer = null; }
        }

        function triggerUINotificationCard(text, borderHex) {
            const card = document.getElementById('dialogue-prompt-card');
            card.innerText = text;
            card.style.borderColor = borderHex;
            card.style.display = "block";
            setTimeout(() => { card.style.display = "none"; }, 4000);
        }

        /* Dynamic Mesh Solver Navigation Engine
           Evaluates step-by-step path adjustments using active matrix tile placements
        */
        async function evaluateConstructedRoute() {
            if (executionLockState) return;
            executionLockState = true;
            document.getElementById('btn-action-trigger').style.display = "none";

            const meta = mapsDatabase["level" + activeStage];
            let currentR = meta.start.r;
            let currentC = meta.start.c;
            const destinationR = meta.end.r;
            const destinationC = meta.end.c;

            let pathMemoryMap = {}; 

            while (currentR !== destinationR || currentC !== destinationC) {
                pathMemoryMap[`${currentR},${currentC}`] = true;
                
                // Prioritize moving rightward and downward toward Home
                let nextStepOptions = [
                    { r: currentR, c: currentC + 1 }, // Right
                    { r: currentR + 1, c: currentC }, // Down
                    { r: currentR, c: currentC - 1 }, // Left
                    { r: currentR - 1, c: currentC }  // Up
                ];

                let chosenTarget = null;

                for (let option of nextStepOptions) {
                    if (option.r >= 0 && option.r < 4 && option.c >= 0 && option.c < 4) {
                        if (pathMemoryMap[`${option.r},${option.c}`]) continue; // Skip backtracking loops
                        
                        const tileIdentity = matrixLayoutData[option.r][option.c];
                        
                        // Validate safe blocks
                        if (tileIdentity === 'user_footpath' || tileIdentity === 'user_zebra' || tileIdentity === 'road' || tileIdentity === 'home') {
                            chosenTarget = option;
                            break;
                        }
                    }
                }

                if (!chosenTarget) {
                    triggerAudioOutput('audio-wrong');
                    triggerUINotificationCard("Oh no! The path breaks here. Pave a connected Footpath safely to Home! 🚧", "var(--neon-red)");
                    penalizePlayerAttempt();
                    return;
                }

                // March forward to the selected adjacent coordinate cell block
                currentR = chosenTarget.r;
                currentC = chosenTarget.c;
                locatePawnOnCoordinates(currentR, currentC);
                await executeAsyncSleepTimer(450);

                const activeTileState = matrixLayoutData[currentR][currentC];

                // Perform environmental safety verification checks
                if (activeTileState === 'road') {
                    triggerAudioOutput('audio-wrong');
                    triggerUINotificationCard("DANGER! Walking straight onto an open highway is unsafe! Cross at the Zebra Crossing! 🛑", "var(--neon-red)");
                    penalizePlayerAttempt();
                    return;
                }

                if (activeStage === 3 && activeTileState === 'user_zebra' && lightSignalStatus === 'red') {
                    triggerAudioOutput('audio-wrong');
                    triggerUINotificationCard("STOP! The traffic light signal is RED! Wait for it to turn GREEN! 🚦", "var(--neon-gold)");
                    penalizePlayerAttempt();
                    return;
                }
            }

            // Walk target reached successfully
            cumulativeScorePoints += runningStagePoints;
            setTimeout(() => {
                triggerAudioOutput('audio-claps');
                document.getElementById('summary-render-text').innerText = meta.summary;
                document.getElementById('btn-summary-continue').innerText = (activeStage === 3) ? "FINISH 🏅" : "NEXT STAGE ➔";
                triggerSpaceTransition('screen-summary');
            }, 300);
        }

        function penalizePlayerAttempt() {
            runningStagePoints = Math.max(20, runningStagePoints - 20);
            document.getElementById('label-score-counter').innerText = "SCORE: " + runningStagePoints;
            setTimeout(() => {
                bootMapLevelBlueprint(activeStage);
            }, 3800);
        }

        function executeAsyncSleepTimer(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        function triggerAudioOutput(id) {
            const clip = document.getElementById(id);
            if (clip) { clip.currentTime = 0; clip.play().catch(() => {}); }
        }

        function progressLevelRouting() {
            if (activeStage < 3) {
                triggerSpaceTransition('screen-game');
                bootMapLevelBlueprint(activeStage + 1);
            } else {
                document.getElementById('label-total-score-ledger').innerText = cumulativeScorePoints + " / 300";
                triggerSpaceTransition('screen-victory');
            }
        }

        function resetWholeGameWorkflow() {
            cumulativeScorePoints = 0;
            triggerSpaceTransition('screen-welcome');
        }
    </script>
</body>
</html>
