<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Safe Route Planner V2</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0c4a6e}
.screen{display:none}.active{display:flex}
#start{min-height:100vh;background:url('assets/startscreenimage.png') center/cover no-repeat;flex-direction:column;justify-content:space-between;align-items:center;padding:60px 20px}
.title{font-size:54px;font-weight:900;color:#1e40af;text-align:center;text-shadow:3px 3px #fff}
.play{padding:18px 40px;border:none;border-radius:40px;background:#f97316;color:#fff;font-size:30px;font-weight:900}
.card{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px}
.level{font-size:34px;font-weight:900}
.objective{font-size:24px;margin:20px}
.award{font-size:22px;line-height:2}
</style>
</head>
<body>
<div id="start" class="screen active">
<div class="title">SAFE ROUTE<br>PLANNER</div>
<button class="play" onclick="showIntro(1)">LET'S PLAY</button>
</div>

<div id="intro" class="screen card">
<div id="introData"></div>
<button class="play" onclick="startLevel()">START</button>
</div>

<div id="award" class="screen card">
<h1>🏅 SAFE WALKER AWARD</h1>
<div class="award">
✓ Uses Footpaths<br>
✓ Uses Zebra Crossings<br>
✓ Follows Traffic Lights
</div>
<button class="play" onclick="location.reload()">PLAY AGAIN</button>
</div>

<script>
let level=1;
const levels={
1:"🏫 → 🧱 → 🏠<br>Build a Footpath",
2:"🏁 Use the Zebra Crossing",
3:"🚦 Wait for the Green Light"
};
function hideAll(){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));}
function showIntro(l){
level=l;hideAll();
document.getElementById('intro').classList.add('active');
document.getElementById('introData').innerHTML=`<div class='level'>LEVEL ${l}</div><div class='objective'>${levels[l]}</div>`;
}
function startLevel(){alert('Integrate existing gameplay screen here.');if(level<3)showIntro(level+1);else finish();}
function finish(){hideAll();document.getElementById('award').classList.add('active');}
</script>
</body>
</html>
