<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Safe Route Planner</title>
    <style>
        :root {
            --bg-sky: #bae6fd;
            --grass-green: #4ade80;
            --road-asphalt: #475569;
            --sidewalk-gray: #cbd5e1;
            --text-dark: #1e3a8a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Comic Sans MS', 'Arial Rounded MT Bold', sans-serif;
            background-color: #0c4a6e;
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Tiny, Compact Kid-Friendly App Viewport Shell */
        .game-cabinet {
            width: 100vw;
            height: 100vh;
            max-width: 440px;
            max-height: 780px;
            background: linear-gradient(180deg, var(--bg-sky) 0%, #e0f2fe 100%);
            border: 6px solid #38bdf8;
            border-radius: 24px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }

        .screen-view {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        .active-view {
            display: flex !important;
        }

        /* Cute & Compact Welcome Menu Screen View Layout */
        #screen-welcome {
            background: linear-gradient(180deg, #bae6fd 0%, #a7f3d0 100%);
            justify-content: center;
            gap: 30px;
            text-align: center;
            padding: 20px;
        }
        .kids-mini-title {
            font-size: 32px;
            font-weight: 900;
            color: #1e3a8a;
            text-shadow: 2px 2px 0px #ffffff;
            line-height: 1.2;
        }
        .welcome-subtitle {
            font-size: 16px;
            font-weight: bold;
            color: #0369a1;
            background: rgba(255, 255, 255, 0.7);
            padding: 8px 16px;
            border-radius: 12px;
        }

        /* Chunky Soft Candy Buttons */
        .btn-kids {
            background: linear-gradient(180deg, #fb923c 0%, #ea580c 100%);
            color: white;
            border: none;
            padding: 14px 40px;
            font-size: 22px;
            font-weight: 900;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 6px 0 #c2410c, 0 8px 15px rgba(0,0,0,0.1);
            text-shadow: 0 2px 4px rgba(0,0,0,0.15);
            transition: transform 0.05s;
        }
        .btn-kids:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #c2410c;
        }

        /* Top HUD Dashboard Information Header Row */
        .kids-hud {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            border: 3px solid #38bdf8;
            padding: 8px 14px;
            border-radius: 16px;
            font-weight: 900;
            font-size: 16px;
        }

        /* Instructions Banner Bar Elements */
        .task-instruction-banner {
            width: 100%;
            background: #fef08a;
            border: 2px dashed #eab308;
            border-radius: 12px;
            padding: 8px;
            text-align: center;
            font-size: 15px;
            font-weight: 900;
            color: #713f12;
            margin: 4px 0;
        }

        /* Playing Workspace Map Matrix Mesh Container Layout Wrapper Box */
        .grid-box-wrapper {
            width: 100%;
            aspect-ratio: 1 / 1;
            margin: auto 0;
        }
        .kids-map-grid {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 6px;
            background: var(--grass-green);
            border: 5px solid #fcd34d;
            border-radius: 20px;
            padding: 6px;
            position: relative;
        }

        /* Grid Coordinate Tiles Layout Block Box Containers Elements */
        .kids-tile {
            position: relative;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .tile-empty {
            background: #86efac;
            border: 2px dashed #22c55e;
            cursor: pointer;
        }
        .tile-empty.highlight-hint {
            animation: hintGlow 1s infinite ease-in-out;
        }
        .tile-obstacle {
            background: #4ade80;
            font-size: 30px;
        }
        .tile-road-lane {
            background: var(--road-asphalt);
            border-top: 2px dashed #94a3b8;
            border-bottom: 2px dashed #94a3b8;
        }
        
        /* Fixed Target Posts Anchors Elements Sizing Configurations */
        .tile-anchor-building {
            background: #93c5fd;
            border: 3px solid #2563eb;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
        }
        .tile-anchor-building img {
            width: 65%;
            height: 65%;
            object-fit: contain;
        }
        .anchor-tag-lbl {
            font-size: 10px;
            font-weight: 900;
            color: #1e3a8a;
            background: white;
            padding: 1px 4px;
            border-radius: 4px;
            z-index: 5;
        }

        /* Crafted Inventory Elements Graphical Placements Models */
        .placed-footpath-block { background: var(--sidewalk-gray); border: 2px solid #94a3b8; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 30px; animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .placed-zebra-block { background: linear-gradient(90deg, var(--road-asphalt) 15%, #fff 15%, #fff 35%, var(--road-asphalt) 35%, var(--road-asphalt) 65%, #fff 65%, #fff 85%, var(--road-asphalt) 85%); border: 2px solid white; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 30px; animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        
        .placed-signal-block { background: #334155; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border: 2px solid #64748b; }
        .signal-bulb { width: 12px; height: 12px; border-radius: 50%; background: #475569; border: 1px solid #000; }
        .placed-signal-block.red-on .bulb-r { background: #ef4444; box-shadow: 0 0 8px #ef4444; }
        .placed-signal-block.green-on .bulb-g { background: #22c55e; box-shadow: 0 0 8px #22c55e; }

        /* Environmental Running Traffic Framework Vectors Blocks */
        .lane-vehicle-token {
            position: absolute;
            font-size: 30px;
            z-index: 10;
            pointer-events: none;
        }

        /* Sam (The Player Pawn Token Structure Node) Container Block */
        #sam-player-token {
            position: absolute;
            width: 25%;
            height: 25%;
            z-index: 50; /* Raised to always float cleanly above background text layers */
            display: flex;
            align-items: center;
            justify-content: center;
            transition: left 0.4s cubic-bezier(0.25, 1, 0.5, 1), top 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            pointer-events: none;
        }
        #sam-player-token img {
            width: 80%;
            height: 80%;
            object-fit: contain;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.25));
        }

        /* Selection Material Inventory Tray Palette Container Dock Framework Frame */
        .inventory-tray {
            width: 100%;
            background: #ffffff;
            border: 3px solid #fcd34d;
            border-radius: 18px;
            padding: 8px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-top: 4px;
            gap: 8px;
            box-shadow: 0 4px 0 #fef08a;
        }
        .tool-card {
            width: clamp(64px, 15vw, 76px);
            height: clamp(64px, 15vw, 76px);
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            box-shadow: 0 3px 5px rgba(0,0,0,0.1);
            position: relative;
        }
        .counter-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #ef4444;
            color: white;
            font-size: 11px;
            padding: 1px 6px;
            border-radius: 10px;
            border: 2px solid white;
            font-weight: 900;
        }
        .tool-footpath { background: var(--sidewalk-gray); border: 2px solid #94a3b8; }
        .tool-zebra { background: linear-gradient(45deg, #475569 25%, #fff 25%, #fff 50%, #475569 50%, #475569 75%, #fff 75%); background-size: 12px 12px; border: 2px solid #475569; }
        .tool-signal { background: #334155; border: 2px solid #64748b; color: white; }

        /* Notification Feed Output Display Panel Elements Bubble Cards */
        .game-speech-bubble {
            position: absolute;
            bottom: 110px;
            left: 5%;
            width: 90%;
            background: #ffffff;
            border: 4px solid #ef4444;
            border-radius: 16px;
            padding: 12px;
            text-align: center;
            font-weight: 900;
            font-size: 15px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
            display: none;
            z-index: 100;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Classroom Chalk Blackboard Summaries Panel Overlays View Window Frame */
        .blackboard-overlay {
            background: rgba(224, 242, 254, 0.98);
            justify-content: center;
            text-align: center;
            gap: 20px;
        }
        .slate-frame {
            background: #14532d;
            border: 8px solid #854d0e;
            border-radius: 20px;
            padding: 20px 14px;
            width: 100%;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }
        .slate-text {
            font-size: 18px;
            color: #f0fdf4;
            font-weight: bold;
            line-height: 1.5;
        }

        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes hintGlow { 0%, 100% { border-color: #eab308; background: #fef08a; } 50% { border-color: #ea580c; background: #fed7aa; } }
    </style>
</head>
<body>

    <!-- Standard Core Sound Pipeline Assets Configuration Hooks Nodes -->
    <audio id="audio-right" src="assets/correctanswer-1.mp3" preload="auto"></audio>
    <audio id="audio-wrong" src="assets/wrong.mp3" preload="auto"></audio>
    <audio id="audio-claps" src="assets/freesound_community-claps-44774.mp3" preload="auto"></audio>

    <div class="game-cabinet">

        <!-- Clean, Cute Welcome Dashboard Frame Screen View -->
        <div id="screen-welcome" class="screen-view active-view">
            <div>
                <h1 class="kids-mini-title">SAFE ROUTE<br><span style="color: #0284c7;">PLANNER</span></h1>
                <p class="welcome-subtitle" style="margin-top: 10px;">Help Sam find the way home! 🎒</p>
            </div>
            <button class="btn-kids" onclick="navigateToGameSpace()">START GAME ➔</button>
        </div>

        <!-- Gameplay Dashboard Container Realtime Activity Screen Area Frame -->
        <div id="screen-game" class="screen-view">
            <div class="kids-hud">
                <span id="hud-level-tag" style="color: #0284c7;">LEVEL: 1/3</span>
                <span id="hud-score-tag" style="color: #ea580c;">SCORE: 100</span>
            </div>

            <div id="task-banner-text" class="task-instruction-banner">Help Sam walk from School to Home safely!</div>

            <div class="grid-box-wrapper">
                <div id="kids-map-mesh" class="kids-map-grid">
                    <!-- Sam (The Active Interactive Movable Player Token Node Vector) -->
                    <div id="sam-player-token">
                        <img src="assets/student-mascot.png" alt="Sam character icon">
                    </div>
                </div>
            </div>

            <div id="speech-bubble-prompt" class="game-speech-bubble"></div>
            <div id="inventory-dock" class="inventory-tray"></div>

            <!-- "GO HOME!" validation engine trigger button is fully visible from the beginning -->
            <button id="btn-action-trigger" class="btn-kids" style="width: 100%; margin-top: 4px; background: linear-gradient(180deg, #4ade80 0%, #16a34a 100%); box-shadow: 0 6px 0 #15803d;" onclick="beginRouteVerificationWalk()">GO HOME! 🏃‍♂️</button>
        </div>

        <!-- Summary Overlay Slate Framework Screen Card View Panel Frame -->
        <div id="screen-summary" class="screen-view blackboard-overlay">
            <div class="slate-frame">
                <p id="summary-slate-text" class="slate-text"></p>
            </div>
            <button id="btn-summary-next" class="btn-kids" onclick="advanceToNextLevel()">CONTINUE ➔</button>
        </div>

        <!-- Victory High Total Performance Metrics Scoreboard Screen Card Frame Overlay View -->
        <div id="screen-victory" class="screen-view blackboard-overlay">
            <div style="font-size: 70px;">🏆</div>
            <h1 style="color: #16a34a; font-size: 32px; font-weight: 900;">MISSION CLEAR!</h1>
            
            <div class="slate-frame" style="background: #1e3a8a; border-color: #38bdf8;">
                <p style="font-size: 16px; color: #93c5fd; font-weight: 900; margin-bottom: 4px;">TOTAL SCORE:</p>
                <p id="victory-score-lbl" style="font-size: 40px; font-weight: 900; color: #facc15;"></p>
            </div>

            <button class="btn-kids" style="background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%); box-shadow: 0 6px 0 #1e40af;" onclick="resetWholeAppEngine()">PLAY AGAIN 🔄</button>
        </div>

    </div>

    <script>
        function navigateToGameSpace() {
            switchScreenLayout('screen-game');
            buildMapLevelRun(1);
        }

        function switchScreenLayout(id) {
            document.querySelectorAll('.screen-view').forEach(view => view.classList.remove('active-view'));
            const node = document.getElementById(id);
            if (node) node.classList.add('active-view');
        }

        // Global Matrix Properties Structural Layout Config State Variables Attributes
        let activeLevelIdx = 1;
        let cumulativeScorePoints = 0;
        let runningLevelMaxPoints = 100;
        let fieldMatrixConfiguration = [];
        let currentlySelectedToolType = null;
        let runningInventoryPoolMap = {};
        let activeLanesVehiclesCollection = [];
        let lightSignalState = "red";
        let autoSignalTimerClock = null;
        let routeSimulationLockFlag = false;
        let inactivityTimerClock = null;

        const mapsDatabase = {
            level1: {
                task: "Help Sam walk safely on the Footpath to reach home! Don't step on the grass!",
                summary: "Safety on the Footpath! Always walk on the footpath to stay safe. We should never run while crossing the road or play on or near the road!",
                inventory: { footpath: 6 },
                start: { r: 0, c: 0 },
                end: { r: 3, c: 3 },
                matrix: [
                    ['school', 'empty',    'empty',    'empty'],
                    ['obstacle', 'obstacle', 'obstacle', 'empty'],
                    ['obstacle', 'obstacle', 'obstacle', 'empty'],
                    ['obstacle', 'obstacle', 'obstacle', 'home']
                ]
            },
            level2: {
                task: "Help Sam walk down and cross the busy highway using a Zebra Crossing!",
                summary: "Zebra Crossings! These lines are painted on the street to keep walkers safe. You must cross busy roads by following the zebra crossing!",
                inventory: { footpath: 4, zebra: 1 },
                start: { r: 0, c: 0 },
                end: { r: 3, c: 3 },
                matrix: [
                    ['school',   'empty',    'obstacle', 'obstacle'],
                    ['obstacle', 'empty',    'obstacle', 'obstacle'],
                    ['road_lane_left', 'road_lane_right', 'road_lane_left', 'road_lane_right'],
                    ['obstacle', 'obstacle', 'empty',    'home']
                ]
            },
            level3: {
                task: "The street is busy! Help Sam use the Zebra Crossing and Traffic Light safely!",
                summary: "Traffic Lights Save Lives! When the light turns red, vehicles STOP. When it turns green, walkers can cross safely!",
                inventory: { footpath: 3, zebra: 1, trafficlight: 1 },
                start: { r: 0, c: 0 },
                end: { r: 3, c: 3 },
                matrix: [
                    ['school',   'empty',    'obstacle', 'obstacle'],
                    ['obstacle', 'empty',    'obstacle', 'obstacle'],
                    ['road_lane_left', 'road_lane_right', 'road_lane_left', 'road_lane_right'],
                    ['obstacle', 'obstacle', 'empty',    'home']
                ]
            }
        };

        function resetInactivityTimeoutEngine() {
            clearTimeout(inactivityTimerClock);
            document.querySelectorAll('.tile-empty').forEach(el => el.classList.remove('highlight-hint'));
            if (routeSimulationLockFlag) return;

            inactivityTimerClock = setTimeout(() => {
                const firstEmptyCell = document.querySelector('.tile-empty');
                if (firstEmptyCell) firstEmptyCell.classList.add('highlight-hint');
            }, 10000);
        }

        function buildMapLevelRun(lvlNum) {
            activeLevelIdx = lvlNum;
            runningLevelMaxPoints = 100;
            currentlySelectedToolType = null;
            routeSimulationLockFlag = false;
            clearVehiclesSimulationThreads();

            document.getElementById('hud-level-tag').innerText = "LEVEL: " + activeLevelIdx + "/3";
            document.getElementById('hud-score-tag').innerText = "SCORE: " + runningLevelMaxPoints;
            document.getElementById('speech-bubble-prompt').style.display = "none";
            document.getElementById('btn-action-trigger').style.display = "block";

            const specBlueprint = mapsDatabase["level" + activeLevelIdx];
            document.getElementById('task-banner-text').innerText = specBlueprint.task;

            fieldMatrixConfiguration = JSON.parse(JSON.stringify(specBlueprint.matrix));
            runningInventoryPoolMap = JSON.parse(JSON.stringify(specBlueprint.inventory));

            const containerGridBox = document.getElementById('kids-map-mesh');
            containerGridBox.querySelectorAll('.kids-tile').forEach(tile => tile.remove());

            // Build Structural Matrix Cells Layout Grid Elements Nodes Configurations
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    const tileCodeType = fieldMatrixConfiguration[r][c];
                    const nodeCell = document.createElement('div');
                    nodeCell.className = `kids-tile tile-${tileCodeType}`;
                    nodeCell.dataset.row = r;
                    nodeCell.dataset.col = c;
                    nodeCell.style.gridRowStart = r + 1;
                    nodeCell.style.gridColStart = c + 1;

                    if (tileCodeType === 'school') {
                        nodeCell.className += " tile-anchor-building";
                        nodeCell.innerHTML = `🏫<span class="anchor-tag-lbl">SCHOOL</span>`;
                    } else if (tileCodeType === 'home') {
                        nodeCell.className += " tile-anchor-building";
                        nodeCell.innerHTML = `<img src="assets/happy-home.png" alt="Home Graphic Asset Node"><span class="anchor-tag-lbl">HOME</span>`;
                    } else if (tileCodeType === 'obstacle') {
                        nodeCell.innerText = "🌳";
                    } else if (tileCodeType === 'road_lane_left' || tileCodeType === 'road_lane_right') {
                        nodeCell.className = "kids-tile tile-road-lane";
                    } else if (tileCodeType === 'empty') {
                        nodeCell.className += " tile-empty";
                    }

                    nodeCell.addEventListener('click', () => executeDirectTapPlacementBlock(nodeCell));
                    containerGridBox.appendChild(nodeCell);
                }
            }

            // Sync Sam visual coordinates instantly on load
            setTimeout(() => { placeSamCharacterPawnCoordinates(specBlueprint.start.r, specBlueprint.start.c); }, 70);
            renderInventoryTrayUI();
            resetInactivityTimeoutEngine();

            if (activeLevelIdx >= 2) {
                deployDynamicLaneTrafficEngine();
                if (activeLevelIdx === 3) launchTrafficLightSignalAutomation();
            }
        }

        function renderInventoryTrayUI() {
            const dock = document.getElementById('inventory-dock');
            dock.innerHTML = "";

            Object.keys(runningInventoryPoolMap).forEach(key => {
                const availableQuantity = runningInventoryPoolMap[key];
                if (availableQuantity <= 0) return;

                const blockCard = document.createElement('div');
                blockCard.className = `tool-card tool-${key}`;
                if (currentlySelectedToolType === key) blockCard.style.outline = "4px solid #ea580c";

                // Replaced confusing walker asset icon with a clean cobble grid brick symbol layout asset
                let iconGraphicSymbol = "🧱"; let labelNameStr = "Footpath";
                if (key === 'zebra') { iconGraphicSymbol = "🏁"; labelNameStr = "Zebra"; }
                if (key === 'trafficlight') { iconGraphicSymbol = "🚦"; labelNameStr = "Signal"; }

                blockCard.innerHTML = `
                    <span style="font-size: 26px; line-height: 1;">${iconGraphicSymbol}</span>
                    <span style="font-size: 11px; font-weight: 900; margin-top: 2px;">${labelNameStr}</span>
                    <div class="counter-badge">${availableQuantity}</div>
                `;

                blockCard.addEventListener('click', () => {
                    currentlySelectedToolType = key;
                    document.querySelectorAll('.tool-card').forEach(c => c.style.outline = "none");
                    blockCard.style.outline = "4px solid #ea580c";
                    resetInactivityTimeoutEngine();
                });

                dock.appendChild(blockCard);
            });
        }

        function executeDirectTapPlacementBlock(targetTileNode) {
            if (routeSimulationLockFlag) return;
            resetInactivityTimeoutEngine();

            const r = parseInt(targetTileNode.dataset.row);
            const c = parseInt(targetTileNode.dataset.col);
            const initialIdentityState = fieldMatrixConfiguration[r][c];

            // Safety Guard Rails: Do not overwrite anchor points
            if (initialIdentityState === 'school' || initialIdentityState === 'home') return;

            if (!currentlySelectedToolType) {
                displayKidsSpeechBubble("Tap a tool card block from the tray below first! 🎒");
                return;
            }

            if (currentlySelectedToolType === 'zebra') {
                if (initialIdentityState !== 'road_lane_left' && initialIdentityState !== 'road_lane_right' && initialIdentityState !== 'empty') {
                    displayKidsSpeechBubble("Place the Zebra Crossing directly on the road for Sam to cross! 🏁");
                    return;
                }
                triggerAudioOutputEffect('audio-right');
                targetTileNode.innerHTML = `<div class="placed-zebra-block">🏁</div>`;
                fieldMatrixConfiguration[r][c] = 'paved_zebra';
            } 
            else if (currentlySelectedToolType === 'trafficlight') {
                if (initialIdentityState !== 'empty' && initialIdentityState !== 'road_lane_left' && initialIdentityState !== 'road_lane_right') return;
                triggerAudioOutputEffect('audio-right');
                targetTileNode.innerHTML = `
                    <div class="placed-signal-block red-on" onclick="manuallyToggleSignalLight(event)">
                        <div class="signal-bulb bulb-r"></div>
                        <div class="signal-bulb bulb-g"></div>
                    </div>`;
                fieldMatrixConfiguration[r][c] = 'paved_signal';
            } 
            else if (currentlySelectedToolType === 'footpath') {
                if (initialIdentityState !== 'empty') {
                    displayKidsSpeechBubble("Place the Footpath on the grass patches to build a safe path! 🧱");
                    return;
                }
                triggerAudioOutputEffect('audio-right');
                targetTileNode.innerHTML = `<div class="placed-footpath-block">🧱</div>`;
                fieldMatrixConfiguration[r][c] = 'paved_footpath';
            }

            runningInventoryPoolMap[currentlySelectedToolType]--;
            currentlySelectedToolType = null;
            renderInventoryTrayUI();
        }

        function placeSamCharacterPawnCoordinates(r, c) {
            const fieldCanvasGrid = document.getElementById('kids-map-mesh');
            const targetTileCell = fieldCanvasGrid.querySelector(`.kids-tile[data-row="${r}"][data-col="${c}"]`);
            if (!targetTileCell) return;

            const samTokenBox = document.getElementById('sam-player-token');
            samTokenBox.style.left = targetTileCell.offsetLeft + "px";
            samTokenBox.style.top = targetTileCell.offsetTop + "px";
            samTokenBox.style.width = targetTileCell.offsetWidth + "px";
            samTokenBox.style.height = targetTileCell.offsetHeight + "px";
        }

        function deployDynamicLaneTrafficEngine() {
            const meshCanvas = document.getElementById('kids-map-mesh');
            spawnIndependentLaneVehicle(2, "🚗", 3.5, "left");
            spawnIndependentLaneVehicle(2, "🚌", 2.5, "right");
        }

        function spawnIndependentLaneVehicle(targetRow, spriteSymbol, movementVelocity, directionPathStr) {
            const meshCanvas = document.getElementById('kids-map-mesh');
            const vehicleNode = document.createElement('div');
            vehicleNode.className = "lane-vehicle-token";
            vehicleNode.innerText = spriteSymbol;
            meshCanvas.appendChild(vehicleNode);

            const rowAnchorTile = meshCanvas.querySelector(`.kids-tile[data-row="${targetRow}"][data-col="0"]`);
            setTimeout(() => {
                let offsetHeightModifier = (directionPathStr === "left") ? 4 : (rowAnchorTile.offsetHeight / 2 - 4);
                vehicleNode.style.top = (rowAnchorTile.offsetTop + offsetHeightModifier) + "px";
            }, 60);

            let calculatedCoordinateX = (directionPathStr === "right") ? -50 : (meshCanvas.clientWidth + 50);
            vehicleNode.style.left = calculatedCoordinateX + "px";

            const operationalClockTimer = setInterval(() => {
                if (activeLevelIdx === 3 && lightSignalState === "red" && calculatedCoordinateX >= (meshCanvas.clientWidth * 0.35) && calculatedCoordinateX <= (meshCanvas.clientWidth * 0.55)) {
                    return;
                }

                if (directionPathStr === "right") {
                    calculatedCoordinateX += movementVelocity;
                    if (calculatedCoordinateX > meshCanvas.clientWidth + 50) calculatedCoordinateX = -50;
                } else {
                    calculatedCoordinateX -= movementVelocity;
                    if (calculatedCoordinateX < -50) calculatedCoordinateX = meshCanvas.clientWidth + 50;
                }
                vehicleNode.style.left = calculatedCoordinateX + "px";
            }, 35);

            activeLanesVehiclesCollection.push({ element: vehicleNode, clock: operationalClockTimer });
        }

        function launchTrafficLightSignalAutomation() {
            lightSignalState = "red";
            autoSignalTimerClock = setInterval(() => {
                const targetSignalBox = document.querySelector('.placed-signal-block');
                if (!targetSignalBox) return;

                if (lightSignalState === "red") {
                    lightSignalState = "green";
                    targetSignalBox.className = "placed-signal-block green-on";
                } else {
                    lightSignalState = "red";
                    targetSignalBox.className = "placed-signal-block red-on";
                }
            }, 4000);
        }

        function manuallyToggleSignalLight(e) {
            e.stopPropagation();
            if (routeSimulationLockFlag) return;
            const element = e.currentTarget;
            if (lightSignalState === "red") {
                lightSignalState = "green";
                element.className = "placed-signal-block green-on";
            } else {
                lightSignalState = "red";
                element.className = "placed-signal-block red-on";
            }
        }

        function clearVehiclesSimulationThreads() {
            activeLanesVehiclesCollection.forEach(obj => { obj.element.remove(); clearInterval(obj.clock); });
            activeLanesVehiclesCollection = [];
            if (autoSignalTimerClock) { clearInterval(autoSignalTimerClock); autoSignalTimerClock = null; }
            clearTimeout(inactivityTimerClock);
        }

        function displayKidsSpeechBubble(msg) {
            const bubbleNode = document.getElementById('speech-bubble-prompt');
            bubbleNode.innerText = msg;
            bubbleNode.style.display = "block";
            setTimeout(() => { bubbleNode.style.display = "none"; }, 4000);
        }

        /* True Sequential Path Checking Timeline Matrix Engine */
        async function beginRouteVerificationWalk() {
            if (routeSimulationLockFlag) return;
            routeSimulationLockFlag = true;
            clearTimeout(inactivityTimerClock);

            const blueprintMeta = mapsDatabase["level" + activeLevelIdx];
            let currentR = blueprintMeta.start.r;
            let currentC = blueprintMeta.start.c;
            const finalDestinationRow = blueprintMeta.end.r;
            const finalDestinationCol = blueprintMeta.end.c;

            let structuralHistoryLogsMap = {};

            while (currentR !== finalDestinationRow || currentC !== finalDestinationCol) {
                structuralHistoryLogsMap[`${currentR},${currentC}`] = true;

                let spatialDirectionalMatrices = [
                    { r: currentR, c: currentC + 1 }, // Travel Rightward
                    { r: currentR + 1, c: currentC }, // Travel Downward
                    { r: currentR, c: currentC - 1 }, // Travel Leftward
                    { r: currentR - 1, c: currentC }  // Travel Upward
                ];

                let chosenNextStepNode = null;

                for (let coordinateOption of spatialDirectionalMatrices) {
                    if (coordinateOption.r >= 0 && coordinateOption.r < 4 && coordinateOption.c >= 0 && coordinateOption.c < 4) {
                        if (structuralHistoryLogsMap[`${coordinateOption.r},${coordinateOption.c}`]) continue;

                        const cellIdentityStr = fieldMatrixConfiguration[coordinateOption.r][coordinateOption.c];

                        if (cellIdentityStr === 'paved_footpath' || cellIdentityStr === 'paved_zebra' || 
                            cellIdentityStr === 'road_lane_left' || cellIdentityStr === 'road_lane_right' || 
                            cellIdentityStr === 'paved_signal' || cellIdentityStr === 'home') {
                            chosenNextStepNode = coordinateOption;
                            break;
                        }
                    }
                }

                if (!chosenNextStepNode) {
                    triggerAudioOutputEffect('audio-wrong');
                    displayKidsSpeechBubble("Oh no! The path breaks here. Help Sam reach Home! 🌳");
                    penalizeAttemptLogs();
                    return;
                }

                currentR = chosenNextStepNode.r;
                currentC = chosenNextStepNode.c;
                placeSamCharacterPawnCoordinates(currentR, currentC);
                await executeAsyncSleepTimer(400);

                const realTimeEvaluatedIdentityType = fieldMatrixConfiguration[currentR][currentC];

                if (realTimeEvaluatedIdentityType === 'road_lane_left' || realTimeEvaluatedIdentityType === 'road_lane_right') {
                    triggerAudioOutputEffect('audio-wrong');
                    displayKidsSpeechBubble("Be careful, Sam! Running on the road without a Zebra Crossing is unsafe! 🛑");
                    penalizeAttemptLogs();
                    return;
                }

                if (activeLevelIdx === 3 && realTimeEvaluatedIdentityType === 'paved_zebra' && lightSignalState === 'red') {
                    triggerAudioOutputEffect('audio-wrong');
                    displayKidsSpeechBubble("Wait, Sam! The traffic light signal is RED! Wait for the light to turn GREEN! 🚦");
                    penalizeAttemptLogs();
                    return;
                }
            }

            cumulativeScorePoints += runningLevelMaxPoints;
            setTimeout(() => {
                triggerAudioOutputEffect('audio-claps');
                document.getElementById('summary-slate-text').innerText = blueprintMeta.summary;
                document.getElementById('btn-summary-next').innerText = (activeLevelIdx === 3) ? "FINISH 🏅" : "NEXT LEVEL ➔";
                switchScreenLayout('screen-summary');
            }, 300);
        }

        function penalizeAttemptLogs() {
            runningLevelMaxPoints = Math.max(20, runningLevelMaxPoints - 20);
            document.getElementById('hud-score-tag').innerText = "SCORE: " + runningLevelMaxPoints;
            setTimeout(() => { buildMapLevelRun(activeLevelIdx); }, 3500);
        }

        function executeAsyncSleepTimer(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        function triggerAudioOutputEffect(id) {
            const track = document.getElementById(id);
            if (track) { track.currentTime = 0; track.play().catch(() => {}); }
        }

        function advanceToNextLevel() {
            if (activeLevelIdx < 3) {
                switchScreenLayout('screen-game');
                buildMapLevelRun(activeLevelIdx + 1);
            } else {
                document.getElementById('victory-score-lbl').innerText = cumulativeScorePoints + " / 300";
                switchScreenLayout('screen-victory');
            }
        }

        function resetWholeAppEngine() {
            cumulativeScorePoints = 0;
            switchScreenLayout('screen-welcome');
        }
    </script>
</body>
</html>
