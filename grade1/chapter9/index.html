<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Safe Route Planner</title>
    <style>
        :root {
            --bg-pastel: #f0fdf4;
            --header-blue: #3b82f6;
            --text-main: #1e293b;
            --success-green: #22c55e;
            --danger-red: #ef4444;
            --warn-yellow: #eab308;
            --road-gray: #475569;
            --sidewalk-gray: #cbd5e1;
            --grid-empty: #fef08a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background-color: #1e293b; /* Dark backdrop to focus the game canvas */
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Scalable Viewport App Frame (Locks aspect ratio across all devices) */
        .app-container {
            width: 100vw;
            height: 100vh;
            max-width: 480px;
            max-height: 850px;
            background-color: var(--bg-pastel);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
            overflow: hidden;
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
        }

        .screen-layout {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        .active-view {
            display: flex !important;
        }

        /* Splash Screen Loading Engine */
        #screen-splash {
            background: #ffffff;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 25px;
            z-index: 9999;
        }
        .splash-logo {
            width: 60%;
            max-width: 220px;
            animation: pulseSoft 1.5s infinite ease-in-out;
        }
        .loading-track {
            width: 55%;
            max-width: 200px;
            height: 10px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
        }
        .loading-bar-fill {
            width: 100%;
            height: 100%;
            background: #22c55e;
            transform: translateX(-100%);
            animation: startLoad 5s forwards linear;
        }

        /* Welcome Screen Layout Dashboard */
        #screen-welcome {
            justify-content: center;
            gap: 30px;
            text-align: center;
        }
        .welcome-title {
            font-size: clamp(32px, 7vh, 44px);
            font-weight: 900;
            color: #1e3a8a;
            line-height: 1.2;
        }
        .welcome-mascot {
            width: 140px;
            height: 140px;
            object-fit: contain;
            animation: bounceMascot 2.5s infinite ease-in-out;
        }

        .btn-push {
            background: #22c55e;
            color: white;
            border: none;
            padding: 14px 40px;
            font-size: clamp(20px, 4.5vw, 24px);
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 6px 0 #15803d;
            transition: transform 0.1s;
        }
        .btn-push:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #15803d;
        }

        /* Top HUD Header Status Bars */
        .hud-row {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--header-blue);
            padding: 10px 16px;
            border-radius: 20px;
            font-weight: 800;
            font-size: clamp(16px, 4vw, 20px);
            color: white;
            box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3);
            margin-bottom: 8px;
        }
        .hud-badge {
            background: rgba(255, 255, 255, 0.25);
            padding: 4px 12px;
            border-radius: 12px;
        }

        /* Map Canvas Layout Grid Framework (Perfectly Square Aspect Container) */
        .map-wrapper-box {
            width: 100%;
            aspect-ratio: 1 / 1;
            margin: auto 0;
        }
        .map-grid-canvas {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 6px;
            background: #f8fafc;
            border: 5px solid #ebd5c0;
            border-radius: 24px;
            padding: 6px;
            position: relative;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.08);
        }

        /* Grid Tile Component Framework */
        .grid-tile {
            position: relative;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 2px dashed transparent;
        }
        .tile-empty {
            background: var(--grid-empty);
            border-color: #fef08a;
            cursor: pointer;
        }
        .tile-empty.drag-hover {
            border-color: var(--header-blue);
            background: #dbeafe;
        }
        .tile-obstacle { background: #bbf7d0; font-size: clamp(24px, 5vh, 32px); }
        .tile-road { background: var(--road-gray); }
        .tile-anchor { background: #bfdbfe; border: 2px solid #60a5fa; }
        .tile-anchor img { width: 85%; height: 85%; object-fit: contain; }
        .tile-school-label { font-size: clamp(10px, 2.5vw, 12px); font-weight: 900; color: #1e3a8a; }

        /* Inventory Toolbelt Tray Selection Dock */
        .inventory-dock-tray {
            width: 100%;
            background: #ffffff;
            border: 3px dashed #94a3b8;
            border-radius: 20px;
            padding: 10px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-top: 8px;
            gap: 8px;
        }
        .draggable-tool-block {
            width: clamp(56px, 14vw, 68px);
            height: clamp(56px, 14vw, 68px);
            border-radius: 14px;
            cursor: grab;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: #0f172a;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            touch-action: none;
        }
        .tool-footpath { background: var(--sidewalk-gray); border: 2px solid #94a3b8; }
        .tool-zebra { background: linear-gradient(45deg, #1e293b 25%, #ffffff 25%, #ffffff 50%, #1e293b 50%, #1e293b 75%, #ffffff 75%); background-size: 16px 16px; border: 2px solid #1e293b; }
        .tool-light { background: #e2e8f0; border: 2px solid #475569; }

        /* Placed Game Piece Assets */
        .placed-footpath { background: var(--sidewalk-gray); width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: clamp(20px, 5vh, 26px); animation: pulsePop 0.2s; }
        .placed-zebra { background: linear-gradient(90deg, #475569 15%, #fff 15%, #fff 35%, #475569 35%, #475569 65%, #fff 65%, #fff 85%, #475569 85%); width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: clamp(20px, 5vh, 26px); animation: pulsePop 0.2s; }
        .placed-light { background: #334155; color: white; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; }
        
        .light-bulb { width: 10px; height: 10px; border-radius: 50%; background: #475569; border: 1px solid #000; }
        .placed-light.state-red .bulb-red { background: var(--danger-red); box-shadow: 0 0 8px var(--danger-red); }
        .placed-light.state-yellow .bulb-yellow { background: var(--warn-yellow); box-shadow: 0 0 8px var(--warn-yellow); }
        .placed-light.state-green .bulb-green { background: var(--success-green); box-shadow: 0 0 8px var(--success-green); }

        /* Automated Vehicle Nodes */
        .animated-vehicle {
            position: absolute;
            font-size: clamp(24px, 5vh, 32px);
            z-index: 10;
            pointer-events: none;
        }

        /* Sliding Player Mascot Piece Container */
        #moving-student-pawn {
            position: absolute;
            width: 21%;
            height: 21%;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: left 0.4s cubic-bezier(0.4, 0, 0.2, 1), top 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
            pointer-events: none;
        }
        #moving-student-pawn img {
            width: 90%;
            height: 90%;
            object-fit: contain;
        }

        /* In-game dialogue overlay system */
        .dialogue-bubble-card {
            position: absolute;
            bottom: 95px;
            left: 5%;
            width: 90%;
            background: white;
            border: 3px solid var(--header-blue);
            border-radius: 16px;
            padding: 12px;
            text-align: center;
            font-weight: bold;
            font-size: clamp(14px, 3.5vw, 16px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.15);
            display: none;
            z-index: 100;
            animation: pulsePop 0.3s ease-out;
        }

        /* Blackboard Summary Text Layout */
        .overlay-screen {
            background: rgba(240, 253, 244, 0.98);
            justify-content: center;
            text-align: center;
            gap: 20px;
        }
        .blackboard-box {
            background: #14532d;
            border: 8px solid #b45309;
            border-radius: 16px;
            padding: 20px 14px;
            width: 100%;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }
        .blackboard-text {
            font-size: clamp(18px, 4.5vw, 22px);
            color: #f0fdf4;
            font-weight: bold;
            line-height: 1.5;
        }

        @keyframes startLoad { from { transform: translateX(-100%); } to { transform: translateX(0%); } }
        @keyframes pulseSoft { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        @keyframes bounceMascot { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes pulsePop { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

    <audio id="audio-right" src="assets/correctanswer-1.mp3" preload="auto"></audio>
    <audio id="audio-wrong" src="assets/wrong.mp3" preload="auto"></audio>
    <audio id="audio-claps" src="assets/freesound_community-claps-44774.mp3" preload="auto"></audio>

    <div class="app-container">
        
        <div id="screen-splash">
            <img src="assets/innovine-logo.png" alt="Innovine Logo" class="splash-logo">
            <div class="loading-track">
                <div class="loading-bar-fill"></div>
            </div>
        </div>

        <div id="screen-welcome" class="screen-layout active-view">
            <h1 class="welcome-title">SAFE ROUTE<br><span style="color: #22c55e;">PLANNER!</span></h1>
            <img src="assets/student-mascot.png" class="welcome-mascot" alt="Student Mascot">
            <button class="btn-push" onclick="navigateToGameSpace()">Start Planning ➔</button>
        </div>

        <div id="screen-game" class="screen-layout">
            <div class="hud-row">
                <span id="hud-level-lbl" class="hud-badge">Level: 1/3</span>
                <span id="hud-score-lbl">Score: 50</span>
            </div>

            <div class="map-wrapper-box">
                <div id="map-blueprint-grid" class="map-grid-canvas">
                    <div id="moving-student-pawn">
                        <img src="assets/student-mascot.png" alt="Player Token">
                    </div>
                </div>
            </div>

            <div id="dialogue-bubble" class="dialogue-bubble-card"></div>
            <div id="toolbelt-tray" class="inventory-dock-tray"></div>
            <button id="action-trigger-btn" class="btn-push" style="width:100%; margin-top:6px;" onclick="compileAndRunRouteEvaluation()">GO HOME! 🏃‍♂️</button>
        </div>

        <div id="screen-summary" class="screen-layout overlay-screen">
            <div class="blackboard-box">
                <p id="summary-msg-text" class="blackboard-text"></p>
            </div>
            <button id="summary-action-btn" class="btn-push" onclick="progressFromSummaryScreen()">Next Blueprint ➔</button>
        </div>

        <div id="screen-victory" class="screen-layout overlay-screen">
            <div style="font-size: 60px; animation: pulseSoft 2s infinite;">🏆</div>
            <h1 style="color: #22c55e; font-size: 32px; font-weight: 900;">Certified Planner!</h1>
            
            <div class="blackboard-box" style="background: #1e3a8a; border-color: #3b82f6;">
                <p style="font-size: 18px; color: #93c5fd; margin-bottom: 6px;">Your Total Safety Score:</p>
                <p id="victory-final-score-lbl" style="font-size: 40px; font-weight: 900; color: #fbbf24;"></p>
            </div>

            <button class="btn-push" style="background: #3b82f6; box-shadow: 0 6px 0 #1d4ed8;" onclick="resetEntireAppWorkflow()">Play Again 🔄</button>
        </div>

    </div>

    <script>
        // Automatic Engine Boot Execution
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('screen-splash').style.display = 'none';
            }, 5000);
        });

        function navigateToGameSpace() {
            changeScreenLayout('screen-game');
            initMapLevelRun(1);
        }

        // State Machine Variables Engine
        let activeLevel = 1;
        let cumulativeSafetyScore = 0;
        let activeLevelScore = 50; 
        let matrixGridConfig = [];
        let currentlyHeldToolType = null;
        let vehicleLoopTimers = [];
        let currentLightState = "red";
        let interactiveLightTimer = null;
        let activeEvaluationFlag = false;

        const blueprintsDatabase = {
            level1: {
                summary: "Safety on the Footpath! Always walk on the footpath to stay safe. We should never run while crossing the road or play on or near the road!",
                inventory: ['footpath', 'footpath', 'footpath'],
                solutionPath: ["0,0", "1,0", "2,0", "3,0", "3,1", "3,2", "3,3"],
                matrix: [
                    ['school', 'empty',  'empty',    'empty'],
                    ['obstacle', 'obstacle', 'obstacle', 'empty'],
                    ['obstacle', 'obstacle', 'obstacle', 'empty'],
                    ['obstacle', 'obstacle', 'obstacle', 'home']
                ]
            },
            level2: {
                summary: "Zebra Crossings! These lines are painted on the street to keep walkers safe. You must cross busy roads by following the zebra crossing!",
                inventory: ['footpath', 'footpath', 'zebra'],
                solutionPath: ["0,0", "1,0", "1,1", "1,2", "1,3", "2,3", "3,3"],
                matrix: [
                    ['school', 'empty',    'obstacle', 'obstacle'],
                    ['obstacle', 'empty',  'obstacle', 'obstacle'],
                    ['road',     'road',   'road',     'road'],
                    ['obstacle', 'obstacle', 'empty',  'home']
                ]
            },
            level3: {
                summary: "Traffic Lights Save Lives! When the light turns red, vehicles STOP. Yellow tells us to WAIT. When it turns green, we can GO safely!",
                inventory: ['footpath', 'zebra', 'trafficlight'],
                solutionPath: ["0,0", "0,1", "0,2", "1,2", "2,2", "3,2", "3,3"],
                matrix: [
                    ['school',   'empty',    'obstacle', 'obstacle'],
                    ['obstacle', 'empty',    'obstacle', 'obstacle'],
                    ['road',     'road',     'road',     'road'],
                    ['obstacle', 'obstacle', 'empty',    'home']
                ]
            }
        };

        function changeScreenLayout(id) {
            document.querySelectorAll('.screen-layout').forEach(s => s.classList.remove('active-view'));
            const targetNode = document.getElementById(id);
            if (targetNode) targetNode.classList.add('active-view');
        }

        function triggerAudioEffect(elementId) {
            const track = document.getElementById(elementId);
            if (track) {
                track.currentTime = 0;
                track.play().catch(() => {});
            }
        }

        function initMapLevelRun(lvlNo) {
            activeLevel = lvlNo;
            activeLevelScore = 50;
            currentlyHeldToolType = null;
            activeEvaluationFlag = false;
            clearAllVehicleLoops();
            
            document.getElementById('hud-level-lbl').innerText = "Level: " + activeLevel + "/3";
            document.getElementById('hud-score-lbl').innerText = "Score: " + activeLevelScore;
            document.getElementById('dialogue-bubble').style.display = 'none';
            document.getElementById('action-trigger-btn').style.display = 'block';

            const activeBlueprint = blueprintsDatabase["level" + activeLevel];
            matrixGridConfig = JSON.parse(JSON.stringify(activeBlueprint.matrix));

            const gridContainer = document.getElementById('map-blueprint-grid');
            gridContainer.querySelectorAll('.grid-tile').forEach(el => el.remove());

            // Build Scalable 4x4 Map Coordinates Grid Tiles
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    const tileType = matrixGridConfig[r][c];
                    const tileNode = document.createElement('div');
                    tileNode.className = `grid-tile tile-${tileType}`;
                    tileNode.dataset.row = r;
                    tileNode.dataset.col = c;
                    tileNode.style.gridRowStart = r + 1;
                    tileNode.style.gridColStart = c + 1;

                    if (tileType === 'school') {
                        tileNode.className += " tile-anchor";
                        tileNode.innerHTML = `🏫<span class="tile-school-label">SCHOOL</span>`;
                    } else if (tileType === 'home') {
                        tileNode.className += " tile-anchor";
                        tileNode.innerHTML = `<img src="assets/happy-home.png" alt="Home">`;
                    } else if (tileType === 'obstacle') {
                        tileNode.innerText = "🌳";
                    } else if (tileType === 'empty') {
                        tileNode.className += " tile-empty";
                        // Desktop Drag & Drop Interfaces
                        tileNode.addEventListener('dragover', (e) => { e.preventDefault(); tileNode.classList.add('drag-hover'); });
                        tileNode.addEventListener('dragleave', () => tileNode.classList.remove('drag-hover'));
                        tileNode.addEventListener('drop', (e) => { e.preventDefault(); tileNode.classList.remove('drag-hover'); executePlacementLogic(tileNode); });
                        // Unified Mobile Direct Tap Interface
                        tileNode.addEventListener('click', () => executePlacementLogic(tileNode));
                    }

                    gridContainer.appendChild(tileNode);
                }
            }

            // Sync dynamic positions scaled instantly by grid calculations
            setTimeout(() => { positionStudentPawnOnCell(0, 0); }, 50);
            renderToolbeltInventory(activeBlueprint.inventory);

            // Dynamic Asset Loops Configurations
            if (activeLevel === 2) {
                spawnDynamicVehicleLoop(2);
            } else if (activeLevel === 3) {
                spawnDynamicVehicleLoop(2);
                initTrafficLightControlEngine();
            }
        }

        function renderToolbeltInventory(itemsArray) {
            const tray = document.getElementById('toolbelt-tray');
            tray.innerHTML = "";
            itemsArray.forEach((tool, idx) => {
                const toolBlock = document.createElement('div');
                toolBlock.className = `draggable-tool-block tool-${tool}`;
                toolBlock.draggable = true;
                toolBlock.dataset.toolType = tool;
                
                let textLabel = "Footpath"; let iconSymbol = "🚶";
                if (tool === 'zebra') { textLabel = "Crossing"; iconSymbol = "🏁"; }
                if (tool === 'trafficlight') { textLabel = "Signal"; iconSymbol = "🚦"; }

                toolBlock.innerHTML = `<span style="font-size:22px; line-height:1;">${iconSymbol}</span><span style="font-size:10px; margin-top:2px;">${textLabel}</span>`;
                
                // Desktop drag setup hooks
                toolBlock.addEventListener('dragstart', () => { currentlyHeldToolType = tool; });

                // Multi-device Touch Interaction selection toggle
                toolBlock.addEventListener('click', () => {
                    document.querySelectorAll('.draggable-tool-block').forEach(b => b.style.outline = "none");
                    currentlyHeldToolType = tool;
                    toolBlock.style.outline = "4px solid var(--header-blue)";
                });

                tray.appendChild(toolBlock);
            });
        }

        function executePlacementLogic(tileElement) {
            if (activeEvaluationFlag) return;
            if (!currentlyHeldToolType) {
                displayHelperBubble("Tap a safety block from the white tray below first!");
                return;
            }

            const r = parseInt(tileElement.dataset.row);
            const c = parseInt(tileElement.dataset.col);

            if (matrixGridConfig[r][c] !== 'empty') return;

            triggerAudioEffect('audio-right');

            if (currentlyHeldToolType === 'footpath') {
                tileElement.innerHTML = `<div class="placed-footpath">🚶</div>`;
                matrixGridConfig[r][c] = 'path_footpath';
            } else if (currentlyHeldToolType === 'zebra') {
                tileElement.innerHTML = `<div class="placed-zebra">🏁</div>`;
                matrixGridConfig[r][c] = 'path_zebra';
            } else if (currentlyHeldToolType === 'trafficlight') {
                tileElement.innerHTML = `
                    <div class="placed-light state-red" onclick="cycleTrafficLightState(event)">
                        <div class="light-bulb bulb-red"></div>
                        <div class="light-bulb bulb-yellow"></div>
                        <div class="light-bulb bulb-green"></div>
                    </div>`;
                matrixGridConfig[r][c] = 'path_light';
            }

            removeBlockFromInventoryPool(currentlyHeldToolType);
            currentlyHeldToolType = null;
        }

        function removeBlockFromInventoryPool(type) {
            const trays = document.querySelectorAll('.draggable-tool-block');
            for (let node of trays) {
                if (node.dataset.toolType === type) {
                    node.remove();
                    break;
                }
            }
        }

        function positionStudentPawnOnCell(row, col) {
            const gridContainer = document.getElementById('map-blueprint-grid');
            const tileNode = gridContainer.querySelector(`.grid-tile[data-row="${row}"][data-col="${col}"]`);
            if (!tileNode) return;

            const targetPawn = document.getElementById('moving-student-pawn');
            targetPawn.style.left = tileNode.offsetLeft + "px";
            targetPawn.style.top = tileNode.offsetTop + "px";
            targetPawn.style.width = tileNode.offsetWidth + "px";
            targetPawn.style.height = tileNode.offsetHeight + "px";
        }

        function spawnDynamicVehicleLoop(row) {
            const gridContainer = document.getElementById('map-blueprint-grid');
            const vehicle = document.createElement('div');
            vehicle.className = "animated-vehicle";
            vehicle.innerText = "🚗";
            gridContainer.appendChild(vehicle);

            const tileNode = gridContainer.querySelector(`.grid-tile[data-row="${row}"][data-col="0"]`);
            setTimeout(() => {
                const targetY = tileNode.offsetTop + (tileNode.offsetHeight / 2) - (vehicle.offsetHeight / 2);
                vehicle.style.top = targetY + "px";
            }, 60);

            let currentX = -40;
            vehicle.style.left = currentX + "px";

            const loopTimer = setInterval(() => {
                if (activeLevel === 3 && currentLightState === "red" && currentX >= (gridContainer.clientWidth * 0.4) && currentX <= (gridContainer.clientWidth * 0.55)) {
                    return; 
                }

                currentX += 4;
                if (currentX > gridContainer.clientWidth + 40) {
                    currentX = -40;
                }
                vehicle.style.left = currentX + "px";
            }, 30);

            vehicleLoopTimers.push({ node: vehicle, clock: loopTimer });
        }

        function initTrafficLightControlEngine() {
            currentLightState = "red";
            interactiveLightTimer = setInterval(() => {
                const node = document.querySelector('.placed-light');
                if (!node) return;
                
                if (currentLightState === "red") {
                    currentLightState = "green";
                    node.className = "placed-light state-green";
                } else {
                    currentLightState = "red";
                    node.className = "placed-light state-red";
                }
            }, 4000);
        }

        function cycleTrafficLightState(e) {
            e.stopPropagation();
            if (activeEvaluationFlag) return;
            const node = e.currentTarget;
            if (currentLightState === "red") {
                currentLightState = "green";
                node.className = "placed-light state-green";
            } else {
                currentLightState = "red";
                node.className = "placed-light state-red";
            }
        }

        function clearAllVehicleLoops() {
            vehicleLoopTimers.forEach(obj => { obj.node.remove(); clearInterval(obj.clock); });
            vehicleLoopTimers = [];
            if (interactiveLightTimer) { clearInterval(interactiveLightTimer); interactiveLightTimer = null; }
        }

        function displayHelperBubble(msg) {
            const bubble = document.getElementById('dialogue-bubble');
            bubble.innerText = msg;
            bubble.style.display = "block";
            setTimeout(() => { bubble.style.display = "none"; }, 4000);
        }

        async function compileAndRunRouteEvaluation() {
            if (activeEvaluationFlag) return;
            activeEvaluationFlag = true;
            document.getElementById('action-trigger-btn').style.display = 'none';
            
            const blueprint = blueprintsDatabase["level" + activeLevel];
            const routeCoordinates = blueprint.solutionPath;

            for (let i = 0; i < routeCoordinates.length; i++) {
                const parts = routeCoordinates[i].split(',');
                const r = parseInt(parts[0]);
                const c = parseInt(parts[1]);

                positionStudentPawnOnCell(r, c);
                await delayExecutionTimer(550);

                const cellType = matrixGridConfig[r][c];

                if (cellType === 'road') {
                    triggerAudioEffect('audio-wrong');
                    displayHelperBubble("Oh no! Walking directly onto an open highway is unsafe! Always build a Zebra Crossing to cross the road safely! 🛑");
                    penalizePlayerAttempt();
                    return;
                }

                if (activeLevel === 3 && cellType === 'path_zebra' && currentLightState === 'red') {
                    triggerAudioEffect('audio-wrong');
                    displayHelperBubble("Wait! The traffic light signal is RED! Vehicles are moving. We must cross only when the light turns GREEN! 🚦");
                    penalizePlayerAttempt();
                    return;
                }
            }

            cumulativeSafetyScore += activeLevelScore;
            setTimeout(() => {
                triggerAudioEffect('audio-claps');
                document.getElementById('summary-msg-text').innerText = blueprint.summary;
                if (activeLevel === 3) {
                    document.getElementById('summary-action-btn').innerText = "Finish Mission 🏅";
                } else {
                    document.getElementById('summary-action-btn').innerText = "Next Blueprint ➔";
                }
                changeScreenLayout('screen-summary');
            }, 400);
        }

        function penalizePlayerAttempt() {
            activeLevelScore = Math.max(10, activeLevelScore - 10);
            document.getElementById('hud-score-lbl').innerText = "Score: " + activeLevelScore;
            setTimeout(() => {
                initMapLevelRun(activeLevel);
            }, 3800);
        }

        function delayExecutionTimer(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        function progressFromSummaryScreen() {
            if (activeLevel < 3) {
                initMapLevelRun(activeLevel + 1);
                changeScreenLayout('screen-game');
            } else {
                document.getElementById('victory-final-score-lbl').innerText = cumulativeSafetyScore + " / 150";
                changeScreenLayout('screen-victory');
            }
        }

        function resetEntireAppWorkflow() {
            cumulativeSafetyScore = 0;
            changeScreenLayout('screen-welcome');
        }
    </script>
</body>
</html>
