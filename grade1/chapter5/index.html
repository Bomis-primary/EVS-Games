<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Animal Dash Quest</title>
<style>
* {
  box-sizing: border-box;
  -webkit-user-select: none;
  user-select: none;
  margin: 0;
  padding: 0;
}
body {
  font-family: Arial, Helvetica, sans-serif;
  background: #f4fcf4;
  color: #2e4a2e;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.screen {
  display: none;
  width: 100%;
  max-width: 500px;
  padding: 20px;
  animation: fadeIn 0.4s ease-out;
}
.screen.active {
  display: block;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* CH1: SPLASH VIEW - HIGH FIDELITY DEVICE SCALING & CENTERING */
#splashScreen {
  background: #ffffff;
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
#splashScreen.active { 
  display: flex; 
}
#splashScreen img {
  width: auto;
  height: auto;
  max-width: 80vw;
  max-height: 50vh;
  object-fit: contain;
}

/* REFRESHED PASTEL PLAY CONTAINER */
.game-card {
  background: #ffffff;
  border: 6px solid #ccebca;
  border-radius: 36px;
  padding: 24px;
  box-shadow: 0 16px 40px rgba(165, 214, 167, 0.3);
  text-align: center;
  position: relative;
}

h1 {
  font-size: 32px;
  color: #3b7a3e;
  margin-bottom: 12px;
  text-shadow: 1px 2px 0px #e8f5e9;
}

/* ACCENT BUTTON STYLE */
.btn-main {
  border: none;
  border-radius: 20px;
  padding: 16px 36px;
  font-size: 20px;
  cursor: pointer;
  background: #ffd54f;
  color: #5d4037;
  box-shadow: 0 6px 0 #ffb300;
  font-weight: 800;
  margin-top: 15px;
  display: inline-block;
  transition: all 0.1s ease;
}
.btn-main:active {
  transform: translateY(4px);
  box-shadow: 0 2px 0 #ffb300;
}

/* TOP STATUS HUD BAR */
.hud-bar {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 16px;
}
.hud-item {
  flex: 1;
  background: #f1fbf0;
  border: 2px solid #c8e6c9;
  padding: 8px 4px;
  border-radius: 16px;
  font-weight: 700;
  font-size: 14px;
  color: #2e7d32;
  transition: opacity 0.2s ease;
}

/* SNAKE BOARD CANVAS BLOCK WRAPPER */
#gamePlayArea {
  display: block;
}
.board-container {
  display: inline-block;
  background: #eef7ee;
  border: 5px solid #a5d6a7;
  border-radius: 24px;
  overflow: hidden;
  margin: 10px 0;
  line-height: 0;
}
canvas {
  background: #fafafa;
}

/* FULL-WIDTH DETACHED QUIZ INTERFACE CANVAS */
#quizPlayArea {
  display: none;
  background: #ffffff;
  border-radius: 24px;
  padding: 10px;
  margin-top: 10px;
  animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.2);
}
@keyframes popIn {
  from { transform: scale(0.95); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.q-text {
  font-size: 19px;
  font-weight: 700;
  color: #1b5e20;
  margin-bottom: 16px;
  line-height: 1.5;
}
.hint-banner {
  font-size: 14px;
  font-weight: 700;
  color: #e65100;
  background: #fff3e0;
  padding: 10px 14px;
  border-radius: 14px;
  margin-bottom: 16px;
  border: 1px dashed #ffb74d;
}
.status-msg {
  font-size: 18px;
  font-weight: 800;
  margin-bottom: 14px;
  min-height: 24px;
}

.options-stack {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.opt-card {
  background: #f9f9f9;
  border: 3px solid #e0e0e0;
  color: #37474f;
  border-radius: 16px;
  padding: 14px;
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
  width: 100%;
  text-align: center;
  box-shadow: 0 4px 0 #e0e0e0;
  transition: all 0.1s ease;
}
.opt-card:active:not(:disabled) {
  transform: translateY(2px);
  box-shadow: 0 2px 0 #e0e0e0;
}
.opt-card.correct {
  background: #c8e6c9 !important;
  border-color: #81c784 !important;
  color: #1b5e20 !important;
  box-shadow: 0 4px 0 #66bb6a !important;
}
.opt-card.wrong {
  background: #ffcdd2 !important;
  border-color: #ef9a9a !important;
  color: #b71c1c !important;
  box-shadow: 0 4px 0 #e57373 !important;
  opacity: 0.6;
  cursor: not-allowed;
}

/* HIGH-ACCURACY LARGE TOUCH CONTROLS */
.dpad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(3, 1fr);
  gap: 10px;
  width: 160px;
  height: 160px;
  margin: 15px auto 0 auto;
}
.dpad-btn {
  background: #fff;
  border: 3px solid #c8e6c9;
  border-radius: 18px;
  font-size: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 4px 0 #c8e6c9;
}
.dpad-btn:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 #c8e6c9;
}

.bg-blob {
  position: absolute;
  border-radius: 50%;
  z-index: -1;
  filter: blur(40px);
  opacity: 0.4;
}
</style>
</head>
<body>

<div class="bg-blob" style="width:200px;height:200px;background:#c8e6c9;top:10%;left:5%;"></div>
<div class="bg-blob" style="width:250px;height:250px;background:#ffe082;bottom:10%;right:5%;"></div>

<div id="splashScreen" class="screen active">
  <img src="assets/innovine-logo.png" alt="Innovine Logo">
</div>

<div id="startScreen" class="screen">
  <div class="game-card">
    <h1>Animal Dash Quest</h1>
    <p style="font-size: 19px; line-height: 1.6; color: #43a047; font-weight: 700; margin: 25px 0;">
      Eat 2 treats with your snake to unlock and solve fun animal riddles!
    </p>
    <button class="btn-main" onclick="bootGame()">▶ Play Game</button>
  </div>
</div>

<div id="gameScreen" class="screen">
  <div class="game-card">
    
    <div class="hud-bar">
      <div class="hud-item" id="hudTreatsBox">🍎 Treats: <span id="lblFood">0/2</span></div>
      <div class="hud-item">⭐ Score: <span id="lblScore">0</span></div>
      <div class="hud-item" id="lblHearts">❤️❤️❤️</div>
    </div>

    <div id="gamePlayArea">
      <div class="board-container">
        <canvas id="stage" width="300" height="300"></canvas>
      </div>

      <div class="dpad">
        <div></div>
        <div class="dpad-btn" onclick="steer('UP')">⬆️</div>
        <div></div>
        <div class="dpad-btn" onclick="steer('LEFT')">⬅️</div>
        <div style="background:#f5f5f5; border-radius:14px;"></div>
        <div class="dpad-btn" onclick="steer('RIGHT')">➡️</div>
        <div></div>
        <div class="dpad-btn" onclick="steer('DOWN')">⬇️</div>
        <div></div>
      </div>
    </div>

    <div id="quizPlayArea">
      <div class="q-text" id="qContainer">Riddle statement goes right here...</div>
      <div class="hint-banner" id="hintContainer"></div>
      <div class="status-msg" id="msgContainer"></div>
      <div class="options-stack" id="optContainer"></div>
    </div>

  </div>
</div>

<div id="endScreen" class="screen">
  <div class="game-card">
    <h1 id="endTitle">Quest Done!</h1>
    <h2 style="color:#2e7d32; margin:15px 0;">Final Score: <span id="endScore">0</span></h2>
    <button class="btn-main" onclick="bootGame()">🔄 Play Again</button>
  </div>
</div>

<audio id="soundRight" preload="auto" src="assets/correct.mp3"></audio>
<audio id="soundWrong" preload="auto" src="assets/wrong.mp3"></audio>
<audio id="soundTrack" preload="auto" loop src="assets/snakegamesound.mp3"></audio>
<audio id="soundClaps" preload="auto" src="assets/freesound_community-claps-44774.mp3"></audio>

<script>
const questionsBank = [
  { q: "A farmer wants milk for his family every morning. Which animal should he keep?", a: "Cow", o: ["Cow", "Lion", "Duck"], h: "Hint: This friendly animal lives inside a shed and says 'Moo'!" },
  { q: "At night, a child hears a soft meowing outside the window. Which pet might be there?", a: "Cat", o: ["Cat", "Dog", "Frog"], h: "Hint: This furry pet has whiskers and loves drinking fresh milk!" },
  { q: "A small baby is seen playing near a dog. What is the baby dog called?", a: "Puppy", o: ["Puppy", "Kitten", "Calf"], h: "Hint: It is a small, playful baby animal that wags its tail!" },
  { q: "On a farm, one useful animal gives eggs for breakfast. Which animal is it?", a: "Hen", o: ["Hen", "Horse", "Rabbit"], h: "Hint: This feathered creature lives in a coop and can cluck!" },
  { q: "A little one looks up and sees beautiful feathers moving across the sky. Which animal is flying?", a: "Bird", o: ["Bird", "Fish", "Monkey"], h: "Hint: This animal has wings, chirps happily, and builds warm nests!" },
  { q: "A tiny buzzing creature is very busy flying near the colorful flowers. Which animal is it?", a: "Bee", o: ["Bee", "Ant", "Spider"], h: "Hint: This insect makes sweet golden honey inside a buzz-filled hive!" },
  { q: "Inside a deep forest den, a very loud roar is heard. Which animal lives there?", a: "Lion", o: ["Lion", "Deer", "Sheep"], h: "Hint: This brave wild predator is called the King of the Jungle!" },
  { q: "A child goes to a clear pond and sees an animal swimming around with shiny fins. Which animal is it?", a: "Fish", o: ["Fish", "Bird", "Cat"], h: "Hint: This little animal breathes underwater and lives inside ponds!" },
  { q: "A girl sees a small animal hopping quickly into a cozy hole in the ground. Which animal is it?", a: "Rabbit", o: ["Rabbit", "Goat", "Elephant"], h: "Hint: This animal has long soft ears and loves crunching on carrots!" },
  { q: "At a farm, a rider climbs safely onto an animal that lives inside a stable. Which animal is it?", a: "Horse", o: ["Horse", "Pig", "Bear"], h: "Hint: This strong animal runs super fast and says 'Neigh'!" }
];

const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");
const gridSize = 20; 
const tileCount = canvas.width / gridSize;

let snake = [], food = {x:0, y:0};
let dx = gridSize, dy = 0;
let score = 0, lives = 3, targetCounter = 0;
let loopEngine = null, isPaused = false;
let sessionQuestions = [], currentQ = null;
let wrongAttempts = 0; 
let quizCounter = 0; 

const sndRight = document.getElementById("soundRight");
const sndWrong = document.getElementById("soundWrong");
const sndTrack = document.getElementById("soundTrack");
const sndClaps = document.getElementById("soundClaps");

function navigate(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function bootGame() {
  score = 0;
  lives = 3;
  targetCounter = 0;
  quizCounter = 0;
  isPaused = false; 
  dx = gridSize; 
  dy = 0;
  
  sessionQuestions = shuffle([...questionsBank]);
  
  snake = [
    {x: gridSize * 4, y: gridSize * 5},
    {x: gridSize * 3, y: gridSize * 5},
    {x: gridSize * 2, y: gridSize * 5}
  ];
  
  // Make sure game field and its HUD elements are explicitly visible
  document.getElementById("gamePlayArea").style.display = "block";
  document.getElementById("hudTreatsBox").style.visibility = "visible";
  document.getElementById("quizPlayArea").style.display = "none";
  
  refreshFood();
  syncPanel();
  navigate("gameScreen");
  
  clearInterval(loopEngine);
  loopEngine = setInterval(gameTick, 450); 
  
  sndTrack.currentTime = 0;
  sndTrack.volume = 0.2;
  sndTrack.play().catch(()=>{});
}

function syncPanel() {
  document.getElementById("lblScore").textContent = score;
  document.getElementById("lblFood").textContent = `${targetCounter}/2`;
  let heartsStr = "";
  for(let i=0; i<3; i++) heartsStr += (i < lives) ? "❤️" : "🖤";
  document.getElementById("lblHearts").textContent = heartsStr;
}

function refreshFood() {
  food.x = Math.floor(Math.random() * tileCount) * gridSize;
  food.y = Math.floor(Math.random() * tileCount) * gridSize;
  snake.forEach(part => {
    if(part.x === food.x && part.y === food.y) refreshFood();
  });
}

function steer(dir) {
  if (isPaused) return;
  if (dir === "UP" && dy === 0) { dx = 0; dy = -gridSize; }
  if (dir === "DOWN" && dy === 0) { dx = 0; dy = gridSize; }
  if (dir === "LEFT" && dx === 0) { dx = -gridSize; dy = 0; }
  if (dir === "RIGHT" && dx === 0) { dx = gridSize; dy = 0; }
}

window.addEventListener("keydown", e => {
  if (e.key === "ArrowUp" || e.key.toLowerCase() === "w") steer("UP");
  if (e.key === "ArrowDown" || e.key.toLowerCase() === "s") steer("DOWN");
  if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") steer("LEFT");
  if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") steer("RIGHT");
});

function gameTick() {
  if (isPaused) return;
  
  const head = {x: snake[0].x + dx, y: snake[0].y + dy};
  
  if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
    handleFailure();
    return;
  }
  
  for (let i = 0; i < snake.length; i++) {
    if (snake[i].x === head.x && snake[i].y === head.y) {
      handleFailure();
      return;
    }
  }
  
  snake.unshift(head);
  
  if (head.x === food.x && head.y === food.y) {
    targetCounter++; 
    refreshFood();
    syncPanel();
    
    if (targetCounter >= 2) {
      isPaused = true;
      targetCounter = 0;
      quizCounter = 0; 
      triggerQuizRound();
      return;
    }
  } else {
    snake.pop();
  }
  
  renderCanvas();
}

function renderCanvas() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  ctx.fillStyle = "#ff8a80";
  ctx.beginPath();
  ctx.arc(food.x + gridSize/2, food.y + gridSize/2, gridSize/2 - 2, 0, Math.PI * 2);
  ctx.fill();
  
  snake.forEach((part, idx) => {
    ctx.fillStyle = idx === 0 ? "#81c784" : "#a5d6a7";
    ctx.beginPath();
    ctx.roundRect(part.x + 2, part.y + 2, gridSize - 4, gridSize - 4, [8]);
    ctx.fill();
  });
}

function handleFailure() {
  if (dx === gridSize) { dx = 0; dy = gridSize; }
  else if (dy === gridSize) { dx = -gridSize; dy = 0; }
  else if (dx === -gridSize) { dx = 0; dy = -gridSize; }
  else if (dy === -gridSize) { dx = gridSize; dy = 0; }
}

function triggerQuizRound() {
  wrongAttempts = 0; 
  
  if (sessionQuestions.length === 0) {
    terminateQuest(true);
    return;
  }
  
  // Cleanly switch visibility: Hide the game box AND hide its treats indicator counter from the HUD
  document.getElementById("gamePlayArea").style.display = "none";
  document.getElementById("hudTreatsBox").style.visibility = "hidden";
  document.getElementById("quizPlayArea").style.display = "block";
  
  currentQ = sessionQuestions.pop();
  quizCounter++; 
  
  document.getElementById("qContainer").textContent = currentQ.q;
  document.getElementById("hintContainer").textContent = currentQ.h;
  document.getElementById("msgContainer").textContent = "";
  
  const optBox = document.getElementById("optContainer");
  optBox.innerHTML = "";
  
  const shuffledOptions = shuffle([...currentQ.o]);
  shuffledOptions.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "opt-card";
    btn.textContent = opt;
    btn.onclick = () => verifyQuizAction(btn, opt === currentQ.a);
    optBox.appendChild(btn);
  });
}

function verifyQuizAction(element, isCorrect) {
  if (isCorrect) {
    score += 1;
    
    document.querySelectorAll(".opt-card").forEach(b => {
      b.disabled = true;
      if (b.textContent === currentQ.a) b.classList.add("correct");
    });
    
    const msg = document.getElementById("msgContainer");
    msg.style.color = "#2e7d32";
    msg.textContent = "Great Job! 🎉";
    
    sndRight.currentTime = 0;
    sndRight.play().catch(()=>{});
    syncPanel();
    
    setTimeout(() => {
      evaluateRoundProgression();
    }, 2000);
    
  } else {
    wrongAttempts++;
    
    if (wrongAttempts === 1) {
      element.classList.add("wrong");
      element.disabled = true;
      
      const msg = document.getElementById("msgContainer");
      msg.style.color = "#f57c00";
      msg.textContent = "Try again! You have 1 more choice! 🤔";
      
      sndWrong.currentTime = 0;
      sndWrong.play().catch(()=>{});
      
    } else {
      element.classList.add("wrong");
      document.querySelectorAll(".opt-card").forEach(b => {
        b.disabled = true;
        if (b.textContent === currentQ.a) b.classList.add("correct");
      });
      
      lives--;
      const msg = document.getElementById("msgContainer");
      msg.style.color = "#d32f2f";
      msg.textContent = "Let's check the right answer!";
      
      sndWrong.currentTime = 0;
      sndWrong.play().catch(()=>{});
      syncPanel();
      
      setTimeout(() => {
        if (lives <= 0) {
          terminateQuest(false);
        } else {
          evaluateRoundProgression();
        }
      }, 2000);
    }
  }
}

function evaluateRoundProgression() {
  if (sessionQuestions.length === 0) {
    terminateQuest(true);
    return;
  }
  
  if (quizCounter < 2) {
    triggerQuizRound();
  } else {
    // Return to the game loop safely: Re-display the game box AND turn the treats counter indicator back on
    document.getElementById("quizPlayArea").style.display = "none";
    document.getElementById("gamePlayArea").style.display = "block";
    document.getElementById("hudTreatsBox").style.visibility = "visible";
    isPaused = false;
    renderCanvas();
  }
}

function terminateQuest(isWin) {
  isPaused = true;
  clearInterval(loopEngine);
  sndTrack.pause();
  sndTrack.currentTime = 0;
  
  document.getElementById("endScore").textContent = score;
  const title = document.getElementById("endTitle");
  
  if (isWin) {
    title.textContent = "Super Animal Champ! 🏆";
    title.style.color = "#2e7d32";
    sndClaps.currentTime = 0;
    sndClaps.play().catch(()=>{});
  } else {
    title.textContent = "Game Over! Try Again! 💔";
    title.style.color = "#c62828";
  }
  
  navigate("endScreen");
}

window.addEventListener("load", () => {
  setTimeout(() => {
    navigate("startScreen");
  }, 5000);
});
</script>
</body>
</html>
