<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter 7: My Home Game</title>
    <style>
        :root {
            --bg-sky: #e0f2fe;
            --clay-orange: #f97316;
            --grass-green: #22c55e;
            --brick-red: #ef4444;
            --slate-dark: #1e293b;
            --board-green: #14532d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-sky);
            color: var(--slate-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Responsive Scrolling Canvas Screen Wrappers */
        .screen-layout {
            display: none;
            width: 100%;
            max-width: 600px;
            min-height: 100vh;
            padding: 15px;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            gap: 15px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .active-view {
            display: flex !important;
        }

        /* 1. Splash Loading Screen Alignment */
        #splash-screen {
            justify-content: center;
            background: #ffffff;
            gap: 25px;
        }
        .splash-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
        }
        .splash-logo {
            width: 65%;
            max-width: 250px;
            height: auto;
            animation: pulseSoft 1.5s infinite ease-in-out;
        }
        .loading-track {
            width: 60%;
            height: 10px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }
        .loading-bar-fill {
            width: 100%;
            height: 100%;
            background: var(--clay-orange);
            transform: translateX(-100%);
            animation: startLoad 4.5s forwards linear;
        }

        /* 2. Welcome View Setup */
        #welcome-screen {
            justify-content: center;
            text-align: center;
            gap: 30px;
        }
        .welcome-house {
            font-size: clamp(70px, 18vh, 120px);
            animation: floatMove 3s infinite ease-in-out;
        }
        .welcome-heading {
            font-size: clamp(22px, 5vw, 32px);
            color: #0369a1;
            font-weight: 800;
            line-height: 1.3;
        }

        /* Action Push Buttons */
        .btn-push {
            background: var(--clay-orange);
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: clamp(16px, 4vw, 22px);
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 6px 0 #c2410c;
            transition: transform 0.05s;
        }
        .btn-push:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #c2410c;
        }

        /* Top HUD Row */
        .hud-row {
            width: 100%;
            display: flex;
            justify-content: space-between;
            background: white;
            padding: 12px 20px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.04);
            font-weight: bold;
            font-size: clamp(14px, 3.5vw, 18px);
        }

        /* 3. Central Interactive Question Windows */
        .main-card {
            width: 100%;
            background: white;
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            border: 4px dashed #cbd5e1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .display-frame {
            width: 100%;
            max-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 12px;
        }
        .display-frame img {
            max-width: 100%;
            max-height: 200px;
            object-fit: contain;
        }
        .question-bubble {
            font-size: clamp(15px, 4vw, 19px);
            font-weight: 700;
            text-align: center;
            color: #334155;
            line-height: 1.4;
        }

        /* Multi-Image Dashboards (Level 3 Layout) */
        .multi-image-row {
            display: none;
            width: 100%;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 10px;
        }
        .scan-box {
            border: 4px solid #e2e8f0;
            border-radius: 12px;
            padding: 6px;
            background: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .scan-box img {
            width: 100%;
            height: 75px;
            object-fit: contain;
        }
        .scan-active {
            border-color: #eab308 !important;
            animation: pulseBorder 1.2s infinite alternate;
            background: #fef9c3;
        }
        .stamp-overlay {
            position: absolute;
            font-size: 28px;
            font-weight: 900;
            padding: 2px 6px;
            border-radius: 6px;
            transform: rotate(-15deg);
            display: none;
        }

        /* 4. Choice Button Arrays */
        .choice-stack {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .choice-item-btn {
            background: white;
            border: 3px solid #e2e8f0;
            border-radius: 16px;
            padding: 16px 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-align: center;
            font-weight: 700;
            font-size: clamp(14px, 3.8vw, 17px);
            color: #475569;
            box-shadow: 0 5px 0 #cbd5e1;
            width: 100%;
        }
        .choice-item-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #cbd5e1;
        }
        .choice-item-btn img {
            height: 60px;
            width: auto;
            object-fit: contain;
        }

        /* Level 3 Dual Stamp Button Layout */
        .stamp-row {
            display: none;
            width: 100%;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .btn-stamp {
            border: none;
            padding: 18px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            border-radius: 20px;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 6px 0 rgba(0,0,0,0.2);
        }
        .btn-danger { background: var(--brick-red); }
        .btn-safe { background: var(--grass-green); }
        .btn-stamp:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.2); }

        /* Animation Feedback Utility Rules */
        .animate-shake {
            animation: shakeLeftRight 0.4s ease-in-out !important;
            border-color: var(--brick-red) !important;
            background: #fef2f2 !important;
            color: var(--brick-red) !important;
        }
        .animate-pulse {
            animation: pulsePop 0.4s ease-in-out !important;
            border-color: var(--grass-green) !important;
            background: #f0fdf4 !important;
            color: var(--grass-green) !important;
        }

        /* Fullscreen Overlay Jumps */
        .overlay-screen {
            background: rgba(15, 23, 42, 0.96);
            color: white;
            justify-content: center;
            text-align: center;
            gap: 25px;
            padding: 25px;
        }
        .blackboard {
            background: var(--board-green);
            border: 10px solid #b45309;
            border-radius: 12px;
            padding: 25px 15px;
            width: 100%;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }
        .blackboard-text {
            font-size: clamp(16px, 4vw, 22px);
            color: #f0fdf4;
            line-height: 1.5;
            font-weight: bold;
        }

        /* CSS GPU Keyframe Configurations */
        @keyframes startLoad { from { transform: translateX(-100%); } to { transform: translateX(0%); } }
        @keyframes pulseSoft { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
        @keyframes floatMove { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        @keyframes pulsePop { 0% { transform: scale(1); } 50% { transform: scale(1.06); } 100% { transform: scale(1); } }
        @keyframes pulseBorder { from { border-color: #cbd5e1; } to { border-color: #eab308; } }
        @keyframes shakeLeftRight {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            50% { transform: translateX(6px); }
            75% { transform: translateX(-4px); }
        }
    </style>
</head>
<body>

    <audio id="audio-right" src="assets/correct.mp3" preload="auto"></audio>
    <audio id="audio-wrong" src="assets/wrong.mp3" preload="auto"></audio>
    <audio id="audio-cheer" src="assets/freesound_community-claps-44774.mp3" preload="auto"></audio>

    <div id="screen-splash" class="screen-layout active-view">
        <div class="splash-block">
            <img src="assets/innovine-logo.png" alt="Innovine Logo" class="splash-logo">
            <div class="loading-track">
                <div class="loading-bar-fill"></div>
            </div>
        </div>
    </div>

    <div id="screen-welcome" class="screen-layout">
        <div class="welcome-house">🏠</div>
        <h1 class="welcome-heading">Build and Protect<br>Your Dream Home!</h1>
        <button class="btn-push" onclick="changeScreen('screen-game'); startNewLevel(1);">▶ Start Game</button>
    </div>

    <div id="screen-game" class="screen-layout">
        <div class="hud-row">
            <span id="hud-level-lbl">Level: 1/3</span>
            <span id="hud-score-lbl">Points: 0</span>
        </div>

        <div class="main-card">
            <div id="dashboard-split" class="multi-image-row">
                <div id="box-waste" class="scan-box"><img src="assets/throwingwaste.png"><div class="stamp-overlay"></div></div>
                <div id="box-ladder" class="scan-box"><img src="assets/climbingladder.png"><div class="stamp-overlay"></div></div>
                <div id="box-matches" class="scan-box"><img src="assets/playingwithmatchbox.png"><div class="stamp-overlay"></div></div>
            </div>

            <div id="canvas-img-frame" class="display-frame">
                <img id="canvas-target-pic" src="">
            </div>
            <div id="canvas-prompt-msg" class="question-bubble">Loading question...</div>
        </div>

        <div id="wrapper-choices" class="choice-stack"></div>

        <div id="wrapper-stamps" class="stamp-row">
            <button class="btn-stamp btn-danger" onclick="evaluateStampInput(false)">🛑 DANGER</button>
            <button class="btn-stamp btn-safe" onclick="evaluateStampInput(true)">💪 SAFE</button>
        </div>
    </div>

    <div id="screen-explain" class="screen-layout overlay-screen">
        <div style="font-size: 65px;">💡</div>
        <h2 style="color: #f59e0b; font-size: 26px;">Let's Think!</h2>
        <p id="explain-message-text" style="font-size: 17px; max-width: 400px; line-height: 1.5; font-weight: 600;"></p>
        <button class="btn-push" style="background:#3b82f6; box-shadow: 0 6px 0 #1d4ed8;" onclick="returnToGameLayout()">Try Again 🔄</button>
    </div>

    <div id="screen-chalkboard" class="screen-layout overlay-screen">
        <div class="blackboard">
            <p id="chalkboard-story-txt" class="blackboard-text"></p>
        </div>
        <button id="chalkboard-next-btn" class="btn-push" onclick="progressFromChalkboard()">Next Level ➔</button>
    </div>

    <div id="screen-victory" class="screen-layout overlay-screen" style="background: #1e1b4b;">
        <div style="font-size: 90px; animation: floatMove 2.5s infinite ease-in-out;">🏆</div>
        <h1 style="color: #f59e0b; font-size: 32px; font-weight: 900;">Super Eco Hero!</h1>
        <p style="font-size: 18px; max-width: 450px; color: #cbd5e1; font-weight: 600;">You know all about houses, clean rooms, and how to stay safe!</p>
        <button class="btn-push" onclick="restartWholeApp()">Play Again 🔄</button>
    </div>

    <script>
        // High-Speed Active Preload Layer for Level 1 Assets
        const priorityPics = ["assets/building.png", "assets/hut.png", "assets/igloo.png"];
        priorityPics.forEach(path => { const dummy = new Image(); dummy.src = path; });

        // Background Deferred Asset Preload Loop
        window.addEventListener('load', () => {
            setTimeout(() => {
                const backgroundPics = [
                    "assets/kitchen.png", "assets/bedroom.png", "assets/livingroom.png",
                    "assets/throwingwaste.png", "assets/climbingladder.png", "assets/playingwithmatchbox.png"
                ];
                backgroundPics.forEach(path => { const dummy = new Image(); dummy.src = path; });
            }, 1200);

            // Auto-advance Splash view layer
            setTimeout(() => { changeScreen('screen-welcome'); }, 4500);
        });

        // App Runtime Variables
        let activeLevel = 1;
        let scoreCounter = 0;
        let roundIndex = 0;
        let roundItem = null;
        let setList = [];
        let controlLock = false;

        // Simplified Grade-1 Context Content Array Database
        const contentDataMap = {
            level1: {
                instruction: "Read the hint. Choose the correct house!",
                rounds: [
                    {
                        isVisualChoice: true,
                        prompt: "Heavy rain and strong winds hit a town. Which solid house built with bricks and cement stays strong?",
                        choices: [
                            { img: "assets/building.png", isCorrect: true },
                            { img: "assets/hut.png", isCorrect: false, hint: "A village mud hut is a weak house. Strong wind can break its straw roof!" },
                            { img: "assets/igloo.png", isCorrect: false, hint: "An igloo is built from cold blocks of ice, not for people living in towns!" }
                        ]
                    },
                    {
                        isVisualChoice: true,
                        prompt: "It is freezing cold and snowing on a mountain. Which dome home is built out of hard blocks of white ice?",
                        choices: [
                            { img: "assets/igloo.png", isCorrect: true },
                            { img: "assets/building.png", isCorrect: false, hint: "Brick buildings are made for cities, not for deep freezing snow mountains!" },
                            { img: "assets/hut.png", isCorrect: false, hint: "Mud huts would freeze completely! Snow blocks keep the inside of an igloo warm." }
                        ]
                    },
                    {
                        isVisualChoice: true,
                        prompt: "A poor village farmer wants to make a simple, low-cost Kutcha house out of natural mud and straw. What should he build?",
                        choices: [
                            { img: "assets/hut.png", isCorrect: true },
                            { img: "assets/building.png", isCorrect: false, hint: "Brick apartment buildings cost lots of money and require cement blocks!" },
                            { img: "assets/igloo.png", isCorrect: false, hint: "An igloo requires blocks of frozen mountain ice, not mud fields!" }
                        ]
                    }
                ],
                summary: "Houses protect us from hot sun, cold wind, rain, and wild animals! Strong houses are built with bricks. Weak huts are made with mud."
            },
            level2: {
                instruction: "Look at the room carefully!",
                rounds: [
                    {
                        bgImage: "assets/kitchen.png",
                        prompt: "Look at this kitchen! Someone left a soft sleeping pillow right next to the hot gas stove. Why is this wrong?",
                        choices: [
                            { text: "Pillows belong in the bedroom! It can catch fire near a hot stove.", isCorrect: true },
                            { text: "A kitchen always needs a cold refrigerator to store fresh milk.", isCorrect: false, hint: "That is true, but it does not fix the dangerous sleeping pillow sitting on the hot stove!" },
                            { text: "This is a living room where we sit and talk with guests.", isCorrect: false, hint: "Look closer! There is a cooking stove here. This is the kitchen room!" }
                        ]
                    },
                    {
                        bgImage: "assets/bedroom.png",
                        prompt: "Look at this bedroom! A sharp, wet kitchen knife was left on the bed blanket where you sleep. What must you do?",
                        choices: [
                            { text: "Move the sharp knife to the kitchen! It can cut you in bed.", isCorrect: true },
                            { text: "Leave it on the blanket because bed pillows are safe.", isCorrect: false, hint: "No! A sharp knife in bed is very dangerous and can cause cuts while you sleep!" },
                            { text: "Go take a splashy water bath inside the bathroom.", isCorrect: false, hint: "Taking a bath is nice, but it does not remove the dangerous knife from your bed sheets!" }
                        ]
                    },
                    {
                        bgImage: "assets/livingroom.png",
                        prompt: "Look at this living room! Someone brought a bucket of soapy water here and spilled it all over the floor by the sofa. Why is this bad?",
                        choices: [
                            { text: "Bathwater belongs in the bathroom! Spilled water makes guests slip and fall.", isCorrect: true },
                            { text: "Turn on the television set to watch funny cartoons.", isCorrect: false, hint: "Watching TV is fun, but someone might still step on the wet puddle and slip down!" },
                            { text: "We must drink fresh glass water while sitting on the sofa.", isCorrect: false, hint: "This is dirty, soapy puddle water from a bucket, not clean drinking water!" }
                        ]
                    }
                ],
                summary: "A good home has many clean rooms. Every room has its own work. We cook in the kitchen, sleep in the bedroom, and greet guests in the living room."
            },
            level3: {
                rounds: [
                    { target: "matches", isSafe: false, text: "A child is sitting alone and striking matches from a real box. If a tiny fire spark jumps on the cloth curtains, what will happen?", hint: "Fire grows very fast on cloth and wood. Matchboxes are tools for grown-ups, never toys for kids!" },
                    { target: "ladder", isSafe: false, text: "A child is climbing very high up on a shaky step ladder to grab a toy. If the heavy frame tilts over, what will happen?", hint: "Falling down from high ladders onto hard floors causes bad bone hurts. Always ask a grown-up to help you get high toys!" },
                    { target: "waste", isSafe: true, text: "A boy is walking in a green open park and carefully throws his trash inside a proper waste bin. Why is this a great habit?", hint: "Cleaning up outdoor parks and gardens keeps our world safe and stops bad flies or bugs from spreading sickness!" }
                ],
                summary: "We must throw garbage inside a covered bin to keep flies away. Never play with sharp objects, electrical sockets, or fire matchsticks, as they can hurt you!"
            }
        };

        // Screen Routing Engine
        function changeScreen(id) {
            document.querySelectorAll('.screen-layout').forEach(s => s.classList.remove('active-view'));
            document.getElementById(id).classList.add('active-view');
        }

        // Shuffle Utility Loop
        function scramble(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Trigger Sound Wrapper
        function playAudioClip(id) {
            const clip = document.getElementById(id);
            if (clip) {
                clip.currentTime = 0;
                clip.play().catch(() => {});
            }
        }

        // Start Level Configuration
        function startNewLevel(lvlNum) {
            activeLevel = lvlNum;
            roundIndex = 0;
            document.getElementById('hud-level-lbl').innerText = "Level: " + activeLevel + "/3";
            
            const key = "level" + activeLevel;
            setList = [...contentDataMap[key].rounds];
            scramble(setList);

            // Toggle Layout panels depending on current level mode rules
            if (activeLevel === 3) {
                document.getElementById('dashboard-split').style.display = "grid";
                document.getElementById('canvas-img-frame').style.display = "none";
                document.getElementById('wrapper-choices').style.display = "none";
                document.getElementById('wrapper-stamps').style.style;
                document.getElementById('wrapper-stamps').style.display = "grid";
                
                // Reset Level 3 stamp views
                document.querySelectorAll('.scan-box').forEach(b => {
                    b.className = "scan-box";
                    b.querySelector('.stamp-overlay').style.display = "none";
                });
            } else {
                document.getElementById('dashboard-split').style.display = "none";
                document.getElementById('canvas-img-frame').style.display = "flex";
                document.getElementById('wrapper-choices').style.display = "flex";
                document.getElementById('wrapper-stamps').style.display = "none";
            }

            loadRoundData();
        }

        // Render Current Question Options
        function loadRoundData() {
            controlLock = false;
            roundItem = setList[roundIndex];

            if (activeLevel === 1) {
                document.getElementById('canvas-target-pic').style.display = "none";
                document.getElementById('canvas-prompt-msg').innerText = roundItem.prompt;
                buildVisualChoices(roundItem.choices);
            } 
            else if (activeLevel === 2) {
                const imgNode = document.getElementById('canvas-target-pic');
                imgNode.src = roundItem.bgImage;
                imgNode.style.display = "block";
                document.getElementById('canvas-prompt-msg').innerText = roundItem.prompt;
                buildTextChoices(roundItem.choices);
            } 
            else if (activeLevel === 3) {
                document.querySelectorAll('.scan-box').forEach(b => b.classList.remove('scan-active'));
                
                // Highlight corresponding scan panel block box
                const activeBox = document.getElementById("box-" + roundItem.target);
                if (activeBox) activeBox.classList.add('scan-active');
                
                document.getElementById('canvas-prompt-msg').innerText = roundItem.text;
            }
        }

        // Render Level 1 Visual Image Buttons
        function buildVisualChoices(choicesArray) {
            const listContainer = document.getElementById('wrapper-choices');
            listContainer.innerHTML = "";
            let pool = [...choicesArray];
            scramble(pool);

            pool.forEach(c => {
                const btn = document.createElement('button');
                btn.className = "choice-item-btn";
                btn.dataset.correct = c.isCorrect;
                btn.dataset.hint = c.hint || "";

                const img = document.createElement('img');
                img.src = c.img;
                btn.appendChild(img);

                btn.addEventListener('click', processPlayerClick);
                listContainer.appendChild(btn);
            });
        }

        // Render Level 2 Text Options Buttons
        function buildTextChoices(choicesArray) {
            const listContainer = document.getElementById('wrapper-choices');
            listContainer.innerHTML = "";
            let pool = [...choicesArray];
            scramble(pool);

            pool.forEach(c => {
                const btn = document.createElement('button');
                btn.className = "choice-item-btn";
                btn.dataset.correct = c.isCorrect;
                btn.dataset.hint = c.hint || "";

                const txt = document.createElement('span');
                txt.innerText = c.text;
                btn.appendChild(txt);

                btn.addEventListener('click', processPlayerClick);
                listContainer.appendChild(btn);
            });
        }

        // Evaluate Selection Input for Levels 1 and 2
        function processPlayerClick(e) {
            if (controlLock) return;
            const btn = e.currentTarget;
            const isCorrect = btn.dataset.correct === "true";

            if (isCorrect) {
                controlLock = true;
                scoreCounter += 10;
                document.getElementById('hud-score-lbl').innerText = "Points: " + scoreCounter;
                btn.classList.add('animate-pulse');
                playAudioClip('audio-right');

                setTimeout(() => {
                    advanceRoundIndex();
                }, 800);
            } else {
                controlLock = true;
                btn.classList.add('animate-shake');
                playAudioClip('audio-wrong');

                setTimeout(() => {
                    document.getElementById('explain-message-text').innerText = btn.dataset.hint;
                    changeScreen('screen-explain');
                }, 500);
            }
        }

        // Evaluate Input Stamps for Level 3
        function evaluateStampInput(pressedSafeButton) {
            if (controlLock) return;
            const targetIsSafe = roundItem.isSafe;
            const targetBox = document.getElementById("box-" + roundItem.target);
            const stampElement = targetBox.querySelector('.stamp-overlay');

            if (pressedSafeButton === targetIsSafe) {
                controlLock = true;
                scoreCounter += 10;
                document.getElementById('hud-score-lbl').innerText = "Points: " + scoreCounter;
                playAudioClip('audio-right');

                // Render Visual Stamp Overlays on target block
                if (targetIsSafe) {
                    stampElement.innerText = "SAFE ✅";
                    stampElement.style.color = "var(--grass-green)";
                    stampElement.style.border = "3px solid var(--grass-green)";
                } else {
                    stampElement.innerText = "DANGER 🛑";
                    stampElement.style.color = "var(--brick-red)";
                    stampElement.style.border = "3px solid var(--brick-red)";
                }
                stampElement.style.display = "block";
                targetBox.classList.remove('scan-active');

                setTimeout(() => {
                    advanceRoundIndex();
                }, 900);
            } else {
                controlLock = true;
                targetBox.classList.add('animate-shake');
                playAudioClip('audio-wrong');

                setTimeout(() => {
                    targetBox.classList.remove('animate-shake');
                    document.getElementById('explain-message-text').innerText = roundItem.hint;
                    changeScreen('screen-explain');
                }, 500);
            }
        }

        // Handle Round Index Progression Logic
        function advanceRoundIndex() {
            roundIndex++;
            if (roundIndex < setList.length) {
                loadRoundData();
            } else {
                const key = "level" + activeLevel;
                document.getElementById('chalkboard-story-txt').innerText = contentDataMap[key].summary;
                
                if (activeLevel === 3) {
                    document.getElementById('chalkboard-next-btn').innerText = "Finish Quest 🏆";
                } else {
                    document.getElementById('chalkboard-next-btn').innerText = "Next Level ➔";
                }
                changeScreen('screen-chalkboard');
            }
        }

        // Return from help view box screen
        function returnToGameLayout() {
            changeScreen('screen-game');
            loadRoundData(); // Shuffles layout options again automatically
        }

        // Handle Chalkboard Navigation Buttons
        function progressFromChalkboard() {
            if (activeLevel < 3) {
                startNewLevel(activeLevel + 1);
                changeScreen('screen-game');
            } else {
                playAudioClip('audio-cheer');
                changeScreen('screen-victory');
            }
        }

        // Full App Restart
        function restartWholeApp() {
            scoreCounter = 0;
            document.getElementById('hud-score-lbl').innerText = "Points: 0";
            changeScreen('screen-welcome');
        }
    </script>
</body>
</html>
