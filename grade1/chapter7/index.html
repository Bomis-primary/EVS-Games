<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chapter 7: My Home Game</title>
    <style>
        :root {
            --bg-sky: #e0f2fe;
            --clay-orange: #f97316;
            --grass-green: #22c55e;
            --brick-red: #ef4444;
            --slate-dark: #1e293b;
            --board-green: #14532d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-sky);
            color: var(--slate-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Screen Layout Wrapper (Scrollable Up and Down) */
        .screen-layout {
            display: none;
            width: 100%;
            max-width: 650px;
            min-height: 100vh;
            padding: 15px;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            gap: 15px;
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch;
        }

        .active-view {
            display: flex !important;
        }

        /* 5-Second Splash Loader Screen */
        #screen-splash {
            background: #ffffff;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 25px;
            z-index: 9999;
        }
        .splash-logo {
            width: 75%;
            max-width: 300px;
            animation: pulseSoft 1.5s infinite ease-in-out;
        }
        .loading-track {
            width: 65%;
            max-width: 260px;
            height: 14px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #cbd5e1;
        }
        .loading-bar-fill {
            width: 100%;
            height: 100%;
            background: var(--clay-orange);
            transform: translateX(-100%);
            animation: startLoad 4.5s forwards linear;
        }

        /* Welcome Main Menu */
        #screen-welcome {
            justify-content: center;
            text-align: center;
            gap: 25px;
        }
        .welcome-house {
            font-size: clamp(80px, 20vh, 130px);
            animation: floatMove 3s infinite ease-in-out;
        }
        .welcome-heading {
            font-size: clamp(26px, 6.5vw, 36px);
            color: #0369a1;
            font-weight: 800;
        }

        .btn-push {
            background: var(--clay-orange);
            color: white;
            border: none;
            padding: 16px 45px;
            font-size: clamp(18px, 4.5vw, 22px);
            font-weight: bold;
            border-radius: 35px;
            cursor: pointer;
            box-shadow: 0 7px 0 #c2410c;
        }
        .btn-push:active {
            transform: translateY(4px);
            box-shadow: 0 3px 0 #c2410c;
        }

        .hud-row {
            width: 100%;
            display: flex;
            justify-content: space-between;
            background: white;
            padding: 12px 20px;
            border-radius: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.04);
            font-weight: 800;
            font-size: 18px;
            flex-shrink: 0;
        }

        /* Main Game Arena Adaptive Display Card */
        .main-card {
            width: 100%;
            background: white;
            border-radius: 24px;
            padding: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.06);
            border: 4px dashed #94a3b8;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            flex-shrink: 0;
        }
        .display-frame {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            background-color: #fafafa;
            position: relative;
        }
        .display-frame img {
            width: 100%;
            max-width: 380px; 
            height: auto;
            max-height: 220px;
            object-fit: contain;
            border-radius: 12px;
        }

        .question-bubble {
            font-size: clamp(16px, 4.2vw, 20px);
            font-weight: 700;
            text-align: center;
            color: #0369a1;
            line-height: 1.4;
            white-space: pre-line;
            padding: 0 5px;
        }

        /* Touch Swipeable Conveyor Belt Track Framework */
        .conveyor-belt-system {
            width: 100%;
            background: #475569;
            border-top: 6px solid #334155;
            border-bottom: 8px solid #1e293b;
            padding: 16px 0;
            overflow-x: auto;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            border-radius: 20px;
            box-shadow: inset 0 8px 16px rgba(0,0,0,0.4);
            flex-shrink: 0;
        }
        .conveyor-belt-system::-webkit-scrollbar {
            display: none;
        }

        .conveyor-track-infinite {
            display: flex;
            width: max-content;
            gap: 25px;
            padding: 0 20px;
            animation: moveConveyorLoop 25s linear infinite;
        }

        .conveyor-belt-system:active .conveyor-track-infinite {
            animation-play-state: paused;
        }

        .choice-item-btn {
            background: white;
            border: 4px solid #cbd5e1;
            border-radius: 20px;
            padding: 12px 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-align: center;
            font-weight: 700;
            font-size: 15px;
            color: #1e293b;
            box-shadow: 0 6px 0 #94a3b8;
            flex-shrink: 0;
            max-width: 260px;
        }
        .choice-item-btn img {
            height: 90px;
            width: auto;
            object-fit: contain;
        }

        /* Level 3 Habit Selection Action Button Layout */
        .stamp-row {
            display: none;
            width: 100%;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            flex-shrink: 0;
        }
        .btn-stamp {
            border: none;
            padding: 20px 10px;
            font-size: 18px;
            font-weight: 900;
            color: white;
            border-radius: 24px;
            cursor: pointer;
            box-shadow: 0 7px 0 rgba(0,0,0,0.25);
        }
        .btn-danger { background: var(--brick-red); box-shadow: 0 7px 0 #b91c1c; }
        .btn-safe { background: var(--grass-green); box-shadow: 0 7px 0 #15803d; }
        .btn-stamp:active { transform: translateY(4px); box-shadow: 0 3px 0 rgba(0,0,0,0.25); }

        .stamp-feedback-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-10deg);
            font-size: 36px;
            font-weight: 950;
            padding: 10px 20px;
            border-radius: 16px;
            background: white;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            display: none;
            z-index: 10;
        }

        .animate-shake { animation: shakeLeftRight 0.4s ease-in-out; border-color: var(--brick-red)!important; background: #fef2f2!important; }
        .animate-pulse { animation: pulsePop 0.4s ease-in-out; border-color: var(--grass-green)!important; background: #f0fdf4!important; }

        .overlay-screen {
            background: rgba(15, 23, 42, 0.97);
            color: white;
            justify-content: center;
            text-align: center;
            gap: 25px;
            padding: 25px;
        }
        .blackboard {
            background: var(--board-green);
            border: 12px solid #b45309;
            border-radius: 16px;
            padding: 30px 20px;
            width: 100%;
            box-shadow: inset 0 0 25px rgba(0,0,0,0.6);
        }
        .blackboard-text {
            font-size: 20px;
            color: #f0fdf4;
            line-height: 1.5;
            font-weight: bold;
        }

        @keyframes moveConveyorLoop {
            0% { transform: translateX(0); }
            100% { transform: translateX(calc(-50% - 12px)); }
        }
        @keyframes startLoad { from { transform: translateX(-100%); } to { transform: translateX(0%); } }
        @keyframes pulseSoft { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
        @keyframes floatMove { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes pulsePop { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        @keyframes shakeLeftRight {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            50% { transform: translateX(6px); }
            75% { transform: translateX(-4px); }
        }
    </style>
</head>
<body>

    <audio id="audio-right" src="assets/correct.mp3" preload="auto"></audio>
    <audio id="audio-wrong" src="assets/wrong.mp3" preload="auto"></audio>
    <audio id="audio-cheer" src="assets/freesound_community-claps-44774.mp3" preload="auto"></audio>

    <div id="screen-splash">
        <img src="assets/innovine-logo.png" alt="Innovine Logo" class="splash-logo">
        <div class="loading-track">
            <div class="loading-bar-fill"></div>
        </div>
    </div>

    <div id="screen-welcome" class="screen-layout">
        <div class="welcome-house">🏠</div>
        <h1 class="welcome-heading">My Home Game!</h1>
        <button class="btn-push" onclick="changeScreen('screen-game'); startNewLevel(1);">▶ Start Game</button>
    </div>

    <div id="screen-game" class="screen-layout">
        <div class="hud-row">
            <span id="hud-level-lbl">Level: 1/3</span>
            <span id="hud-score-lbl">Points: 0</span>
        </div>

        <div class="main-card">
            <div id="canvas-img-frame" class="display-frame">
                <img id="canvas-target-pic" src="">
                <div id="stamp-alert-overlay" class="stamp-feedback-overlay"></div>
            </div>
            
            <div id="canvas-prompt-msg" class="question-bubble">Loading...</div>
        </div>

        <div id="wrapper-conveyor-housing" class="conveyor-belt-system">
            <div id="wrapper-choices" class="conveyor-track-infinite"></div>
        </div>

        <div id="wrapper-stamps" class="stamp-row">
            <button class="btn-stamp btn-danger" onclick="evaluateStampInput(false)">🛑 NOT SAFE</button>
            <button class="btn-stamp btn-safe" onclick="evaluateStampInput(true)">💚 GOOD HABIT</button>
        </div>
    </div>

    <div id="screen-explain" class="screen-layout overlay-screen">
        <div style="font-size: 65px;">💡</div>
        <h2 style="color: #f59e0b; font-size: 26px;">Let's Think!</h2>
        <p id="explain-message-text" style="font-size: 18px; max-width: 420px; line-height: 1.5; font-weight: 600;"></p>
        <button class="btn-push" style="background:#3b82f6; box-shadow: 0 6px 0 #1d4ed8;" onclick="returnToGameLayout()">Try Again 🔄</button>
    </div>

    <div id="screen-chalkboard" class="screen-layout overlay-screen">
        <div class="blackboard">
            <p id="chalkboard-story-txt" class="blackboard-text"></p>
        </div>
        <button id="chalkboard-next-btn" class="btn-push" onclick="progressFromChalkboard()">Next Level ➔</button>
    </div>

    <div id="screen-victory" class="screen-layout overlay-screen" style="background: #1e1b4b;">
        <div style="font-size: 90px; animation: floatMove 2.5s infinite ease-in-out;">🏆</div>
        <h1 style="color: #f59e0b; font-size: 32px; font-weight: 900;">Super Eco Hero!</h1>
        <p style="font-size: 18px; max-width: 450px; color: #cbd5e1; font-weight: 600;">You know all about houses, clean rooms, and how to stay safe!</p>
        <button class="btn-push" onclick="restartWholeApp()">Play Again 🔄</button>
    </div>

    <script>
        const priorityPics = ["assets/building.png", "assets/hut.png", "assets/igloo.png"];
        priorityPics.forEach(path => { const dummy = new Image(); dummy.src = path; });

        window.addEventListener('load', () => {
            setTimeout(() => {
                const backgroundPics = [
                    "assets/kitchen.png", "assets/bedroom.png", "assets/livingroom.png",
                    "assets/throwingwaste.png", "assets/climbingladder.png", "assets/playingwithmatchbox.png"
                ];
                backgroundPics.forEach(path => { const dummy = new Image(); dummy.src = path; });
            }, 1000);

            // Firm 5000ms delay hold logic before booting screen-welcome
            setTimeout(() => { 
                document.getElementById('screen-splash').style.display = 'none';
                changeScreen('screen-welcome'); 
            }, 5000);
        });

        let activeLevel = 1;
        let scoreCounter = 0;
        let roundIndex = 0;
        let roundItem = null;
        let setList = [];
        let controlLock = false;

        const contentDataMap = {
            level1: {
                rounds: [
                    {
                        prompt: "Brrr! Chiku the monkey is freezing in the mountain snow! ❄️\nWhere should he hide to stay warm?",
                        correctChoice: { img: "assets/igloo.png" },
                        wrongHints: [
                            "Oh no! Mud and regular town bricks will crack and freeze in deep mountain snow. Chiku needs a special ice block dome!",
                            "A mud hut will freeze completely! Only thick ice blocks can keep out the shivering mountain storm."
                        ]
                    },
                    {
                        prompt: "Welcome to busy Mumbai city! There is no flat ground land left! 🚗\nWhich home stacks rooms up high into the clouds?",
                        correctChoice: { img: "assets/building.png" },
                        wrongHints: [
                            "Think about the busy city! A village mud hut takes up too much ground space. A tall building stacks homes high up!",
                            "An igloo is made from soft freezing snow blocks. You will not find them inside a hot concrete city!"
                        ]
                    },
                    {
                        prompt: "Look at this lovely farm village! 🌾\nWhat can the farmer build today using only mud and straw grass?",
                        correctChoice: { img: "assets/hut.png" },
                        wrongHints: [
                            "Wait! There are no big concrete mixers in a green farm field. The farmer must use the grass and mud to make a simple hut!",
                            "There is no freezing mountain snow in a warm green farming field to build ice structures!"
                        ]
                    }
                ],
                summary: "Houses keep us safe from the hot sun, cold wind, rain, and wild animals! Strong houses use bricks. Weak huts use mud."
            },
            level2: {
                // FIXED: The user choice is the ONLY intruder. The surrounding loop consists entirely of safe objects belonging to that exact room.
                rounds: [
                    {
                        bgImage: "assets/kitchen.png",
                        prompt: "Mother is getting ready to cook delicious hot rotis. 🍳\nIdentify the bedroom object that does NOT belong on the counter:",
                        correctText: "A soft sleeping pillow",
                        roomDecoys: ["A clean frying pan", "A metal kitchen toaster", "A shiny tea kettle", "A blending jar"],
                        hint: "A soft pillow belongs in the bedroom on your bed. If it gets near a hot cooking stove, it can catch fire instantly!"
                    },
                    {
                        bgImage: "assets/bedroom.png",
                        prompt: "Mina is yawning and wants to jump straight into her cozy bed. 💤\nWhat dangerous kitchen item did the Messy Monster leave on her blanket?",
                        correctText: "A sharp kitchen knife",
                        roomDecoys: ["A colorful story book", "A soft teddy bear", "A cozy night lamp", "A warm winter quilt"],
                        hint: "A sharp cooking knife belongs safely inside a closed drawer. Leaving it out on a bed can accidentally cut your hand or fingers!"
                    },
                    {
                        bgImage: "assets/livingroom.png",
                        prompt: "Ding-dong! A special guest walks through the front door. 🚪\nWhich spill on the floor tiles will make them slip and fall?",
                        correctText: "A puddle of soapy water",
                        roomDecoys: ["A soft pair of slippers", "A wooden toy block", "A remote control", "A colorful floor mat"],
                        hint: "Soapy wash water belongs inside a bathroom bucket. Spilling it where people walk makes the floor slick like ice!"
                    }
                ],
                summary: "Our home has different rooms. We cook in the kitchen, sleep in the bedroom, and welcome guests in the living room."
            },
            level3: {
                // FIXED: Unique 3-round sequence using custom action buttons labels.
                rounds: [
                    { src: "assets/playingwithmatchbox.png", isSafe: false, prompt: "This boy is striking matches all alone to watch the sparks. 🔥\nIs this action a good habit or not safe?", hint: "Stop! A single tiny matchstick spark can catch onto curtains or clothes and cause a giant fire. Matches are tools for grown-ups, never toys!" },
                    { src: "assets/climbingladder.png", isSafe: false, prompt: "Look! Someone is climbing a tall, wobbly ladder to reach a toy. 🪜\nWho can tell if this action is a good habit or not safe?", hint: "Watch out! Shaky ladders can tip over easily. Falling from high up will hurt your bones. Always wait and ask a grown-up for help!" },
                    { src: "assets/throwingwaste.png", isSafe: true, prompt: "This helpful child is throwing his empty wrapper into the trash. ✨\nHow do we rate this choice—is it a good habit or not safe?", hint: "This is awesome behavior! Putting waste directly into the dustbin stops dirty houseflies, mosquitoes, and mice from spreading sickness." }
                ],
                summary: "Throw trash inside a closed bin to keep bugs away. Never play with sharp knives, hot stoves, or matchsticks because they can hurt you!"
            }
        };

        function changeScreen(id) {
            document.querySelectorAll('.screen-layout').forEach(s => s.classList.remove('active-view'));
            const target = document.getElementById(id);
            if (target) target.classList.add('active-view');
        }

        function scramble(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function playAudioClip(id) {
            const clip = document.getElementById(id);
            if (clip) {
                clip.currentTime = 0;
                clip.play().catch(() => {});
            }
        }

        function startNewLevel(lvlNum) {
            activeLevel = lvlNum;
            roundIndex = 0;
            document.getElementById('hud-level-lbl').innerText = "Level: " + activeLevel + "/3";
            
            const key = "level" + activeLevel;
            setList = [...contentDataMap[key].rounds];
            scramble(setList);

            if (activeLevel === 3) {
                document.getElementById('wrapper-conveyor-housing').style.display = "none";
                document.getElementById('wrapper-stamps').style.display = "grid";
            } else {
                document.getElementById('wrapper-conveyor-housing').style.display = "block";
                document.getElementById('wrapper-stamps').style.display = "none";
            }

            loadRoundData();
        }

        function loadRoundData() {
            controlLock = false;
            roundItem = setList[roundIndex];

            document.getElementById('stamp-alert-overlay').style.display = "none";
            const track = document.getElementById('wrapper-choices');
            track.style.animationPlayState = "running";
            document.getElementById('wrapper-conveyor-housing').scrollLeft = 0;

            const imgNode = document.getElementById('canvas-target-pic');
            document.getElementById('canvas-prompt-msg').innerText = roundItem.prompt;

            if (activeLevel === 1) {
                imgNode.style.display = "none";
                buildLevel1Belt();
            } 
            else if (activeLevel === 2) {
                imgNode.src = roundItem.bgImage;
                imgNode.style.display = "block";
                buildLevel2Belt();
            } 
            else if (activeLevel === 3) {
                imgNode.src = roundItem.src;
                imgNode.style.display = "block";
            }
        }

        function buildLevel1Belt() {
            const track = document.getElementById('wrapper-choices');
            track.innerHTML = "";

            let items = [];
            items.push({ img: roundItem.correctChoice.img, isCorrect: true, hint: "" });
            
            let hintsCounter = 0;
            contentDataMap.level1.rounds.forEach(r => {
                if (r.correctChoice.img !== roundItem.correctChoice.img) {
                    items.push({ img: r.correctChoice.img, isCorrect: false, hint: roundItem.wrongHints[hintsCounter++] });
                }
            });

            scramble(items);
            const continuousPool = [...items, ...items];

            continuousPool.forEach(c => {
                const btn = document.createElement('button');
                btn.className = "choice-item-btn";
                btn.dataset.correct = c.isCorrect;
                btn.dataset.hint = c.hint;

                const img = document.createElement('img');
                img.src = c.img;
                btn.appendChild(img);

                btn.addEventListener('click', processPlayerClick);
                track.appendChild(btn);
            });
        }

        function buildLevel2Belt() {
            const track = document.getElementById('wrapper-choices');
            track.innerHTML = "";

            let items = [];
            // Correct intruder item injection setup
            items.push({ text: roundItem.correctText, isCorrect: true, hint: "" });

            // Pull room decoys matching the room setting context
            let safeDecoys = [...roundItem.roomDecoys];
            scramble(safeDecoys);
            
            items.push({ text: safeDecoys[0], isCorrect: false, hint: roundItem.hint });
            items.push({ text: safeDecoys[1], isCorrect: false, hint: roundItem.hint });

            scramble(items);
            const continuousPool = [...items, ...items];

            continuousPool.forEach(c => {
                const btn = document.createElement('button');
                btn.className = "choice-item-btn";
                btn.dataset.correct = c.isCorrect;
                btn.dataset.hint = c.hint;

                const txt = document.createElement('span');
                txt.innerText = c.text;
                btn.appendChild(txt);

                btn.addEventListener('click', processPlayerClick);
                track.appendChild(btn);
            });
        }

        function processPlayerClick(e) {
            if (controlLock) return;
            controlLock = true;

            const btn = e.currentTarget;
            const isCorrect = btn.dataset.correct === "true";
            document.getElementById('wrapper-choices').style.animationPlayState = "paused";

            if (isCorrect) {
                scoreCounter += 10;
                document.getElementById('hud-score-lbl').innerText = "Points: " + scoreCounter;
                btn.classList.add('animate-pulse');
                playAudioClip('audio-right');

                setTimeout(() => { advanceRoundIndex(); }, 800);
            } else {
                btn.classList.add('animate-shake');
                playAudioClip('audio-wrong');

                setTimeout(() => {
                    document.getElementById('explain-message-text').innerText = btn.dataset.hint;
                    changeScreen('screen-explain');
                }, 500);
            }
        }

        function evaluateStampInput(pressedSafeButton) {
            if (controlLock) return;
            controlLock = true;

            const targetIsSafe = roundItem.isSafe;
            const overlay = document.getElementById('stamp-alert-overlay');
            const mainCardBox = document.querySelector('.main-card');

            if (pressedSafeButton === targetIsSafe) {
                scoreCounter += 10;
                document.getElementById('hud-score-lbl').innerText = "Points: " + scoreCounter;
                playAudioClip('audio-right');

                if (targetIsSafe) {
                    overlay.innerText = "GOOD HABIT 💚";
                    overlay.style.color = "var(--grass-green)";
                    overlay.style.border = "6px solid var(--grass-green)";
                } else {
                    overlay.innerText = "NOT SAFE 🛑";
                    overlay.style.color = "var(--brick-red)";
                    overlay.style.border = "6px solid var(--brick-red)";
                }
                overlay.style.display = "block";

                setTimeout(() => { advanceRoundIndex(); }, 1200);
            } else {
                mainCardBox.classList.add('animate-shake');
                playAudioClip('audio-wrong');

                setTimeout(() => {
                    mainCardBox.classList.remove('animate-shake');
                    document.getElementById('explain-message-text').innerText = roundItem.hint;
                    changeScreen('screen-explain');
                }, 500);
            }
        }

        function advanceRoundIndex() {
            roundIndex++;
            if (roundIndex < setList.length) {
                loadRoundData();
            } else {
                const key = "level" + activeLevel;
                document.getElementById('chalkboard-story-txt').innerText = contentDataMap[key].summary;
                
                if (activeLevel === 3) {
                    document.getElementById('chalkboard-next-btn').innerText = "Finish Quest 🏆";
                } else {
                    document.getElementById('chalkboard-next-btn').innerText = "Next Level ➔";
                }
                changeScreen('screen-chalkboard');
            }
        }

        function returnToGameLayout() {
            changeScreen('screen-game');
            loadRoundData();
        }

        function progressFromChalkboard() {
            if (activeLevel < 3) {
                startNewLevel(activeLevel + 1);
                changeScreen('screen-game');
            } else {
                playAudioClip('audio-cheer');
                changeScreen('screen-victory');
            }
        }

        function restartWholeApp() {
            scoreCounter = 0;
            document.getElementById('hud-score-lbl').innerText = "Points: 0";
            changeScreen('screen-welcome');
        }
    </script>
</body>
</html>
