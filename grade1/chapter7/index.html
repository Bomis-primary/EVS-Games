<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chapter 7: My Home Game</title>
    <style>
        :root {
            --bg-sky: #e0f2fe;
            --clay-orange: #f97316;
            --grass-green: #22c55e;
            --brick-red: #ef4444;
            --slate-dark: #1e293b;
            --board-green: #14532d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-sky);
            color: var(--slate-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* FIXED: Added vertical scrolling so kids can push the screen up and down */
        .screen-layout {
            display: none;
            width: 100%;
            max-width: 650px;
            min-height: 100vh;
            padding: 15px;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            gap: 15px;
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch;
        }

        .active-view {
            display: flex !important;
        }

        /* Splash Screen (5-Second Handoff) */
        #screen-splash {
            background: #ffffff;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 25px;
            z-index: 9999;
        }
        .splash-logo {
            width: 75%;
            max-width: 300px;
            animation: pulseSoft 1.5s infinite ease-in-out;
        }
        .loading-track {
            width: 65%;
            max-width: 260px;
            height: 14px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #cbd5e1;
        }
        .loading-bar-fill {
            width: 100%;
            height: 100%;
            background: var(--clay-orange);
            transform: translateX(-100%);
            animation: startLoad 4.5s forwards linear;
        }

        /* Welcome Screen Space */
        #screen-welcome {
            justify-content: center;
            text-align: center;
            gap: 25px;
        }
        .welcome-house {
            font-size: clamp(80px, 20vh, 130px);
            animation: floatMove 3s infinite ease-in-out;
        }
        .welcome-heading {
            font-size: clamp(26px, 6.5vw, 36px);
            color: #0369a1;
            font-weight: 800;
        }

        .btn-push {
            background: var(--clay-orange);
            color: white;
            border: none;
            padding: 16px 45px;
            font-size: clamp(18px, 4.5vw, 22px);
            font-weight: bold;
            border-radius: 35px;
            cursor: pointer;
            box-shadow: 0 7px 0 #c2410c;
        }
        .btn-push:active {
            transform: translateY(4px);
            box-shadow: 0 3px 0 #c2410c;
        }

        .hud-row {
            width: 100%;
            display: flex;
            justify-content: space-between;
            background: white;
            padding: 12px 20px;
            border-radius: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.04);
            font-weight: 800;
            font-size: 18px;
            flex-shrink: 0;
        }

        /* Question Frame Setup */
        .main-card {
            width: 100%;
            background: white;
            border-radius: 24px;
            padding: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.06);
            border: 4px dashed #94a3b8;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }
        .display-frame {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            background-color: #fafafa;
        }
        .display-frame img {
            width: 100%;
            max-width: 380px; 
            height: auto;
            max-height: 220px;
            object-fit: contain;
        }
        .question-bubble {
            font-size: clamp(16px, 4.2vw, 20px);
            font-weight: 700;
            text-align: center;
            color: #0369a1;
            line-height: 1.4;
            white-space: pre-line;
        }

        /* Level 3 Macro Item Grid Grid */
        .multi-image-row {
            display: none;
            width: 100%;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }
        .scan-box {
            border: 4px solid #cbd5e1;
            border-radius: 16px;
            padding: 8px;
            background: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            min-height: 140px;
        }
        .scan-box img {
            width: 100%;
            height: auto;
            max-height: 120px; 
            object-fit: contain;
        }
        .stamp-overlay {
            position: absolute;
            font-size: 16px;
            font-weight: 900;
            padding: 4px 6px;
            border-radius: 8px;
            transform: rotate(-12deg);
            display: none;
            background: rgba(255,255,255,0.95);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* Conveyor Belt Framework Mechanics */
        .conveyor-belt-system {
            width: 100%;
            background: #475569;
            border-top: 6px solid #334155;
            border-bottom: 8px solid #1e293b;
            padding: 16px 0;
            overflow-x: auto;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            border-radius: 20px;
            box-shadow: inset 0 8px 16px rgba(0,0,0,0.4);
            flex-shrink: 0;
        }
        .conveyor-belt-system::-webkit-scrollbar {
            display: none;
        }

        .conveyor-track-infinite {
            display: flex;
            width: max-content;
            gap: 25px;
            padding: 0 20px;
            animation: moveConveyorLoop 22s linear infinite;
        }

        .conveyor-belt-system:active .conveyor-track-infinite {
            animation-play-state: paused;
        }

        .choice-item-btn {
            background: white;
            border: 4px solid #cbd5e1;
            border-radius: 20px;
            padding: 12px 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-align: center;
            font-weight: 700;
            font-size: 15px;
            color: #1e293b;
            box-shadow: 0 6px 0 #94a3b8;
            flex-shrink: 0;
            max-width: 260px;
        }
        .choice-item-btn img {
            height: 90px;
            width: auto;
            object-fit: contain;
        }

        .stamp-row {
            display: none;
            width: 100%;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            flex-shrink: 0;
        }
        .btn-stamp {
            border: none;
            padding: 20px 10px;
            font-size: 20px;
            font-weight: 900;
            color: white;
            border-radius: 24px;
            cursor: pointer;
            box-shadow: 0 7px 0 rgba(0,0,0,0.25);
        }
        .btn-danger { background: var(--brick-red); }
        .btn-safe { background: var(--grass-green); }
        .btn-stamp:active { transform: translateY(4px); box-shadow: 0 3px 0 rgba(0,0,0,0.25); }

        .animate-shake { animation: shakeLeftRight 0.4s ease-in-out; border-color: var(--brick-red)!important; background: #fef2f2!important; }
        .animate-pulse { animation: pulsePop 0.4s ease-in-out; border-color: var(--grass-green)!important; background: #f0fdf4!important; }

        .overlay-screen {
            background: rgba(15, 23, 42, 0.97);
            color: white;
            justify-content: center;
            text-align: center;
            gap: 25px;
            padding: 25px;
        }
        .blackboard {
            background: var(--board-green);
            border: 12px solid #b45309;
            border-radius: 16px;
            padding: 30px 20px;
            width: 100%;
            box-shadow: inset 0 0 25px rgba(0,0,0,0.6);
        }
        .blackboard-text {
            font-size: 20px;
            color: #f0fdf4;
            line-height: 1.5;
            font-weight: bold;
        }

        @keyframes moveConveyorLoop {
            0% { transform: translateX(0); }
            100% { transform: translateX(calc(-50% - 12px)); }
        }
        @keyframes startLoad { from { transform: translateX(-100%); } to { transform: translateX(0%); } }
        @keyframes pulseSoft { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
        @keyframes floatMove { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes pulsePop { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        @keyframes shakeLeftRight {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            50% { transform: translateX(6px); }
            75% { transform: translateX(-4px); }
        }
    </style>
</head>
<body>

    <audio id="audio-right" src="assets/correct.mp3" preload="auto"></audio>
    <audio id="audio-wrong" src="assets/wrong.mp3" preload="auto"></audio>
    <audio id="audio-cheer" src="assets/freesound_community-claps-44774.mp3" preload="auto"></audio>

    <div id="screen-splash">
        <img src="assets/innovine-logo.png" alt="Innovine Logo" class="splash-logo">
        <div class="loading-track">
            <div class="loading-bar-fill"></div>
        </div>
    </div>

    <div id="screen-welcome" class="screen-layout">
        <div class="welcome-house">🏠</div>
        <h1 class="welcome-heading">My Home Game!</h1>
        <button class="btn-push" onclick="changeScreen('screen-game'); startNewLevel(1);">▶ Start Game</button>
    </div>

    <div id="screen-game" class="screen-layout">
        <div class="hud-row">
            <span id="hud-level-lbl">Level: 1/3</span>
            <span id="hud-score-lbl">Points: 0</span>
        </div>

        <div class="main-card">
            <div id="dashboard-split" class="multi-image-row">
                <div id="box-waste" class="scan-box"><img src="assets/throwingwaste.png"><div class="stamp-overlay"></div></div>
                <div id="box-ladder" class="scan-box"><img src="assets/climbingladder.png"><div class="stamp-overlay"></div></div>
                <div id="box-matches" class="scan-box"><img src="assets/playingwithmatchbox.png"><div class="stamp-overlay"></div></div>
            </div>

            <div id="canvas-img-frame" class="display-frame">
                <img id="canvas-target-pic" src="">
            </div>
            
            <div id="canvas-prompt-msg" class="question-bubble">Loading...</div>
        </div>

        <div id="wrapper-conveyor-housing" class="conveyor-belt-system">
            <div id="wrapper-choices" class="conveyor-track-infinite"></div>
        </div>

        <div id="wrapper-stamps" class="stamp-row">
            <button class="btn-stamp btn-danger" onclick="evaluateStampInput(false)">🛑 DANGER</button>
            <button class="btn-stamp btn-safe" onclick="evaluateStampInput(true)">💪 SAFE</button>
        </div>
    </div>

    <div id="screen-explain" class="screen-layout overlay-screen">
        <div style="font-size: 65px;">💡</div>
        <h2 style="color: #f59e0b; font-size: 26px;">Let's Think!</h2>
        <p id="explain-message-text" style="font-size: 18px; max-width: 420px; line-height: 1.5; font-weight: 600;"></p>
        <button class="btn-push" style="background:#3b82f6; box-shadow: 0 6px 0 #1d4ed8;" onclick="returnToGameLayout()">Try Again 🔄</button>
    </div>

    <div id="screen-chalkboard" class="screen-layout overlay-screen">
        <div class="blackboard">
            <p id="chalkboard-story-txt" class="blackboard-text"></p>
        </div>
        <button id="chalkboard-next-btn" class="btn-push" onclick="progressFromChalkboard()">Next Level ➔</button>
    </div>

    <div id="screen-victory" class="screen-layout overlay-screen" style="background: #1e1b4b;">
        <div style="font-size: 90px; animation: floatMove 2.5s infinite ease-in-out;">🏆</div>
        <h1 style="color: #f59e0b; font-size: 32px; font-weight: 900;">Super Eco Hero!</h1>
        <p style="font-size: 18px; max-width: 450px; color: #cbd5e1; font-weight: 600;">You know all about houses, clean rooms, and how to stay safe!</p>
        <button class="btn-push" onclick="restartWholeApp()">Play Again 🔄</button>
    </div>

    <script>
        const priorityPics = ["assets/building.png", "assets/hut.png", "assets/igloo.png"];
        priorityPics.forEach(path => { const dummy = new Image(); dummy.src = path; });

        window.addEventListener('load', () => {
            setTimeout(() => {
                const backgroundPics = [
                    "assets/kitchen.png", "assets/bedroom.png", "assets/livingroom.png",
                    "assets/throwingwaste.png", "assets/climbingladder.png", "assets/playingwithmatchbox.png"
                ];
                backgroundPics.forEach(path => { const dummy = new Image(); dummy.src = path; });
            }, 1000);

            // 5-second precise runtime handoff hold to screen-welcome
            setTimeout(() => { 
                document.getElementById('screen-splash').style.display = 'none';
                changeScreen('screen-welcome'); 
            }, 5000);
        });

        let activeLevel = 1;
        let scoreCounter = 0;
        let roundIndex = 0;
        let roundItem = null;
        let setList = [];
        let controlLock = false;

        // FIXED: Every single question restricted to a crisp maximum of 2 lines
        const contentDataMap = {
            level1: {
                rounds: [
                    {
                        prompt: "Brrr! Chiku the monkey is freezing in the snow! ❄️\nHelp him find a cozy house made of ice blocks.",
                        choices: [
                            { img: "assets/igloo.png", isCorrect: true },
                            { img: "assets/building.png", isCorrect: false, hint: "Oh no! Mud and town bricks will crack and freeze in deep snow. Chiku needs a special ice block home to stay warm!" },
                            { img: "assets/hut.png", isCorrect: false, hint: "A mud hut will freeze completely! Only thick ice blocks can keep out the shivering mountain storm." }
                        ]
                    },
                    {
                        prompt: "Welcome to busy Mumbai city! 🚗\nWhich tall building stands way high up inside the clouds?",
                        choices: [
                            { img: "assets/building.png", isCorrect: true },
                            { img: "assets/hut.png", isCorrect: false, hint: "Think about the busy city! A village mud hut takes up too much flat ground space. A tall building stacks homes high up so everyone fits!" },
                            { img: "assets/igloo.png", isCorrect: false, hint: "An igloo is made from freezing snow blocks. You will not find them inside a hot town city!" }
                        ]
                    },
                    {
                        prompt: "Look at this lovely farm village! 🌾\nHelp the farmer build a simple hut using mud and straw grass.",
                        choices: [
                            { img: "assets/hut.png", isCorrect: true },
                            { img: "assets/building.png", isCorrect: false, hint: "Wait! There are no big cement concrete mixers in a green farm field. The farmer must use the grass and mud to make a simple hut!" },
                            { img: "assets/igloo.png", isCorrect: false, hint: "There is no mountain snow in a warm farming field to build ice structures!" }
                        ]
                    }
                ],
                summary: "Houses keep us safe from the hot sun, cold wind, rain, and wild animals! Strong houses use bricks. Weak huts use mud."
            },
            level2: {
                rounds: [
                    {
                        bgImage: "assets/kitchen.png",
                        prompt: "The Naughty Monster ran into the kitchen! 🍳\nFind the wrong bedroom item left on the hot cooking stove.",
                        choices: [
                            { text: "A sleeping pillow is on the stove counter.", isCorrect: true },
                            { text: "A cold refrigerator holding the milk.", isCorrect: false, hint: "Look near the cooking fire! A pillow belongs in the bedroom. If it touches the hot stove, it can catch fire instantly!" },
                            { text: "A kitchen shelf holding spice boxes.", isCorrect: false, hint: "Spice boxes are supposed to be kept right inside cooking spaces to prepare tasty dishes!" }
                        ]
                    },
                    {
                        bgImage: "assets/bedroom.png",
                        prompt: "Mina wants to jump onto her bed for a nap! 💤\nFind the dangerous kitchen tool left flat on her blanket.",
                        choices: [
                            { text: "A sharp kitchen knife is on the sheets.", isCorrect: true },
                            { text: "A cozy blanket spread over the mattress.", isCorrect: false, hint: "Look right at the middle of the bed! A sharp cooking knife belongs in a drawer. If Mina sits on it, it will cut her hand!" },
                            { text: "A glass of water sitting on the table.", isCorrect: false, hint: "Water glasses on side tables are perfectly safe for when you wake up feeling thirsty." }
                        ]
                    },
                    {
                        bgImage: "assets/livingroom.png",
                        prompt: "Oh no! A special guest just slipped and fell! 🚪\nFind the wet washroom item spilled all over the living room tiles.",
                        choices: [
                            { text: "A big pool of soapy washroom water.", isCorrect: true },
                            { text: "A soft rug placed under the tea table.", isCorrect: false, hint: "Look closely near the sofa legs! Soapy wash water belongs in the bathroom. Spilling it here makes the floor as slippery as a slide!" },
                            { text: "The television playing a nice cartoon.", isCorrect: false, hint: "A cartoon program playing on the screen cannot make your visitors slip or fall down!" }
                        ]
                    }
                ],
                summary: "Our home has different rooms. We cook in the kitchen, sleep in the bedroom, and welcome guests in the living room."
            },
            level3: {
                rounds: [
                    { target: "matches", isSafe: false, prompt: "A little boy is sitting alone playing with sharp matches. 🔥\nUse your superhero judgment! Is this safe or danger?", hint: "Stop! A single match stick spark can catch onto curtains and cause a giant fire. Matches are tools for grown-ups, never toys!" },
                    { target: "ladder", isSafe: false, prompt: "A little girl is climbing a very high, shaky wooden ladder. 🛑\nUse your superhero judgment! Is this safe or danger?", hint: "Watch out! Shaky ladders can tip over. Falling from high up will hurt your bones. Always ask a grown-up for help!" },
                    { target: "waste", isSafe: true, prompt: "A good boy drops his empty chocolate wrapper into the dustbin. ✨\nUse your superhero judgment! Is this safe or danger?", hint: "This is awesome behavior! Putting waste into the dustbin stops dirty houseflies and mosquitoes from spreading sickness." }
                ],
                summary: "Throw trash inside a closed bin to keep bugs away. Never play with sharp knives, hot stoves, or matchsticks because they can hurt you!"
            }
        };

        function changeScreen(id) {
            document.querySelectorAll('.screen-layout').forEach(s => s.classList.remove('active-view'));
            const target = document.getElementById(id);
            if (target) target.classList.add('active-view');
        }

        function scramble(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function playAudioClip(id) {
            const clip = document.getElementById(id);
            if (clip) {
                clip.currentTime = 0;
                clip.play().catch(() => {});
            }
        }

        function startNewLevel(lvlNum) {
            activeLevel = lvlNum;
            roundIndex = 0;
            document.getElementById('hud-level-lbl').innerText = "Level: " + activeLevel + "/3";
            
            const key = "level" + activeLevel;
            setList = [...contentDataMap[key].rounds];
            scramble(setList);

            if (activeLevel === 3) {
                document.getElementById('dashboard-split').style.display = "grid";
                document.getElementById('canvas-img-frame').style.display = "none";
                document.getElementById('wrapper-conveyor-housing').style.display = "none";
                document.getElementById('wrapper-stamps').style.display = "grid";
                
                document.querySelectorAll('.scan-box').forEach(b => {
                    b.className = "scan-box";
                    b.querySelector('.stamp-overlay').style.display = "none";
                });
            } else {
                document.getElementById('dashboard-split').style.display = "none";
                document.getElementById('canvas-img-frame').style.display = "flex";
                document.getElementById('wrapper-conveyor-housing').style.display = "block";
                document.getElementById('wrapper-stamps').style.display = "none";
            }

            loadRoundData();
        }

        function loadRoundData() {
            controlLock = false;
            roundItem = setList[roundIndex];

            const track = document.getElementById('wrapper-choices');
            track.style.animationPlayState = "running";
            document.getElementById('wrapper-conveyor-housing').scrollLeft = 0;

            if (activeLevel === 1) {
                document.getElementById('canvas-target-pic').style.display = "none";
                document.getElementById('canvas-prompt-msg').innerText = roundItem.prompt;
                buildVisualBeltOptions(roundItem.choices);
            } 
            else if (activeLevel === 2) {
                const imgNode = document.getElementById('canvas-target-pic');
                imgNode.src = roundItem.bgImage;
                imgNode.style.display = "block";
                document.getElementById('canvas-prompt-msg').innerText = roundItem.prompt;
                buildTextBeltOptions(roundItem.choices);
            } 
            else if (activeLevel === 3) {
                // Pre-highlight borders are strictly hidden
                document.querySelectorAll('.scan-box').forEach(b => b.classList.remove('scan-active'));
                document.getElementById('canvas-prompt-msg').innerText = roundItem.prompt;
            }
        }

        function buildVisualBeltOptions(choicesArray) {
            const track = document.getElementById('wrapper-choices');
            track.innerHTML = "";
            let basePool = [...choicesArray];
            scramble(basePool);

            const finalPool = [...basePool, ...basePool];

            finalPool.forEach(c => {
                const btn = document.createElement('button');
                btn.className = "choice-item-btn";
                btn.dataset.correct = c.isCorrect;
                btn.dataset.hint = c.hint || "";

                const img = document.createElement('img');
                img.src = c.img;
                btn.appendChild(img);

                btn.addEventListener('click', processPlayerClick);
                track.appendChild(btn);
            });
        }

        function buildTextBeltOptions(choicesArray) {
            const track = document.getElementById('wrapper-choices');
            track.innerHTML = "";
            let basePool = [...choicesArray];
            scramble(basePool);

            const finalPool = [...basePool, ...basePool];

            finalPool.forEach(c => {
                const btn = document.createElement('button');
                btn.className = "choice-item-btn";
                btn.dataset.correct = c.isCorrect;
                btn.dataset.hint = c.hint || "";

                const txt = document.createElement('span');
                txt.innerText = c.text;
                btn.appendChild(txt);

                btn.addEventListener('click', processPlayerClick);
                track.appendChild(btn);
            });
        }

        function processPlayerClick(e) {
            if (controlLock) return;
            controlLock = true;

            const btn = e.currentTarget;
            const isCorrect = btn.dataset.correct === "true";
            const track = document.getElementById('wrapper-choices');
            
            track.style.animationPlayState = "paused";

            if (isCorrect) {
                scoreCounter += 10;
                document.getElementById('hud-score-lbl').innerText = "Points: " + scoreCounter;
                btn.classList.add('animate-pulse');
                playAudioClip('audio-right');

                setTimeout(() => { advanceRoundIndex(); }, 800);
            } else {
                btn.classList.add('animate-shake');
                playAudioClip('audio-wrong');

                setTimeout(() => {
                    document.getElementById('explain-message-text').innerText = btn.dataset.hint;
                    changeScreen('screen-explain');
                }, 500);
            }
        }

        function evaluateStampInput(pressedSafeButton) {
            if (controlLock) return;
            const targetIsSafe = roundItem.isSafe;
            const targetBox = document.getElementById("box-" + roundItem.target);
            const stampElement = targetBox.querySelector('.stamp-overlay');

            if (pressedSafeButton === targetIsSafe) {
                controlLock = true;
                scoreCounter += 10;
                document.getElementById('hud-score-lbl').innerText = "Points: " + scoreCounter;
                playAudioClip('audio-right');

                if (targetIsSafe) {
                    stampElement.innerText = "SAFE ✅";
                    stampElement.style.color = "var(--grass-green)";
                    stampElement.style.border = "4px solid var(--grass-green)";
                } else {
                    stampElement.innerText = "DANGER 🛑";
                    stampElement.style.color = "var(--brick-red)";
                    stampElement.style.border = "4px solid var(--brick-red)";
                }
                stampElement.style.display = "block";

                setTimeout(() => { advanceRoundIndex(); }, 900);
            } else {
                controlLock = true;
                targetBox.classList.add('animate-shake');
                playAudioClip('audio-wrong');

                setTimeout(() => {
                    targetBox.classList.remove('animate-shake');
                    document.getElementById('explain-message-text').innerText = roundItem.hint;
                    changeScreen('screen-explain');
                }, 500);
            }
        }

        function advanceRoundIndex() {
            roundIndex++;
            if (roundIndex < setList.length) {
                loadRoundData();
            } else {
                const key = "level" + activeLevel;
                document.getElementById('chalkboard-story-txt').innerText = contentDataMap[key].summary;
                
                if (activeLevel === 3) {
                    document.getElementById('chalkboard-next-btn').innerText = "Finish Quest 🏆";
                } else {
                    document.getElementById('chalkboard-next-btn').innerText = "Next Level ➔";
                }
                changeScreen('screen-chalkboard');
            }
        }

        function returnToGameLayout() {
            changeScreen('screen-game');
            loadRoundData();
        }

        function progressFromChalkboard() {
            if (activeLevel < 3) {
                startNewLevel(activeLevel + 1);
                changeScreen('screen-game');
            } else {
                playAudioClip('audio-cheer');
                changeScreen('screen-victory');
            }
        }

        function restartWholeApp() {
            scoreCounter = 0;
            document.getElementById('hud-score-lbl').innerText = "Points: 0";
            changeScreen('screen-welcome');
        }
    </script>
</body>
</html>
