<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Zippy's Path of Adventure</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f8ff;color:#22324a;overflow-x:hidden}
.screen{display:none;min-height:100vh;padding:12px}
.active{display:block}

#splashScreen{
  background:#fff;
  display:none;
  align-items:center;
  justify-content:center;
  position:fixed;
  inset:0;
  z-index:9999;
}
#splashScreen.active{display:flex}
#splashScreen img{
  width: 45%; 
  max-width: 380px;  
  min-width: 160px;  
  height:auto;
  object-fit:contain;
}

h1{font-size:clamp(28px,5vw,46px);color:#ff7b54;margin:10px 0 8px}
button{border:none;border-radius:18px;padding:12px 22px;margin:8px;font-size:18px;cursor:pointer;background:#ffd166;box-shadow:0 4px 0 #d99b16;font-weight:700;touch-action:manipulation}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #d99b16}
.card{background:rgba(255,255,255,.95);border-radius:24px;padding:14px;max-width:1100px;margin:8px auto;box-shadow:0 8px 18px rgba(0,0,0,.12)}
.topbar{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;background:rgba(255,255,255,.9);padding:8px;border-radius:18px;margin-bottom:8px}
.badge{background:#fff;padding:8px 12px;border-radius:14px;font-weight:700;font-size:16px}
.instructions-line{font-size:clamp(16px,2.6vw,21px);background:#fff7c9;padding:10px;border-radius:14px;margin:12px auto;max-width:850px;line-height:1.4;text-align:center}
.question{font-size:clamp(18px,3vw,28px);font-weight:700;color:#5e3d2f;margin-bottom:6px;text-align:center}
.message{min-height:28px;font-size:18px;font-weight:700;margin-top:6px;line-height:1.35;text-align:center}

.game-layout{
  display:grid;
  grid-template-columns:1fr;
  gap:14px;
  align-items:start;
  max-width:1180px;
  margin:8px auto 0;
}

.path-zone{
  border-radius:26px;
  position:relative;
  overflow-x:auto; 
  overflow-y:hidden;
  -webkit-overflow-scrolling:touch;
  box-shadow:0 8px 18px rgba(0,0,0,.12);
  background: #e3f2fd;
}
.path-zone-inner {
  min-width: 800px; 
  width: 100%;
  position: relative;
  display: flex;
  align-items: center;
}

.board-image {
  width: 100%;
  height: auto;
  display: block;
}

#pathAvatar{
  position:absolute;
  left:4%;
  bottom:20%;
  width:clamp(45px,6vw,75px);
  transition:left .45s ease,transform .25s ease;
  z-index:5;
  filter:drop-shadow(0 3px 4px rgba(0,0,0,.18))
}

.path-zone::before{
  content:"Help Zippy move to school";
  position:sticky; /* Keeps label visible while scrolling horizontally */
  left:50%;
  transform:translateX(-50%);
  display: inline-block;
  margin-top: 12px;
  background:rgba(255,255,255,.95);
  padding:6px 14px;
  border-radius:14px;
  font-weight:700;
  color:#2f7f57;
  font-size:15px;
  z-index:10;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

.milestones{
  position:absolute;
  left:7%;
  right:7%;
  bottom:18%;
  display:flex;
  justify-content:space-between;
  z-index:2
}

.dot{
  width:clamp(14px, 2vw, 20px);
  height:clamp(14px, 2vw, 20px);
  border-radius:50%;
  background:#d2d9ef;
  border:3px solid #fff;
  box-shadow:0 2px 4px rgba(0,0,0,.12);
  transition: background 0.3s ease;
}
.dot.done{background:#66bb6a}

.options-panel{background:rgba(255,255,255,.96);padding:12px;border-radius:24px;box-shadow:0 5px 12px rgba(0,0,0,.12)}
#options{display:grid;grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));gap:10px}
.option-btn{border:none;border-radius:18px;padding:10px;background:#f5f8ff;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.08);min-height:110px;touch-action:manipulation;}
.option-btn img{width:100%;max-width:140px;aspect-ratio:1/1;object-fit:contain;background:#fff;border-radius:14px;padding:6px;display:block;margin:0 auto}
.option-btn.correct{background:#dff7eb;outline:3px solid #57b97c}
.option-btn.wrong{background:#ffe3e3;outline:3px solid #e57373}
.option-btn.hint-glow{outline:4px solid #42a5f5!important;box-shadow:0 0 18px #42a5f5}
.controls{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:10px;align-items:center;}
input[type="range"]{width:120px; accent-color: #ffd166;}
.final{font-size:clamp(24px,5vw,40px);color:#2e7d32;font-weight:700}
.confetti{position:fixed;top:-20px;width:12px;height:12px;pointer-events:none;animation:fall 2.5s linear forwards;z-index:999;will-change:transform, opacity;}

@keyframes fall{to{transform:translate3d(0, 105vh, 0) rotate(720deg);opacity:0}}
@media(max-width:420px){
  button{font-size:16px;padding:11px 18px}
  #options{grid-template-columns: 1fr 1fr;}
  .option-btn{min-height:95px}
  .option-btn img{max-width:110px}
  .path-zone-inner {min-width: 600px;} /* slightly scaled down for very small phones to avoid excessive scrolling */
}
</style>
</head>
<body>

<div id="splashScreen" class="screen active">
  <img src="assets/innovine-logo.png" alt="Innovine Logo">
</div>

<div id="startScreen" class="screen">
  <div class="card">
    <h1 style="text-align:center">Zippy's Path of Adventure</h1>
    <div class="instructions-line">Tap the best picture to help Zippy move forward on his path.</div>
    <div class="controls">
      <button onclick="startGame()">▶ Start Game</button>
      <button onclick="toggleMusic()" id="musicBtn">🔊 Music</button>
      <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="0.4" aria-label="Volume">
    </div>
  </div>
</div>

<div id="gameScreen" class="screen">
  <div class="topbar">
    <div class="badge">⭐ Score: <span id="score">0</span></div>
    <div class="badge">Q <span id="qNo">1</span>/12</div>
  </div>

  <div class="card">
    <div class="question" id="questionText"></div>
    <div class="message" id="helperText"></div>
    <div class="message" id="message"></div>
  </div>

  <div class="game-layout">
    <div class="path-zone" id="pathZoneContainer">
      <div class="path-zone-inner">
        <!-- Render the boardgame as an image so it dictates layout sizing -->
        <img src="assets/boardgame.png" class="board-image" alt="Game Path">
        <img id="pathAvatar" src="assets/zippysmiling.png" alt="Zippy">
        <div id="milestones" class="milestones"></div>
      </div>
    </div>

    <div class="options-panel">
      <div id="options"></div>
      <div class="controls"><button onclick="startGame()">🔄 Retry</button></div>
    </div>
  </div>
</div>

<div id="endScreen" class="screen">
  <div class="card" style="text-align:center">
    <div class="final" id="finalMsg">Great work!</div>
    <h2>Your Score: <span id="finalScore"></span>/12</h2>
    <button onclick="startGame()">🔄 Play Again</button>
  </div>
</div>

<audio id="rightSound" preload="auto" src="assets/correct.mp3"></audio>
<audio id="wrongSound" preload="auto" src="assets/wrong.mp3"></audio>
<audio id="music" preload="auto" loop src="assets/cheerfulmusic.mp3"></audio>

<script>
const questions=[
  {q:'Zippy is with a big family that includes grandparents. Which picture should he choose?',a:'jointfamily',h:'Hint: Look for grandparents in the picture.',e:'A joint family includes grandparents, parents, and children.',o:['jointfamily','nuclearfamily','classroom']},
  {q:'Mumma is busy in the kitchen and Zippy wants to help. Which picture fits best?',a:'helpinginkitchen',h:'Hint: Look for helping with food at home.',e:'Helping at home is a good habit.',o:['helpinginkitchen','library','wateringplant']},
  {q:'The flowers need water. Which picture shows Zippy taking care of them?',a:'wateringplant',h:'Hint: Look for the watering action.',e:'Plants need water to stay healthy.',o:['wateringplant','medicalroom','bussafety']},
  {q:'Zippy is ready for study time. Which picture shows the learning place?',a:'classroom',h:'Hint: Look for a place with desks.',e:'A classroom is where lessons happen.',o:['classroom','library','playground']},
  {q:'Zippy wants a quiet place full of books. Which picture should he go to?',a:'library',h:'Hint: Look for shelves full of books.',e:'The library is a place for reading.',o:['library','classroom','staffroom']},
  {q:'The school bus is waiting. Which picture shows Zippy playing it safe?',a:'bussafety',h:'Hint: Look for the school bus safety scene.',e:'Bus safety helps children travel safely.',o:['bussafety','strangerdanger','playground']},
  {q:'A stranger is calling Zippy near school. Which picture warns him to stay away?',a:'strangerdanger',h:'Hint: Look for the caution sign near a stranger.',e:'Children should stay away from strangers.',o:['strangerdanger','bussafety','jointfamily']},
  {q:'The principal has called Zippy. Which picture shows the right office to visit?',a:'principleoffice',h:'Hint: Look for the school office door.',e:'The principal meets students in the principal office.',o:['principleoffice','staffroom','library']},
  {q:'Zippy gets hurt while playing. Which picture shows where he should get help?',a:'medicalroom',h:'Hint: Look for the help room in school.',e:'The medical room helps when a child is hurt.',o:['medicalroom','playground','classroom']},
  {q:'Zippy is back in class. Which picture shows the teacher and students together?',a:'classroom',h:'Hint: Look for the learning room scene.',e:'Children learn in the classroom.',o:['classroom','staffroom','library']},
  {q:'Zippy spots himself in a picture with a little family nearby. Which scene matches what he sees?',a:'nuclearfamily',h:'Hint: Look for a child with only parents nearby.',e:'A nuclear family has parents and children.',o:['nuclearfamily','jointfamily','principleoffice']},
  {q:'Zippy wants to run, jump, and play. Which picture shows that place?',a:'playground',h:'Hint: Look for swings, slides, and play.',e:'A playground is for play and exercise.',o:['playground','library','medicalroom']}
];

const map={
  jointfamily:'assets/jointfamily.png',
  helpinginkitchen:'assets/helpinginkitchen.png',
  wateringplant:'assets/wateringplant.png', /* Fixed potential typo here */
  classroom:'assets/classroom.png',
  library:'assets/library.png',
  bussafety:'assets/bussafety.png',
  strangerdanger:'assets/strangerdanger.png',
  principleoffice:'assets/principleoffice.png',
  staffroom:'assets/staffroom.png',
  medicalroom:'assets/medicalroom.png',
  playground:'assets/playground.png',
  nuclearfamily:'assets/nuclearfamily.png'
};

const faces={
  happy:'assets/zippysmiling.png',
  sad:'assets/zippysad.png'
};

let gameQuestions=[],current=0,score=0,busy=false,hintTimer,avatarStep=0,musicOn=true, audioUnlocked=false;
const rightSound=document.getElementById('rightSound');
const wrongSound=document.getElementById('wrongSound');
const musicEl=document.getElementById('music');

musicEl.volume=0.4;
document.getElementById('volumeSlider').addEventListener('input',e=>musicEl.volume=Number(e.target.value));

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]]
  }
  return a;
}

function unlockAudio() {
  if (audioUnlocked) return;
  [rightSound, wrongSound, musicEl].forEach(sound => {
    let playPromise = sound.play();
    if (playPromise !== undefined) {
      playPromise.then(_ => {
        if(sound !== musicEl || !musicOn) {
            sound.pause();
            sound.currentTime = 0;
        }
      }).catch(error => {});
    }
  });
  audioUnlocked = true;
}

function renderMilestones(){
  const row=document.getElementById('milestones');
  row.innerHTML='';
  for(let i=0;i<12;i++){
    const d=document.createElement('div');
    d.className='dot'+(i<avatarStep?' done':'');
    row.appendChild(d);
  }
}

function moveAvatar(){
  const avatar=document.getElementById('pathAvatar');
  const pct=(avatarStep/11)*88;
  avatar.style.left=Math.min(4+pct,90)+'%';
  avatar.src=faces.happy;

  // Auto-scroll the path container to follow the avatar on mobile
  const container = document.getElementById('pathZoneContainer');
  const scrollTarget = (container.scrollWidth * (avatarStep/11)) - (container.clientWidth / 2);
  container.scrollTo({ left: Math.max(0, scrollTarget), behavior: 'smooth' });
}

function startGame(){
  unlockAudio();
  current=0;score=0;busy=false;avatarStep=0;
  gameQuestions=shuffle([...questions]);
  showScreen('gameScreen');
  document.getElementById('pathAvatar').src=faces.happy;
  
  if(musicOn) {
    musicEl.play().catch(()=>{});
  }
  
  // Timeout ensures the DOM has painted before moving the avatar/calculating scroll
  setTimeout(() => {
      moveAvatar();
      loadQuestion();
  }, 100);
}

function loadQuestion(){
  if(current>=gameQuestions.length){endGame();return}
  busy=false;
  const q=gameQuestions[current];
  
  clearTimeout(hintTimer);
  document.getElementById('score').textContent=score;
  document.getElementById('qNo').textContent=current+1;
  document.getElementById('questionText').textContent=q.q;
  document.getElementById('helperText').textContent='';
  document.getElementById('message').textContent='';
  
  const box=document.getElementById('options');
  box.innerHTML='';
  
  shuffle(q.o.map(k=>({key:k,img:map[k],correct:k===q.a}))).forEach(opt=>{
    const b=document.createElement('button');
    b.className='option-btn';
    b.innerHTML=`<img src="${opt.img}" alt="option" loading="lazy">`;
    b.onclick=()=>checkAnswer(b,opt.correct,q.a,q.e);
    box.appendChild(b)
  });
  renderMilestones();
  hintTimer=setTimeout(()=>showHint(q.a,q.h),10000)
}

function showHint(correctKey,clueText){
  document.getElementById('helperText').textContent=clueText;
  document.querySelectorAll('.option-btn').forEach(btn=>{
    const img=btn.querySelector('img');
    if(img&&img.getAttribute('src')===map[correctKey]){
      btn.classList.add('hint-glow');
      setTimeout(()=>btn.classList.remove('hint-glow'),5000)
    }
  })
}

function confetti(){
  for(let i=0;i<20;i++){
    const c=document.createElement('div');
    c.className='confetti';
    c.style.left=Math.random()*100+'vw';
    c.style.background=['#ff5252','#ffca28','#66bb6a','#42a5f5','#ab47bc'][Math.floor(Math.random()*5)];
    c.style.animationDelay=Math.random()*0.4+'s';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),3000)
  }
}

function checkAnswer(button,isCorrect,correctKey,explain){
  if(busy)return;
  busy=true;
  clearTimeout(hintTimer);
  const all=[...document.querySelectorAll('.option-btn')];
  all.forEach(b=>b.disabled=true);
  
  if(isCorrect){
    score++;
    document.getElementById('score').textContent=score;
    document.getElementById('message').textContent='Correct!';
    button.classList.add('correct');
    rightSound.currentTime=0;
    rightSound.play().catch(()=>{});
    confetti();
    avatarStep=Math.min(avatarStep+1,11);
    document.getElementById('pathAvatar').src=faces.happy;
    moveAvatar();
  }else{
    button.classList.add('wrong');
    const correctBtn=all.find(b=>b.querySelector('img')?.getAttribute('src')===map[correctKey]);
    if(correctBtn)correctBtn.classList.add('correct');
    document.getElementById('message').textContent='Correct answer: '+correctKey.replace(/([a-z])([A-Z])/g,'$1 $2')+'. '+explain;
    wrongSound.currentTime=0;
    wrongSound.play().catch(()=>{});
    if(navigator.vibrate) navigator.vibrate([140,80,140]);
    avatarStep=Math.max(0,avatarStep-1);
    document.getElementById('pathAvatar').src=faces.sad;
    moveAvatar();
  }
  setTimeout(()=>{current++;loadQuestion()},2000); /* Extended slightly so users can read the explanation */
}

function endGame(){
  showScreen('endScreen');
  document.getElementById('finalScore').textContent=score;
  const f=document.getElementById('finalMsg');
  
  if(score===12){
    f.textContent='Well done, champ!';
    confetti();
  }
  else if(score>=10){
    f.textContent='Good work!';
    confetti();
  }
  else if(score>=8){
    f.textContent='Great effort!';
  }
  else{
    f.textContent='Try again! Better luck next time.';
  }
}

function toggleMusic(){
  musicOn=!musicOn;
  const btn=document.getElementById('musicBtn');
  if(musicOn){
    btn.textContent='🔊 Music';
    musicEl.play().catch(()=>{})
  }else{
    btn.textContent='🔇 Music';
    musicEl.pause()
  }
}

window.addEventListener('load',()=>{
  setTimeout(()=>showScreen('startScreen'),1500)
});
</script>
</body>
</html>
