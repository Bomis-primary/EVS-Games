<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Air & Water Clean Town</title>
<style>
* {
  box-sizing: border-box;
  -webkit-user-select: none;
  user-select: none;
  margin: 0;
  padding: 0;
}
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: #eefbff;
  color: #004d40;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow-x: hidden;
}

/* BRAND LOGO SPLASH LAYER SETUP */
#splashScreenLayer {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: #ffffff;
  z-index: 99999;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.6s ease-in-out;
  opacity: 1;
}
#splashScreenLayer.fade-out {
  opacity: 0;
}
#splashScreenLayer img {
  max-width: 75vw;
  max-height: 45vh;
  object-fit: contain;
}

/* HARDWARE-ACCELERATED RESPONSIVE CONTAINER PANELS */
.screen {
  display: none;
  width: 92vw;
  max-width: 520px;
  padding: 10px;
  animation: screenSlide 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.screen.active {
  display: block;
}
@keyframes screenSlide {
  from { opacity: 0; transform: translateY(20px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.game-card {
  background: #ffffff;
  border: 6px solid #00acc1;
  border-radius: 32px;
  padding: 5vh 4vw;
  box-shadow: 0 16px 35px rgba(0, 172, 193, 0.18);
  text-align: center;
  width: 100%;
}

/* SEAMLESSLY SCALED INTERACTIVE EMOJIS */
.giant-emoji {
  font-size: calc(50px + 4vw);
  margin: 2vh 0;
  display: block;
  animation: floatBounce 3s ease-in-out infinite alternate;
}
@keyframes floatBounce {
  from { transform: translateY(0px); }
  to { transform: translateY(-12px); }
}

h1 {
  font-size: calc(22px + 1vw);
  color: #00838f;
  margin-bottom: 12px;
  line-height: 1.2;
}
p.description {
  font-size: calc(16px + 0.3vw);
  line-height: 1.5;
  color: #006064;
  margin: 2vh 0;
  font-weight: bold;
}

.btn-action {
  border: none;
  border-radius: 24px;
  padding: 16px 40px;
  font-size: calc(16px + 0.3vw);
  cursor: pointer;
  background: #ffb74d;
  color: #4e342e;
  box-shadow: 0 6px 0 #ef6c00;
  font-weight: bold;
  display: inline-block;
  transition: all 0.1s ease;
  margin-top: 1vh;
}
.btn-action:active {
  transform: translateY(4px);
  box-shadow: 0 2px 0 #ef6c00;
}

/* GAMEPLAY HUD CONSOLE LINES */
.hud-bar {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 2vh;
}
.hud-item {
  flex: 1;
  background: #e0f2f1;
  border: 2px solid #b2dfdb;
  padding: 10px 4px;
  border-radius: 16px;
  font-weight: bold;
  font-size: calc(13px + 0.2vw);
  color: #004d40;
}

.zone-header {
  font-size: calc(16px + 0.3vw);
  font-weight: bold;
  background: #b2dfdb;
  color: #004d40;
  padding: 14px;
  border-radius: 16px;
  margin-bottom: 2vh;
  line-height: 1.3;
}

/* FLEX SHUFFLED BUTTONS STACK */
.grid-container {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin: 2vh 0;
}
.grid-btn {
  background: #f5fdfd;
  border: 3px solid #b2ebf2;
  border-radius: 20px;
  padding: 18px 16px;
  font-size: calc(14px + 0.2vw);
  font-weight: bold;
  color: #006064;
  cursor: pointer;
  transition: background-color 0.2s, border-color 0.2s, color 0.2s;
  text-align: left;
  width: 100%;
  line-height: 1.3;
}

/* SUCCESS PULSE FEEDBACK */
.grid-btn.matched {
  background: #e8f5e9 !important;
  border-color: #81c784 !important;
  color: #2e7d32 !important;
  pointer-events: none;
  animation: successPulse 0.4s ease-out;
}
@keyframes successPulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.03); }
  100% { transform: scale(1); }
}

/* HORIZONTAL RUBBER-BAND FAILURE SHAKE */
.grid-btn.wrong-shake {
  background: #ffebee !important;
  border-color: #e57373 !important;
  color: #c62828 !important;
  animation: mechanicalShake 0.4s ease-in-out;
}
@keyframes mechanicalShake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-10px); }
  40% { transform: translateX(8px); }
  60% { transform: translateX(-6px); }
  80% { transform: translateX(4px); }
}

/* TEXTBOARD DASHED CARD REVIEWS */
.explanation-card {
  background: #f1fbf6;
  border: 4px dashed #34a853;
  border-radius: 24px;
  padding: 22px;
  margin: 2vh 0;
  text-align: center;
}
.explanation-card.hint-style {
  background: #fffde7;
  border-color: #fbc02d;
}
.explanation-text {
  font-size: calc(15px + 0.3vw);
  line-height: 1.6;
  font-weight: bold;
  color: #1b5e20;
}
.explanation-text.hint-color {
  color: #f57f17;
}
</style>
</head>
<body>

<div id="splashScreenLayer">
  <img src="assets/innovine-logo.png" alt="Innovine Logo">
</div>

<div id="startScreen" class="screen">
  <div class="game-card">
    <h1>Air & Water Clean Town</h1>
    <span class="giant-emoji">🌍</span>
    <p class="description">
      Be an Eco-Hero! Find the right answers to save our air and water!
    </p>
    <button class="btn-action" onclick="startPatrol()">▶ Start Game</button>
  </div>
</div>

<div id="gameScreen" class="screen">
  <div class="game-card">
    
    <div class="hud-bar">
      <div class="hud-item">Level: <span id="lblLevel">1/3</span></div>
      <div class="hud-item">Points: <span id="lblScore">0</span></div>
    </div>

    <div id="zoneTitleBanner" class="zone-header"></div>
    <div class="grid-container" id="gridBox"></div>

  </div>
</div>

<div id="hintScreen" class="screen">
  <div class="game-card" style="border-color: #fbc02d;">
    <h1 style="color: #f57f17;">Let's Think!</h1>
    <span class="giant-emoji">💡</span>
    
    <div class="explanation-card hint-style">
      <p id="txtHintContext" class="explanation-text hint-color"></p>
    </div>
    
    <button class="btn-action" style="background:#fff176; box-shadow:0 6px 0 #fbc02d; color:#5d4037;" onclick="returnToGridBoard()">Try Again 🔄</button>
  </div>
</div>

<div id="reviewScreen" class="screen">
  <div class="game-card" style="border-color: #34a853;">
    <h1 style="color: #1b5e20;">Level Cleared!</h1>
    <span class="giant-emoji" id="lblReviewEmoji">💨</span>
    
    <div class="explanation-card">
      <p id="txtCleanExplanation" class="explanation-text"></p>
    </div>
    
    <button class="btn-action" style="background:#4caf50; box-shadow:0 6px 0 #2e7d32; color:white;" onclick="nextLevelReady()">Next Level 👍</button>
  </div>
</div>

<div id="endScreen" class="screen">
  <div class="game-card" style="border-color: #ffca28;">
    <h1 style="color: #f57f17;">Super Eco-Hero!</h1>
    <span class="giant-emoji">🏆</span>
    <h2 style="color:#e65100; margin:2vh 0;">Total Points: <span id="txtEndScore">0</span></h2>
    <p style="font-weight: bold; color: #546e7a; margin-bottom: 2vh;">You know exactly how to use air and save water!</p>
    <button class="btn-action" style="background:#ffb74d; box-shadow:0 6px 0 #f57c00;" onclick="resetToMenu()">🔄 Play Again</button>
  </div>
</div>

<audio id="soundRight" preload="auto" src="assets/correct.mp3"></audio>
<audio id="soundWrong" preload="auto" src="assets/wrong.mp3"></audio>
<audio id="soundClaps" preload="auto" src="assets/freesound_community-claps-44774.mp3"></audio>

<script>
// TRUTHY TEXT DATA MAPS WITH COMPLEX GRADE-1 ARCHITECTURE
const levelSetups = {
  1: {
    title: "Find the Wind Power!",
    instruction: "Tap things that need wind to move or dry:",
    emoji: "💨",
    targetsNeeded: 3,
    items: [
      { label: "Sailboat moving across water", isCorrect: true, updateText: "✓ Wind pushes the sails!" },
      { label: "Kite flying high up in the sky", isCorrect: true, updateText: "✓ Air lifts it upwards!" },
      { label: "Wet clothes drying on a line", isCorrect: true, updateText: "✓ Air blows water away!" },
      { label: "A heavy car driving down the road", isCorrect: false, updateText: "You picked the Car! But cars need fuel to go down the road. They don't use wind power to roll their wheels!" },
      { label: "An electric fan that is turned off", isCorrect: false, updateText: "You picked the Fan! But since the switch is off, it stays completely still and cannot blow any air around the room!" }
    ],
    explanation: "Moving air is called wind! Wind pushes big boats across water, lifts colorful kites into the sky, and blows water away from wet clothes to dry them! 💨"
  },
  2: {
    title: "Find the Water Source!",
    instruction: "Tap places where nature gives us water:",
    emoji: "🌧️",
    targetsNeeded: 3,
    items: [
      { label: "Rain falling down from clouds", isCorrect: true, updateText: "✓ The main source of water!" },
      { label: "A long river flowing down mountains", isCorrect: true, updateText: "✓ Natural freshwater flow!" },
      { label: "A deep well dug into the ground", isCorrect: true, updateText: "✓ Catches hidden underground water!" },
      { label: "A clean drinking glass on the table", isCorrect: false, updateText: "You picked the Water Glass! A glass is a container that holds water for us to drink, but nature doesn't create water inside it!" },
      { label: "A swimming pool filled up with water", isCorrect: false, updateText: "You picked the Swimming Pool! Even though it holds lots of water, people built the pool blocks. It is not made by nature!" }
    ],
    explanation: "Rain is our main source of water! When rain falls from big clouds, it fills up our deep rivers, wide lakes, and ground wells so we can drink it! 🌧️"
  },
  3: {
    title: "Save the Water!",
    instruction: "Tap bad habits that waste water to fix them:",
    emoji: "🚰",
    targetsNeeded: 4,
    items: [
      { label: "Washing a car with a spraying hose pipe", isCorrect: true, updateText: "✓ Fixed! We will use a bucket instead." },
      { label: "Leaving the tap running while brushing teeth", isCorrect: true, updateText: "✓ Fixed! Close it tight until done." },
      { label: "Watering plants with a giant leaking pipe", isCorrect: true, updateText: "✓ Fixed! A watering can is much better." },
      { label: "Washing hands with a fast splashing tap", isCorrect: true, updateText: "✓ Fixed! Turn the handle down low." },
      { label: "Taking a bath using a bucket and small mug", isCorrect: false, updateText: "You picked the Bucket and Mug! This is already an amazing habit. It uses very little water and doesn't waste anything!" }
    ],
    explanation: "Water is precious for every living thing! Closing running taps tightly, using watering cans, and avoiding spraying hoses helps us save every drop! 🚰"
  }
};

let gameLevel = 1;
let totalScore = 0;
let itemsFoundCount = 0;

const rightSnd = document.getElementById("soundRight");
const wrongSnd = document.getElementById("soundWrong");
const clapsSnd = document.getElementById("soundClaps");

function screenRouter(targetId) {
  document.querySelectorAll('.screen').forEach(scr => scr.classList.remove('active'));
  const target = document.getElementById(targetId);
  if (target) target.classList.add('active');
}

function resetToMenu() {
  screenRouter("startScreen");
}

function startPatrol() {
  gameLevel = 1;
  totalScore = 0;
  buildLevelLayout();
}

// THE SHUFFLE ENGINE (PREVENTS MUSCLE-MEMORY POSITION GUESSING)
function shuffleArray(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function buildLevelLayout() {
  itemsFoundCount = 0;
  document.getElementById("lblLevel").textContent = `${gameLevel}/3`;
  document.getElementById("lblScore").textContent = totalScore;
  
  const currentData = levelSetups[gameLevel];
  document.getElementById("zoneTitleBanner").innerHTML = `<strong style="font-size:1.2em;">${currentData.title}</strong><br><span style="font-size:0.85em; font-weight:normal; opacity:0.95;">${currentData.instruction}</span>`;
  
  const gridContainer = document.getElementById("gridBox");
  gridContainer.innerHTML = "";
  
  // Clone array structural links and shuffle them completely
  const randomizedItems = shuffleArray([...currentData.items]);
  
  randomizedItems.forEach(item => {
    const btn = document.createElement("button");
    btn.className = "grid-btn";
    btn.textContent = item.label;
    
    btn.onclick = () => {
      if (item.isCorrect) {
        btn.classList.add("matched");
        btn.textContent = item.updateText;
        totalScore += 10;
        itemsFoundCount++;
        document.getElementById("lblScore").textContent = totalScore;
        
        rightSnd.currentTime = 0;
        rightSnd.play().catch(() => {});
        
        if (itemsFoundCount >= currentData.targetsNeeded) {
          setTimeout(() => triggerExplanationBoard(), 1000);
        }
      } else {
        if (btn.classList.contains("wrong-shake")) return;
        
        // Execute the visual jolt shake animation first
        btn.classList.add("wrong-shake");
        wrongSnd.currentTime = 0;
        wrongSnd.play().catch(() => {});
        
        // Let shake finish, then seamlessly jump screens to present the explanation
        setTimeout(() => {
          document.getElementById("txtHintContext").textContent = item.updateText;
          screenRouter("hintScreen");
          
          // Clear button back to normal so it's clean when they return
          btn.classList.remove("wrong-shake");
        }, 500);
      }
    };
    
    gridContainer.appendChild(btn);
  });
  
  screenRouter("gameScreen");
}

function returnToGridBoard() {
  screenRouter("gameScreen");
}

function triggerExplanationBoard() {
  const currentData = levelSetups[gameLevel];
  document.getElementById("lblReviewEmoji").textContent = currentData.emoji;
  document.getElementById("txtCleanExplanation").textContent = currentData.explanation;
  screenRouter("reviewScreen");
}

function nextLevelReady() {
  gameLevel++;
  if (gameLevel > 3) {
    document.getElementById("txtEndScore").textContent = totalScore;
    clapsSnd.currentTime = 0;
    clapsSnd.play().catch(() => {});
    screenRouter("endScreen");
  } else {
    buildLevelLayout();
  }
}

// RELIABLE 5-SECOND SYNCHRONIZED BOOT LOADER MAPPING
window.addEventListener("DOMContentLoaded", () => {
  screenRouter("startScreen");
  
  setTimeout(() => {
    const splash = document.getElementById("splashScreenLayer");
    if (splash) {
      splash.classList.add("fade-out");
      setTimeout(() => {
        splash.style.display = "none";
      }, 600);
    }
  }, 5000); 
});
</script>
</body>
</html>
