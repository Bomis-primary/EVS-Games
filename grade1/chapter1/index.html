Paste this as your full `index.html` file. It uses your existing `assets/` path.

```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Body Explorer</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:"Comic Sans MS", sans-serif;
  background:linear-gradient(135deg,#fffae3,#e0f7fa,#dcedc8);
  text-align:center;
  color:#263238;
  overflow-x:hidden;
}

.screen{
  display:none;
  min-height:100vh;
  padding:10px;
}

.active{
  display:block;
}

#splashScreen{
  background:white;
  position:relative;
}

#splashScreen img{
  max-width:55%;
  height:auto;
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
}

h1{
  font-size:clamp(30px,6vw,50px);
  color:#ff7043;
  margin:12px 0;
}

h2{
  color:#00796b;
  font-size:clamp(18px,4vw,28px);
}

button{
  border:none;
  border-radius:18px;
  padding:12px 22px;
  margin:8px;
  font-size:18px;
  cursor:pointer;
  background:#ffca28;
  box-shadow:0 4px 0 #f57f17;
  font-weight:bold;
}

button:active{
  transform:translateY(3px);
  box-shadow:0 2px 0 #f57f17;
}

.card{
  background:rgba(255,255,255,0.92);
  border-radius:22px;
  padding:12px;
  max-width:1000px;
  margin:8px auto;
  box-shadow:0 6px 16px rgba(0,0,0,0.12);
}

.topbar{
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:8px;
  background:rgba(255,255,255,0.8);
  padding:8px;
  border-radius:18px;
  margin-bottom:8px;
}

.badge{
  background:white;
  padding:7px 12px;
  border-radius:14px;
  font-weight:bold;
  font-size:16px;
}

.question{
  font-size:clamp(18px,3vw,27px);
  font-weight:bold;
  color:#5d4037;
  margin-bottom:5px;
}

.clue{
  font-size:clamp(14px,2.5vw,19px);
  background:#fff9c4;
  padding:7px;
  border-radius:14px;
  min-height:34px;
}

.message{
  min-height:28px;
  font-size:18px;
  font-weight:bold;
  margin-top:4px;
}

.game-container{
  display:grid;
  grid-template-columns:70% 28%;
  gap:14px;
  align-items:center;
  max-width:1150px;
  margin:8px auto 0;
}

.body-zone{
  min-height:62vh;
  display:flex;
  align-items:center;
  justify-content:center;
  border:4px dashed #81c784;
  border-radius:26px;
  background:linear-gradient(#e3f2fd,#fffde7);
  position:relative;
}

.body-zone::before{
  content:"Drop the correct body part here";
  position:absolute;
  top:10px;
  background:white;
  padding:6px 14px;
  border-radius:14px;
  font-weight:bold;
  color:#388e3c;
  font-size:15px;
}

#bodyOutline{
  width:70%;
  max-height:70vh;
  object-fit:contain;
}

#draggables{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  align-content:center;
  justify-items:center;
  background:rgba(255,255,255,0.85);
  padding:12px;
  border-radius:22px;
  box-shadow:0 5px 12px rgba(0,0,0,0.12);
}

.draggable{
  width:54px;
  height:54px;
  cursor:grab;
  user-select:none;
  border:2px solid #ffb74d;
  border-radius:14px;
  background:white;
  object-fit:contain;
  padding:3px;
}

.draggable:hover{
  transform:scale(1.08);
}

.highlight{
  border:4px solid #42a5f5 !important;
  box-shadow:0 0 14px #42a5f5;
}

.final{
  font-size:clamp(24px,5vw,40px);
  color:#2e7d32;
  font-weight:bold;
}

.confetti{
  position:fixed;
  top:-20px;
  width:12px;
  height:12px;
  pointer-events:none;
  animation:fall 2.5s linear forwards;
  z-index:999;
}

@keyframes fall{
  to{
    transform:translateY(105vh) rotate(720deg);
    opacity:0;
  }
}

@media(max-width:650px){
  .game-container{
    grid-template-columns:1fr;
  }

  .body-zone{
    min-height:52vh;
  }

  #bodyOutline{
    width:78%;
    max-height:58vh;
  }

  #draggables{
    grid-template-columns:repeat(6,1fr);
    gap:6px;
  }

  .draggable{
    width:42px;
    height:42px;
  }

  .body-zone::before{
    font-size:12px;
  }
}
</style>
</head>

<body>

<div id="splashScreen" class="screen active">
  <img src="assets/innovine-logo.png" alt="Innovine Logo">
</div>

<div id="startScreen" class="screen">
  <div class="card">
    <h1>My Body Explorer</h1>
    <h2>Read the question. Drag the correct body part to the body outline.</h2>
    <button onclick="initGame()">▶ Start Game</button>
  </div>
</div>

<div id="gameScreen" class="screen">
  <div class="topbar">
    <div class="badge">⭐ Score: <span id="score">0</span></div>
    <div class="badge">❤️ Lives: <span id="lives">3</span></div>
    <div class="badge">Q <span id="qNo">1</span>/12</div>
  </div>

  <div class="card">
    <div class="question" id="questionText"></div>
    <div class="clue" id="clueText"></div>
    <div class="message" id="message"></div>
  </div>

  <div class="game-container">
    <div class="body-zone" id="dropZone">
      <img id="bodyOutline" src="assets/bodyoutline.png" alt="Body Outline">
    </div>
    <div id="draggables"></div>
  </div>
</div>

<div id="endScreen" class="screen">
  <div class="card">
    <div class="final" id="finalMsg">Great work!</div>
    <h2>Your Score: <span id="finalScore"></span>/12</h2>
    <button onclick="initGame()">🔄 Play Again</button>
  </div>
</div>

<script>
let questions=[
  {q:"Which part helps you hear a bird singing?",part:"ears.png",hint:"It helps you listen."},
  {q:"What part helps you see the rainbow?",part:"eyes.png",hint:"It helps you look at things."},
  {q:"Mia is climbing stairs. Which part helps her balance?",part:"legs.png",hint:"We use these to stand and walk."},
  {q:"Sam wants to pick up a pencil. Which part should he use?",part:"hands.png",hint:"Used to hold and grab objects."},
  {q:"What part helps you taste your favourite food?",part:"tongue.png",hint:"We taste with this."},
  {q:"Which part helps you smell flowers in the garden?",part:"nose.png",hint:"We use this to sense smells."},
  {q:"Tom wears a cap on this body part. Which part is it?",part:"head.png",hint:"It is at the top of the body."},
  {q:"What part helps you speak to a friend?",part:"mouth.png",hint:"We use it to talk and eat."},
  {q:"Which part helps you bend your arm?",part:"elbow.png",hint:"It is in the middle of the arm."},
  {q:"Which part helps you bend and straighten your leg while running?",part:"knee.png",hint:"It is in the middle of the leg."},
  {q:"Mia combs this part every morning. What is it?",part:"hair.png",hint:"It grows on the head."},
  {q:"Tom wears a scarf around this part. Which part is it?",part:"neck.png",hint:"It connects the head and the body."}
];

const allParts=[
  "head.png","eyes.png","ears.png","nose.png","mouth.png","hands.png",
  "legs.png","elbow.png","knee.png","neck.png","hair.png","tongue.png"
];

let current=0;
let score=0;
let lives=3;
let tries=0;
let selectedPart="";
let hintTimeout;

const correctSound=new Audio("assets/correct.mp3");
const wrongSound=new Audio("assets/wrong.mp3");
const clapSound=new Audio("assets/freesound_community-claps-44774.mp3");

function showScreen(id){
  document.querySelectorAll(".screen").forEach(screen=>{
    screen.classList.remove("active");
  });
  document.getElementById(id).classList.add("active");
}

function initGame(){
  score=0;
  lives=3;
  current=0;
  tries=0;
  questions=shuffle([...questions]);
  showScreen("gameScreen");
  loadQuestion();
}

function loadQuestion(){
  if(current>=questions.length){
    endGame();
    return;
  }

  clearTimeout(hintTimeout);
  tries=0;

  const q=questions[current];

  document.getElementById("questionText").textContent=q.q;
  document.getElementById("clueText").textContent="";
  document.getElementById("message").textContent="";
  document.getElementById("qNo").textContent=current+1;
  document.getElementById("score").textContent=score;
  document.getElementById("lives").textContent=lives;

  renderDraggables();

  hintTimeout=setTimeout(()=>{
    showHint();
  },18000);
}

function renderDraggables(){
  const container=document.getElementById("draggables");
  container.innerHTML="";

  shuffle([...allParts]).forEach(part=>{
    const img=document.createElement("img");
    img.src="assets/"+part;
    img.className="draggable";
    img.draggable=true;
    img.alt=part.replace(".png","");

    img.addEventListener("dragstart",e=>{
      selectedPart=part;
      e.dataTransfer.setData("text/plain",part);
    });

    img.addEventListener("click",()=>{
      selectedPart=part;
      document.querySelectorAll(".draggable").forEach(i=>i.style.outline="none");
      img.style.outline="4px solid #29b6f6";
      document.getElementById("message").textContent="Now tap the body outline.";
    });

    container.appendChild(img);
  });
}

const dropZone=document.getElementById("dropZone");

dropZone.addEventListener("dragover",e=>{
  e.preventDefault();
});

dropZone.addEventListener("drop",e=>{
  e.preventDefault();
  const dropped=e.dataTransfer.getData("text/plain");
  checkAnswer(dropped);
});

dropZone.addEventListener("click",()=>{
  if(selectedPart){
    checkAnswer(selectedPart);
  }
});

function checkAnswer(part){
  const q=questions[current];

  if(part===q.part){
    score++;
    document.getElementById("score").textContent=score;
    document.getElementById("message").textContent="Correct!";
    correctSound.currentTime=0;
    correctSound.play();
    confetti();
    clearTimeout(hintTimeout);
    selectedPart="";
    current++;
    setTimeout(loadQuestion,900);
  }else{
    tries++;
    lives--;
    document.getElementById("lives").textContent=lives;
    wrongSound.currentTime=0;
    wrongSound.play();
    navigator.vibrate?.(140);

    if(lives<=0){
      endGame();
      return;
    }

    if(tries>=2){
      document.getElementById("message").textContent="Look at the hint and try once more!";
      showHint();
    }else{
      document.getElementById("message").textContent="Try again!";
      document.getElementById("clueText").textContent="You have one more try before the hint.";
    }
  }
}

function showHint(){
  const q=questions[current];
  document.getElementById("clueText").textContent=q.hint;
  highlightCorrect(q.part);
}

function highlightCorrect(part){
  document.querySelectorAll(".draggable").forEach(img=>{
    if(img.src.includes(part)){
      img.classList.add("highlight");
      setTimeout(()=>{
        img.classList.remove("highlight");
      },5000);
    }
  });
}

function endGame(){
  clearTimeout(hintTimeout);
  showScreen("endScreen");
  document.getElementById("finalScore").textContent=score;

  const feedback=document.getElementById("finalMsg");

  if(score===12){
    feedback.textContent="Excellent! Body Explorer Champion!";
    clapSound.play();
    confetti();
  }else if(score>=10){
    feedback.textContent="Very good work!";
    clapSound.play();
    confetti();
  }else if(score>=8){
    feedback.textContent="Good effort! Play again to improve.";
  }else{
    feedback.textContent="Try again! You can do better.";
  }
}

function confetti(){
  for(let i=0;i<50;i++){
    const c=document.createElement("div");
    c.className="confetti";
    c.style.left=Math.random()*100+"vw";
    c.style.background=["#ff5252","#ffca28","#66bb6a","#42a5f5","#ab47bc"][Math.floor(Math.random()*5)];
    c.style.animationDelay=Math.random()*0.5+"s";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),3000);
  }
}

function shuffle(array){
  for(let i=array.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [array[i],array[j]]=[array[j],array[i]];
  }
  return array;
}

window.addEventListener("load",()=>{
  setTimeout(()=>{
    showScreen("startScreen");
  },5000);
});
</script>

</body>
</html>
```
